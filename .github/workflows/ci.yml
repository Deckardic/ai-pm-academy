name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: FSD architecture (Steiger)
        run: pnpm lint:fsd
      - name: Typecheck
        run: pnpm typecheck
      - name: Content validation
        run: pnpm content:validate
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  content-review:
    # Cross-model review of changed lessons (PRD 10.1). Runs only when content changes and secrets are set.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CONTENT_PREVIEW: "1"
      CONTENT_REVIEW_BASE_URL: ${{ secrets.CONTENT_REVIEW_BASE_URL }}
      CONTENT_REVIEW_API_KEY: ${{ secrets.CONTENT_REVIEW_API_KEY }}
      CONTENT_REVIEW_MODEL: ${{ secrets.CONTENT_REVIEW_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            content:
              - 'content/course/**'
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.content == 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.content == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.changes.outputs.content == 'true'
        run: pnpm install --frozen-lockfile
      - name: Review changed modules
        if: steps.changes.outputs.content == 'true' && env.CONTENT_REVIEW_API_KEY != ''
        run: |
          for module in $(git diff --name-only origin/${{ github.base_ref }}... -- content/course | sed -nE 's#content/course/[a-z]+/([jms][0-9]{2})-.*#\1#p' | sort -u); do
            pnpm content:review --module "$module"
          done

  freshness:
    # Quarterly-ish reminder: AI lessons older than 90 days (warnings from content:validate).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate 2>&1 | tee validate.log
      - name: Summarize stale lessons
        run: grep "не пересматривался" validate.log >> "$GITHUB_STEP_SUMMARY" || echo "Все ИИ-уроки свежие" >> "$GITHUB_STEP_SUMMARY"
