id: m11-quiz
kind: module
title: "Тест модуля: Качество и риски ИИ"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: check-depth
    type: single
    prompt: От чего зависит глубина проверки результата ИИ?
    options:
      - id: a
        text: "От цены ошибки: всё, что уходит наружу или влияет на решения, проверяется полностью"
      - id: b
        text: От длины текста
      - id: c
        text: От того, какая модель использовалась
    correct: a
    explanation: Проверка пропорциональна цене ошибки.
    lessonId: m11-01
  - id: sampling
    type: single
    scenario: ИИ классифицировал 400 обращений дилеров по темам.
    prompt: Как разумно проверить результат?
    options:
      - id: a
        text: Проверить все 400
      - id: b
        text: Случайная выборка с долей ошибок плюс полная проверка рискованных обращений
      - id: c
        text: Не проверять
    correct: b
    explanation: Выборка показывает общее качество, рискованные элементы проверяются целиком.
    lessonId: m11-01
  - id: protocol-check
    type: single
    prompt: Какая ошибка типична для протоколов, подготовленных ИИ?
    options:
      - id: a
        text: Обсуждение превращено в решение, перепутаны ответственные
      - id: b
        text: Слишком короткие предложения
      - id: c
        text: Отсутствие заголовка
    correct: a
    explanation: Поэтому каждое решение и задачу сверяют с заметками.
    lessonId: m11-01
  - id: pd-processing
    type: single
    prompt:
      Является ли передача контактов представителей дилеров во внешний ИИ-сервис обработкой персональных
      данных?
    options:
      - id: a
        text: Да, и для неё действуют требования 152-ФЗ
      - id: b
        text: Нет, если сервис удобный
      - id: c
        text: Нет, если это деловые контакты
    correct: a
    explanation: Контакты людей — персональные данные; их передача сервису — обработка.
    lessonId: m11-02
  - id: nda
    type: single
    prompt:
      Договор с подрядчиком содержит условия NDA. Можно ли перевести его через публичный онлайн-переводчик
      с ИИ?
    options:
      - id: a
        text: Да, перевод — это не передача
      - id: b
        text: "Нет без проверки: сервис — третье лицо, NDA и режим коммерческой тайны могут это запрещать"
      - id: c
        text: Да, если удалить подписи
    correct: b
    explanation: Внешний ИИ-сервис — третье лицо. При сомнениях — не отправлять и уточнить у юриста.
    lessonId: m11-02
  - id: leak-action
    type: single
    prompt: Данные клиентов по ошибке ушли во внешний сервис. Что сделать в первую очередь?
    options:
      - id: a
        text: Удалить диалог и забыть
      - id: b
        text: Сообщить по процедуре компании, зафиксировать детали и остановить дальнейшую передачу
      - id: c
        text: Подождать, вдруг ничего не будет
    correct: b
    explanation: У компании есть обязанности и сроки по закону; скорость важна.
    lessonId: m11-02
  - id: ai-rights
    type: single
    prompt: Кто решает вопрос о правах на результаты, созданные с ИИ и передаваемые заказчику по договору?
    options:
      - id: a
        text: PM самостоятельно
      - id: b
        text: Юрист компании с учётом договора и условий сервиса
      - id: c
        text: Сам ИИ-сервис
    correct: b
    explanation: Это неустоявшийся правовой вопрос — нужна позиция юриста.
    lessonId: m11-02
  - id: policy-content
    type: multiple
    prompt: Что должно быть в корпоративной политике ИИ? Выберите все подходящие.
    options:
      - id: a
        text: Разрешённые инструменты и задачи
      - id: b
        text: Какие данные в какие инструменты можно отправлять
      - id: c
        text: Ответственность, проверка и порядок действий при инцидентах
      - id: d
        text: Рейтинг сотрудников по использованию ИИ
    correct:
      - a
      - b
      - c
    explanation: Политика отвечает на вопросы об инструментах, данных, ответственности и инцидентах.
    lessonId: m11-03
  - id: shadow-ai
    type: single
    scenario: После полного запрета ИИ сотрудники продолжают пользоваться сервисами с личных устройств.
    prompt: Что поможет?
    options:
      - id: a
        text: Ужесточить наказания
      - id: b
        text: Дать разрешённый инструмент, правила по данным и обучение
      - id: c
        text: Ничего
    correct: b
    explanation: Теневое использование — признак реальной потребности.
    lessonId: m11-03
  - id: transparency
    type: single
    prompt: Когда особенно важно договориться с заказчиком об использовании ИИ?
    options:
      - id: a
        text: Когда ИИ существенно формирует результат, за который платит заказчик
      - id: b
        text: Когда ИИ исправил опечатку
      - id: c
        text: Никогда
    correct: a
    explanation:
      Согласованное заранее использование — профессионально, обнаруженное постфактум — подрывает
      доверие.
    lessonId: m11-04
  - id: bias-hiring
    type: single
    prompt: Руководитель предлагает, чтобы ИИ отбирал кандидатов по резюме. Что ответить?
    options:
      - id: a
        text: Хорошая идея
      - id: b
        text:
          Решения о людях нельзя отдавать модели из-за возможной предвзятости; ИИ — для рутины, отбор
          — людям
      - id: c
        text: Можно, если модель дорогая
    correct: b
    explanation: Модели воспроизводят перекосы, а решения о людях требуют ответственности человека.
    lessonId: m11-04
  - id: responsibility
    type: single
    prompt: Кто отвечает за ошибку в отчёте, подготовленном с ИИ и отправленном PM?
    options:
      - id: a
        text: Разработчик модели
      - id: b
        text: PM, который отправил отчёт
      - id: c
        text: Никто
    correct: b
    explanation: «Так сказал ИИ» не снимает ответственности.
    lessonId: m11-04
  - id: checklist-types
    type: single
    prompt: Зачем разные чек-листы для текстов, протоколов, расчётов и анализа?
    options:
      - id: a
        text: Разные задачи ошибаются по-разному
      - id: b
        text: Для объёма
      - id: c
        text: Так красивее
      - id: d
        text: Не нужны
    correct: a
    explanation: Например, расчёты — арифметика, протоколы — перепутанные ответственные.
    lessonId: m11-01
  - id: laws-check
    type: single
    prompt: Как проверять ссылки на законы в ответе ИИ?
    options:
      - id: a
        text: Поверить
      - id: b
        text: Открыть официальный текст
      - id: c
        text: Спросить другую модель
      - id: d
        text: Не проверять
    correct: b
    explanation: Модели придумывают несуществующие статьи.
    lessonId: m11-01
  - id: acceptable-error
    type: single
    prompt: Что сделать, если доля ошибок в выборке выше допустимой?
    options:
      - id: a
        text: Отправить как есть
      - id: b
        text: Исправить промпт или процесс и проверить снова
      - id: c
        text: Увеличить выборку до 1
      - id: d
        text: Скрыть
    correct: b
    explanation: Выборочная проверка работает только с реакцией на результат.
    lessonId: m11-01
  - id: check-log
    type: single
    prompt: Зачем документировать проверку важных результатов?
    options:
      - id: a
        text: Для бюрократии
      - id: b
        text: Чтобы понять, где сбой — в данных, промпте или проверке, и какие промпты улучшать
      - id: c
        text: Для наказаний
      - id: d
        text: Не нужно
    correct: b
    explanation: Статистика ошибок улучшает процесс.
    lessonId: m11-01
  - id: author-responsible
    type: single
    prompt: Кто отвечает за результат, подготовленный с ИИ?
    options:
      - id: a
        text: Модель
      - id: b
        text: Автор, который его использует и отправляет
      - id: c
        text: Никто
      - id: d
        text: Отдел ИТ
    correct: b
    explanation: Проверка — часть работы автора.
    lessonId: m11-01
  - id: pd-examples
    type: single
    prompt: Что относится к персональным данным?
    options:
      - id: a
        text: Голос на записи встречи
      - id: b
        text: Средняя температура в городе
      - id: c
        text: Название отдела без людей
      - id: d
        text: Число задач в спринте
    correct: a
    explanation: Голос и слова человека относятся к нему.
    lessonId: m11-02
  - id: localization
    type: single
    prompt: Что требует закон о локализации персональных данных граждан России?
    options:
      - id: a
        text: Хранить их только на бумаге
      - id: b
        text: Вести запись и хранение в базах данных на территории России при сборе
      - id: c
        text: Удалять их через месяц
      - id: d
        text: Ничего
    correct: b
    explanation: Это делает внешние зарубежные сервисы рискованными.
    lessonId: m11-02
  - id: trade-secret-regime
    type: single
    prompt: Как информация становится коммерческой тайной компании?
    options:
      - id: a
        text: Автоматически
      - id: b
        text: Компания устанавливает режим коммерческой тайны внутренними документами
      - id: c
        text: По желанию сотрудника
      - id: d
        text: Через суд
    correct: b
    explanation: Режим регулирует закон № 98-ФЗ.
    lessonId: m11-02
  - id: service-terms
    type: single
    prompt: Что прочитать в условиях ИИ-сервиса перед рабочим использованием?
    options:
      - id: a
        text: Какие права на ввод и вывод описаны и используются ли данные для обучения
      - id: b
        text: Только цену
      - id: c
        text: Ничего
      - id: d
        text: Отзывы
    correct: a
    explanation: Условия сервисов различаются.
    lessonId: m11-02
  - id: leak-blame
    type: single
    prompt: Почему разбор утечки проводят без поиска виноватых?
    options:
      - id: a
        text: Чтобы все были довольны
      - id: b
        text: Иначе о следующих инцидентах просто не сообщат
      - id: c
        text: Так требует закон
      - id: d
        text: Виноватых не бывает
    correct: b
    explanation: Цель — изменить процесс.
    lessonId: m11-02
  - id: policy-short
    type: single
    prompt: Каким должен быть объём политики ИИ?
    options:
      - id: a
        text: 30 страниц
      - id: b
        text: Две-три страницы и памятка на одну
      - id: c
        text: Одна строка
      - id: d
        text: Без ограничений
    correct: b
    explanation: Длинный документ никто не прочитает.
    lessonId: m11-03
  - id: policy-ways
    type: single
    prompt: Политика запрещает отправлять выгрузку клиентов в публичный чат-бот. Что ещё она должна дать?
    options:
      - id: a
        text: Наказание
      - id: b
        text: Разрешённый способ сделать ту же задачу
      - id: c
        text: Ничего
      - id: d
        text: Список виновных
    correct: b
    explanation: Политика даёт способы, а не только запреты.
    lessonId: m11-03
  - id: no-auto-people
    type: single
    prompt: Какое решение политика обычно запрещает принимать автоматически по результату ИИ?
    options:
      - id: a
        text: Формат отчёта
      - id: b
        text: Решения о найме, оценке и увольнении людей
      - id: c
        text: Выбор шрифта
      - id: d
        text: Порядок пунктов
    correct: b
    explanation: Решения о людях — за людьми.
    lessonId: m11-03
  - id: amnesty
    type: single
    prompt: Что помогает перевести теневое использование ИИ в разрешённое?
    options:
      - id: a
        text: Наказание за прошлое
      - id: b
        text: Амнистия при переходе на разрешённые инструменты и объяснение причин правил
      - id: c
        text: Слежка
      - id: d
        text: Игнорирование
    correct: b
    explanation: Люди охотнее переходят, если не боятся.
    lessonId: m11-03
  - id: team-rules
    type: single
    prompt: В компании нет политики ИИ. Что может сделать PM?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Согласовать правила на уровне команды с руководителем и безопасностью
      - id: c
        text: Разрешить всё
      - id: d
        text: Запретить всё
    correct: b
    explanation: Это снижает риски здесь и сейчас.
    lessonId: m11-03
  - id: when-disclose
    type: single
    prompt: Когда не обязательно объявлять об использовании ИИ?
    options:
      - id: a
        text: Когда ИИ помог с черновиком письма, которое вы переписали
      - id: b
        text: Когда ИИ сделал отчёт для заказчика
      - id: c
        text: Когда бот отвечает дилерам
      - id: d
        text: Когда ИИ обрабатывает записи встреч
    correct: a
    explanation: Это рабочий инструмент, как проверка орфографии.
    lessonId: m11-04
  - id: bias-remove
    type: single
    prompt: Как снизить предвзятость при использовании ИИ в задачах о людях?
    options:
      - id: a
        text: Добавить имена
      - id: b
        text: Убрать из данных признаки, не относящиеся к задаче, и проверять результаты на перекосы
      - id: c
        text: Использовать больше моделей
      - id: d
        text: Никак
    correct: b
    explanation: А в чувствительных задачах — не использовать ИИ.
    lessonId: m11-04
  - id: sign-test
    type: single
    prompt: Какой вопрос хорошо проверяет готовность документа к отправке?
    options:
      - id: a
        text: «Красиво ли?»
      - id: b
        text: «Готов ли я подписаться под каждым словом и цифрой, если спросят, откуда они?»
      - id: c
        text: «Длинно ли?»
      - id: d
        text: «Быстро ли?»
    correct: b
    explanation: Ответственность за текст — на отправителе.
    lessonId: m11-04
  - id: trust-resource
    type: single
    prompt: Почему доверие называют главным ресурсом PM?
    options:
      - id: a
        text: Оно бесплатное
      - id: b
        text: Накапливается медленно, теряется быстро, и от него зависит работа со всеми стейкхолдерами
      - id: c
        text: Его можно купить
      - id: d
        text: Оно не важно
    correct: b
    explanation: ИИ может его укрепить или подорвать.
    lessonId: m11-04
