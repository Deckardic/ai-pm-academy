id: m11-quiz
kind: module
title: "Тест модуля: Качество и риски ИИ"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: check-depth
    type: single
    prompt: "От чего зависит глубина проверки результата ИИ?"
    options:
      - {
          id: a,
          text: "От цены ошибки: всё, что уходит наружу или влияет на решения, проверяется полностью",
        }
      - { id: b, text: "От длины текста" }
      - { id: c, text: "От того, какая модель использовалась" }
    correct: a
    explanation: "Проверка пропорциональна цене ошибки."
    lessonId: m11-01
  - id: sampling
    type: single
    scenario: "ИИ классифицировал 400 обращений дилеров по темам."
    prompt: "Как разумно проверить результат?"
    options:
      - { id: a, text: "Проверить все 400" }
      - {
          id: b,
          text: "Случайная выборка с долей ошибок плюс полная проверка рискованных обращений",
        }
      - { id: c, text: "Не проверять" }
    correct: b
    explanation: "Выборка показывает общее качество, рискованные элементы проверяются целиком."
    lessonId: m11-01
  - id: protocol-check
    type: single
    prompt: "Какая ошибка типична для протоколов, подготовленных ИИ?"
    options:
      - { id: a, text: "Обсуждение превращено в решение, перепутаны ответственные" }
      - { id: b, text: "Слишком короткие предложения" }
      - { id: c, text: "Отсутствие заголовка" }
    correct: a
    explanation: "Поэтому каждое решение и задачу сверяют с заметками."
    lessonId: m11-01
  - id: pd-processing
    type: single
    prompt: "Является ли передача контактов представителей дилеров во внешний ИИ-сервис обработкой персональных данных?"
    options:
      - { id: a, text: "Да, и для неё действуют требования 152-ФЗ" }
      - { id: b, text: "Нет, если сервис удобный" }
      - { id: c, text: "Нет, если это деловые контакты" }
    correct: a
    explanation: "Контакты людей — персональные данные; их передача сервису — обработка."
    lessonId: m11-02
  - id: nda
    type: single
    prompt: "Договор с подрядчиком содержит условия NDA. Можно ли перевести его через публичный онлайн-переводчик с ИИ?"
    options:
      - { id: a, text: "Да, перевод — это не передача" }
      - {
          id: b,
          text: "Нет без проверки: сервис — третье лицо, NDA и режим коммерческой тайны могут это запрещать",
        }
      - { id: c, text: "Да, если удалить подписи" }
    correct: b
    explanation: "Внешний ИИ-сервис — третье лицо. При сомнениях — не отправлять и уточнить у юриста."
    lessonId: m11-02
  - id: leak-action
    type: single
    prompt: "Данные клиентов по ошибке ушли во внешний сервис. Что сделать в первую очередь?"
    options:
      - { id: a, text: "Удалить диалог и забыть" }
      - {
          id: b,
          text: "Сообщить по процедуре компании, зафиксировать детали и остановить дальнейшую передачу",
        }
      - { id: c, text: "Подождать, вдруг ничего не будет" }
    correct: b
    explanation: "У компании есть обязанности и сроки по закону; скорость важна."
    lessonId: m11-02
  - id: ai-rights
    type: single
    prompt: "Кто решает вопрос о правах на результаты, созданные с ИИ и передаваемые заказчику по договору?"
    options:
      - { id: a, text: "PM самостоятельно" }
      - { id: b, text: "Юрист компании с учётом договора и условий сервиса" }
      - { id: c, text: "Сам ИИ-сервис" }
    correct: b
    explanation: "Это неустоявшийся правовой вопрос — нужна позиция юриста."
    lessonId: m11-02
  - id: policy-content
    type: multiple
    prompt: "Что должно быть в корпоративной политике ИИ? Выберите все подходящие."
    options:
      - { id: a, text: "Разрешённые инструменты и задачи" }
      - { id: b, text: "Какие данные в какие инструменты можно отправлять" }
      - { id: c, text: "Ответственность, проверка и порядок действий при инцидентах" }
      - { id: d, text: "Рейтинг сотрудников по использованию ИИ" }
    correct: [a, b, c]
    explanation: "Политика отвечает на вопросы об инструментах, данных, ответственности и инцидентах."
    lessonId: m11-03
  - id: shadow-ai
    type: single
    scenario: "После полного запрета ИИ сотрудники продолжают пользоваться сервисами с личных устройств."
    prompt: "Что поможет?"
    options:
      - { id: a, text: "Ужесточить наказания" }
      - { id: b, text: "Дать разрешённый инструмент, правила по данным и обучение" }
      - { id: c, text: "Ничего" }
    correct: b
    explanation: "Теневое использование — признак реальной потребности."
    lessonId: m11-03
  - id: transparency
    type: single
    prompt: "Когда особенно важно договориться с заказчиком об использовании ИИ?"
    options:
      - { id: a, text: "Когда ИИ существенно формирует результат, за который платит заказчик" }
      - { id: b, text: "Когда ИИ исправил опечатку" }
      - { id: c, text: "Никогда" }
    correct: a
    explanation: "Согласованное заранее использование — профессионально, обнаруженное постфактум — подрывает доверие."
    lessonId: m11-04
  - id: bias-hiring
    type: single
    prompt: "Руководитель предлагает, чтобы ИИ отбирал кандидатов по резюме. Что ответить?"
    options:
      - { id: a, text: "Хорошая идея" }
      - {
          id: b,
          text: "Решения о людях нельзя отдавать модели из-за возможной предвзятости; ИИ — для рутины, отбор — людям",
        }
      - { id: c, text: "Можно, если модель дорогая" }
    correct: b
    explanation: "Модели воспроизводят перекосы, а решения о людях требуют ответственности человека."
    lessonId: m11-04
  - id: responsibility
    type: single
    prompt: "Кто отвечает за ошибку в отчёте, подготовленном с ИИ и отправленном PM?"
    options:
      - { id: a, text: "Разработчик модели" }
      - { id: b, text: "PM, который отправил отчёт" }
      - { id: c, text: "Никто" }
    correct: b
    explanation: "«Так сказал ИИ» не снимает ответственности."
    lessonId: m11-04
