id: m05-quiz
kind: module
title: "Тест модуля: Метрики и отчётность"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: lead-vs-cycle
    type: single
    prompt: "Чем lead time отличается от cycle time?"
    options:
      - {
          id: a,
          text: "Lead time — от запроса до результата, cycle time — от начала работы до готовности",
        }
      - { id: b, text: "Это одно и то же" }
      - { id: c, text: "Cycle time всегда больше lead time" }
    correct: a
    explanation: "Разница между ними — время ожидания в очереди до начала работы."
    lessonId: m05-01
  - id: customer-metric
    type: single
    prompt: "Какую метрику времени чувствует заказчик?"
    options:
      - { id: a, text: "Cycle time" }
      - { id: b, text: "Lead time" }
      - { id: c, text: "Velocity" }
    correct: b
    explanation: "Заказчику важно, сколько ждать от запроса до результата, включая очередь."
    lessonId: m05-01
  - id: percentile
    type: single
    prompt: "Почему для обещаний заказчику лучше использовать 85-й процентиль времени цикла, а не среднее?"
    options:
      - { id: a, text: "Он всегда меньше среднего" }
      - {
          id: b,
          text: "Распределение несимметрично, среднее скрывает длинный хвост; 85-й процентиль выполняется в большинстве случаев",
        }
      - { id: c, text: "Так требует Kanban" }
    correct: b
    explanation: "Время цикла имеет длинный хвост; процентиль честнее описывает, что ждать заказчику."
    lessonId: m05-01
  - id: burnup-scope
    type: single
    scenario: "Burn-down три недели идёт почти горизонтально, хотя команда закрыла 30 задач."
    prompt: "Какой график покажет, что происходит?"
    options:
      - { id: a, text: "Burn-up: на нём видно, что общий объём растёт вместе со сделанным" }
      - { id: b, text: "Тот же burn-down, только за месяц" }
      - { id: c, text: "Круговая диаграмма задач по исполнителям" }
    correct: a
    explanation: "Burn-up разделяет темп команды и рост скоупа."
    lessonId: m05-02
  - id: cfd-bottleneck
    type: single
    prompt: "Что означает расширяющаяся полоса «Проверка» на накопительной диаграмме потока?"
    options:
      - { id: a, text: "На этапе проверки копится работа — это узкое место" }
      - { id: b, text: "Проверка работает быстрее всех" }
      - { id: c, text: "Команда закрывает больше задач" }
    correct: a
    explanation: "Расширение полосы — задачи приходят на этап быстрее, чем уходят."
    lessonId: m05-02
  - id: cfd-done-flat
    type: single
    prompt: "Полоса «Готово» на CFD две недели не растёт. Что это значит?"
    options:
      - { id: a, text: "Ничего не завершается: блокер, отпуск или аврал — нужно разобраться" }
      - { id: b, text: "Всё отлично" }
      - { id: c, text: "Команда перевыполнила план" }
    correct: a
    explanation: "Горизонтальная полоса «Готово» означает нулевую пропускную способность."
    lessonId: m05-02
  - id: goodhart
    type: single
    prompt: "Команду премируют за количество закрытых задач. Что скорее всего произойдёт?"
    options:
      - { id: a, text: "Реальная продуктивность вырастет" }
      - { id: b, text: "Задачи начнут дробить: метрика вырастет без роста результата" }
      - { id: c, text: "Ничего" }
    correct: b
    explanation: "Закон Гудхарта — метрика, ставшая целью, портится."
    lessonId: m05-03
  - id: dashboard-audience
    type: single
    prompt: "С чего начинать проектирование дашборда?"
    options:
      - { id: a, text: "С вопросов и решений аудитории" }
      - { id: b, text: "С перечня всех доступных данных" }
      - { id: c, text: "С выбора красивых графиков" }
    correct: a
    explanation: "Дашборд полезен, если отвечает на вопросы тех, кто по нему принимает решения."
    lessonId: m05-03
  - id: metric-questions
    type: multiple
    prompt: "Какие вопросы стоит задать о каждой метрике на дашборде? Выберите все подходящие."
    options:
      - { id: a, text: "Какое решение мы по ней примем?" }
      - { id: b, text: "Что будем делать, если она ухудшится?" }
      - { id: c, text: "Кто за неё отвечает?" }
      - { id: d, text: "Насколько красиво она выглядит?" }
    correct: [a, b, c]
    explanation: "Метрика без решения, реакции и владельца на дашборде не нужна."
    lessonId: m05-03
  - id: numbers-by-formula
    type: single
    prompt: "Как надёжнее получить цифры для еженедельной сводки?"
    options:
      - { id: a, text: "Попросить модель посчитать по выгрузке" }
      - {
          id: b,
          text: "Посчитать формулами в таблице или отчётами трекера, а модели отдать готовые цифры для текста",
        }
      - { id: c, text: "Прикинуть на глаз" }
    correct: b
    explanation: "Модели плохо считают. Цифры — формулами, текст — моделью, выводы — PM."
    lessonId: m05-04
  - id: wrong-number
    type: single
    scenario: "В сводке модель написала «закрыто 16 задач», а в таблице — 14."
    prompt: "Что делать?"
    options:
      - { id: a, text: "Оставить — разница небольшая" }
      - { id: b, text: "Исправить и сверить остальные числа" }
      - { id: c, text: "Попросить модель пересчитать выгрузку" }
    correct: b
    explanation: "Источник истины — таблица. Одна ошибка — повод проверить всё."
    lessonId: m05-04
  - id: export-data
    type: multiple
    prompt: "Что убрать из выгрузки трекера перед отправкой во внешний ИИ-сервис? Выберите все подходящие."
    options:
      - { id: a, text: "Имена исполнителей" }
      - { id: b, text: "Комментарии с контактами" }
      - { id: c, text: "Названия клиентов в заголовках" }
      - { id: d, text: "Даты переходов между статусами" }
    correct: [a, b, c]
    explanation: "Даты нужны для метрик; персональные данные и названия клиентов — нет."
    lessonId: m05-04
