id: m05-quiz
kind: module
title: "Тест модуля: Метрики и отчётность"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: lead-vs-cycle
    type: single
    prompt: Чем lead time отличается от cycle time?
    options:
      - id: a
        text: Lead time — от запроса до результата, cycle time — от начала работы до готовности
      - id: b
        text: Это одно и то же
      - id: c
        text: Cycle time всегда больше lead time
    correct: a
    explanation: Разница между ними — время ожидания в очереди до начала работы.
    lessonId: m05-01
  - id: customer-metric
    type: single
    prompt: Какую метрику времени чувствует заказчик?
    options:
      - id: a
        text: Cycle time
      - id: b
        text: Lead time
      - id: c
        text: Velocity
    correct: b
    explanation: Заказчику важно, сколько ждать от запроса до результата, включая очередь.
    lessonId: m05-01
  - id: percentile
    type: single
    prompt: Почему для обещаний заказчику лучше использовать 85-й процентиль времени цикла, а не среднее?
    options:
      - id: a
        text: Он всегда меньше среднего
      - id: b
        text:
          Распределение несимметрично, среднее скрывает длинный хвост; 85-й процентиль выполняется в большинстве
          случаев
      - id: c
        text: Так требует Kanban
    correct: b
    explanation: Время цикла имеет длинный хвост; процентиль честнее описывает, что ждать заказчику.
    lessonId: m05-01
  - id: burnup-scope
    type: single
    scenario: Burn-down три недели идёт почти горизонтально, хотя команда закрыла 30 задач.
    prompt: Какой график покажет, что происходит?
    options:
      - id: a
        text: "Burn-up: на нём видно, что общий объём растёт вместе со сделанным"
      - id: b
        text: Тот же burn-down, только за месяц
      - id: c
        text: Круговая диаграмма задач по исполнителям
    correct: a
    explanation: Burn-up разделяет темп команды и рост скоупа.
    lessonId: m05-02
  - id: cfd-bottleneck
    type: single
    prompt: Что означает расширяющаяся полоса «Проверка» на накопительной диаграмме потока?
    options:
      - id: a
        text: На этапе проверки копится работа — это узкое место
      - id: b
        text: Проверка работает быстрее всех
      - id: c
        text: Команда закрывает больше задач
    correct: a
    explanation: Расширение полосы — задачи приходят на этап быстрее, чем уходят.
    lessonId: m05-02
  - id: cfd-done-flat
    type: single
    prompt: Полоса «Готово» на CFD две недели не растёт. Что это значит?
    options:
      - id: a
        text: "Ничего не завершается: блокер, отпуск или аврал — нужно разобраться"
      - id: b
        text: Всё отлично
      - id: c
        text: Команда перевыполнила план
    correct: a
    explanation: Горизонтальная полоса «Готово» означает нулевую пропускную способность.
    lessonId: m05-02
  - id: goodhart
    type: single
    prompt: Команду премируют за количество закрытых задач. Что скорее всего произойдёт?
    options:
      - id: a
        text: Реальная продуктивность вырастет
      - id: b
        text: "Задачи начнут дробить: метрика вырастет без роста результата"
      - id: c
        text: Ничего
    correct: b
    explanation: Закон Гудхарта — метрика, ставшая целью, портится.
    lessonId: m05-03
  - id: dashboard-audience
    type: single
    prompt: С чего начинать проектирование дашборда?
    options:
      - id: a
        text: С вопросов и решений аудитории
      - id: b
        text: С перечня всех доступных данных
      - id: c
        text: С выбора красивых графиков
    correct: a
    explanation: Дашборд полезен, если отвечает на вопросы тех, кто по нему принимает решения.
    lessonId: m05-03
  - id: metric-questions
    type: multiple
    prompt: Какие вопросы стоит задать о каждой метрике на дашборде? Выберите все подходящие.
    options:
      - id: a
        text: Какое решение мы по ней примем?
      - id: b
        text: Что будем делать, если она ухудшится?
      - id: c
        text: Кто за неё отвечает?
      - id: d
        text: Насколько красиво она выглядит?
    correct:
      - a
      - b
      - c
    explanation: Метрика без решения, реакции и владельца на дашборде не нужна.
    lessonId: m05-03
  - id: numbers-by-formula
    type: single
    prompt: Как надёжнее получить цифры для еженедельной сводки?
    options:
      - id: a
        text: Попросить модель посчитать по выгрузке
      - id: b
        text: Посчитать формулами в таблице или отчётами трекера, а модели отдать готовые цифры для текста
      - id: c
        text: Прикинуть на глаз
    correct: b
    explanation: Модели плохо считают. Цифры — формулами, текст — моделью, выводы — PM.
    lessonId: m05-04
  - id: wrong-number
    type: single
    scenario: В сводке модель написала «закрыто 16 задач», а в таблице — 14.
    prompt: Что делать?
    options:
      - id: a
        text: Оставить — разница небольшая
      - id: b
        text: Исправить и сверить остальные числа
      - id: c
        text: Попросить модель пересчитать выгрузку
    correct: b
    explanation: Источник истины — таблица. Одна ошибка — повод проверить всё.
    lessonId: m05-04
  - id: export-data
    type: multiple
    prompt: Что убрать из выгрузки трекера перед отправкой во внешний ИИ-сервис? Выберите все подходящие.
    options:
      - id: a
        text: Имена исполнителей
      - id: b
        text: Комментарии с контактами
      - id: c
        text: Названия клиентов в заголовках
      - id: d
        text: Даты переходов между статусами
    correct:
      - a
      - b
      - c
    explanation: Даты нужны для метрик; персональные данные и названия клиентов — нет.
    lessonId: m05-04
  - id: lead-minus-cycle
    type: single
    prompt: Чему равна разница между lead time и cycle time?
    options:
      - id: a
        text: Времени ожидания в очереди до начала работы
      - id: b
        text: Времени тестирования
      - id: c
        text: Нулю
      - id: d
        text: Длине спринта
    correct: a
    explanation: Заказчик ждёт и в очереди, и в работе.
    lessonId: m05-01
  - id: start-definition
    type: single
    prompt: Что важно при подсчёте cycle time?
    options:
      - id: a
        text: Одинаково определять начало и конец работы всё время
      - id: b
        text: Каждый раз по-разному
      - id: c
        text: Считать только выходные
      - id: d
        text: Не считать праздники
    correct: a
    explanation: Иначе цифры несравнимы.
    lessonId: m05-01
  - id: median-vs-mean
    type: single
    prompt: "Время цикла: 2, 3, 3, 4, 30 дней. Что лучше описывает типичную задачу?"
    options:
      - id: a
        text: Среднее — 8,4 дня
      - id: b
        text: Медиана — 3 дня
      - id: c
        text: Максимум — 30 дней
      - id: d
        text: Минимум — 2 дня
    correct: b
    explanation: Одна длинная задача искажает среднее.
    lessonId: m05-01
  - id: age-threshold
    type: single
    prompt: Когда задачу в работе пора разобрать по возрасту?
    options:
      - id: a
        text: Когда она старше, чем 85% ранее завершённых задач
      - id: b
        text: Через час
      - id: c
        text: Никогда
      - id: d
        text: Когда исполнитель в отпуске
    correct: a
    explanation: Это ранний сигнал застревания.
    lessonId: m05-01
  - id: metrics-by-type
    type: single
    prompt: Почему метрики считают отдельно для разных типов работы?
    options:
      - id: a
        text: Так короче
      - id: b
        text: Срочные исправления и крупные функции дают бессмысленное общее распределение
      - id: c
        text: Так требует трекер
      - id: d
        text: Не нужно
    correct: b
    explanation: Смешанная выборка не помогает решениям.
    lessonId: m05-01
  - id: burndown-flat
    type: single
    prompt: Burn-down три недели горизонтален. Какие два объяснения возможны?
    options:
      - id: a
        text: Простой команды или рост объёма
      - id: b
        text: Только отпуск
      - id: c
        text: Только ошибка графика
      - id: d
        text: Только успех
    correct: a
    explanation: Burn-up позволит различить эти случаи.
    lessonId: m05-02
  - id: cfd-horizontal
    type: single
    prompt: Что показывает горизонтальное расстояние между границами «В работе» и «Готово» на CFD?
    options:
      - id: a
        text: Приблизительное время прохождения задачи
      - id: b
        text: Бюджет
      - id: c
        text: Количество людей
      - id: d
        text: Число багов
    correct: a
    explanation: Вертикальная толщина — WIP этапа.
    lessonId: m05-02
  - id: cfd-backlog-grows
    type: single
    prompt: На CFD растёт только верхняя полоса бэклога. Что это значит?
    options:
      - id: a
        text: Работа поступает быстрее, чем команда её берёт; прогноз ухудшается
      - id: b
        text: Всё отлично
      - id: c
        text: Команда ускорилась
      - id: d
        text: Ничего
    correct: a
    explanation: Нужно управлять притоком.
    lessonId: m05-02
  - id: ideal-line
    type: single
    prompt: Как относиться к «идеальной» прямой на burn-down?
    options:
      - id: a
        text: Как к строгому плану
      - id: b
        text: "Как к упрощению: важен тренд, а не отклонения в первые дни"
      - id: c
        text: Как к ошибке
      - id: d
        text: Удалять её
    correct: b
    explanation: Работа никогда не идёт равномерно.
    lessonId: m05-02
  - id: bottleneck-help
    type: single
    prompt: Полоса «Проверка» на CFD расширяется. Что НЕ поможет?
    options:
      - id: a
        text: Подключить разработчиков к тестированию
      - id: b
        text: Ввести WIP-лимит на «Проверку»
      - id: c
        text: Попросить разработчиков писать код быстрее
      - id: d
        text: Автоматизировать проверки
    correct: c
    explanation: Ускорение до узкого места только увеличит очередь.
    lessonId: m05-02
  - id: dash-title
    type: single
    prompt: Какой заголовок графика для руководителя лучше?
    options:
      - id: a
        text: «Burn-up»
      - id: b
        text: "«Прогноз: 20 марта с уверенностью 85%»"
      - id: c
        text: «График 3»
      - id: d
        text: «Данные»
    correct: b
    explanation: Заголовок — вывод или вопрос.
    lessonId: m05-03
  - id: dash-top-left
    type: single
    prompt: Где на дашборде размещать самое важное?
    options:
      - id: a
        text: Внизу справа
      - id: b
        text: Сверху слева, куда смотрят первым делом
      - id: c
        text: В приложении
      - id: d
        text: Посередине мелко
    correct: b
    explanation: Порядок чтения определяет порядок важности.
    lessonId: m05-03
  - id: dash-comment
    type: single
    prompt: Что должно быть рядом с дашбордом для спонсора?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Две-три строки комментария PM
      - id: c
        text: Все задачи
      - id: d
        text: Протоколы
    correct: b
    explanation: Цифры не объясняют, что за ними стоит и что делать.
    lessonId: m05-03
  - id: dash-3d
    type: single
    prompt: Почему не стоит использовать трёхмерные диаграммы и «спидометры»?
    options:
      - id: a
        text: Они старомодные
      - id: b
        text: Они мешают читать данные
      - id: c
        text: Они дорогие
      - id: d
        text: Их нельзя сделать
    correct: b
    explanation: Минимум украшений — больше смысла.
    lessonId: m05-03
  - id: export-filter
    type: single
    prompt: Как сделать обезличивание выгрузки надёжным?
    options:
      - id: a
        text: Каждый раз вручную
      - id: b
        text: Сохранить в трекере фильтр выгрузки только с нужными полями
      - id: c
        text: Не обезличивать
      - id: d
        text: Попросить ИИ
    correct: b
    explanation: Процесс не должен зависеть от усталости.
    lessonId: m05-04
  - id: pm-fields
    type: single
    prompt: Какие части еженедельной сводки остаются за PM?
    options:
      - id: a
        text: Статус, прогноз, запросы к руководству
      - id: b
        text: Количество задач
      - id: c
        text: Список закрытых задач
      - id: d
        text: Оформление
    correct: a
    explanation: Это управленческие выводы.
    lessonId: m05-04
  - id: partial-send
    type: single
    prompt: Сценарий сводки упал на середине. Что должно произойти?
    options:
      - id: a
        text: Отправить частичный отчёт
      - id: b
        text: Не отправлять и уведомить владельца
      - id: c
        text: Отправить пустой
      - id: d
        text: Отправить старый
    correct: b
    explanation: Частичный результат вводит в заблуждение.
    lessonId: m05-04
  - id: weekly-steps
    type: single
    prompt: Что даёт регулярный процесс сводки с одинаковыми шагами?
    options:
      - id: a
        text: Экономию времени и стабильность результата
      - id: b
        text: Ничего
      - id: c
        text: Больше работы
      - id: d
        text: Меньше данных
    correct: a
    explanation: Экономия появляется от повторяемости.
    lessonId: m05-04
  - id: throughput-spread
    type: single
    prompt: Почему важно смотреть не только среднюю пропускную способность, но и разброс?
    options:
      - id: a
        text: Разброс определяет неопределённость прогноза
      - id: b
        text: Не важно
      - id: c
        text: Так красивее
    correct: a
    explanation: Отсюда нужны процентили и Монте-Карло.
    lessonId: m05-01
  - id: wip-now
    type: single
    prompt: Какая метрика показывает проблему, пока задача ещё в работе?
    options:
      - id: a
        text: Возраст задачи
      - id: b
        text: Cycle time
      - id: c
        text: Lead time
    correct: a
    explanation: Cycle time известен только после завершения.
    lessonId: m05-01
  - id: cfd-colums-real
    type: single
    prompt: Когда CFD показывает «фантазию»?
    options:
      - id: a
        text: Когда колонки доски не отражают реальный процесс
      - id: b
        text: Когда много задач
      - id: c
        text: Когда мало людей
    correct: a
    explanation: CFD не лучше доски, на которой построен.
    lessonId: m05-02
  - id: dash-audience-many
    type: single
    prompt: Почему один дашборд «для всех» обычно плох?
    options:
      - id: a
        text: Аудиториям нужны разные вопросы и глубина
      - id: b
        text: Это дорого
      - id: c
        text: Так нельзя технически
    correct: a
    explanation: Лучше два-три простых дашборда.
    lessonId: m05-03
  - id: dash-definitions
    type: single
    prompt: Что написать под каждой метрикой дашборда?
    options:
      - id: a
        text: Определение, источник и частоту обновления
      - id: b
        text: Имя автора
      - id: c
        text: Ничего
    correct: a
    explanation: Иначе обсуждают, что значат цифры.
    lessonId: m05-03
  - id: report-no-rounding
    type: single
    prompt: Что запретить модели в промпте сводки по готовым цифрам?
    options:
      - id: a
        text: Округлять и пересчитывать цифры, добавлять причины
      - id: b
        text: Писать короче
      - id: c
        text: Использовать шаблон
    correct: a
    explanation: Цифры — дословно из таблицы.
    lessonId: m05-04
