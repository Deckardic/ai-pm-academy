id: m10
slug: komanda-i-liderstvo
order: 10
title: Команда и лидерство
summary: Мотивация, делегирование, 1:1, конфликты и внедрение ИИ в команде.
goals:
  - Проводить 1:1 и делегировать
  - Разрешать конфликты
  - Внедрять ИИ без сопротивления
status: published
artifact: Шаблон 1:1 и план фасилитации
keyConcepts:
  - "1:1"
  - делегирование
  - конфликт
  - фасилитация
searchQueries:
  - как проводить 1 на 1
lessonsPlan:
  - slug: motivaciya
    title: Мотивация команды
    focus: что действительно мотивирует людей
    durationMin: 12
    keyPoints:
      - Внутренняя и внешняя мотивация
      - Автономия, мастерство, смысл
      - Признание результатов
      - Демотиваторы, которые создаёт PM
    practice: Найти демотиваторы в описании команды
  - slug: delegirovanie
    title: Делегирование
    focus: как отдавать задачи без микроменеджмента
    durationMin: 12
    keyPoints:
      - Уровни делегирования
      - Что делегировать нельзя
      - Контроль через договорённости
      - Рост людей через задачи
    practice: Разложить свои задачи по уровням делегирования
  - slug: one-on-one
    title: Встречи один на один
    focus: регулярный разговор, который строит доверие
    durationMin: 11
    keyPoints:
      - Встреча сотрудника, а не отчёт
      - Вопросы для 1:1
      - Регулярность и заметки
      - Сложные темы
    practice: Подготовить шаблон 1:1
  - slug: konflikty
    title: Конфликты в команде
    focus: как разбирать и не усугублять
    durationMin: 13
    keyPoints:
      - Источники конфликтов
      - Стили поведения в конфликте
      - Разговор о фактах и интересах
      - Когда звать руководителя
    practice: Разобрать конфликт между разработчиком и аналитиком
  - slug: vnedrenie-ii-v-komande
    title: Внедрение ИИ в команде
    focus: без сопротивления и хаоса
    durationMin: 13
    keyPoints:
      - Страхи и их причины
      - Пилот на добровольцах
      - Правила по данным и проверке
      - Обмен практиками и метрики эффекта
    practice: Составить план пилота ИИ в команде на месяц
assignment:
  title: Шаблон 1:1 и план фасилитации
  deliverable: Шаблон встречи 1:1 и план ретро или воркшопа
  brief: Шаблон 1:1 с вопросами, план фасилитации одной встречи команды и план пилота ИИ.
quizFocus:
  - мотивация
  - уровни делегирования
  - встречи 1:1
  - стили поведения в конфликте
  - внедрение ИИ
