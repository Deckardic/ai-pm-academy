id: m10-quiz
kind: module
title: "Тест модуля: Команда и лидерство"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: intrinsic-factors
    type: multiple
    prompt: "Какие факторы внутренней мотивации выделяет Дэниел Пинк? Выберите все подходящие."
    options:
      - { id: a, text: "Автономия" }
      - { id: b, text: "Мастерство" }
      - { id: c, text: "Смысл" }
      - { id: d, text: "Премия по итогам квартала" }
    correct: [a, b, c]
    explanation: "Премия — внешняя мотивация. Внутренняя строится на автономии, мастерстве и смысле."
    lessonId: m10-01
  - id: cancelled-feature
    type: single
    scenario: "Функцию, над которой команда работала месяц, отменили по решению руководства."
    prompt: "Как PM снизить демотивацию?"
    options:
      - { id: a, text: "Промолчать" }
      - {
          id: b,
          text: "Объяснить причину, признать сделанную работу и рассказать, что пригодится дальше",
        }
      - { id: c, text: "Сразу перейти к следующей задаче" }
    correct: b
    explanation: "Больше всего демотивирует отсутствие объяснений и признания."
    lessonId: m10-01
  - id: pm-demotivators
    type: multiple
    prompt: "Какие демотиваторы часто создаёт сам PM? Выберите все подходящие."
    options:
      - { id: a, text: "Микроменеджмент" }
      - { id: b, text: "Постоянная смена приоритетов" }
      - { id: c, text: "Отчётность, которую никто не читает" }
      - { id: d, text: "Показ команде, как пользователи работают с результатом" }
    correct: [a, b, c]
    explanation: "Показ результата пользователям, наоборот, усиливает ощущение смысла."
    lessonId: m10-01
  - id: delegation-level
    type: single
    prompt: "Что означает уровень делегирования «ты решаешь, потом рассказываешь мне»?"
    options:
      - { id: a, text: "Сотрудник принимает решение сам и информирует PM после" }
      - { id: b, text: "PM решает и объясняет" }
      - { id: c, text: "Решают вместе" }
    correct: a
    explanation: "Это шестой уровень из семи в модели Юргена Аппело."
    lessonId: m10-02
  - id: not-delegate
    type: single
    prompt: "Что PM нельзя делегировать?"
    options:
      - { id: a, text: "Подготовку черновика статус-отчёта" }
      - { id: b, text: "Ответственность перед спонсором за результат проекта" }
      - { id: c, text: "Еженедельный созвон с подрядчиком" }
    correct: b
    explanation: "Ответственность можно разделить, но не передать."
    lessonId: m10-02
  - id: delegated-decision
    type: single
    scenario: "Аналитик в согласованных границах перенёс с подрядчиком второстепенную задачу на неделю, релиз не затронут."
    prompt: "Как поступить PM?"
    options:
      - { id: a, text: "Отменить решение" }
      - { id: b, text: "Принять; при необходимости уточнить границы на будущее" }
      - { id: c, text: "Забрать общение с подрядчиком себе" }
    correct: b
    explanation: "Отмена решения в границах подрывает доверие и делегирование."
    lessonId: m10-02
  - id: one-on-one-purpose
    type: single
    prompt: "Что главное на встрече один на один?"
    options:
      - { id: a, text: "Статус задач" }
      - {
          id: b,
          text: "То, что важно сотруднику: самочувствие, препятствия, развитие, обратная связь",
        }
      - { id: c, text: "Оценка производительности" }
    correct: b
    explanation: "Статус обсуждают на командных встречах; 1:1 — время сотрудника."
    lessonId: m10-03
  - id: one-on-one-notes
    type: single
    prompt: "Можно ли отправить заметки встреч 1:1 в ИИ-сервис, чтобы сделать сводку?"
    options:
      - { id: a, text: "Да, если сервис удобный" }
      - { id: b, text: "Нет: заметки конфиденциальны и могут содержать личные обстоятельства" }
      - { id: c, text: "Да, если убрать даты" }
    correct: b
    explanation: "Заметки 1:1 не уходят в ИИ-сервисы и не пересказываются без согласия."
    lessonId: m10-03
  - id: conflict-security
    type: single
    scenario: "Разработчик хочет выпустить функцию без проверки безопасности, чтобы успеть к демонстрации."
    prompt: "Какой стиль поведения PM уместен?"
    options:
      - { id: a, text: "Приспособление" }
      - { id: b, text: "Соперничество — вопрос безопасности не обсуждается" }
      - { id: c, text: "Избегание" }
    correct: b
    explanation: "Безопасность — случай, когда уместно твёрдо отстоять позицию."
    lessonId: m10-04
  - id: conflict-root
    type: single
    prompt: "Аналитик и разработчик конфликтуют из-за «плохих требований». С чего начать разбор?"
    options:
      - { id: a, text: "Выяснить, кто виноват" }
      - { id: b, text: "Проверить процесс: как фиксируются и меняются требования, понятны ли роли" }
      - { id: c, text: "Развести их по разным проектам" }
    correct: b
    explanation: "Часто конфликт «о людях» на деле — о процессе или ролях."
    lessonId: m10-04
  - id: ai-pilot
    type: single
    prompt: "Как лучше начать внедрение ИИ в команде?"
    options:
      - { id: a, text: "Обязать всех использовать ИИ с понедельника" }
      - {
          id: b,
          text: "Пилот на добровольцах с понятными задачами, правилами и измерением эффекта",
        }
      - { id: c, text: "Дождаться, пока все начнут сами" }
    correct: b
    explanation: "Пилот снижает сопротивление, даёт реальные данные и примеры для остальных."
    lessonId: m10-05
  - id: ai-leak
    type: single
    scenario: "Участник пилота отправил в личный чат-бот выгрузку с данными клиентов."
    prompt: "Какая мера правильная в первую очередь?"
    options:
      - { id: a, text: "Запретить ИИ всей команде" }
      - {
          id: b,
          text: "Обработать инцидент по процедуре компании, напомнить правила и дать разрешённый способ решать задачу",
        }
      - { id: c, text: "Ничего не делать" }
    correct: b
    explanation: "Тотальный запрет толкает людей пользоваться ИИ тайно."
    lessonId: m10-05
  - id: ai-metrics
    type: single
    prompt: "Как честно измерить эффект ИИ на задаче?"
    options:
      - { id: a, text: "Сравнить время генерации с ручной работой" }
      - { id: b, text: "Сравнить время с учётом проверки и исправлений, а также качество и ошибки" }
      - { id: c, text: "Спросить, нравится ли команде" }
    correct: b
    explanation: "Без учёта проверки экономия завышается и подрывает доверие к пилоту."
    lessonId: m10-05
