id: m10-quiz
kind: module
title: "Тест модуля: Команда и лидерство"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: intrinsic-factors
    type: multiple
    prompt: Какие факторы внутренней мотивации выделяет Дэниел Пинк? Выберите все подходящие.
    options:
      - id: a
        text: Автономия
      - id: b
        text: Мастерство
      - id: c
        text: Смысл
      - id: d
        text: Премия по итогам квартала
    correct:
      - a
      - b
      - c
    explanation: Премия — внешняя мотивация. Внутренняя строится на автономии, мастерстве и смысле.
    lessonId: m10-01
  - id: cancelled-feature
    type: single
    scenario: Функцию, над которой команда работала месяц, отменили по решению руководства.
    prompt: Как PM снизить демотивацию?
    options:
      - id: a
        text: Промолчать
      - id: b
        text: Объяснить причину, признать сделанную работу и рассказать, что пригодится дальше
      - id: c
        text: Сразу перейти к следующей задаче
    correct: b
    explanation: Больше всего демотивирует отсутствие объяснений и признания.
    lessonId: m10-01
  - id: pm-demotivators
    type: multiple
    prompt: Какие демотиваторы часто создаёт сам PM? Выберите все подходящие.
    options:
      - id: a
        text: Микроменеджмент
      - id: b
        text: Постоянная смена приоритетов
      - id: c
        text: Отчётность, которую никто не читает
      - id: d
        text: Показ команде, как пользователи работают с результатом
    correct:
      - a
      - b
      - c
    explanation: Показ результата пользователям, наоборот, усиливает ощущение смысла.
    lessonId: m10-01
  - id: delegation-level
    type: single
    prompt: Что означает уровень делегирования «ты решаешь, потом рассказываешь мне»?
    options:
      - id: a
        text: Сотрудник принимает решение сам и информирует PM после
      - id: b
        text: PM решает и объясняет
      - id: c
        text: Решают вместе
    correct: a
    explanation: Это шестой уровень из семи в модели Юргена Аппело.
    lessonId: m10-02
  - id: not-delegate
    type: single
    prompt: Что PM нельзя делегировать?
    options:
      - id: a
        text: Подготовку черновика статус-отчёта
      - id: b
        text: Ответственность перед спонсором за результат проекта
      - id: c
        text: Еженедельный созвон с подрядчиком
    correct: b
    explanation: Ответственность можно разделить, но не передать.
    lessonId: m10-02
  - id: delegated-decision
    type: single
    scenario:
      Аналитик в согласованных границах перенёс с подрядчиком второстепенную задачу на неделю, релиз
      не затронут.
    prompt: Как поступить PM?
    options:
      - id: a
        text: Отменить решение
      - id: b
        text: Принять; при необходимости уточнить границы на будущее
      - id: c
        text: Забрать общение с подрядчиком себе
    correct: b
    explanation: Отмена решения в границах подрывает доверие и делегирование.
    lessonId: m10-02
  - id: one-on-one-purpose
    type: single
    prompt: Что главное на встрече один на один?
    options:
      - id: a
        text: Статус задач
      - id: b
        text: "То, что важно сотруднику: самочувствие, препятствия, развитие, обратная связь"
      - id: c
        text: Оценка производительности
    correct: b
    explanation: Статус обсуждают на командных встречах; 1:1 — время сотрудника.
    lessonId: m10-03
  - id: one-on-one-notes
    type: single
    prompt: Можно ли отправить заметки встреч 1:1 в ИИ-сервис, чтобы сделать сводку?
    options:
      - id: a
        text: Да, если сервис удобный
      - id: b
        text: "Нет: заметки конфиденциальны и могут содержать личные обстоятельства"
      - id: c
        text: Да, если убрать даты
    correct: b
    explanation: Заметки 1:1 не уходят в ИИ-сервисы и не пересказываются без согласия.
    lessonId: m10-03
  - id: conflict-security
    type: single
    scenario: Разработчик хочет выпустить функцию без проверки безопасности, чтобы успеть к демонстрации.
    prompt: Какой стиль поведения PM уместен?
    options:
      - id: a
        text: Приспособление
      - id: b
        text: Соперничество — вопрос безопасности не обсуждается
      - id: c
        text: Избегание
    correct: b
    explanation: Безопасность — случай, когда уместно твёрдо отстоять позицию.
    lessonId: m10-04
  - id: conflict-root
    type: single
    prompt: Аналитик и разработчик конфликтуют из-за «плохих требований». С чего начать разбор?
    options:
      - id: a
        text: Выяснить, кто виноват
      - id: b
        text: "Проверить процесс: как фиксируются и меняются требования, понятны ли роли"
      - id: c
        text: Развести их по разным проектам
    correct: b
    explanation: Часто конфликт «о людях» на деле — о процессе или ролях.
    lessonId: m10-04
  - id: ai-pilot
    type: single
    prompt: Как лучше начать внедрение ИИ в команде?
    options:
      - id: a
        text: Обязать всех использовать ИИ с понедельника
      - id: b
        text: Пилот на добровольцах с понятными задачами, правилами и измерением эффекта
      - id: c
        text: Дождаться, пока все начнут сами
    correct: b
    explanation: Пилот снижает сопротивление, даёт реальные данные и примеры для остальных.
    lessonId: m10-05
  - id: ai-leak
    type: single
    scenario: Участник пилота отправил в личный чат-бот выгрузку с данными клиентов.
    prompt: Какая мера правильная в первую очередь?
    options:
      - id: a
        text: Запретить ИИ всей команде
      - id: b
        text:
          Обработать инцидент по процедуре компании, напомнить правила и дать разрешённый способ решать
          задачу
      - id: c
        text: Ничего не делать
    correct: b
    explanation: Тотальный запрет толкает людей пользоваться ИИ тайно.
    lessonId: m10-05
  - id: ai-metrics
    type: single
    prompt: Как честно измерить эффект ИИ на задаче?
    options:
      - id: a
        text: Сравнить время генерации с ручной работой
      - id: b
        text: Сравнить время с учётом проверки и исправлений, а также качество и ошибки
      - id: c
        text: Спросить, нравится ли команде
    correct: b
    explanation: Без учёта проверки экономия завышается и подрывает доверие к пилоту.
    lessonId: m10-05
  - id: fair-pay
    type: single
    prompt: Какая роль у справедливой оплаты в мотивации?
    options:
      - id: a
        text: Никакой
      - id: b
        text: Базовое условие, без которого остальное не работает
      - id: c
        text: Главный мотиватор для творческой работы
      - id: d
        text: Лишний фактор
    correct: b
    explanation: Но для интеллектуальной работы внутренняя мотивация важнее.
    lessonId: m10-01
  - id: recognition-heroics
    type: single
    prompt: Чем опасно хвалить только за ночные авралы?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Команда научится устраивать авралы
      - id: c
        text: Люди станут скромнее
      - id: d
        text: Похвала обесценится
    correct: b
    explanation: Признавайте вклад, а не героизм.
    lessonId: m10-01
  - id: recognition-specific
    type: single
    prompt: Какое признание работает лучше?
    options:
      - id: a
        text: «Молодцы»
      - id: b
        text: «Интеграция статусов снизила звонки дилеров в поддержку — отдел продаж это заметил»
      - id: c
        text: Премия через год
      - id: d
        text: Молчание
    correct: b
    explanation: Конкретное и своевременное признание.
    lessonId: m10-01
  - id: what-motivates
    type: single
    prompt: Как узнать, что мотивирует конкретного человека?
    options:
      - id: a
        text: Угадать
      - id: b
        text: Спросить на встречах один на один
      - id: c
        text: Посмотреть в резюме
      - id: d
        text: Спросить ИИ
    correct: b
    explanation: Люди разные.
    lessonId: m10-01
  - id: appelo
    type: single
    prompt: Кто предложил семь уровней делегирования?
    options:
      - id: a
        text: Юрген Аппело (Management 3.0)
      - id: b
        text: Роберт Купер
      - id: c
        text: Норман Керт
      - id: d
        text: Гудхарт
    correct: a
    explanation: Уровни помогают явно договориться о границах решения.
    lessonId: m10-02
  - id: delegate-no-power
    type: single
    prompt: Можно ли поручить договариваться о бюджете человеку без права его менять?
    options:
      - id: a
        text: Да
      - id: b
        text: Нет — делегирование без полномочий не работает
      - id: c
        text: Только в пятницу
      - id: d
        text: Только стажёру
    correct: b
    explanation: Передаётся задача вместе с правом решения.
    lessonId: m10-02
  - id: between-checkpoints
    type: single
    prompt: Что делать между точками проверки делегированной задачи?
    options:
      - id: a
        text: Проверять каждый день
      - id: b
        text: Не вмешиваться, если нет сигналов
      - id: c
        text: Переделывать самому
      - id: d
        text: Спрашивать ИИ
    correct: b
    explanation: Вмешательство возвращает задачу вам.
    lessonId: m10-02
  - id: growth-delegation
    type: single
    prompt: Как развивать человека через делегирование?
    options:
      - id: a
        text: Сразу дать максимальный уровень
      - id: b
        text: Начать с более низкого уровня и поднимать его по мере успехов
      - id: c
        text: Не давать сложных задач
      - id: d
        text: Давать только рутину
    correct: b
    explanation: Задачи немного выше текущего уровня растят людей.
    lessonId: m10-02
  - id: cancel-1-1
    type: single
    prompt: Что сообщает человеку отменённая встреча один на один?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Что он неважен; лучше перенести, но не пропускать
      - id: c
        text: Что всё хорошо
      - id: d
        text: Что его повысили
    correct: b
    explanation: Регулярность важнее длительности.
    lessonId: m10-03
  - id: shared-doc-1-1
    type: single
    prompt: Какая практика помогает сотруднику вести повестку 1:1?
    options:
      - id: a
        text: Общий документ, куда он заранее пишет темы
      - id: b
        text: Запрет на темы
      - id: c
        text: Отчёт о задачах
      - id: d
        text: Опрос в конце года
    correct: a
    explanation: Вопросы PM идут после тем сотрудника.
    lessonId: m10-03
  - id: hard-topic-1-1
    type: single
    prompt: Как поднять на 1:1 тему снижения качества работы?
    options:
      - id: a
        text: «Ты стал небрежным»
      - id: b
        text: Конкретно о ситуациях и с вопросом о причинах
      - id: c
        text: Не поднимать
      - id: d
        text: Через HR без разговора
    correct: b
    explanation: О поведении и ситуациях, а не о личности.
    lessonId: m10-03
  - id: avoid-style
    type: single
    prompt: Когда уместно избегание в конфликте?
    options:
      - id: a
        text: Всегда
      - id: b
        text: Когда вопрос неважен, нужно остыть или решать должен другой
      - id: c
        text: Никогда
      - id: d
        text: В вопросах безопасности
    correct: b
    explanation: У каждого стиля своё место.
    lessonId: m10-04
  - id: collaboration-style
    type: single
    prompt: Когда уместно сотрудничество?
    options:
      - id: a
        text: Вопрос важен, есть время, нужны обязательства обеих сторон
      - id: b
        text: Срочное решение
      - id: c
        text: Вопрос неважен
      - id: d
        text: Никогда
    correct: a
    explanation: Сотрудничество дольше, но даёт лучшее решение.
    lessonId: m10-04
  - id: call-hr
    type: single
    prompt: Когда PM зовёт руководителя или HR в конфликт?
    options:
      - id: a
        text: При каждом споре
      - id: b
        text: При недопустимом поведении или вопросах вне полномочий PM
      - id: c
        text: Никогда
      - id: d
        text: Когда устал
    correct: b
    explanation: PM — не психолог и не руководитель всех участников.
    lessonId: m10-04
  - id: separate-talks
    type: single
    prompt: Зачем перед совместной встречей по конфликту поговорить с каждым отдельно?
    options:
      - id: a
        text: Чтобы выбрать сторону
      - id: b
        text: Выслушать позицию и эмоции, не принимая сторону
      - id: c
        text: Чтобы отменить встречу
      - id: d
        text: Не нужно
    correct: b
    explanation: Так встреча идёт спокойнее.
    lessonId: m10-04
  - id: ai-fears
    type: single
    prompt: Сотрудник боится, что ИИ его заменит. Как лучше ответить?
    options:
      - id: a
        text: «Никого не сократят» без оснований
      - id: b
        text:
          "Честно: ИИ берёт рутину, решения и ответственность остаются за людьми; показать, как меняется
          роль"
      - id: c
        text: Игнорировать
      - id: d
        text: Сократить его
    correct: b
    explanation: Не обещайте того, чего не знаете.
    lessonId: m10-05
  - id: champions
    type: single
    prompt: Какая роль «чемпионов» пилота ИИ?
    options:
      - id: a
        text: Судить других
      - id: b
        text: Помогать коллегам на следующем этапе внедрения
      - id: c
        text: Контролировать всех
      - id: d
        text: Получать премии
    correct: b
    explanation: Пример коллег убедительнее инструкций.
    lessonId: m10-05
  - id: rules-before
    type: single
    prompt: Когда писать памятку по данным для пилота ИИ?
    options:
      - id: a
        text: После утечки
      - id: b
        text: До старта пилота
      - id: c
        text: Через месяц
      - id: d
        text: Не писать
    correct: b
    explanation: Правила — до инструмента.
    lessonId: m10-05
