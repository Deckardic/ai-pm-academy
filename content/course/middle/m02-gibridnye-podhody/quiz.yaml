id: m02-quiz
kind: module
title: "Тест модуля: Гибридные подходы"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: hybrid-origin
    type: single
    prompt: "С чего правильно начинать проектирование гибридного подхода?"
    options:
      - { id: a, text: "С выбора, что взять из Scrum и что из каскада" }
      - {
          id: b,
          text: "С ограничений проекта: для каждого — элемент процесса, который на него отвечает",
        }
      - { id: c, text: "С того, как работали на прошлом проекте" }
    correct: b
    explanation: "Каждый элемент осознанного гибрида отвечает конкретному ограничению проекта."
    lessonId: m02-01
  - id: hybrid-chaos
    type: single
    scenario: "Команда работает спринтами, а PM ведёт детальную диаграмму Ганта на все задачи на полгода вперёд, которая расходится со спринтами каждую неделю."
    prompt: "Что это?"
    options:
      - { id: a, text: "Хороший гибрид" }
      - {
          id: b,
          text: "Хаос: два несогласованных плана одного уровня вместо плана вех сверху и итераций внутри",
        }
      - { id: c, text: "Чистый каскад" }
    correct: b
    explanation: "В осознанном гибриде уровни разделены и синхронизированы."
    lessonId: m02-01
  - id: hybrid-reasons
    type: multiple
    prompt: "Какие ограничения обычно приводят к гибридному подходу? Выберите все подходящие."
    options:
      - { id: a, text: "Фиксированный договор при неопределённых требованиях" }
      - { id: b, text: "Подрядчики с разными процессами" }
      - { id: c, text: "Обязательные регуляторные согласования" }
      - { id: d, text: "Одна небольшая команда и полностью вовлечённый заказчик" }
    correct: [a, b, c]
    explanation: "Последний случай часто хорошо закрывается чистым Scrum или Kanban."
    lessonId: m02-01
  - id: gate-meaning
    type: single
    prompt: "Какое решение принимают на воротах Stage-Gate?"
    options:
      - { id: a, text: "Инвестиционное: вкладываться ли в следующий этап" }
      - { id: b, text: "Какие задачи взять в спринт" }
      - { id: c, text: "Кто из команды работал лучше" }
    correct: a
    explanation: "Ворота — точка инвестиционного решения с учётом того, что узнали на этапе."
    lessonId: m02-02
  - id: stage-goal
    type: single
    prompt: "Как лучше сформулировать цель этапа пилота?"
    options:
      - { id: a, text: "Сделать 20 функций портала" }
      - {
          id: b,
          text: "Проверить, что пять пилотных дилеров оформляют через портал большинство заказов",
        }
      - { id: c, text: "Провести 6 спринтов" }
    correct: b
    explanation: "Цель этапа — проверяемая гипотеза. Тогда итерации свободны искать лучший путь к ней."
    lessonId: m02-02
  - id: gate-stop
    type: single
    prompt: "Проект не подтвердил главную гипотезу на воротах, и его остановили. Как это оценить?"
    options:
      - { id: a, text: "Провал PM" }
      - { id: b, text: "Модель сработала: организация сэкономила ресурсы на следующих этапах" }
      - { id: c, text: "Ошибка — ворота нужны, чтобы продолжать" }
    correct: b
    explanation: "Ворота, где всегда решают «идём дальше», — ритуал. Остановка — их нормальный результат."
    lessonId: m02-02
  - id: wsf-loss
    type: single
    prompt: "Где в Water-Scrum-Fall теряется больше всего ценности?"
    options:
      - { id: a, text: "В спринтах" }
      - {
          id: b,
          text: "На длинных концах: требования устаревают, а обратная связь приходит только после внедрения",
        }
      - { id: c, text: "На дейли" }
    correct: b
    explanation: "Итерации есть только в середине, а организация получает результат по-прежнему в конце."
    lessonId: m02-03
  - id: wsf-security
    type: single
    scenario: "Безопасность проверяет решение только в конце и каждый раз находит проблемы, из-за которых запуск сдвигается."
    prompt: "Что поможет лучше всего?"
    options:
      - { id: a, text: "Добавить месяц буфера в конце" }
      - {
          id: b,
          text: "Включить требования безопасности в критерии готовности итераций и звать специалиста на обзоры",
        }
      - { id: c, text: "Пропустить проверку" }
    correct: b
    explanation: "Перенос проверок внутрь итераций находит проблемы рано, когда их дешевле исправить."
    lessonId: m02-03
  - id: wsf-ok
    type: single
    prompt: "Когда Water-Scrum-Fall может быть разумным компромиссом?"
    options:
      - {
          id: a,
          text: "Когда регуляторика требует утверждения требований до разработки или сертификации перед запуском",
        }
      - { id: b, text: "Когда хочется выглядеть гибкими" }
      - { id: c, text: "Всегда" }
    correct: a
    explanation: "При внешних ограничениях длинные концы оправданы — но компромисс должен быть осознанным."
    lessonId: m02-03
  - id: minimal-process
    type: single
    prompt: "Какой вопрос помогает понять, нужна ли встреча или документ в процессе?"
    options:
      - { id: a, text: "Так ли делают в других компаниях?" }
      - { id: b, text: "Какое решение принимается на этой встрече или по этому документу?" }
      - { id: c, text: "Нравится ли это руководству?" }
    correct: b
    explanation: "Минимально достаточный процесс — только элементы, которые помогают решениям и снижают риски."
    lessonId: m02-04
  - id: busy-customer
    type: single
    scenario: "Заказчик готов уделять проекту час в месяц, а требования неопределённые."
    prompt: "Как адаптировать процесс?"
    options:
      - { id: a, text: "Проводить демонстрации без заказчика" }
      - {
          id: b,
          text: "Договориться о представителе заказчика с правом решения для частой обратной связи",
        }
      - { id: c, text: "Написать подробное ТЗ и отказаться от итераций" }
    correct: b
    explanation: "При неопределённости нужна частая обратная связь — от уполномоченного представителя."
    lessonId: m02-04
  - id: process-change-pace
    type: single
    prompt: "Как менять процесс по ходу проекта?"
    options:
      - { id: a, text: "Перестраивать каждую неделю" }
      - {
          id: b,
          text: "Менять одно-два правила за раз, фиксировать изменения и оценивать эффект через несколько итераций",
        }
      - { id: c, text: "Никогда не менять" }
    correct: b
    explanation: "Процессу нужно время, чтобы показать результат. Постоянная перестройка — тоже хаос."
    lessonId: m02-04
