id: m02-quiz
kind: module
title: "Тест модуля: Гибридные подходы"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: hybrid-origin
    type: single
    prompt: С чего правильно начинать проектирование гибридного подхода?
    options:
      - id: a
        text: С выбора, что взять из Scrum и что из каскада
      - id: b
        text: "С ограничений проекта: для каждого — элемент процесса, который на него отвечает"
      - id: c
        text: С того, как работали на прошлом проекте
    correct: b
    explanation: Каждый элемент осознанного гибрида отвечает конкретному ограничению проекта.
    lessonId: m02-01
  - id: hybrid-chaos
    type: single
    scenario:
      Команда работает спринтами, а PM ведёт детальную диаграмму Ганта на все задачи на полгода
      вперёд, которая расходится со спринтами каждую неделю.
    prompt: Что это?
    options:
      - id: a
        text: Хороший гибрид
      - id: b
        text: "Хаос: два несогласованных плана одного уровня вместо плана вех сверху и итераций внутри"
      - id: c
        text: Чистый каскад
    correct: b
    explanation: В осознанном гибриде уровни разделены и синхронизированы.
    lessonId: m02-01
  - id: hybrid-reasons
    type: multiple
    prompt: Какие ограничения обычно приводят к гибридному подходу? Выберите все подходящие.
    options:
      - id: a
        text: Фиксированный договор при неопределённых требованиях
      - id: b
        text: Подрядчики с разными процессами
      - id: c
        text: Обязательные регуляторные согласования
      - id: d
        text: Одна небольшая команда и полностью вовлечённый заказчик
    correct:
      - a
      - b
      - c
    explanation: Последний случай часто хорошо закрывается чистым Scrum или Kanban.
    lessonId: m02-01
  - id: gate-meaning
    type: single
    prompt: Какое решение принимают на воротах Stage-Gate?
    options:
      - id: a
        text: "Инвестиционное: вкладываться ли в следующий этап"
      - id: b
        text: Какие задачи взять в спринт
      - id: c
        text: Кто из команды работал лучше
    correct: a
    explanation: Ворота — точка инвестиционного решения с учётом того, что узнали на этапе.
    lessonId: m02-02
  - id: stage-goal
    type: single
    prompt: Как лучше сформулировать цель этапа пилота?
    options:
      - id: a
        text: Сделать 20 функций портала
      - id: b
        text: Проверить, что пять пилотных дилеров оформляют через портал большинство заказов
      - id: c
        text: Провести 6 спринтов
    correct: b
    explanation: Цель этапа — проверяемая гипотеза. Тогда итерации свободны искать лучший путь к ней.
    lessonId: m02-02
  - id: gate-stop
    type: single
    prompt: Проект не подтвердил главную гипотезу на воротах, и его остановили. Как это оценить?
    options:
      - id: a
        text: Провал PM
      - id: b
        text: "Модель сработала: организация сэкономила ресурсы на следующих этапах"
      - id: c
        text: Ошибка — ворота нужны, чтобы продолжать
    correct: b
    explanation: Ворота, где всегда решают «идём дальше», — ритуал. Остановка — их нормальный результат.
    lessonId: m02-02
  - id: wsf-loss
    type: single
    prompt: Где в Water-Scrum-Fall теряется больше всего ценности?
    options:
      - id: a
        text: В спринтах
      - id: b
        text: "На длинных концах: требования устаревают, а обратная связь приходит только после внедрения"
      - id: c
        text: На дейли
    correct: b
    explanation: Итерации есть только в середине, а организация получает результат по-прежнему в конце.
    lessonId: m02-03
  - id: wsf-security
    type: single
    scenario:
      Безопасность проверяет решение только в конце и каждый раз находит проблемы, из-за которых
      запуск сдвигается.
    prompt: Что поможет лучше всего?
    options:
      - id: a
        text: Добавить месяц буфера в конце
      - id: b
        text: Включить требования безопасности в критерии готовности итераций и звать специалиста на обзоры
      - id: c
        text: Пропустить проверку
    correct: b
    explanation: Перенос проверок внутрь итераций находит проблемы рано, когда их дешевле исправить.
    lessonId: m02-03
  - id: wsf-ok
    type: single
    prompt: Когда Water-Scrum-Fall может быть разумным компромиссом?
    options:
      - id: a
        text: Когда регуляторика требует утверждения требований до разработки или сертификации перед запуском
      - id: b
        text: Когда хочется выглядеть гибкими
      - id: c
        text: Всегда
    correct: a
    explanation: При внешних ограничениях длинные концы оправданы — но компромисс должен быть осознанным.
    lessonId: m02-03
  - id: minimal-process
    type: single
    prompt: Какой вопрос помогает понять, нужна ли встреча или документ в процессе?
    options:
      - id: a
        text: Так ли делают в других компаниях?
      - id: b
        text: Какое решение принимается на этой встрече или по этому документу?
      - id: c
        text: Нравится ли это руководству?
    correct: b
    explanation: Минимально достаточный процесс — только элементы, которые помогают решениям и снижают риски.
    lessonId: m02-04
  - id: busy-customer
    type: single
    scenario: Заказчик готов уделять проекту час в месяц, а требования неопределённые.
    prompt: Как адаптировать процесс?
    options:
      - id: a
        text: Проводить демонстрации без заказчика
      - id: b
        text: Договориться о представителе заказчика с правом решения для частой обратной связи
      - id: c
        text: Написать подробное ТЗ и отказаться от итераций
    correct: b
    explanation: При неопределённости нужна частая обратная связь — от уполномоченного представителя.
    lessonId: m02-04
  - id: process-change-pace
    type: single
    prompt: Как менять процесс по ходу проекта?
    options:
      - id: a
        text: Перестраивать каждую неделю
      - id: b
        text: Менять одно-два правила за раз, фиксировать изменения и оценивать эффект через несколько итераций
      - id: c
        text: Никогда не менять
    correct: b
    explanation: Процессу нужно время, чтобы показать результат. Постоянная перестройка — тоже хаос.
    lessonId: m02-04
  - id: contractors-diff
    type: single
    prompt: Внутренняя команда работает спринтами, подрядчик — по этапам договора. Где их синхронизировать?
    options:
      - id: a
        text: Нигде
      - id: b
        text: На уровне выше — через общий план вех
      - id: c
        text: Заставить подрядчика работать спринтами
      - id: d
        text: Отказаться от подрядчика
    correct: b
    explanation: Гибрид синхронизирует разные процессы через верхний уровень.
    lessonId: m02-01
  - id: hybrid-cost
    type: single
    prompt: Почему гибрид не всегда лучший выбор?
    options:
      - id: a
        text: Он сложнее, и его сложность должна окупаться
      - id: b
        text: Он запрещён
      - id: c
        text: Он всегда дорогой
      - id: d
        text: Он не работает
    correct: a
    explanation: Если ограничений нет, достаточно чистого подхода.
    lessonId: m02-01
  - id: hybrid-change-nothing
    type: single
    prompt: «У нас гибрид», но нет ранней обратной связи от пользователей. Что это скорее всего?
    options:
      - id: a
        text: Идеальный гибрид
      - id: b
        text: Каскад с дейли под новым названием
      - id: c
        text: Kanban
      - id: d
        text: Scrum
    correct: b
    explanation: Без обратной связи и адаптации гибкость — только название.
    lessonId: m02-01
  - id: regulatory-hybrid
    type: single
    prompt: Как совместить регуляторные согласования с итерациями?
    options:
      - id: a
        text: Никак
      - id: b
        text: Формальные вехи согласований сверху, итерации внутри этапов
      - id: c
        text: Отменить согласования
      - id: d
        text: Согласовывать каждую задачу
    correct: b
    explanation: Так гибрид отвечает обоим ограничениям.
    lessonId: m02-01
  - id: cooper
    type: single
    prompt: С чьими работами связывают модель Stage-Gate?
    options:
      - id: a
        text: Роберта Купера
      - id: b
        text: Уинстона Ройса
      - id: c
        text: Дэниела Пинка
      - id: d
        text: Гудхарта
    correct: a
    explanation: Модель Stage-Gate связывают с работами Роберта Купера о разработке новых продуктов.
    lessonId: m02-02
  - id: gate-options
    type: single
    prompt: Какие решения возможны на воротах Stage-Gate?
    options:
      - id: a
        text: Только «идём дальше»
      - id: b
        text: Идти дальше, доработать, остановить или отложить
      - id: c
        text: Только «остановить»
      - id: d
        text: Никаких
    correct: b
    explanation: Ворота — полноценная точка решения.
    lessonId: m02-02
  - id: gate-criteria-early
    type: single
    prompt: Когда лучше согласовать критерии ворот?
    options:
      - id: a
        text: На самих воротах
      - id: b
        text: До начала этапа
      - id: c
        text: После запуска
      - id: d
        text: Не согласовывать
    correct: b
    explanation: Тогда команда знает, что показать, а правила не меняются по ходу.
    lessonId: m02-02
  - id: gate-fast
    type: single
    prompt: Как сделать, чтобы ворота не тормозили команду?
    options:
      - id: a
        text: Проводить редко и долго
      - id: b
        text: Планировать заранее, готовить материалы по ходу, решать на месте за 1–2 часа
      - id: c
        text: Отменить ворота
      - id: d
        text: Согласовывать письменно месяцами
    correct: b
    explanation: Ворота не должны превращаться в бюрократию.
    lessonId: m02-02
  - id: gate-proportional
    type: single
    prompt: Сколько ворот нужно маленькому проекту с низким риском?
    options:
      - id: a
        text: Как у большого
      - id: b
        text: Меньше, с простыми материалами — соразмерно риску
      - id: c
        text: Двадцать
      - id: d
        text: Ни одного, никогда
    correct: b
    explanation: Процесс соразмерен проекту.
    lessonId: m02-02
  - id: wsf-requirements
    type: single
    prompt: Как сократить «водопадное» начало Water-Scrum-Fall?
    options:
      - id: a
        text: Писать требования ещё подробнее
      - id: b
        text: Детализировать требования волнами — за один-два спринта до разработки
      - id: c
        text: Отменить анализ
      - id: d
        text: Нанять больше аналитиков
    correct: b
    explanation: Рамки согласуют заранее, детали — по ходу.
    lessonId: m02-03
  - id: wsf-pilot
    type: single
    prompt: Как сократить «водопадный» конец?
    options:
      - id: a
        text: Внедрять всё сразу
      - id: b
        text: Пилот для нескольких пользователей как можно раньше, затем расширение
      - id: c
        text: Добавить месяц тестирования
      - id: d
        text: Отказаться от внедрения
    correct: b
    explanation: Пилот даёт раннюю пользу и обратную связь.
    lessonId: m02-03
  - id: wsf-name
    type: single
    prompt: Если команда работает по Water-Scrum-Fall, как это называть?
    options:
      - id: a
        text: «Наш Agile»
      - id: b
        text: Честно — как есть, с понятными ограничениями
      - id: c
        text: Каскадом
      - id: d
        text: Никак
    correct: b
    explanation: Иначе руководство ждёт от «Agile» того, чего процесс не даёт.
    lessonId: m02-03
  - id: wsf-origin
    type: single
    prompt: Когда появился термин Water-Scrum-Fall?
    options:
      - id: a
        text: В 1970-х
      - id: b
        text: В начале 2010-х годов в индустриальной аналитике
      - id: c
        text: В 2025 году
      - id: d
        text: В XIX веке
    correct: b
    explanation: Им описывали компании, «перешедшие на Agile» только в разработке.
    lessonId: m02-03
  - id: tailor-start
    type: single
    prompt: С чего начинать проектирование процесса проекта?
    options:
      - id: a
        text: С процесса прошлого проекта
      - id: b
        text: "С описания ограничений: договор, команда, заказчик, риски, регуляторика, масштаб"
      - id: c
        text: С выбора трекера
      - id: d
        text: С набора встреч
    correct: b
    explanation: Процесс хороший в одном контексте мешает в другом.
    lessonId: m02-04
  - id: process-agree
    type: single
    prompt: Что стоит согласовать с заказчиком о процессе?
    options:
      - id: a
        text: Ничего — это внутреннее дело
      - id: b
        text: Ритм, его участие, права решения, изменения, отчётность, эскалации
      - id: c
        text: Только цены
      - id: d
        text: Только сроки
    correct: b
    explanation: Процесс — часть договорённостей.
    lessonId: m02-04
  - id: process-drift
    type: single
    prompt: Зачем фиксировать изменения процесса?
    options:
      - id: a
        text: Для отчёта
      - id: b
        text: Чтобы не было «тихого» дрейфа, когда каждый понимает правила по-своему
      - id: c
        text: Так требует трекер
      - id: d
        text: Не нужно
    correct: b
    explanation: Записанные изменения поддерживают общие правила.
    lessonId: m02-04
  - id: ai-more-process
    type: single
    prompt: Какая слабость у ИИ-оппонента при проверке процесса?
    options:
      - id: a
        text: Он слишком краток
      - id: b
        text: Он склонен предлагать больше процесса, а не меньше
      - id: c
        text: Он всегда прав
      - id: d
        text: Он не задаёт вопросов
    correct: b
    explanation: Предложения добавить элементы оценивают критически.
    lessonId: m02-04
  - id: process-change-when
    type: single
    prompt: Какой повод пересмотреть процесс?
    options:
      - id: a
        text: Скука
      - id: b
        text: Изменение контекста, повторяющаяся проблема на ретро, ухудшение метрик
      - id: c
        text: Новый месяц
      - id: d
        text: Пятница
    correct: b
    explanation: Процесс — гипотеза, которую проверяют.
    lessonId: m02-04
