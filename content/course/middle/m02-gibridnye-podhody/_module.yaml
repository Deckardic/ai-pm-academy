lessonsPlan:
- slug: zachem-gibrid
  title: Зачем нужен гибрид
  focus: когда чистые методологии не подходят
  durationMin: 11
  keyPoints:
  - Фиксированный договор и неопределённые требования
  - Подрядчики с разными процессами
  - Регуляторика и согласования
  - Гибрид — это осознанный выбор, а не хаос
  practice: Разобрать, почему чистый Scrum не подошёл в кейсе
- slug: stage-gate-i-agile
  title: Stage-Gate и итерации
  focus: контрольные ворота сверху, спринты внутри
  durationMin: 13
  keyPoints:
  - Ворота для инвестиционных решений
  - Итерации внутри этапа
  - Что показывать на воротах
  - Как не замедлить команду
  practice: Спроектировать ворота для проекта внедрения системы
- slug: water-scrum-fall
  title: Water-Scrum-Fall
  focus: 'частый гибрид: риски и как сделать его осознанным'
  durationMin: 12
  keyPoints:
  - Длинный анализ, итеративная разработка, длинное внедрение
  - Где теряется ценность
  - Как сократить «водопадные» концы
  - Когда это нормальный компромисс
  practice: Найти места для сокращения цикла в учебном процессе
- slug: adaptaciya-processa
  title: Адаптация процесса под проект
  focus: как спроектировать свой процесс
  durationMin: 13
  keyPoints:
  - 'Ограничения: договор, команда, заказчик, риски'
  - Минимально достаточный процесс
  - Как договориться о процессе с заказчиком
  - Пересмотр процесса по ходу проекта
  aiAngle: 'ИИ как оппонент: найти слабые места описанного процесса'
  practice: Описать процесс проекта на одной странице
assignment:
  title: Описание процесса проекта
  deliverable: Процесс проекта на 1–2 страницы со схемой
