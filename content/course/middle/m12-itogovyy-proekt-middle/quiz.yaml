id: m12-quiz
kind: module
title: "Тест модуля: Итоговый проект Middle"
passScore: 0.7
questionsPerAttempt: 5
questions:
  - id: flow-symptom
    type: single
    prompt: "Какой симптом лучше всего указывает на проблему с потоком работы?"
    options:
      - { id: a, text: "Бюджет проекта 12 млн" }
      - { id: b, text: "25 задач в работе на шесть человек и 9 задач старше трёх недель" }
      - { id: c, text: "Выставка через восемь недель" }
    correct: b
    explanation: "Большой WIP и старые задачи — признаки перегруженного потока."
    lessonId: m12-01
  - id: symptom-vs-cause
    type: single
    prompt: "Что из этого — гипотеза причины, а не симптом?"
    options:
      - { id: a, text: "В спринтах переносится 40–60% задач" }
      - { id: b, text: "Запросы продаж идут в обход Product Owner и раздувают бэклог и WIP" }
      - { id: c, text: "Бюджет израсходован на две трети" }
    correct: b
    explanation: "Хорошая гипотеза объясняет несколько симптомов и проверяется данными."
    lessonId: m12-01
  - id: evm-case
    type: single
    prompt: "BAC = 12 млн, EV = 6,0 млн, AC = 8,0 млн. Чему равен EAC при текущей эффективности?"
    options:
      - { id: a, text: "16 млн" }
      - { id: b, text: "12 млн" }
      - { id: c, text: "14 млн" }
    correct: a
    explanation: "CPI = 6 ÷ 8 = 0,75; EAC = 12 ÷ 0,75 = 16 млн."
    lessonId: m12-02
  - id: first-wave
    type: single
    prompt: "Бэклог растёт на 5 задач в неделю, команда закрывает 3–4. Какое действие первой волны важнее всего?"
    options:
      - { id: a, text: "Попросить работать больше" }
      - { id: b, text: "Остановить неуправляемый приток: запросы только через Product Owner" }
      - { id: c, text: "Добавить двух разработчиков" }
    correct: b
    explanation: "Пока приток больше пропускной способности, прогноз бесконечен."
    lessonId: m12-02
  - id: action-waves
    type: order
    prompt: "Расположите волны антикризисных действий по порядку."
    items:
      - { id: a, text: "Остановить ухудшение" }
      - { id: b, text: "Стабилизировать процесс" }
      - { id: c, text: "Выйти на новый план" }
    explanation: "Сначала останавливают ухудшение, затем стабилизируют систему и только потом строят новый базовый план."
    lessonId: m12-02
  - id: ai-diagnosis
    type: single
    prompt: "Какая роль ИИ в антикризисной работе уместна?"
    options:
      - { id: a, text: "Поставить диагноз проекту по всем данным" }
      - {
          id: b,
          text: "Обработать выгрузки и переписку, подготовить черновики сводок; диагноз и решения — за PM",
        }
      - { id: c, text: "Провести защиту плана вместо PM" }
    correct: b
    explanation: "Модель ускоряет обработку данных, но диагноз ставится по данным проекта и разговорам с людьми."
    lessonId: m12-02
  - id: defense-start
    type: single
    prompt: "С чего начать защиту антикризисного плана перед руководством?"
    options:
      - { id: a, text: "С истории проекта" }
      - { id: b, text: "С сути: прогноз без изменений, предложение и какие решения нужны" }
      - { id: c, text: "С благодарности команде" }
    correct: b
    explanation: "Защита плана — запрос решения; суть — в первые 30 секунд."
    lessonId: m12-03
  - id: who-guilty
    type: single
    prompt: "Генеральный директор спрашивает «Кто виноват?». Какой ответ лучше?"
    options:
      - { id: a, text: "Назвать предыдущего PM" }
      - { id: b, text: "Назвать причины в процессе и перейти к плану их устранения" }
      - { id: c, text: "«Виноваты все»" }
    correct: b
    explanation: "Руководству для решения нужны причины и план, а не виноватые."
    lessonId: m12-03
  - id: promise-all
    type: single
    prompt: "Руководство давит: «Успейте всё к выставке». По данным это невозможно. Что ответить?"
    options:
      - { id: a, text: "«Постараемся»" }
      - {
          id: b,
          text: "Честно назвать вероятность и предложить то, что успеваем с высокой уверенностью",
        }
      - { id: c, text: "Согласиться, а потом объяснить" }
    correct: b
    explanation: "Невыполнимое обещание разрушит доверие окончательно."
    lessonId: m12-03
  - id: control-metrics
    type: multiple
    prompt: "Какие метрики помогут через 2–4 недели понять, работает ли план? Выберите все подходящие."
    options:
      - { id: a, text: "Приток и выход задач" }
      - { id: b, text: "WIP и возраст задач" }
      - { id: c, text: "Прогноз даты с уверенностью 85%" }
      - { id: d, text: "Количество сообщений в чате проекта" }
    correct: [a, b, c]
    explanation: "Эти метрики показывают, остановился ли рост бэклога, стабилизировался ли поток и прогноз."
    lessonId: m12-03
