id: m12-quiz
kind: module
title: "Тест модуля: Итоговый проект Middle"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: flow-symptom
    type: single
    prompt: Какой симптом лучше всего указывает на проблему с потоком работы?
    options:
      - id: a
        text: Бюджет проекта 12 млн
      - id: b
        text: 25 задач в работе на шесть человек и 9 задач старше трёх недель
      - id: c
        text: Выставка через восемь недель
    correct: b
    explanation: Большой WIP и старые задачи — признаки перегруженного потока.
    lessonId: m12-01
  - id: symptom-vs-cause
    type: single
    prompt: Что из этого — гипотеза причины, а не симптом?
    options:
      - id: a
        text: В спринтах переносится 40–60% задач
      - id: b
        text: Запросы продаж идут в обход Product Owner и раздувают бэклог и WIP
      - id: c
        text: Бюджет израсходован на две трети
    correct: b
    explanation: Хорошая гипотеза объясняет несколько симптомов и проверяется данными.
    lessonId: m12-01
  - id: evm-case
    type: single
    prompt: BAC = 12 млн, EV = 6,0 млн, AC = 8,0 млн. Чему равен EAC при текущей эффективности?
    options:
      - id: a
        text: 16 млн
      - id: b
        text: 12 млн
      - id: c
        text: 14 млн
    correct: a
    explanation: CPI = 6 ÷ 8 = 0,75; EAC = 12 ÷ 0,75 = 16 млн.
    lessonId: m12-02
  - id: first-wave
    type: single
    prompt:
      Бэклог растёт на 5 задач в неделю, команда закрывает 3–4. Какое действие первой волны важнее
      всего?
    options:
      - id: a
        text: Попросить работать больше
      - id: b
        text: "Остановить неуправляемый приток: запросы только через Product Owner"
      - id: c
        text: Добавить двух разработчиков
    correct: b
    explanation: Пока приток больше пропускной способности, прогноз бесконечен.
    lessonId: m12-02
  - id: action-waves
    type: order
    prompt: Расположите волны антикризисных действий по порядку.
    items:
      - id: a
        text: Остановить ухудшение
      - id: b
        text: Стабилизировать процесс
      - id: c
        text: Выйти на новый план
    explanation:
      Сначала останавливают ухудшение, затем стабилизируют систему и только потом строят новый
      базовый план.
    lessonId: m12-02
  - id: ai-diagnosis
    type: single
    prompt: Какая роль ИИ в антикризисной работе уместна?
    options:
      - id: a
        text: Поставить диагноз проекту по всем данным
      - id: b
        text: Обработать выгрузки и переписку, подготовить черновики сводок; диагноз и решения — за PM
      - id: c
        text: Провести защиту плана вместо PM
    correct: b
    explanation:
      Модель ускоряет обработку данных, но диагноз ставится по данным проекта и разговорам с
      людьми.
    lessonId: m12-02
  - id: defense-start
    type: single
    prompt: С чего начать защиту антикризисного плана перед руководством?
    options:
      - id: a
        text: С истории проекта
      - id: b
        text: "С сути: прогноз без изменений, предложение и какие решения нужны"
      - id: c
        text: С благодарности команде
    correct: b
    explanation: Защита плана — запрос решения; суть — в первые 30 секунд.
    lessonId: m12-03
  - id: who-guilty
    type: single
    prompt: Генеральный директор спрашивает «Кто виноват?». Какой ответ лучше?
    options:
      - id: a
        text: Назвать предыдущего PM
      - id: b
        text: Назвать причины в процессе и перейти к плану их устранения
      - id: c
        text: «Виноваты все»
    correct: b
    explanation: Руководству для решения нужны причины и план, а не виноватые.
    lessonId: m12-03
  - id: promise-all
    type: single
    prompt: "Руководство давит: «Успейте всё к выставке». По данным это невозможно. Что ответить?"
    options:
      - id: a
        text: «Постараемся»
      - id: b
        text: Честно назвать вероятность и предложить то, что успеваем с высокой уверенностью
      - id: c
        text: Согласиться, а потом объяснить
    correct: b
    explanation: Невыполнимое обещание разрушит доверие окончательно.
    lessonId: m12-03
  - id: control-metrics
    type: multiple
    prompt: Какие метрики помогут через 2–4 недели понять, работает ли план? Выберите все подходящие.
    options:
      - id: a
        text: Приток и выход задач
      - id: b
        text: WIP и возраст задач
      - id: c
        text: Прогноз даты с уверенностью 85%
      - id: d
        text: Количество сообщений в чате проекта
    correct:
      - a
      - b
      - c
    explanation: Эти метрики показывают, остановился ли рост бэклога, стабилизировался ли поток и прогноз.
    lessonId: m12-03
  - id: case-cpi
    type: single
    prompt: По данным кейса CPI = 0,75. Что это значит?
    options:
      - id: a
        text: На рубль затрат получаем работы на 75 копеек
      - id: b
        text: Проект опережает график
      - id: c
        text: Бюджет сэкономлен на 25%
      - id: d
        text: Ничего
    correct: a
    explanation: Работа обходится дороже плана.
    lessonId: m12-01
  - id: case-inflow
    type: single
    prompt: Бэклог вырос на 38 задач за 8 недель. Какой средний приток в неделю?
    options:
      - id: a
        text: Около 5 задач
      - id: b
        text: 38 задач
      - id: c
        text: 1 задача
      - id: d
        text: 8 задач
    correct: a
    explanation: 38 ÷ 8 ≈ 4,75.
    lessonId: m12-01
  - id: case-throughput
    type: single
    prompt: "Пропускная способность за 8 недель: 3, 4, 2, 5, 3, 2, 4, 3. Средняя?"
    options:
      - id: a
        text: 3,25
      - id: b
        text: "4"
      - id: c
        text: 2,5
      - id: d
        text: "5"
    correct: a
    explanation: Сумма 26 ÷ 8 = 3,25.
    lessonId: m12-01
  - id: case-blocked
    type: single
    prompt: 7 задач ждут подрядчика больше двух недель, а подрядчик ждёт уточнений по статусам. Что это?
    options:
      - id: a
        text: Проблема подрядчика
      - id: b
        text: Взаимная блокировка из-за неразрешённого решения по требованиям
      - id: c
        text: Нормальная ситуация
      - id: d
        text: Ошибка трекера
    correct: b
    explanation: Решение по статусам разблокирует интеграцию.
    lessonId: m12-01
  - id: case-po-half
    type: single
    prompt: Product Owner на половину времени, запросы идут в обход. Какое действие логично?
    options:
      - id: a
        text: Уволить Product Owner
      - id: b
        text: Выделить Product Owner на полное время и направлять все запросы через него
      - id: c
        text: Отменить бэклог
      - id: d
        text: Раздать задачи напрямую
    correct: b
    explanation: Это устраняет причину роста бэклога.
    lessonId: m12-02
  - id: first-week-honest
    type: single
    prompt: Что нужно сделать в первую неделю антикризисного плана, кроме операционных мер?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Честно сообщить руководству о ситуации
      - id: c
        text: Скрыть проблемы
      - id: d
        text: Уйти в отпуск
    correct: b
    explanation: Остановить ухудшение включает честную коммуникацию.
    lessonId: m12-02
  - id: diagnosis-cause
    type: single
    prompt: "Какая причина лучше: одна, объясняющая несколько симптомов, или много отдельных?"
    options:
      - id: a
        text: Одна, объясняющая несколько симптомов — её устранение даёт больший эффект
      - id: b
        text: Много отдельных
      - id: c
        text: Разницы нет
      - id: d
        text: Причины не важны
    correct: a
    explanation: Например, запросы в обход Product Owner объясняют рост бэклога, WIP и переносы.
    lessonId: m12-02
  - id: new-people-effect
    type: single
    prompt: Почему новые люди в проблемном проекте сначала снижают скорость?
    options:
      - id: a
        text: Они хуже
      - id: b
        text: Погружение и рост координации отнимают время у команды
      - id: c
        text: Так всегда
      - id: d
        text: Не снижают
    correct: b
    explanation: Главное ограничение — хаос в потоке, а не число людей.
    lessonId: m12-02
  - id: defense-30s
    type: single
    prompt: Что должно прозвучать в первые 30 секунд защиты плана?
    options:
      - id: a
        text: История проекта
      - id: b
        text: "Суть: прогноз без изменений, предложение и нужные решения"
      - id: c
        text: Благодарности
      - id: d
        text: Методология
    correct: b
    explanation: Иначе через пять минут перебьют.
    lessonId: m12-03
  - id: defense-options-table
    type: single
    prompt: Зачем в защите таблица вариантов с ценой?
    options:
      - id: a
        text: Для объёма
      - id: b
        text: Руководство принимает решение, когда видит выбор и его цену
      - id: c
        text: Так требует шаблон
      - id: d
        text: Не нужна
    correct: b
    explanation: Выбор должен быть осознанным.
    lessonId: m12-03
  - id: defense-other-choice
    type: single
    prompt: Руководство выбрало не рекомендованный вами вариант. Что делать?
    options:
      - id: a
        text: Спорить до конца
      - id: b
        text: Зафиксировать решение и последствия и работать по нему
      - id: c
        text: Отказаться от проекта
      - id: d
        text: Саботировать
    correct: b
    explanation: Цель — решение для проекта, а не победа плана.
    lessonId: m12-03
  - id: control-weekly
    type: single
    prompt: Как руководство будет получать метрики контроля плана?
    options:
      - id: a
        text: Никак
      - id: b
        text: Например, одна страница каждую пятницу
      - id: c
        text: Только в конце
      - id: d
        text: Устно при встрече
    correct: b
    explanation: Договоритесь о формате и частоте заранее.
    lessonId: m12-03
  - id: crisis-ai-rehearsal
    type: single
    prompt: Для чего нужна репетиция защиты с ИИ в роли скептичного директора?
    options:
      - id: a
        text: Предсказать решение
      - id: b
        text: Отточить формулировки и найти слабые места плана
      - id: c
        text: Заменить встречу
      - id: d
        text: Получить одобрение
    correct: b
    explanation: Реальные люди спросят своё — оставьте время.
    lessonId: m12-03
  - id: case-wip-cause
    type: single
    prompt: Какие данные кейса указывают на перегруженный поток?
    options:
      - id: a
        text: WIP 25 на шесть человек и 9 задач старше трёх недель
      - id: b
        text: Бюджет 12 млн
      - id: c
        text: Выставка через 8 недель
    correct: a
    explanation: Команда начинает больше, чем заканчивает.
    lessonId: m12-01
  - id: case-reviews-cancelled
    type: single
    prompt: Обзоры спринтов отменялись, ретро не было два месяца. К какому направлению диагностики это относится?
    options:
      - id: a
        text: Процесс
      - id: b
        text: Бюджет
      - id: c
        text: Юридические риски
    correct: a
    explanation: Без обзоров и ретро нет обратной связи и улучшений.
    lessonId: m12-01
  - id: case-logistics
    type: single
    prompt: Логистика против показа остатков дилерам. К какому направлению диагностики это относится?
    options:
      - id: a
        text: Стейкхолдеры
      - id: b
        text: Бюджет
      - id: c
        text: Поток
    correct: a
    explanation: Неразрешённый конфликт интересов.
    lessonId: m12-01
  - id: crisis-forecast-before-after
    type: single
    prompt: Зачем делать прогноз «до» и «после» изменений?
    options:
      - id: a
        text: Показать эффект плана и цену бездействия
      - id: b
        text: Для объёма
      - id: c
        text: Так требует шаблон
    correct: a
    explanation: Руководству нужно сравнение.
    lessonId: m12-02
  - id: crisis-metrics
    type: single
    prompt: Какой признак через две недели покажет, что приток задач остановлен?
    options:
      - id: a
        text: Бэклог перестал расти
      - id: b
        text: Команда больше работает
      - id: c
        text: Больше встреч
    correct: a
    explanation: Приток и выход задач — метрика контроля.
    lessonId: m12-02
  - id: crisis-q-people
    type: single
    prompt: Руководство спрашивает, почему нельзя просто добавить людей. Лучший ответ?
    options:
      - id: a
        text: Новые люди сначала снизят скорость; главное ограничение — хаос в потоке
      - id: b
        text: Потому что дорого
      - id: c
        text: Потому что не хочу
    correct: a
    explanation: Ответ опирается на причину, а не на мнение.
    lessonId: m12-03
