id: m09-quiz
kind: module
title: "Тест модуля: Стейкхолдеры и ожидания"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: matrix-limit
    type: single
    prompt: "Чего не показывает матрица власти и интереса?"
    options:
      - { id: a, text: "За или против проекта стейкхолдер" }
      - { id: b, text: "Насколько человек может повлиять на проект" }
      - { id: c, text: "Насколько ему важен результат" }
    correct: a
    explanation: "Высокая власть и интерес бывают и у сторонника, и у противника. Нужна оценка вовлечённости."
    lessonId: m09-01
  - id: engagement-gap
    type: single
    prompt: "Что определяет план работы со стейкхолдером?"
    options:
      - { id: a, text: "Разрыв между текущей и желаемой вовлечённостью" }
      - { id: b, text: "Его должность" }
      - { id: c, text: "Количество встреч с ним" }
    correct: a
    explanation: "Не всем нужно быть лидерами проекта — важно сократить разрыв до нужного уровня."
    lessonId: m09-01
  - id: hidden-influencer
    type: single
    scenario: "Финансовый директор внезапно выступил против интеграции с новыми аргументами."
    prompt: "Что проверить в первую очередь?"
    options:
      - { id: a, text: "Нет ли советника или эксперта, который влияет на его позицию" }
      - { id: b, text: "Можно ли эскалировать генеральному директору" }
      - { id: c, text: "Можно ли убрать интеграцию" }
    correct: a
    explanation: "Новые аргументы часто приходят от скрытых влиятельных людей."
    lessonId: m09-01
  - id: early-expectations
    type: single
    prompt: "Где чаще всего формируются неоправданные ожидания?"
    options:
      - { id: a, text: "На первых встречах и из макетов — из фраз PM и картинок" }
      - { id: b, text: "На приёмке" }
      - { id: c, text: "В трекере" }
    correct: a
    explanation: "Фразы вроде «единое окно» и вкладки на макетах запоминаются как обещания."
    lessonId: m09-02
  - id: demo-mismatch
    type: single
    scenario: "На демонстрации директор говорит «А где история расчётов? Я думал, она будет». В договорённостях её нет."
    prompt: "Что сделать?"
    options:
      - { id: a, text: "Пообещать сделать в этом релизе" }
      - { id: b, text: "Напомнить договорённости, выяснить важность и предложить варианты через управление изменениями" }
      - { id: c, text: "Сказать, что это не наша проблема" }
    correct: b
    explanation: "Расхождение выявлено до запуска — это удача. Дальше — варианты с ценой."
    lessonId: m09-02
  - id: bad-news-timing
    type: single
    prompt: "Почему плохие новости стоит сообщать как можно раньше?"
    options:
      - { id: a, text: "Разочарование пропорционально внезапности, а раннее сообщение оставляет варианты" }
      - { id: b, text: "Чтобы переложить ответственность" }
      - { id: c, text: "Так требует регламент" }
    correct: a
    explanation: "Ранний сигнал — рабочий вопрос, поздний — кризис доверия."
    lessonId: m09-02
  - id: position-interest
    type: single
    prompt: "Логистика требует «не показывать дилерам остатки склада». Что здесь — позиция, а что может быть интересом?"
    options:
      - { id: a, text: "Позиция — не показывать остатки; интерес — избежать конфликтов из-за зарезервированного товара" }
      - { id: b, text: "Это и позиция, и интерес одновременно" }
      - { id: c, text: "Позиция — избежать конфликтов; интерес — не показывать остатки" }
    correct: a
    explanation: "Позиция — что требуют, интерес — зачем. Интересы часто совместимы."
    lessonId: m09-03
  - id: batna
    type: single
    prompt: "Что такое лучшая альтернатива соглашению (BATNA)?"
    options:
      - { id: a, text: "Лучшее, что вы сделаете, если договориться не получится" }
      - { id: b, text: "Самое выгодное условие, которое можно получить" }
      - { id: c, text: "Компромисс посередине" }
    correct: a
    explanation: "Альтернатива определяет силу в переговорах. Её готовят заранее."
    lessonId: m09-03
  - id: negotiation-prep
    type: multiple
    prompt: "Что входит в подготовку к переговорам? Выберите все подходящие."
    options:
      - { id: a, text: "Интересы обеих сторон" }
      - { id: b, text: "Альтернативы обеих сторон" }
      - { id: c, text: "Варианты взаимной выгоды и объективные критерии" }
      - { id: d, text: "Список угроз для давления" }
    correct: [a, b, c]
    explanation: "Принципиальные переговоры строятся на интересах, альтернативах, вариантах и критериях."
    lessonId: m09-03
  - id: emotion-response
    type: single
    prompt: "Стейкхолдер говорит «Ваша команда ничего не делает!». Какой ответ лучше?"
    options:
      - { id: a, text: "«Это неправда»" }
      - { id: b, text: "«Понимаю, что вы недовольны темпом. Давайте посмотрим, что сделано и что задерживается»" }
      - { id: c, text: "«Обсудим, когда успокоитесь»" }
    correct: b
    explanation: "Признание эмоции и переход к фактам снижают напряжение."
    lessonId: m09-04
  - id: escalation-threat
    type: single
    prompt: "Какая эскалация сохраняет доверие?"
    options:
      - { id: a, text: "«Если не согласитесь, пойду к генеральному»" }
      - { id: b, text: "«Мы не можем решить это вдвоём — предлагаю вместе вынести вопрос с вариантами»" }
      - { id: c, text: "Молча написать генеральному" }
    correct: b
    explanation: "Совместная эскалация с фактами и вариантами — рабочий инструмент, а не угроза."
    lessonId: m09-04
  - id: fixation
    type: single
    prompt: "Что сделать после сложного разговора с договорённостями?"
    options:
      - { id: a, text: "Ничего, всё и так понятно" }
      - { id: b, text: "В тот же день отправить письмо с итогами и попросить поправить, если что-то неверно" }
      - { id: c, text: "Обсудить через месяц" }
    correct: b
    explanation: "Без фиксации через неделю будет две разные версии договорённостей."
    lessonId: m09-04
