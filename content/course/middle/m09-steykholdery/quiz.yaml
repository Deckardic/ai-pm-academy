id: m09-quiz
kind: module
title: "Тест модуля: Стейкхолдеры и ожидания"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: matrix-limit
    type: single
    prompt: Чего не показывает матрица власти и интереса?
    options:
      - id: a
        text: За или против проекта стейкхолдер
      - id: b
        text: Насколько человек может повлиять на проект
      - id: c
        text: Насколько ему важен результат
    correct: a
    explanation: Высокая власть и интерес бывают и у сторонника, и у противника. Нужна оценка вовлечённости.
    lessonId: m09-01
  - id: engagement-gap
    type: single
    prompt: Что определяет план работы со стейкхолдером?
    options:
      - id: a
        text: Разрыв между текущей и желаемой вовлечённостью
      - id: b
        text: Его должность
      - id: c
        text: Количество встреч с ним
    correct: a
    explanation: Не всем нужно быть лидерами проекта — важно сократить разрыв до нужного уровня.
    lessonId: m09-01
  - id: hidden-influencer
    type: single
    scenario: Финансовый директор внезапно выступил против интеграции с новыми аргументами.
    prompt: Что проверить в первую очередь?
    options:
      - id: a
        text: Нет ли советника или эксперта, который влияет на его позицию
      - id: b
        text: Можно ли эскалировать генеральному директору
      - id: c
        text: Можно ли убрать интеграцию
    correct: a
    explanation: Новые аргументы часто приходят от скрытых влиятельных людей.
    lessonId: m09-01
  - id: early-expectations
    type: single
    prompt: Где чаще всего формируются неоправданные ожидания?
    options:
      - id: a
        text: На первых встречах и из макетов — из фраз PM и картинок
      - id: b
        text: На приёмке
      - id: c
        text: В трекере
    correct: a
    explanation: Фразы вроде «единое окно» и вкладки на макетах запоминаются как обещания.
    lessonId: m09-02
  - id: demo-mismatch
    type: single
    scenario:
      На демонстрации директор говорит «А где история расчётов? Я думал, она будет». В договорённостях
      её нет.
    prompt: Что сделать?
    options:
      - id: a
        text: Пообещать сделать в этом релизе
      - id: b
        text: Напомнить договорённости, выяснить важность и предложить варианты через управление изменениями
      - id: c
        text: Сказать, что это не наша проблема
    correct: b
    explanation: Расхождение выявлено до запуска — это удача. Дальше — варианты с ценой.
    lessonId: m09-02
  - id: bad-news-timing
    type: single
    prompt: Почему плохие новости стоит сообщать как можно раньше?
    options:
      - id: a
        text: Разочарование пропорционально внезапности, а раннее сообщение оставляет варианты
      - id: b
        text: Чтобы переложить ответственность
      - id: c
        text: Так требует регламент
    correct: a
    explanation: Ранний сигнал — рабочий вопрос, поздний — кризис доверия.
    lessonId: m09-02
  - id: position-interest
    type: single
    prompt:
      Логистика требует «не показывать дилерам остатки склада». Что здесь — позиция, а что может быть
      интересом?
    options:
      - id: a
        text: Позиция — не показывать остатки; интерес — избежать конфликтов из-за зарезервированного товара
      - id: b
        text: Это и позиция, и интерес одновременно
      - id: c
        text: Позиция — избежать конфликтов; интерес — не показывать остатки
    correct: a
    explanation: Позиция — что требуют, интерес — зачем. Интересы часто совместимы.
    lessonId: m09-03
  - id: batna
    type: single
    prompt: Что такое лучшая альтернатива соглашению (BATNA)?
    options:
      - id: a
        text: Лучшее, что вы сделаете, если договориться не получится
      - id: b
        text: Самое выгодное условие, которое можно получить
      - id: c
        text: Компромисс посередине
    correct: a
    explanation: Альтернатива определяет силу в переговорах. Её готовят заранее.
    lessonId: m09-03
  - id: negotiation-prep
    type: multiple
    prompt: Что входит в подготовку к переговорам? Выберите все подходящие.
    options:
      - id: a
        text: Интересы обеих сторон
      - id: b
        text: Альтернативы обеих сторон
      - id: c
        text: Варианты взаимной выгоды и объективные критерии
      - id: d
        text: Список угроз для давления
    correct:
      - a
      - b
      - c
    explanation: Принципиальные переговоры строятся на интересах, альтернативах, вариантах и критериях.
    lessonId: m09-03
  - id: emotion-response
    type: single
    prompt: Стейкхолдер говорит «Ваша команда ничего не делает!». Какой ответ лучше?
    options:
      - id: a
        text: «Это неправда»
      - id: b
        text: «Понимаю, что вы недовольны темпом. Давайте посмотрим, что сделано и что задерживается»
      - id: c
        text: «Обсудим, когда успокоитесь»
    correct: b
    explanation: Признание эмоции и переход к фактам снижают напряжение.
    lessonId: m09-04
  - id: escalation-threat
    type: single
    prompt: Какая эскалация сохраняет доверие?
    options:
      - id: a
        text: «Если не согласитесь, пойду к генеральному»
      - id: b
        text: «Мы не можем решить это вдвоём — предлагаю вместе вынести вопрос с вариантами»
      - id: c
        text: Молча написать генеральному
    correct: b
    explanation: Совместная эскалация с фактами и вариантами — рабочий инструмент, а не угроза.
    lessonId: m09-04
  - id: fixation
    type: single
    prompt: Что сделать после сложного разговора с договорённостями?
    options:
      - id: a
        text: Ничего, всё и так понятно
      - id: b
        text: В тот же день отправить письмо с итогами и попросить поправить, если что-то неверно
      - id: c
        text: Обсудить через месяц
    correct: b
    explanation: Без фиксации через неделю будет две разные версии договорённостей.
    lessonId: m09-04
  - id: not-all-leaders
    type: single
    prompt: Нужно ли, чтобы все стейкхолдеры стали лидерами проекта?
    options:
      - id: a
        text: Да
      - id: b
        text: "Нет: иногда достаточно перевести человека из сопротивления в нейтральную позицию"
      - id: c
        text: Только спонсор
      - id: d
        text: Только команда
    correct: b
    explanation: Цель — нужная для успеха вовлечённость.
    lessonId: m09-01
  - id: map-public
    type: single
    prompt: Как хранить карту стейкхолдеров с оценками позиций?
    options:
      - id: a
        text: Опубликовать всем
      - id: b
        text: Как рабочий документ PM; публичная версия — без оценок
      - id: c
        text: Отправить каждому стейкхолдеру
      - id: d
        text: Не хранить
    correct: b
    explanation: Оценки вроде «сопротивляется» могут задеть людей.
    lessonId: m09-01
  - id: key-user
    type: single
    prompt: Почему крупнейший дилер — возможный скрытый влиятельный стейкхолдер?
    options:
      - id: a
        text: Он платит налоги
      - id: b
        text: Его мнение станет аргументом для руководства
      - id: c
        text: Он всегда против
      - id: d
        text: Он не влияет
    correct: b
    explanation: Ключевые пользователи влияют неформально.
    lessonId: m09-01
  - id: map-update-when
    type: single
    prompt: Когда обновлять карту стейкхолдеров?
    options:
      - id: a
        text: Только на старте
      - id: b
        text: На контрольных точках, при смене людей и неожиданных изменениях позиций
      - id: c
        text: Раз в пять лет
      - id: d
        text: Никогда
    correct: b
    explanation: Позиции меняются вместе с проектом.
    lessonId: m09-01
  - id: phrases-promises
    type: single
    prompt: Почему фразы вроде «портал станет единым окном» опасны на старте?
    options:
      - id: a
        text: Они длинные
      - id: b
        text: Стейкхолдеры запоминают их как обещания и понимают по-своему
      - id: c
        text: Они грамматически неверны
      - id: d
        text: Не опасны
    correct: b
    explanation: "Говорите конкретно: что будет в первом релизе, а что нет."
    lessonId: m09-02
  - id: mockup-tab
    type: single
    prompt: На макете была вкладка «Бонусы», потом её убрали. Какой риск?
    options:
      - id: a
        text: Никакого
      - id: b
        text: Стейкхолдер ожидает бонусы — нужно явно проговорить изменение
      - id: c
        text: Макет станет лучше
      - id: d
        text: Дизайнер обидится
    correct: b
    explanation: Картинка запоминается сильнее оговорок.
    lessonId: m09-02
  - id: drift
    type: single
    prompt: Что помогает удерживать ожидания рядом с реальностью?
    options:
      - id: a
        text: Молчание
      - id: b
        text: Регулярные демонстрации, обновление прогноза и повторение границ
      - id: c
        text: Длинные отчёты
      - id: d
        text: Обещания
    correct: b
    explanation: Ожидания дрейфуют без сверки.
    lessonId: m09-02
  - id: overpromise
    type: single
    prompt: Почему опасно обещать больше, чтобы понравиться?
    options:
      - id: a
        text: Это скучно
      - id: b
        text: Хорошее настроение на неделю, разочарование на весь проект
      - id: c
        text: Это запрещено
      - id: d
        text: Не опасно
    correct: b
    explanation: Лучше пообещать меньше и выполнить.
    lessonId: m09-02
  - id: fisher-ury
    type: single
    prompt: Кто описал подход «принципиальных переговоров»?
    options:
      - id: a
        text: Роджер Фишер и Уильям Юри
      - id: b
        text: Канеман и Тверски
      - id: c
        text: Купер
      - id: d
        text: Пинк
    correct: a
    explanation: Книга «Путь к согласию» (Getting to Yes).
    lessonId: m09-03
  - id: expand-pie
    type: single
    prompt: Что значит «расширить предмет переговоров»?
    options:
      - id: a
        text: Говорить дольше
      - id: b
        text: Обсуждать не только цену, но и сроки, объём, порядок оплаты, гарантии
      - id: c
        text: Позвать больше людей
      - id: d
        text: Повысить голос
    correct: b
    explanation: Так появляются варианты взаимной выгоды.
    lessonId: m09-03
  - id: cheap-valuable
    type: single
    prompt: Какой приём помогает найти вариант взаимной выгоды?
    options:
      - id: a
        text: Найти то, что дёшево для вас и ценно для другой стороны
      - id: b
        text: Требовать максимум
      - id: c
        text: Уступать всё
      - id: d
        text: Угрожать
    correct: a
    explanation: Например, ранняя оплата этапа в обмен на сохранение цены.
    lessonId: m09-03
  - id: improve-batna
    type: single
    prompt: Как улучшить свою альтернативу перед переговорами с подрядчиком о цене?
    options:
      - id: a
        text: Никак
      - id: b
        text: Заранее запросить предложение у другого подрядчика
      - id: c
        text: Скрыть информацию
      - id: d
        text: Отменить переговоры
    correct: b
    explanation: Реальная альтернатива усиливает позицию.
    lessonId: m09-03
  - id: roleplay-limits
    type: single
    prompt: Каково ограничение репетиции переговоров с ИИ?
    options:
      - id: a
        text: Модель не знает реального человека и контекста — реальный разговор будет другим
      - id: b
        text: Она всегда права
      - id: c
        text: Она бесполезна
      - id: d
        text: Она раскрывает секреты
    correct: a
    explanation: Используйте для тренировки, а не для прогноза.
    lessonId: m09-03
  - id: ask-15-min
    type: single
    prompt: Сложный разговор застал врасплох. Что допустимо?
    options:
      - id: a
        text: Спорить сразу
      - id: b
        text: Попросить короткое время, чтобы ответить точно, и перезвонить
      - id: c
        text: Бросить трубку
      - id: d
        text: Пообещать всё
    correct: b
    explanation: Подготовка важнее мгновенной реакции.
    lessonId: m09-04
  - id: common-goal
    type: single
    prompt: С чего начинать сложный разговор?
    options:
      - id: a
        text: С оправданий
      - id: b
        text: С общей цели, которая объединяет стороны
      - id: c
        text: С обвинений
      - id: d
        text: С цифр бюджета
    correct: b
    explanation: Общая цель задаёт рамку разговора.
    lessonId: m09-04
  - id: fact-vs-interpretation
    type: single
    prompt: «Вы меня подставили» — это факт или интерпретация?
    options:
      - id: a
        text: Факт
      - id: b
        text: Интерпретация; факт — что человек узнал о риске не от PM
      - id: c
        text: Ни то ни другое
      - id: d
        text: Шутка
    correct: b
    explanation: Отделяйте факты от выводов.
    lessonId: m09-04
  - id: escalation-agreed
    type: single
    prompt: Когда эскалация воспринимается как нормальный механизм?
    options:
      - id: a
        text: Когда о ней договорились заранее и она совместная, с фактами и вариантами
      - id: b
        text: Когда её используют как угрозу
      - id: c
        text: Когда её скрывают
      - id: d
        text: Никогда
    correct: a
    explanation: Правила эскалации — часть устава или плана коммуникаций.
    lessonId: m09-04
  - id: influencer-find
    type: single
    prompt: Как найти скрытых влиятельных людей?
    options:
      - id: a
        text: Спросить «с кем вы советуетесь?» и замечать, чьи возражения повторяют другие
      - id: b
        text: Посмотреть оргструктуру
      - id: c
        text: Никак
    correct: a
    explanation: Формальная власть — не единственная.
    lessonId: m09-01
  - id: expect-reconfirm
    type: single
    prompt: Что спрашивать стейкхолдеров регулярно?
    options:
      - id: a
        text: Изменилось ли что-то в их приоритетах
      - id: b
        text: Какой у них отпуск
      - id: c
        text: Ничего
    correct: a
    explanation: Ожидания дрейфуют.
    lessonId: m09-02
  - id: objective-criteria
    type: single
    prompt: Что такое объективные критерии в переговорах?
    options:
      - id: a
        text: Рыночные ставки, прошлые договоры, данные — основания вне воли сторон
      - id: b
        text: Чьё мнение громче
      - id: c
        text: Решение руководителя
    correct: a
    explanation: Критерии переводят спор из упрямства в факты.
    lessonId: m09-03
  - id: fix-agreements
    type: single
    prompt: Что включить в письмо после сложного разговора?
    options:
      - id: a
        text: Договорённости по пунктам и просьбу поправить неточности
      - id: b
        text: Благодарность без деталей
      - id: c
        text: Ничего
    correct: a
    explanation: Иначе будет две версии договорённостей.
    lessonId: m09-04
  - id: discuss-then-escalate
    type: single
    prompt: С чего лучше начать при разногласии с подрядчиком?
    options:
      - id: a
        text: С разговора на своём уровне, эскалация — если не получилось
      - id: b
        text: С письма генеральному директору
      - id: c
        text: С угрозы
    correct: a
    explanation: Эскалация — когда исчерпаны свои возможности.
    lessonId: m09-04
  - id: map-private-version
    type: single
    prompt: Какую версию карты стейкхолдеров можно показывать широко?
    options:
      - id: a
        text: С ролями и способами коммуникации, без оценок позиций
      - id: b
        text: С оценками «сопротивляется»
      - id: c
        text: Никакую
    correct: a
    explanation: Оценки могут задеть людей.
    lessonId: m09-01
