id: m07-quiz
kind: module
title: "Тест модуля: Продвинутый промптинг и ИИ-воркфлоу"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: chain-definition
    type: single
    prompt: Что такое цепочка промптов?
    options:
      - id: a
        text: Очень длинный промпт со всеми требованиями
      - id: b
        text: Последовательность простых запросов, где результат шага — вход следующего
      - id: c
        text: Один и тот же промпт, отправленный в несколько моделей
    correct: b
    explanation:
      Цепочка разбивает сложную задачу на шаги, каждый из которых модель решает лучше, чем всю
      задачу сразу.
    lessonId: m07-01
  - id: chain-benefit
    type: single
    prompt: Главное преимущество цепочки перед одним большим промптом?
    options:
      - id: a
        text: Меньше токенов в сумме
      - id: b
        text: Точки контроля — можно проверить промежуточный результат
      - id: c
        text: Модель работает быстрее
    correct: b
    explanation:
      Между шагами вы проверяете промежуточный результат и ловите ошибки до того, как они попадут
      в итог.
    lessonId: m07-01
  - id: chain-order
    type: order
    prompt: Расставьте шаги типовой цепочки анализа требований.
    items:
      - id: extract
        text: Извлечь факты из исходного текста
      - id: check
        text: Проверить извлечённое человеком
      - id: analyze
        text: Найти противоречия и пробелы
      - id: format
        text: Оформить результат в нужный формат
    explanation:
      Извлечь → проверить → проанализировать → оформить. Проверка стоит сразу после извлечения
      — там ошибки дешевле всего.
    lessonId: m07-01
  - id: cheapest-fix
    type: single
    prompt: Где дешевле всего исправить неверно понятое требование?
    options:
      - id: a
        text: На шаге проверки извлечённых фактов
      - id: b
        text: В итоговом документе
      - id: c
        text: После отправки документа заказчику
    correct: a
    explanation: Чем раньше найдена ошибка, тем дешевле её исправить.
    lessonId: m07-01
  - id: no-chain
    type: single
    prompt: Когда цепочка промптов избыточна?
    options:
      - id: a
        text: Когда результат можно проверить за минуту
      - id: b
        text: Когда исходных данных много
      - id: c
        text: Когда задача важная
    correct: a
    explanation: Для простых задач — письмо по тезисам, короткая сводка — достаточно одного промпта.
    lessonId: m07-01
  - id: big-prompt-problems
    type: multiple
    prompt: Какие проблемы у одного большого промпта для сложной задачи? Выберите все подходящие.
    options:
      - id: a
        text: Часть требований выполняется поверхностно
      - id: b
        text: Ошибки первого шага не видны до итога
      - id: c
        text: Его сложно переиспользовать в других задачах
      - id: d
        text: Модель отказывается отвечать
    correct:
      - a
      - b
      - c
    explanation:
      Внимание модели распределяется, ошибки прячутся в итоге, а сам промпт привязан к одной
      ситуации.
    lessonId: m07-01
  - id: few-shot-count
    type: single
    prompt: Сколько примеров обычно оптимально для few-shot промпта?
    options:
      - id: a
        text: Один
      - id: b
        text: Два-три разнообразных, включая граничный случай
      - id: c
        text: Не меньше десяти
    correct: b
    explanation: Разнообразие примеров показывает модели, что постоянно (формат), а что меняется (содержание).
    lessonId: m07-02
  - id: few-shot-copy
    type: single
    scenario:
      В примере задержка объяснялась болезнью разработчика, и модель пишет то же в новом отчёте,
      хотя в данных этого нет.
    prompt: Что изменить в промпте?
    options:
      - id: a
        text: Убрать все примеры
      - id: b
        text:
          Сделать примеры разнообразными, указать, что брать из них только формат и тон, ограничить факты
          входными данными
      - id: c
        text: Попросить модель быть внимательнее
    correct: b
    explanation: Модель скопировала содержание примера. Разнообразие и явные указания это предотвращают.
    lessonId: m07-02
  - id: table-math
    type: single
    prompt: Как надёжно посчитать медиану времени цикла по выгрузке из 600 задач?
    options:
      - id: a
        text: Попросить модель посчитать в чате
      - id: b
        text: Попросить модель написать формулу и посчитать в таблице
      - id: c
        text: Попросить модель прикинуть по первым строкам
    correct: b
    explanation: Модель пишет формулу — таблица считает.
    lessonId: m07-03
  - id: long-docs
    type: single
    prompt: Как надёжнее обработать пять длинных протоколов?
    options:
      - id: a
        text: Загрузить все сразу одним запросом
      - id: b
        text: Обработать каждый одинаковым промптом, проверить и отдельным шагом собрать итог
      - id: c
        text: Обработать только первый и последний
    correct: b
    explanation: На длинных материалах теряются детали из середины. Части проще проверить.
    lessonId: m07-03
  - id: result-check
    type: multiple
    prompt: Как проверить итог обработки большой выгрузки? Выберите все подходящие.
    options:
      - id: a
        text: Сверить контрольные суммы
      - id: b
        text: Проверить случайную выборку элементов
      - id: c
        text: Сверить крайние значения с источником
      - id: d
        text: Проверять только то, что выглядит странно
    correct:
      - a
      - b
      - c
    explanation: Опасные ошибки выглядят правдоподобно — проверяют по плану, а не по ощущению.
    lessonId: m07-03
  - id: assistant-kb
    type: single
    prompt: Какие документы можно загрузить в базу знаний ассистента во внешнем сервисе?
    options:
      - id: a
        text: Любые рабочие документы проекта
      - id: b
        text: "Только разрешённые для этого сервиса: шаблоны, публичные регламенты, обезличенные примеры"
      - id: c
        text: Договоры с подрядчиками, чтобы ассистент знал условия
    correct: b
    explanation: Документы уходят в сервис и хранятся там. Действуют те же правила о данных.
    lessonId: m07-04
  - id: assistant-tests
    type: single
    prompt: Что сделать после изменения инструкций командного ассистента?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Прогнать набор тестовых примеров
      - id: c
        text: Попросить ассистента оценить себя
    correct: b
    explanation: Небольшое изменение может сломать другое поведение. Тесты это покажут.
    lessonId: m07-04
  - id: assistant-owner
    type: single
    prompt: Зачем командному ассистенту владелец?
    options:
      - id: a
        text: Чтобы обновлять инструкции и документы и следить за качеством
      - id: b
        text: Чтобы только он мог пользоваться ассистентом
      - id: c
        text: Владелец не нужен
    correct: a
    explanation: Без владельца ассистент устаревает, а команда продолжает ему доверять.
    lessonId: m07-04
  - id: library-standard
    type: multiple
    prompt: Что должно быть в описании промпта командной библиотеки? Выберите все подходящие.
    options:
      - id: a
        text: Назначение и когда использовать
      - id: b
        text: Переменные и пример результата
      - id: c
        text: Что проверить и правила по данным
      - id: d
        text: Владелец и версия
    correct:
      - a
      - b
      - c
      - d
    explanation: Полное описание позволяет любому в команде использовать промпт правильно.
    lessonId: m07-05
  - id: savings-calc
    type: single
    prompt:
      Протокол вручную — 30 минут, с ИИ — 5 минут на запуск и 10 на проверку, 40 протоколов в месяц.
      Экономия?
    options:
      - id: a
        text: 1000 минут
      - id: b
        text: 600 минут
      - id: c
        text: 1200 минут
    correct: b
    explanation: (30 − 15) × 40 = 600 минут. Без учёта проверки экономия завышается.
    lessonId: m07-05
  - id: chain-control
    type: single
    prompt: Что такое точка контроля в цепочке промптов?
    options:
      - id: a
        text: Место, где человек проверяет промежуточный результат перед следующим шагом
      - id: b
        text: Пауза для кофе
      - id: c
        text: Конец диалога
      - id: d
        text: Название модели
    correct: a
    explanation: Ошибка на раннем шаге иначе размножается дальше.
    lessonId: m07-01
  - id: chain-separate
    type: single
    prompt: Почему извлечение фактов и выводы лучше делать разными шагами?
    options:
      - id: a
        text: Так дольше
      - id: b
        text: Выводы на непроверенных фактах множат ошибки; факты сначала проверяют
      - id: c
        text: Так требует сервис
      - id: d
        text: Разницы нет
    correct: b
    explanation: Каждый шаг маленький и проверяемый.
    lessonId: m07-01
  - id: pairs-better
    type: single
    prompt: Почему пары «вход — результат» лучше, чем одни примеры результата?
    options:
      - id: a
        text: Модель видит, как из данных получается текст
      - id: b
        text: Они короче
      - id: c
        text: Их проще найти
      - id: d
        text: Разницы нет
    correct: a
    explanation: Пара показывает логику преобразования.
    lessonId: m07-02
  - id: too-many-examples
    type: single
    prompt: Что обычно происходит, если добавить больше пяти примеров?
    options:
      - id: a
        text: Качество растёт бесконечно
      - id: b
        text: Выигрыш редко есть, а длинный промпт может запутать модель
      - id: c
        text: Модель отказывается отвечать
      - id: d
        text: Ничего
    correct: b
    explanation: Важнее разнообразие, чем количество.
    lessonId: m07-02
  - id: example-edge
    type: single
    prompt: Хотите, чтобы при неизвестной причине модель писала «уточняется». Как надёжнее всего?
    options:
      - id: a
        text: Попросить словами
      - id: b
        text: Показать это поведение в одном из примеров
      - id: c
        text: Не указывать
      - id: d
        text: Удалить причину из данных
    correct: b
    explanation: Модель повторяет поведение примера надёжнее, чем правило.
    lessonId: m07-02
  - id: template-version
    type: single
    prompt: Зачем у шаблона промпта версия и дата?
    options:
      - id: a
        text: Для красоты
      - id: b
        text: Понимать, какой шаблон дал результат, и отслеживать изменения
      - id: c
        text: Так требует закон
      - id: d
        text: Не нужны
    correct: b
    explanation: Особенно важно, когда шаблоном пользуется команда.
    lessonId: m07-02
  - id: file-upload-parts
    type: single
    prompt: Какой риск у загрузки большого файла в ассистента?
    options:
      - id: a
        text: Сервис может ответить по найденным фрагментам, а не по всему документу
      - id: b
        text: Файл удалится
      - id: c
        text: Ответ будет на английском
      - id: d
        text: Никакого
    correct: a
    explanation: Проверяйте полноту итога.
    lessonId: m07-03
  - id: code-calc
    type: single
    prompt: Ассистент умеет запускать код для расчётов. Что всё равно нужно проверить?
    options:
      - id: a
        text: Что посчитано именно то, что вы хотели
      - id: b
        text: Ничего
      - id: c
        text: Цвет графика
      - id: d
        text: Скорость
    correct: a
    explanation: Код считает точно, но может считать не то.
    lessonId: m07-03
  - id: mapping-table
    type: single
    prompt: Где хранить таблицу соответствия кодов и реальных названий при обезличивании?
    options:
      - id: a
        text: Отправить вместе с данными в модель
      - id: b
        text: Отдельно, не отправляя в модель
      - id: c
        text: В чате команды
      - id: d
        text: Не хранить
    correct: b
    explanation: Иначе обезличивание теряет смысл.
    lessonId: m07-03
  - id: extremes
    type: single
    prompt: Как проверить итог анализа по крайним значениям?
    options:
      - id: a
        text: Сверить самую долгую задачу и самую частую причину с источником
      - id: b
        text: Посчитать слова
      - id: c
        text: Проверить шрифт
      - id: d
        text: Никак
    correct: a
    explanation: Крайние значения часто выдают ошибки.
    lessonId: m07-03
  - id: assistant-bad-request
    type: single
    prompt: Что добавить в инструкции ассистента на случай неподходящего запроса?
    options:
      - id: a
        text: Ничего
      - id: b
        text: "Как реагировать: например, попросить заметки встречи"
      - id: c
        text: Запрет на ответы
      - id: d
        text: Шутку
    correct: b
    explanation: Предсказуемое поведение на неожиданный ввод.
    lessonId: m07-04
  - id: assistant-share
    type: single
    prompt: Ассистент общий для команды. Что учесть в его базе знаний?
    options:
      - id: a
        text: Её видят все, кто пользуется ассистентом
      - id: b
        text: Её никто не видит
      - id: c
        text: Она удаляется ежедневно
      - id: d
        text: Ничего
    correct: a
    explanation: Проверьте настройки доступа.
    lessonId: m07-04
  - id: assistant-model-change
    type: single
    prompt: Сервис сменил модель в ассистенте. Что сделать?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Прогнать набор тестов
      - id: c
        text: Удалить ассистента
      - id: d
        text: Переписать инструкции с нуля
    correct: b
    explanation: Смена модели меняет поведение.
    lessonId: m07-04
  - id: assistant-card
    type: single
    prompt: Что записать рядом с командным ассистентом?
    options:
      - id: a
        text: Назначение, владельца, правила по данным, дату обновления
      - id: b
        text: Только название
      - id: c
        text: Пароль
      - id: d
        text: Ничего
    correct: a
    explanation: Иначе через полгода никто не знает, зачем он.
    lessonId: m07-04
  - id: library-first
    type: single
    prompt: Что означает правило «сначала библиотека»?
    options:
      - id: a
        text: Сначала читать книги
      - id: b
        text: Прежде чем писать свой промпт, проверить, нет ли готового в командной библиотеке
      - id: c
        text: Библиотека важнее работы
      - id: d
        text: Хранить промпты в библиотеке города
    correct: b
    explanation: Это сокращает изобретение одних и тех же промптов.
    lessonId: m07-05
  - id: library-bottomup
    type: single
    prompt: Как собрать первые промпты командной библиотеки?
    options:
      - id: a
        text: Спустить сверху
      - id: b
        text: Из того, чем команда уже пользуется, и с предложениями от людей
      - id: c
        text: Скачать 300 из интернета
      - id: d
        text: Попросить ИИ сгенерировать все
    correct: b
    explanation: Так библиотеку принимают, а не терпят.
    lessonId: m07-05
  - id: library-feedback
    type: single
    prompt: Что делать с отзывом «промпт не сработал на таких данных»?
    options:
      - id: a
        text: Игнорировать
      - id: b
        text: Разобрать владельцем промпта, при необходимости обновить и добавить тест
      - id: c
        text: Удалить промпт
      - id: d
        text: Сменить модель
    correct: b
    explanation: Обратная связь улучшает библиотеку.
    lessonId: m07-05
  - id: savings-honest2
    type: single
    prompt: Промпт экономит 5 минут, но проверка занимает 10. Что сделать?
    options:
      - id: a
        text: Считать экономию 5 минут
      - id: b
        text: Признать, что эффекта нет, и доработать или убрать промпт
      - id: c
        text: Скрыть проверку
      - id: d
        text: Удвоить частоту
    correct: b
    explanation: Честные метрики важнее впечатляющих.
    lessonId: m07-05
