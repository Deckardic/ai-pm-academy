id: m07-quiz
kind: module
title: "Тест модуля: Продвинутый промптинг и ИИ-воркфлоу"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: chain-definition
    type: single
    prompt: "Что такое цепочка промптов?"
    options:
      - { id: a, text: "Очень длинный промпт со всеми требованиями" }
      - { id: b, text: "Последовательность простых запросов, где результат шага — вход следующего" }
      - { id: c, text: "Один и тот же промпт, отправленный в несколько моделей" }
    correct: b
    explanation: "Цепочка разбивает сложную задачу на шаги, каждый из которых модель решает лучше, чем всю задачу сразу."
    lessonId: m07-01
  - id: chain-benefit
    type: single
    prompt: "Главное преимущество цепочки перед одним большим промптом?"
    options:
      - { id: a, text: "Меньше токенов в сумме" }
      - { id: b, text: "Точки контроля — можно проверить промежуточный результат" }
      - { id: c, text: "Модель работает быстрее" }
    correct: b
    explanation: "Между шагами вы проверяете промежуточный результат и ловите ошибки до того, как они попадут в итог."
    lessonId: m07-01
  - id: chain-order
    type: order
    prompt: "Расставьте шаги типовой цепочки анализа требований."
    items:
      - { id: extract, text: "Извлечь факты из исходного текста" }
      - { id: check, text: "Проверить извлечённое человеком" }
      - { id: analyze, text: "Найти противоречия и пробелы" }
      - { id: format, text: "Оформить результат в нужный формат" }
    explanation: "Извлечь → проверить → проанализировать → оформить. Проверка стоит сразу после извлечения — там ошибки дешевле всего."
    lessonId: m07-01
  - id: cheapest-fix
    type: single
    prompt: "Где дешевле всего исправить неверно понятое требование?"
    options:
      - { id: a, text: "На шаге проверки извлечённых фактов" }
      - { id: b, text: "В итоговом документе" }
      - { id: c, text: "После отправки документа заказчику" }
    correct: a
    explanation: "Чем раньше найдена ошибка, тем дешевле её исправить."
    lessonId: m07-01
  - id: no-chain
    type: single
    prompt: "Когда цепочка промптов избыточна?"
    options:
      - { id: a, text: "Когда результат можно проверить за минуту" }
      - { id: b, text: "Когда исходных данных много" }
      - { id: c, text: "Когда задача важная" }
    correct: a
    explanation: "Для простых задач — письмо по тезисам, короткая сводка — достаточно одного промпта."
    lessonId: m07-01
  - id: big-prompt-problems
    type: multiple
    prompt: "Какие проблемы у одного большого промпта для сложной задачи? Выберите все подходящие."
    options:
      - { id: a, text: "Часть требований выполняется поверхностно" }
      - { id: b, text: "Ошибки первого шага не видны до итога" }
      - { id: c, text: "Его сложно переиспользовать в других задачах" }
      - { id: d, text: "Модель отказывается отвечать" }
    correct: [a, b, c]
    explanation: "Внимание модели распределяется, ошибки прячутся в итоге, а сам промпт привязан к одной ситуации."
    lessonId: m07-01
  - id: few-shot-count
    type: single
    prompt: "Сколько примеров обычно оптимально для few-shot промпта?"
    options:
      - { id: a, text: "Один" }
      - { id: b, text: "Два-три разнообразных, включая граничный случай" }
      - { id: c, text: "Не меньше десяти" }
    correct: b
    explanation: "Разнообразие примеров показывает модели, что постоянно (формат), а что меняется (содержание)."
    lessonId: m07-02
  - id: few-shot-copy
    type: single
    scenario: "В примере задержка объяснялась болезнью разработчика, и модель пишет то же в новом отчёте, хотя в данных этого нет."
    prompt: "Что изменить в промпте?"
    options:
      - { id: a, text: "Убрать все примеры" }
      - { id: b, text: "Сделать примеры разнообразными, указать, что брать из них только формат и тон, ограничить факты входными данными" }
      - { id: c, text: "Попросить модель быть внимательнее" }
    correct: b
    explanation: "Модель скопировала содержание примера. Разнообразие и явные указания это предотвращают."
    lessonId: m07-02
  - id: table-math
    type: single
    prompt: "Как надёжно посчитать медиану времени цикла по выгрузке из 600 задач?"
    options:
      - { id: a, text: "Попросить модель посчитать в чате" }
      - { id: b, text: "Попросить модель написать формулу и посчитать в таблице" }
      - { id: c, text: "Попросить модель прикинуть по первым строкам" }
    correct: b
    explanation: "Модель пишет формулу — таблица считает."
    lessonId: m07-03
  - id: long-docs
    type: single
    prompt: "Как надёжнее обработать пять длинных протоколов?"
    options:
      - { id: a, text: "Загрузить все сразу одним запросом" }
      - { id: b, text: "Обработать каждый одинаковым промптом, проверить и отдельным шагом собрать итог" }
      - { id: c, text: "Обработать только первый и последний" }
    correct: b
    explanation: "На длинных материалах теряются детали из середины. Части проще проверить."
    lessonId: m07-03
  - id: result-check
    type: multiple
    prompt: "Как проверить итог обработки большой выгрузки? Выберите все подходящие."
    options:
      - { id: a, text: "Сверить контрольные суммы" }
      - { id: b, text: "Проверить случайную выборку элементов" }
      - { id: c, text: "Сверить крайние значения с источником" }
      - { id: d, text: "Проверять только то, что выглядит странно" }
    correct: [a, b, c]
    explanation: "Опасные ошибки выглядят правдоподобно — проверяют по плану, а не по ощущению."
    lessonId: m07-03
  - id: assistant-kb
    type: single
    prompt: "Какие документы можно загрузить в базу знаний ассистента во внешнем сервисе?"
    options:
      - { id: a, text: "Любые рабочие документы проекта" }
      - { id: b, text: "Только разрешённые для этого сервиса: шаблоны, публичные регламенты, обезличенные примеры" }
      - { id: c, text: "Договоры с подрядчиками, чтобы ассистент знал условия" }
    correct: b
    explanation: "Документы уходят в сервис и хранятся там. Действуют те же правила о данных."
    lessonId: m07-04
  - id: assistant-tests
    type: single
    prompt: "Что сделать после изменения инструкций командного ассистента?"
    options:
      - { id: a, text: "Ничего" }
      - { id: b, text: "Прогнать набор тестовых примеров" }
      - { id: c, text: "Попросить ассистента оценить себя" }
    correct: b
    explanation: "Небольшое изменение может сломать другое поведение. Тесты это покажут."
    lessonId: m07-04
  - id: assistant-owner
    type: single
    prompt: "Зачем командному ассистенту владелец?"
    options:
      - { id: a, text: "Чтобы обновлять инструкции и документы и следить за качеством" }
      - { id: b, text: "Чтобы только он мог пользоваться ассистентом" }
      - { id: c, text: "Владелец не нужен" }
    correct: a
    explanation: "Без владельца ассистент устаревает, а команда продолжает ему доверять."
    lessonId: m07-04
  - id: library-standard
    type: multiple
    prompt: "Что должно быть в описании промпта командной библиотеки? Выберите все подходящие."
    options:
      - { id: a, text: "Назначение и когда использовать" }
      - { id: b, text: "Переменные и пример результата" }
      - { id: c, text: "Что проверить и правила по данным" }
      - { id: d, text: "Владелец и версия" }
    correct: [a, b, c, d]
    explanation: "Полное описание позволяет любому в команде использовать промпт правильно."
    lessonId: m07-05
  - id: savings-calc
    type: single
    prompt: "Протокол вручную — 30 минут, с ИИ — 5 минут на запуск и 10 на проверку, 40 протоколов в месяц. Экономия?"
    options:
      - { id: a, text: "1000 минут" }
      - { id: b, text: "600 минут" }
      - { id: c, text: "1200 минут" }
    correct: b
    explanation: "(30 − 15) × 40 = 600 минут. Без учёта проверки экономия завышается."
    lessonId: m07-05
