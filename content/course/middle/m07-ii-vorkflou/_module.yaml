id: m07
slug: ii-vorkflou
order: 7
title: Продвинутый промптинг и ИИ-воркфлоу
summary: Шаблоны промптов, цепочки, few-shot, работа с документами и командная библиотека промптов.
goals:
  - Строить цепочки промптов для сложных задач
  - Использовать few-shot и шаблоны
  - Собирать командную библиотеку промптов
status: published
artifact: Библиотека промптов для команды
keyConcepts:
  - цепочка промптов
  - few-shot
  - шаблон промпта
  - ИИ-воркфлоу
searchQueries:
  - цепочка промптов
  - few-shot промптинг
  - нейросети в работе менеджера проектов
lessonsPlan:
  - slug: cepochki-promptov
    title: Цепочки промптов
    focus: сложная задача как последовательность шагов с проверкой
    durationMin: 15
    keyPoints:
      - Почему один большой промпт хуже
      - Извлечь — проверить — проанализировать — оформить
      - Точки контроля
      - Когда цепочка не нужна
    practice: Собрать цепочку для анализа протокола
  - slug: few-shot-i-shablony
    title: Few-shot и шаблоны
    focus: учим модель на примерах
    durationMin: 13
    keyPoints:
      - Примеры задают стиль и формат
      - Сколько примеров нужно
      - Шаблоны промптов с переменными
      - Как не «переучить» модель на пример
    practice: Сделать промпт статус-отчёта с двумя примерами
  - slug: rabota-s-dokumentami
    title: Работа с документами и таблицами
    focus: длинные тексты, выгрузки и ограничения контекста
    durationMin: 13
    keyPoints:
      - Разбиение на части
      - "Таблицы и расчёты: модель ошибается в арифметике"
      - Обезличивание выгрузок
      - Проверка итогов
    practice: Проанализировать выгрузку задач частями
  - slug: assistenty-i-instrukcii
    title: Ассистенты и постоянные инструкции
    focus: настройка ИИ под повторяющиеся задачи
    durationMin: 12
    keyPoints:
      - Постоянные инструкции и системные промпты
      - База знаний ассистента — только разрешённые документы
      - Тестирование ассистента
      - Обновление и владелец
    practice: Настроить ассистента для протоколов встреч
  - slug: komandnaya-biblioteka
    title: Командная библиотека промптов
    focus: как делиться промптами и поддерживать качество
    durationMin: 12
    keyPoints:
      - Стандарт описания промпта
      - Версии и ревью
      - Обучение команды
      - "Метрика: сколько времени экономим"
    practice: Оформить 5 промптов по стандарту
assignment:
  title: Библиотека промптов для команды
  deliverable: 10 промптов по стандарту и правила использования
  brief: Промпты с переменными, примерами, чек-листом проверки и владельцем; правила по данным и обновлению.
quizFocus:
  - цепочки промптов
  - few-shot
  - работа с таблицами и ограничения
  - командные стандарты
