id: middle-exam
kind: exam
title: Итоговый экзамен Middle
passScore: 0.75
questionsPerAttempt: 4
timeLimitMin: 60
cooldownHours: 24
questions:
  - id: y-little-law
    type: single
    scenario: Команда завершает 12 задач в неделю, в работе 24 задачи.
    prompt: Каким будет среднее время прохождения задачи?
    options:
      - id: a
        text: 2 недели
      - id: b
        text: 4 недели
      - id: c
        text: 0,5 недели
    correct: a
    explanation: "По закону Литтла: 24 ÷ 12 = 2 недели."
    lessonId: m01-01
  - id: y-wip-cut
    type: single
    prompt:
      Незавершённую работу сократили с 30 до 15 задач, пропускная способность не изменилась. Что будет
      со временем прохождения?
    options:
      - id: a
        text: Сократится примерно вдвое
      - id: b
        text: Вырастет
      - id: c
        text: Не изменится
    correct: a
    explanation: Время прохождения пропорционально незавершённой работе при той же пропускной способности.
    lessonId: m01-01
  - id: y-wip-full
    type: single
    scenario: Команда работает по Kanban с WIP-лимитами.
    prompt: Колонка «Тестирование» заполнена до лимита. Что должен сделать освободившийся разработчик?
    options:
      - id: a
        text: Взять новую задачу
      - id: b
        text: Помочь с тестированием
      - id: c
        text: Поднять лимит колонки
    correct: b
    explanation: Упор в лимит — сигнал помочь довести начатое, а не начинать новое.
    lessonId: m01-01
  - id: y-wip-start
    type: single
    prompt: С какого лимита лучше начать внедрение WIP-лимитов?
    options:
      - id: a
        text: Немного ниже текущего уровня незавершённой работы
      - id: b
        text: Один — по задаче на колонку
      - id: c
        text: Сразу вдвое ниже текущего
    correct: a
    explanation:
      Резкое снижение вызывает сопротивление. Начните с «текущее минус 20–30%» и корректируйте
      по метрикам.
    lessonId: m01-01
  - id: y-wip-raise
    type: single
    scenario: Лимит колонки «Ревью» — 3 задачи.
    prompt: Команда постоянно упирается в лимит на ревью. Что сделать в первую очередь?
    options:
      - id: a
        text: Поднять лимит
      - id: b
        text: Разобраться, почему ревью становится узким местом
      - id: c
        text: Отменить лимиты
    correct: b
    explanation: Упор в лимит показывает узкое место. Поднять лимит — значит спрятать проблему.
    lessonId: m01-01
  - id: y-flow-signals
    type: multiple
    prompt: Какие признаки говорят о слишком большом объёме незавершённой работы? Выберите все подходящие.
    options:
      - id: a
        text: У каждого по 3–4 задачи в работе
      - id: b
        text: Задачи долго ждут ревью и ответов
      - id: c
        text: Команда редко переключается между задачами
      - id: d
        text: До «Готово» доходит мало задач
    correct:
      - a
      - b
      - d
    explanation: Много задач на человека, ожидания и медленное завершение — типичные симптомы.
    lessonId: m01-01
  - id: y-chain-when
    type: single
    scenario: Нужно разобрать протокол встречи на 5 страниц и найти противоречия в требованиях.
    prompt: "Что лучше: один большой промпт или цепочка?"
    options:
      - id: a
        text: Один промпт — быстрее
      - id: b
        text: Цепочка с проверкой после извлечения требований
      - id: c
        text: Разница не важна
    correct: b
    explanation: Сложная задача с риском ошибки в вводных — случай для цепочки с точками контроля.
    lessonId: m07-01
  - id: y-chain-no
    type: single
    prompt: Нужна ли цепочка промптов, чтобы переписать письмо по трём тезисам?
    options:
      - id: a
        text: Да, всегда
      - id: b
        text: Нет, результат проверяется за минуту — хватит одного промпта
      - id: c
        text: Да, если письмо важное
    correct: b
    explanation: Цепочка нужна, когда задачу сложно проверить целиком.
    lessonId: m07-01
  - id: y-chain-steps
    type: order
    prompt: Расставьте шаги цепочки по порядку.
    items:
      - id: extract
        text: Извлечь требования
      - id: check
        text: Проверить извлечённое
      - id: analyze
        text: Найти противоречия
      - id: format
        text: Оформить вопросы к заказчику
    explanation: Проверка идёт сразу после извлечения — там ошибки дешевле всего.
    lessonId: m07-01
  - id: y-chain-error
    type: single
    prompt: Модель неверно поняла требование на первом шаге цепочки, а вы это пропустили. Что будет?
    options:
      - id: a
        text: Ошибка исправится на следующих шагах
      - id: b
        text: Анализ и итоговый документ будут построены на ошибке
      - id: c
        text: Модель предупредит об ошибке
    correct: b
    explanation: Каждый шаг опирается на предыдущий — поэтому нужна проверка после извлечения.
    lessonId: m07-01
  - id: y-chain-reuse
    type: single
    prompt: Какое свойство цепочек помогает командной работе?
    options:
      - id: a
        text: Шаги легко переиспользовать в других задачах
      - id: b
        text: Цепочки нельзя передать коллегам
      - id: c
        text: Цепочки работают только в одной модели
    correct: a
    explanation:
      Отдельные шаги — извлечь, проверить, оформить — становятся кирпичиками командной библиотеки
      промптов.
    lessonId: m07-01
  - id: y-chain-data
    type: single
    scenario: В протоколе встречи — ФИО участников и условия договора.
    prompt: Что сделать перед отправкой протокола в цепочку внешнего ИИ-сервиса?
    options:
      - id: a
        text: Ничего
      - id: b
        text: "Обезличить: убрать ФИО, названия компаний и суммы, если это не разрешено политикой"
      - id: c
        text: Отправить только заголовки
    correct: b
    explanation: Правила работы с данными действуют на каждом шаге цепочки.
    lessonId: m07-01
