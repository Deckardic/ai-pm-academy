id: middle-exam
kind: exam
title: Итоговый экзамен Middle
passScore: 0.75
questionsPerAttempt: 12
timeLimitMin: 60
cooldownHours: 24
questions:
  - id: y-little-law
    type: single
    scenario: Команда завершает 12 задач в неделю, в работе 24 задачи.
    prompt: Каким будет среднее время прохождения задачи?
    options:
      - id: a
        text: 2 недели
      - id: b
        text: 4 недели
      - id: c
        text: 0,5 недели
    correct: a
    explanation: "По закону Литтла: 24 ÷ 12 = 2 недели."
    lessonId: m01-01
  - id: y-wip-cut
    type: single
    prompt:
      Незавершённую работу сократили с 30 до 15 задач, пропускная способность не изменилась. Что будет
      со временем прохождения?
    options:
      - id: a
        text: Сократится примерно вдвое
      - id: b
        text: Вырастет
      - id: c
        text: Не изменится
    correct: a
    explanation: Время прохождения пропорционально незавершённой работе при той же пропускной способности.
    lessonId: m01-01
  - id: y-wip-full
    type: single
    scenario: Команда работает по Kanban с WIP-лимитами.
    prompt: Колонка «Тестирование» заполнена до лимита. Что должен сделать освободившийся разработчик?
    options:
      - id: a
        text: Взять новую задачу
      - id: b
        text: Помочь с тестированием
      - id: c
        text: Поднять лимит колонки
    correct: b
    explanation: Упор в лимит — сигнал помочь довести начатое, а не начинать новое.
    lessonId: m01-01
  - id: y-wip-start
    type: single
    prompt: С какого лимита лучше начать внедрение WIP-лимитов?
    options:
      - id: a
        text: Немного ниже текущего уровня незавершённой работы
      - id: b
        text: Один — по задаче на колонку
      - id: c
        text: Сразу вдвое ниже текущего
    correct: a
    explanation:
      Резкое снижение вызывает сопротивление. Начните с «текущее минус 20–30%» и корректируйте
      по метрикам.
    lessonId: m01-01
  - id: y-wip-raise
    type: single
    scenario: Лимит колонки «Ревью» — 3 задачи.
    prompt: Команда постоянно упирается в лимит на ревью. Что сделать в первую очередь?
    options:
      - id: a
        text: Поднять лимит
      - id: b
        text: Разобраться, почему ревью становится узким местом
      - id: c
        text: Отменить лимиты
    correct: b
    explanation: Упор в лимит показывает узкое место. Поднять лимит — значит спрятать проблему.
    lessonId: m01-01
  - id: y-flow-signals
    type: multiple
    prompt: Какие признаки говорят о слишком большом объёме незавершённой работы? Выберите все подходящие.
    options:
      - id: a
        text: У каждого по 3–4 задачи в работе
      - id: b
        text: Задачи долго ждут ревью и ответов
      - id: c
        text: Команда редко переключается между задачами
      - id: d
        text: До «Готово» доходит мало задач
    correct:
      - a
      - b
      - d
    explanation: Много задач на человека, ожидания и медленное завершение — типичные симптомы.
    lessonId: m01-01
  - id: y-chain-when
    type: single
    scenario: Нужно разобрать протокол встречи на 5 страниц и найти противоречия в требованиях.
    prompt: "Что лучше: один большой промпт или цепочка?"
    options:
      - id: a
        text: Один промпт — быстрее
      - id: b
        text: Цепочка с проверкой после извлечения требований
      - id: c
        text: Разница не важна
    correct: b
    explanation: Сложная задача с риском ошибки в вводных — случай для цепочки с точками контроля.
    lessonId: m07-01
  - id: y-chain-no
    type: single
    prompt: Нужна ли цепочка промптов, чтобы переписать письмо по трём тезисам?
    options:
      - id: a
        text: Да, всегда
      - id: b
        text: Нет, результат проверяется за минуту — хватит одного промпта
      - id: c
        text: Да, если письмо важное
    correct: b
    explanation: Цепочка нужна, когда задачу сложно проверить целиком.
    lessonId: m07-01
  - id: y-chain-steps
    type: order
    prompt: Расставьте шаги цепочки по порядку.
    items:
      - id: extract
        text: Извлечь требования
      - id: check
        text: Проверить извлечённое
      - id: analyze
        text: Найти противоречия
      - id: format
        text: Оформить вопросы к заказчику
    explanation: Проверка идёт сразу после извлечения — там ошибки дешевле всего.
    lessonId: m07-01
  - id: y-chain-error
    type: single
    prompt: Модель неверно поняла требование на первом шаге цепочки, а вы это пропустили. Что будет?
    options:
      - id: a
        text: Ошибка исправится на следующих шагах
      - id: b
        text: Анализ и итоговый документ будут построены на ошибке
      - id: c
        text: Модель предупредит об ошибке
    correct: b
    explanation: Каждый шаг опирается на предыдущий — поэтому нужна проверка после извлечения.
    lessonId: m07-01
  - id: y-chain-reuse
    type: single
    prompt: Какое свойство цепочек помогает командной работе?
    options:
      - id: a
        text: Шаги легко переиспользовать в других задачах
      - id: b
        text: Цепочки нельзя передать коллегам
      - id: c
        text: Цепочки работают только в одной модели
    correct: a
    explanation:
      Отдельные шаги — извлечь, проверить, оформить — становятся кирпичиками командной библиотеки
      промптов.
    lessonId: m07-01
  - id: y-chain-data
    type: single
    scenario: В протоколе встречи — ФИО участников и условия договора.
    prompt: Что сделать перед отправкой протокола в цепочку внешнего ИИ-сервиса?
    options:
      - id: a
        text: Ничего
      - id: b
        text: "Обезличить: убрать ФИО, названия компаний и суммы, если это не разрешено политикой"
      - id: c
        text: Отправить только заголовки
    correct: b
    explanation: Правила работы с данными действуют на каждом шаге цепочки.
    lessonId: m07-01
  - id: y-sprint-goal
    type: single
    scenario: "Команда планирует спринт как список из 14 задач без общей цели, половина задач каждый раз переносится."
    prompt: Что изменить в первую очередь?
    options:
      - { id: a, text: "Брать больше задач" }
      - {
          id: b,
          text: "Формулировать цель спринта и планировать по фактической производительности",
        }
      - { id: c, text: "Удлинить спринт до месяца" }
    correct: b
    explanation: "Цель даёт фокус, а планирование по факту — реалистичный объём."
    lessonId: m01-02
  - id: y-dod
    type: single
    prompt: Что даёт команде Definition of Done?
    options:
      - { id: a, text: "Одинаковое для всех понимание «готово»" }
      - { id: b, text: "Оценки в часах" }
      - { id: c, text: "Список всех будущих задач" }
    correct: a
    explanation: "Без общего критерия готовности незавершённая работа копится под видом готовой."
    lessonId: m01-03
  - id: y-classes
    type: single
    prompt: Зачем ограничивать число срочных задач в Kanban-системе?
    options:
      - { id: a, text: "Иначе срочным становится всё, и настоящие срочные задачи тонут" }
      - { id: b, text: "Срочные задачи неважны" }
      - { id: c, text: "Так требует трекер" }
    correct: a
    explanation: "Класс обслуживания работает, только если у него есть критерии и лимит."
    lessonId: m01-04
  - id: y-velocity
    type: single
    prompt: Руководитель хочет сравнить три команды по velocity. Что ответить?
    options:
      - { id: a, text: "Хорошая идея" }
      - {
          id: b,
          text: "Нельзя: шкалы оценок у команд разные, сравнение приведёт к инфляции оценок",
        }
      - { id: c, text: "Можно, если перевести в часы" }
    correct: b
    explanation: "Story points — относительная шкала конкретной команды."
    lessonId: m01-05
  - id: y-hybrid
    type: single
    prompt: С чего начинать проектирование гибридного процесса?
    options:
      - { id: a, text: "С ограничений проекта и элементов, которые на них отвечают" }
      - { id: b, text: "С любимой методологии" }
      - { id: c, text: "С набора встреч" }
    correct: a
    explanation: "Каждый элемент гибрида должен отвечать конкретному ограничению."
    lessonId: m02-01
  - id: y-gate
    type: single
    prompt: Что показывают на воротах Stage-Gate?
    options:
      - { id: a, text: "Отчёт о выполненных задачах" }
      - {
          id: b,
          text: "Результат этапа, проверенные гипотезы, прогноз следующего этапа и рекомендацию",
        }
      - { id: c, text: "Диаграмму Ганта на год" }
    correct: b
    explanation: "Ворота — инвестиционное решение."
    lessonId: m02-02
  - id: y-wsf
    type: single
    prompt: Какая метрика лучше всего показывает проблему Water-Scrum-Fall?
    options:
      - { id: a, text: "Время от идеи функции до первого использования реальным пользователем" }
      - { id: b, text: "Длина спринта" }
      - { id: c, text: "Число встреч" }
    correct: a
    explanation: "В Water-Scrum-Fall спринты короткие, но пользователь получает результат через месяцы."
    lessonId: m02-03
  - id: y-minimal-process
    type: single
    prompt: Какой вопрос помогает убрать лишние элементы процесса?
    options:
      - { id: a, text: "Какое решение принимается на этой встрече или по этому документу?" }
      - { id: b, text: "Как делают конкуренты?" }
      - { id: c, text: "Нравится ли это команде?" }
    correct: a
    explanation: "Элемент без решения — кандидат на удаление."
    lessonId: m02-04
  - id: y-problem-behind
    type: single
    scenario: "Заказчик просит «выгрузку всех заказов в Excel»."
    prompt: Какой вопрос задать первым?
    options:
      - { id: a, text: "Какой формат файла?" }
      - { id: b, text: "Что вы будете делать с этой выгрузкой?" }
      - { id: c, text: "К какому числу?" }
    correct: b
    explanation: "Вопрос о цели выявляет проблему за предложенным решением."
    lessonId: m03-01
  - id: y-gwt
    type: single
    prompt: Какой формат удобен для критериев приёмки?
    options:
      - { id: a, text: "«Дано — Когда — Тогда»" }
      - { id: b, text: "Описание цвета и расположения кнопок" }
      - { id: c, text: "Оценка в story points" }
    correct: a
    explanation: "Сценарии описывают поведение и граничные случаи."
    lessonId: m03-02
  - id: y-rice
    type: single
    prompt: "Охват 400, влияние 2, уверенность 80%, затраты 1. Чему равен RICE?"
    options:
      - { id: a, text: "640" }
      - { id: b, text: "800" }
      - { id: c, text: "320" }
    correct: a
    explanation: "400 × 2 × 0,8 ÷ 1 = 640."
    lessonId: m03-03
  - id: y-change-owner
    type: single
    prompt: Кто принимает решение об изменении, которое сдвигает дату релиза?
    options:
      - { id: a, text: "Разработчик, который получил просьбу" }
      - { id: b, text: "Тот, кто отвечает за рамки проекта, например спонсор" }
      - { id: c, text: "Стейкхолдер, который попросил" }
    correct: b
    explanation: "PM готовит оценку и варианты, решает владелец рамок."
    lessonId: m03-04
  - id: y-ai-req
    type: single
    prompt: Как защититься от выдуманных требований при извлечении с ИИ?
    options:
      - { id: a, text: "Требовать цитату-источник и сверять" }
      - { id: b, text: "Использовать новую модель" }
      - { id: c, text: "Попросить быть точнее" }
    correct: a
    explanation: "Требование без источника сразу видно."
    lessonId: m03-05
  - id: y-anchor
    type: single
    prompt: Как снизить влияние якорения на оценки?
    options:
      - { id: a, text: "Просить оценку до того, как кто-то назовёт желаемый срок" }
      - { id: b, text: "Сначала назвать дату" }
      - { id: c, text: "Оценивать всем вместе вслух по очереди" }
    correct: a
    explanation: "Первая названная цифра тянет оценки к себе."
    lessonId: m04-01
  - id: y-poker
    type: single
    prompt: В чём главная польза покера планирования?
    options:
      - { id: a, text: "В обсуждении расхождений оценок" }
      - { id: b, text: "В точном числе" }
      - { id: c, text: "В скорости" }
    correct: a
    explanation: "Расхождения показывают разное понимание задачи."
    lessonId: m04-02
  - id: y-mc-level
    type: single
    prompt: Какой уровень уверенности прогноза обычно используют для внешних обязательств?
    options:
      - { id: a, text: "50%" }
      - { id: b, text: "85% и выше" }
      - { id: c, text: "10%" }
    correct: b
    explanation: "50% — это «монетка»."
    lessonId: m04-03
  - id: y-forecast-talk
    type: single
    prompt: Как лучше сообщить заказчику срок?
    options:
      - { id: a, text: "Одной оптимистичной датой" }
      - { id: b, text: "Датой с уровнем уверенности, условиями и договорённостью об обновлениях" }
      - { id: c, text: "Не сообщать, пока не будет точно" }
    correct: b
    explanation: "Диапазон и условия дают заказчику управлять риском."
    lessonId: m04-04
  - id: y-lead-time
    type: single
    prompt: Какое время чувствует заказчик доработки?
    options:
      - { id: a, text: "Lead time — от запроса до результата" }
      - { id: b, text: "Cycle time — от начала работы" }
      - { id: c, text: "Длину спринта" }
    correct: a
    explanation: "Заказчик ждёт и в очереди, и в работе."
    lessonId: m05-01
  - id: y-cfd
    type: single
    prompt: Что означает расширяющаяся полоса этапа на CFD?
    options:
      - { id: a, text: "На этапе копится работа — узкое место" }
      - { id: b, text: "Этап работает лучше всех" }
      - { id: c, text: "Ничего" }
    correct: a
    explanation: "Работа приходит на этап быстрее, чем уходит."
    lessonId: m05-02
  - id: y-goodhart
    type: single
    prompt: Что произойдёт, если сделать количество закрытых задач KPI команды?
    options:
      - { id: a, text: "Задачи начнут дробить, метрика вырастет без роста результата" }
      - { id: b, text: "Продуктивность вырастет" }
      - { id: c, text: "Ничего" }
    correct: a
    explanation: "Закон Гудхарта."
    lessonId: m05-03
  - id: y-report-numbers
    type: single
    prompt: Как надёжно получить цифры для сводки по выгрузке?
    options:
      - { id: a, text: "Формулами в таблице, а модели — готовые цифры для текста" }
      - { id: b, text: "Попросить модель посчитать" }
      - { id: c, text: "Прикинуть" }
    correct: a
    explanation: "Модели ошибаются в арифметике."
    lessonId: m05-04
  - id: y-reserves
    type: single
    prompt: Чем резерв на риски отличается от управленческого резерва?
    options:
      - {
          id: a,
          text: "Резерв на риски — для известных рисков, управленческий — для непредвиденного",
        }
      - { id: b, text: "Ничем" }
      - { id: c, text: "Управленческий — для зарплат" }
    correct: a
    explanation: "Резервом на риски обычно управляет PM, управленческим — спонсор."
    lessonId: m06-01
  - id: y-underspend
    type: single
    prompt: Проект потратил меньше плана. Что это может означать?
    options:
      - { id: a, text: "Только экономию" }
      - { id: b, text: "Часто — отставание работ или неоплаченные обязательства" }
      - { id: c, text: "Ошибку бухгалтерии" }
    correct: b
    explanation: "Сравнивайте затраты с выполненной работой и учитывайте обязательства."
    lessonId: m06-02
  - id: y-spi
    type: single
    prompt: "PV = 10 млн, EV = 8 млн. Чему равен SPI?"
    options:
      - { id: a, text: "0,8 — отставание" }
      - { id: b, text: "1,25 — опережение" }
      - { id: c, text: "2 — отставание" }
    correct: a
    explanation: "SPI = EV ÷ PV."
    lessonId: m06-03
  - id: y-eac
    type: single
    prompt: "BAC = 10 млн, CPI = 0,8. Каков EAC при сохранении эффективности?"
    options:
      - { id: a, text: "12,5 млн" }
      - { id: b, text: "8 млн" }
      - { id: c, text: "10 млн" }
    correct: a
    explanation: "EAC = BAC ÷ CPI."
    lessonId: m06-04
  - id: y-few-shot
    type: single
    prompt: Модель копирует содержание примеров в новые отчёты. Что помогает?
    options:
      - { id: a, text: "Разнообразные примеры и явное указание брать из них только формат и тон" }
      - { id: b, text: "Больше одинаковых примеров" }
      - { id: c, text: "Убрать ограничения" }
    correct: a
    explanation: "Модель должна видеть, что меняется, а что постоянно."
    lessonId: m07-02
  - id: y-assistant-tests
    type: single
    prompt: Что сделать после изменения инструкций командного ИИ-ассистента?
    options:
      - { id: a, text: "Прогнать набор тестовых примеров" }
      - { id: b, text: "Ничего" }
      - { id: c, text: "Удалить базу знаний" }
    correct: a
    explanation: "Небольшое изменение может сломать другое поведение."
    lessonId: m07-04
  - id: y-automate
    type: single
    prompt: Какая задача — лучший кандидат для автоматизации?
    options:
      - { id: a, text: "Частая, одинаковая, предсказуемая, с заметной ценой ошибки" }
      - { id: b, text: "Редкая, с меняющимися правилами" }
      - { id: c, text: "Решение о приёмке результата" }
    correct: a
    explanation: "Такая автоматизация окупается."
    lessonId: m08-01
  - id: y-agent-bounds
    type: single
    prompt: Какие действия ИИ-агента требуют подтверждения человека?
    options:
      - { id: a, text: "Внешние коммуникации, изменение обязательств и необратимые действия" }
      - { id: b, text: "Чтение задач" }
      - { id: c, text: "Никакие" }
    correct: a
