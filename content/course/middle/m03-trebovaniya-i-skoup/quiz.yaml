id: m03-quiz
kind: module
title: "Тест модуля: Требования и скоуп"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: problem-behind
    type: single
    scenario: "Директор по продажам просит «выгрузку всех заказов в Excel»."
    prompt: "Какой вопрос лучше всего поможет выявить настоящую потребность?"
    options:
      - { id: a, text: "В каком формате сделать файл?" }
      - { id: b, text: "Что вы будете делать с этой выгрузкой?" }
      - { id: c, text: "Когда нужна выгрузка?" }
    correct: b
    explanation: "Вопрос о цели помогает найти проблему за предложенным решением."
    lessonId: m03-01
  - id: nfr
    type: single
    prompt: "Какое требование нефункциональное?"
    options:
      - { id: a, text: "Дилер может повторить прошлый заказ" }
      - { id: b, text: "Дилер видит только свои цены и заказы" }
      - { id: c, text: "Менеджер может выгрузить список заказов" }
    correct: b
    explanation: "Разграничение доступа — требование безопасности, то есть нефункциональное."
    lessonId: m03-01
  - id: interview-past
    type: single
    prompt: "Какой вопрос в интервью даёт более надёжную информацию?"
    options:
      - { id: a, text: "«Как бы вы хотели оформлять заказы?»" }
      - { id: b, text: "«Расскажите о последнем заказе, который вы оформляли: что делали шаг за шагом?»" }
      - { id: c, text: "«Вам нужен удобный портал?»" }
    correct: b
    explanation: "Рассказ о реальном прошлом опыте надёжнее рассуждений о желаемом будущем."
    lessonId: m03-01
  - id: story-value
    type: single
    prompt: "Какая часть пользовательской истории самая важная для команды и приоритизации?"
    options:
      - { id: a, text: "Роль" }
      - { id: b, text: "Ценность — часть «чтобы…»" }
      - { id: c, text: "Номер задачи" }
    correct: b
    explanation: "Ценность объясняет зачем и позволяет команде предложить лучшее решение."
    lessonId: m03-02
  - id: invest-bad
    type: single
    prompt: "История «Как менеджер дилера, я хочу удобный портал, чтобы работать эффективно» нарушает прежде всего…"
    options:
      - { id: a, text: "Independent и Negotiable" }
      - { id: b, text: "Small, Estimable и Testable" }
      - { id: c, text: "Ничего" }
    correct: b
    explanation: "Это целый продукт — его нельзя оценить, сделать за итерацию и проверить."
    lessonId: m03-02
  - id: gwt
    type: order
    prompt: "Расположите части критерия приёмки в правильном порядке."
    items:
      - { id: a, text: "Дано: исходная ситуация" }
      - { id: b, text: "Когда: действие пользователя" }
      - { id: c, text: "Тогда: ожидаемый результат" }
    explanation: "Формат «Дано — Когда — Тогда» описывает поведение системы в конкретном сценарии."
    lessonId: m03-02
  - id: rice-formula
    type: single
    prompt: "Как считается RICE?"
    options:
      - { id: a, text: "Охват × Влияние × Уверенность ÷ Затраты" }
      - { id: b, text: "Охват + Влияние + Уверенность + Затраты" }
      - { id: c, text: "Затраты ÷ Охват" }
    correct: a
    explanation: "RICE растёт с охватом, влиянием и уверенностью и падает с затратами."
    lessonId: m03-03
  - id: wsjf-calc
    type: single
    prompt: "Задача A: стоимость задержки 20, размер 10. Задача B: стоимость задержки 12, размер 3. Что делать первым по WSJF?"
    options:
      - { id: a, text: "A" }
      - { id: b, text: "B" }
      - { id: c, text: "Без разницы" }
    correct: b
    explanation: "WSJF A = 2, WSJF B = 4. Короткая задача с заметной стоимостью задержки приносит больше ценности в единицу времени."
    lessonId: m03-03
  - id: moscow-must
    type: single
    prompt: "Какое главное правило MoSCoW?"
    options:
      - { id: a, text: "Must должно быть меньшинством и помещаться в ресурсы с запасом" }
      - { id: b, text: "Всё важное — Must" }
      - { id: c, text: "Won't означает «никогда»" }
    correct: a
    explanation: "Если всё Must, метод перестаёт работать. Won't — «не в этот раз»."
    lessonId: m03-03
  - id: change-decider
    type: single
    scenario: "Директор по продажам просит функцию, которая сдвинет релиз на месяц. За дату релиза он не отвечает."
    prompt: "Как поступить PM?"
    options:
      - { id: a, text: "Согласиться" }
      - { id: b, text: "Оценить влияние, подготовить варианты и вынести решение тому, кто отвечает за рамки проекта" }
      - { id: c, text: "Отказать без обсуждения" }
    correct: b
    explanation: "Решение об изменении рамок принимает тот, кто за них отвечает. PM готовит оценку и варианты."
    lessonId: m03-04
  - id: change-options
    type: multiple
    prompt: "Какие варианты реакции на запрос изменения стоит рассматривать? Выберите все подходящие."
    options:
      - { id: a, text: "Включить с изменением сроков или бюджета" }
      - { id: b, text: "Включить за счёт другой задачи" }
      - { id: c, text: "Сделать упрощённую версию" }
      - { id: d, text: "Молча включить без оценки" }
    correct: [a, b, c]
    explanation: "Также возможны перенос и отказ. Молчаливое включение — путь к разрастанию скоупа."
    lessonId: m03-04
  - id: ai-invented-req
    type: single
    scenario: "Модель извлекла из протокола требование о двухфакторной аутентификации, хотя о безопасности не говорили."
    prompt: "Что делать?"
    options:
      - { id: a, text: "Оставить — полезное требование" }
      - { id: b, text: "Убрать из требований; при желании вынести как предложение для стейкхолдеров" }
      - { id: c, text: "Поверить объяснению модели" }
    correct: b
    explanation: "Требование не высказывалось — это предложение модели, его подтверждают люди."
    lessonId: m03-05
  - id: ai-source
    type: single
    prompt: "Какой приём лучше всего защищает от выдуманных требований при извлечении с ИИ?"
    options:
      - { id: a, text: "Попросить модель быть точнее" }
      - { id: b, text: "Требовать цитату-источник для каждого требования и сверять с протоколом" }
      - { id: c, text: "Использовать самую новую модель" }
    correct: b
    explanation: "Требование без источника сразу видно и проверяется сверкой."
    lessonId: m03-05
