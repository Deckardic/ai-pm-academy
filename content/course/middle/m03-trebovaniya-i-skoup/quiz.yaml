id: m03-quiz
kind: module
title: "Тест модуля: Требования и скоуп"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: problem-behind
    type: single
    scenario: Директор по продажам просит «выгрузку всех заказов в Excel».
    prompt: Какой вопрос лучше всего поможет выявить настоящую потребность?
    options:
      - id: a
        text: В каком формате сделать файл?
      - id: b
        text: Что вы будете делать с этой выгрузкой?
      - id: c
        text: Когда нужна выгрузка?
    correct: b
    explanation: Вопрос о цели помогает найти проблему за предложенным решением.
    lessonId: m03-01
  - id: nfr
    type: single
    prompt: Какое требование нефункциональное?
    options:
      - id: a
        text: Дилер может повторить прошлый заказ
      - id: b
        text: Дилер видит только свои цены и заказы
      - id: c
        text: Менеджер может выгрузить список заказов
    correct: b
    explanation: Разграничение доступа — требование безопасности, то есть нефункциональное.
    lessonId: m03-01
  - id: interview-past
    type: single
    prompt: Какой вопрос в интервью даёт более надёжную информацию?
    options:
      - id: a
        text: «Как бы вы хотели оформлять заказы?»
      - id: b
        text: "«Расскажите о последнем заказе, который вы оформляли: что делали шаг за шагом?»"
      - id: c
        text: «Вам нужен удобный портал?»
    correct: b
    explanation: Рассказ о реальном прошлом опыте надёжнее рассуждений о желаемом будущем.
    lessonId: m03-01
  - id: story-value
    type: single
    prompt: Какая часть пользовательской истории самая важная для команды и приоритизации?
    options:
      - id: a
        text: Роль
      - id: b
        text: Ценность — часть «чтобы…»
      - id: c
        text: Номер задачи
    correct: b
    explanation: Ценность объясняет зачем и позволяет команде предложить лучшее решение.
    lessonId: m03-02
  - id: invest-bad
    type: single
    prompt:
      История «Как менеджер дилера, я хочу удобный портал, чтобы работать эффективно» нарушает прежде
      всего…
    options:
      - id: a
        text: Independent и Negotiable
      - id: b
        text: Small, Estimable и Testable
      - id: c
        text: Ничего
    correct: b
    explanation: Это целый продукт — его нельзя оценить, сделать за итерацию и проверить.
    lessonId: m03-02
  - id: gwt
    type: order
    prompt: Расположите части критерия приёмки в правильном порядке.
    items:
      - id: a
        text: "Дано: исходная ситуация"
      - id: b
        text: "Когда: действие пользователя"
      - id: c
        text: "Тогда: ожидаемый результат"
    explanation: Формат «Дано — Когда — Тогда» описывает поведение системы в конкретном сценарии.
    lessonId: m03-02
  - id: rice-formula
    type: single
    prompt: Как считается RICE?
    options:
      - id: a
        text: Охват × Влияние × Уверенность ÷ Затраты
      - id: b
        text: Охват + Влияние + Уверенность + Затраты
      - id: c
        text: Затраты ÷ Охват
    correct: a
    explanation: RICE растёт с охватом, влиянием и уверенностью и падает с затратами.
    lessonId: m03-03
  - id: wsjf-calc
    type: single
    prompt:
      "Задача A: стоимость задержки 20, размер 10. Задача B: стоимость задержки 12, размер 3. Что
      делать первым по WSJF?"
    options:
      - id: a
        text: A
      - id: b
        text: B
      - id: c
        text: Без разницы
    correct: b
    explanation:
      WSJF A = 2, WSJF B = 4. Короткая задача с заметной стоимостью задержки приносит больше
      ценности в единицу времени.
    lessonId: m03-03
  - id: moscow-must
    type: single
    prompt: Какое главное правило MoSCoW?
    options:
      - id: a
        text: Must должно быть меньшинством и помещаться в ресурсы с запасом
      - id: b
        text: Всё важное — Must
      - id: c
        text: Won't означает «никогда»
    correct: a
    explanation: Если всё Must, метод перестаёт работать. Won't — «не в этот раз».
    lessonId: m03-03
  - id: change-decider
    type: single
    scenario:
      Директор по продажам просит функцию, которая сдвинет релиз на месяц. За дату релиза он не
      отвечает.
    prompt: Как поступить PM?
    options:
      - id: a
        text: Согласиться
      - id: b
        text: Оценить влияние, подготовить варианты и вынести решение тому, кто отвечает за рамки проекта
      - id: c
        text: Отказать без обсуждения
    correct: b
    explanation: Решение об изменении рамок принимает тот, кто за них отвечает. PM готовит оценку и варианты.
    lessonId: m03-04
  - id: change-options
    type: multiple
    prompt: Какие варианты реакции на запрос изменения стоит рассматривать? Выберите все подходящие.
    options:
      - id: a
        text: Включить с изменением сроков или бюджета
      - id: b
        text: Включить за счёт другой задачи
      - id: c
        text: Сделать упрощённую версию
      - id: d
        text: Молча включить без оценки
    correct:
      - a
      - b
      - c
    explanation: Также возможны перенос и отказ. Молчаливое включение — путь к разрастанию скоупа.
    lessonId: m03-04
  - id: ai-invented-req
    type: single
    scenario:
      Модель извлекла из протокола требование о двухфакторной аутентификации, хотя о безопасности
      не говорили.
    prompt: Что делать?
    options:
      - id: a
        text: Оставить — полезное требование
      - id: b
        text: Убрать из требований; при желании вынести как предложение для стейкхолдеров
      - id: c
        text: Поверить объяснению модели
    correct: b
    explanation: Требование не высказывалось — это предложение модели, его подтверждают люди.
    lessonId: m03-05
  - id: ai-source
    type: single
    prompt: Какой приём лучше всего защищает от выдуманных требований при извлечении с ИИ?
    options:
      - id: a
        text: Попросить модель быть точнее
      - id: b
        text: Требовать цитату-источник для каждого требования и сверять с протоколом
      - id: c
        text: Использовать самую новую модель
    correct: b
    explanation: Требование без источника сразу видно и проверяется сверкой.
    lessonId: m03-05
  - id: observation
    type: single
    prompt: Когда особенно полезен метод наблюдения?
    options:
      - id: a
        text: Чтобы понять реальный процесс и найти неочевидные шаги
      - id: b
        text: Чтобы согласовать бюджет
      - id: c
        text: Чтобы написать устав
      - id: d
        text: Никогда
    correct: a
    explanation: Люди описывают, как думают, что работают, а наблюдение показывает, как на самом деле.
    lessonId: m03-01
  - id: workshop
    type: single
    prompt: Когда уместен воркшоп для выявления требований?
    options:
      - id: a
        text: Чтобы согласовать требования нескольких сторон и разрешить противоречия
      - id: b
        text: Для личного интервью
      - id: c
        text: Для расчёта бюджета
      - id: d
        text: Для ретро
    correct: a
    explanation: Нужна хорошая фасилитация, иначе побеждает самый громкий.
    lessonId: m03-01
  - id: prototype-risk
    type: single
    prompt: В чём ограничение прототипа при выявлении требований?
    options:
      - id: a
        text: Люди начинают обсуждать цвета кнопок вместо сути
      - id: b
        text: Он всегда дорогой
      - id: c
        text: Он бесполезен
      - id: d
        text: Он заменяет требования
    correct: a
    explanation: Направляйте обсуждение на сценарии и проблемы.
    lessonId: m03-01
  - id: raw-wishes
    type: single
    prompt: Список из 200 пожеланий после интервью — это…
    options:
      - id: a
        text: Готовые требования
      - id: b
        text: "Сырьё: нужно сгруппировать, связать с проблемами, убрать дубли и приоритизировать"
      - id: c
        text: Бэклог спринта
      - id: d
        text: Устав
    correct: b
    explanation: Требования появляются после обработки.
    lessonId: m03-01
  - id: interview-record
    type: single
    prompt: Что нужно для записи интервью и её обработки с ИИ?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Согласие собеседника и сервис, разрешённый для таких данных; иначе — обезличенные заметки
      - id: c
        text: Только диктофон
      - id: d
        text: Только ИИ
    correct: b
    explanation: Запись интервью — персональные данные.
    lessonId: m03-01
  - id: story-card
    type: single
    prompt: Из каких трёх элементов состоит история в популярной формуле?
    options:
      - id: a
        text: Карточка, разговор, подтверждение
      - id: b
        text: Роль, цена, срок
      - id: c
        text: Эпик, задача, подзадача
      - id: d
        text: План, факт, отклонение
    correct: a
    explanation: Карточка напоминает, о чём договориться.
    lessonId: m03-02
  - id: no-story-tech
    type: single
    prompt: Как лучше описать обновление библиотек в проекте?
    options:
      - id: a
        text: Историей «Как библиотека, я хочу обновиться»
      - id: b
        text: Технической задачей с понятным результатом
      - id: c
        text: Не описывать
      - id: d
        text: Эпиком на год
    correct: b
    explanation: Не всё удобно описывать историями.
    lessonId: m03-02
  - id: nfr-in-dod
    type: single
    prompt: Где часто удобно держать нефункциональные требования?
    options:
      - id: a
        text: В отдельных историях для каждой функции
      - id: b
        text: В общих ограничениях или в Definition of Done
      - id: c
        text: В чате
      - id: d
        text: Нигде
    correct: b
    explanation: Так они применяются ко всем задачам.
    lessonId: m03-02
  - id: invest-i
    type: single
    prompt: Что значит буква I в INVEST?
    options:
      - id: a
        text: Независимая
      - id: b
        text: Интересная
      - id: c
        text: Инновационная
      - id: d
        text: Итеративная
    correct: a
    explanation: Историю можно сделать и выпустить без других.
    lessonId: m03-02
  - id: rice-confidence
    type: single
    prompt: Стейкхолдер оценил влияние задачи на 3, но данных нет. Какая уверенность честна?
    options:
      - id: a
        text: 100%
      - id: b
        text: Около 50%
      - id: c
        text: 200%
      - id: d
        text: 0%
    correct: b
    explanation: Уверенность снижает вес идей без данных.
    lessonId: m03-03
  - id: rice-calc2
    type: single
    prompt: Охват 500, влияние 1, уверенность 100%, затраты 2. RICE = ?
    options:
      - id: a
        text: "250"
      - id: b
        text: "1000"
      - id: c
        text: "500"
      - id: d
        text: "50"
    correct: a
    explanation: 500 × 1 × 1 ÷ 2 = 250.
    lessonId: m03-03
  - id: wsjf-cod
    type: single
    prompt: Из чего складывают стоимость задержки в WSJF?
    options:
      - id: a
        text: Ценность, критичность по времени, снижение рисков или открытие возможностей
      - id: b
        text: Бюджет и срок
      - id: c
        text: Количество людей
      - id: d
        text: Число задач
    correct: a
    explanation: Компоненты оценивают относительно.
    lessonId: m03-03
  - id: prio-disagree
    type: single
    prompt: Оценки влияния у двух стейкхолдеров отличаются в три раза. Что делать?
    options:
      - id: a
        text: Усреднить
      - id: b
        text: "Обсудить: кто-то знает то, чего не знают другие"
      - id: c
        text: Взять большую
      - id: d
        text: Взять меньшую
    correct: b
    explanation: Расхождение — повод для разговора.
    lessonId: m03-03
  - id: prio-transparent
    type: single
    prompt: Как защититься от подгонки оценок под желаемый ответ?
    options:
      - id: a
        text: Скрыть оценки
      - id: b
        text: Сделать все оценки и их обоснования видимыми участникам
      - id: c
        text: Считать в одиночку
      - id: d
        text: Не приоритизировать
    correct: b
    explanation: Прозрачность снижает манипуляции.
    lessonId: m03-03
  - id: change-journal
    type: single
    prompt: Зачем журнал изменений в конце проекта?
    options:
      - id: a
        text: Для красоты
      - id: b
        text: Объяснить, почему сроки и бюджет отличаются от исходных
      - id: c
        text: Для наказаний
      - id: d
        text: Не нужен
    correct: b
    explanation: Также видно, сколько изменений приходит и от кого.
    lessonId: m03-04
  - id: change-simpler
    type: single
    prompt: Какой вопрос часто находит более дешёвое решение для запроса на изменение?
    options:
      - id: a
        text: «Кто виноват?»
      - id: b
        text: «Какую проблему решает изменение и есть ли более простой способ?»
      - id: c
        text: «Сколько вы заплатите?»
      - id: d
        text: «Зачем вы пишете?»
    correct: b
    explanation: Например, ручная загрузка прайсов вместо интеграции.
    lessonId: m03-04
  - id: change-subcontract
    type: single
    prompt: Как оформляется изменение объёма работ подрядчика по фиксированному договору?
    options:
      - id: a
        text: Устно
      - id: b
        text: Дополнительным соглашением между сторонами договора
      - id: c
        text: Сообщением в чат
      - id: d
        text: Не оформляется
    correct: b
    explanation: Это решение сторон договора.
    lessonId: m03-04
  - id: change-levels
    type: single
    prompt: Какие изменения обычно может утвердить PM сам?
    options:
      - id: a
        text: Сдвиг даты релиза
      - id: b
        text: Изменения в пределах буфера и резервов, делегированных спонсором
      - id: c
        text: Увеличение бюджета
      - id: d
        text: Смену цели проекта
    correct: b
    explanation: Уровни полномочий договаривают на старте.
    lessonId: m03-04
  - id: ai-reqs-dates
    type: single
    prompt: Протоколы нескольких встреч противоречат друг другу. Что подсказать модели?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Указать даты и попросить учитывать более поздние решения
      - id: c
        text: Удалить старые протоколы
      - id: d
        text: Попросить выбрать любимый
    correct: b
    explanation: Иначе модель может взять устаревшую позицию.
    lessonId: m03-05
  - id: ai-reqs-suggest
    type: single
    prompt: Как оформить требования, которые модель предлагает сама?
    options:
      - id: a
        text: Как требования стейкхолдеров
      - id: b
        text: Отдельно, с пометкой «предложение, требует подтверждения»
      - id: c
        text: Не показывать
      - id: d
        text: Сразу в разработку
    correct: b
    explanation: Предложение модели — не требование.
    lessonId: m03-05
  - id: ai-reqs-caveats
    type: single
    prompt: Какая потеря контекста типична при извлечении требований ИИ?
    options:
      - id: a
        text: Потеря оговорок вроде «только для крупных дилеров»
      - id: b
        text: Лишние пробелы
      - id: c
        text: Неверный шрифт
      - id: d
        text: Длинные заголовки
    correct: a
    explanation: Оговорки меняют смысл требования.
    lessonId: m03-05
