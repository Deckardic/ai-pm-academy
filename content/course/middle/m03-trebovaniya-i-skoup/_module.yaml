id: m03
slug: trebovaniya-i-skoup
order: 3
title: Требования и скоуп
summary: User stories, критерии приёмки, приоритизация и управление изменениями.
goals:
  - Писать user stories и критерии приёмки
  - Приоритизировать по MoSCoW, RICE и WSJF
  - Управлять изменениями скоупа
status: published
artifact: Бэклог с приоритизацией
keyConcepts:
  - user story
  - критерии приёмки
  - MoSCoW
  - RICE
  - WSJF
searchQueries:
  - rice приоритизация
  - user story пример
lessonsPlan:
  - slug: vyyavlenie-trebovaniy
    title: Выявление требований
    focus: как узнать, что на самом деле нужно
    durationMin: 13
    keyPoints:
      - Интервью, наблюдение, воркшопы
      - Проблема важнее решения, которое предлагает заказчик
      - Нефункциональные требования
      - Фиксация и согласование
    aiAngle: подготовка вопросов к интервью и разбор записи с ИИ (обезличенно)
    practice: Подготовить план интервью с заказчиком
  - slug: user-stories
    title: User stories и критерии приёмки
    focus: формат, который понимают и заказчик, и команда
    durationMin: 13
    keyPoints:
      - Формат «Как …, я хочу …, чтобы …»
      - Критерии INVEST
      - Критерии приёмки в формате «Дано — Когда — Тогда»
      - Истории — повод для разговора, а не контракт
    practice: Написать 5 историй с критериями приёмки
  - slug: prioritizaciya
    title: Приоритизация
    focus: MoSCoW, RICE и WSJF на практике
    durationMin: 14
    keyPoints:
      - MoSCoW для быстрых договорённостей
      - "RICE: охват, влияние, уверенность, затраты"
      - "WSJF: стоимость задержки к длительности"
      - Метод — повод для разговора, а не калькулятор истины
    aiAngle: ИИ считает RICE по вашим оценкам — оценки дают люди
    practice: Приоритизировать бэклог из 12 задач двумя методами
  - slug: upravlenie-izmeneniyami
    title: Управление изменениями скоупа
    focus: как не утонуть в новых хотелках
    durationMin: 12
    keyPoints:
      - Запрос на изменение и его путь
      - Оценка влияния на сроки, бюджет, качество, риски
      - Варианты вместо «да» или «нет»
      - Кто принимает решение
    practice: Разобрать запрос на изменение с помощью промпта «scope-change»
  - slug: ii-i-trebovaniya
    title: ИИ в работе с требованиями
    focus: поиск противоречий и пробелов
    durationMin: 13
    keyPoints:
      - Извлечение требований из протоколов
      - Поиск противоречий и неоднозначностей
      - Генерация критериев приёмки
      - "Риски: выдуманные требования и потеря контекста"
    practice: Прогнать протокол через цепочку «извлечь — проверить — найти противоречия»
assignment:
  title: Бэклог с приоритизацией
  deliverable: Бэклог из 15–20 историй с критериями приёмки и приоритетами
  brief:
    Истории по формату, критерии приёмки, приоритизация RICE или WSJF с обоснованием, пример обработки
    запроса на изменение.
quizFocus:
  - методы выявления требований
  - INVEST и критерии приёмки
  - RICE и WSJF
  - управление изменениями
