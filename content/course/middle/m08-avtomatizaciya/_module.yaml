lessonsPlan:
- slug: chto-avtomatizirovat
  title: Что автоматизировать
  focus: карта рутины и окупаемость
  durationMin: 11
  keyPoints:
  - Инвентаризация повторяющихся задач
  - Частота × время × ошибки
  - Что автоматизировать нельзя
  - Стоимость поддержки автоматизации
  practice: Составить карту рутины и выбрать 2 кандидата
- slug: no-code-instrumenty
  title: No-code автоматизации
  focus: n8n, Albato, встроенные автоматизации и боты
  durationMin: 14
  keyPoints:
  - Триггер — действие — условие
  - n8n на своём сервере и облачные сервисы
  - Встроенные автоматизации трекеров
  - Telegram-боты для команды
  practice: Спроектировать сценарий напоминаний о просроченных задачах
- slug: ii-agenty
  title: ИИ-агенты
  focus: что это, когда применять и как контролировать
  durationMin: 13
  keyPoints:
  - Агент = модель + инструменты + цель
  - Границы автономии
  - Человек в контуре для значимых действий
  - Логи и возможность отката
  practice: Описать границы автономии агента для сбора статусов
- slug: bezopasnost-avtomatizaciy
  title: Надёжность и безопасность автоматизаций
  focus: доступы, данные и отказы
  durationMin: 12
  keyPoints:
  - Минимальные права доступа
  - Где проходят данные
  - Мониторинг и уведомления об ошибках
  - Владелец автоматизации
  practice: Проверить сценарий по чек-листу безопасности
assignment:
  title: Схема автоматизированного воркфлоу
  deliverable: Схема и описание сценария
  brief: Триггеры, шаги, участие ИИ и человека, данные и доступы, обработка ошибок, ожидаемая экономия
    времени.
quizFocus:
