id: m08-quiz
kind: module
title: "Тест модуля: Автоматизация"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: best-candidate
    type: single
    prompt: Какая задача — лучший кандидат для автоматизации?
    options:
      - id: a
        text: Ежегодный отчёт для аудита с новыми требованиями каждый год
      - id: b
        text: Еженедельное напоминание подрядчику прислать статус со сбором ответа в таблицу
      - id: c
        text: Разговор с сотрудником о качестве работы
    correct: b
    explanation: Частая, одинаковая, предсказуемая задача с высокой ценой ошибки — идеальный кандидат.
    lessonId: m08-01
  - id: automation-cost
    type: multiple
    prompt: Что входит в стоимость автоматизации помимо настройки? Выберите все подходящие.
    options:
      - id: a
        text: Исправление поломок при изменении систем
      - id: b
        text: Разбор ошибок сценария
      - id: c
        text: Документация и владелец
      - id: d
        text: Ничего, настроил один раз — и всё
    correct:
      - a
      - b
      - c
    explanation: Автоматизации требуют поддержки; её стоимость учитывают при оценке окупаемости.
    lessonId: m08-01
  - id: process-first
    type: single
    prompt: Задачи в трекере без сроков и ответственных. Стоит ли настраивать напоминания о просрочках?
    options:
      - id: a
        text: Да, сразу
      - id: b
        text: Сначала договориться о процессе — иначе автоматизация даст автоматический хаос
      - id: c
        text: Да, но только для руководителей
    correct: b
    explanation: Автоматизация хаотичного процесса не работает.
    lessonId: m08-01
  - id: scenario-blocks
    type: order
    prompt: Расположите блоки no-code сценария в порядке срабатывания.
    items:
      - id: a
        text: Триггер
      - id: b
        text: Условие
      - id: c
        text: Действие
    explanation: Событие запускает сценарий, условие фильтрует случаи, действие выполняется.
    lessonId: m08-02
  - id: self-hosted
    type: single
    prompt: Когда стоит выбрать платформу автоматизации на своём сервере вместо облачного сервиса?
    options:
      - id: a
        text: Когда через сценарий проходят чувствительные данные, которые нельзя передавать во внешние сервисы
      - id: b
        text: Всегда
      - id: c
        text: Когда сценарий очень простой
    correct: a
    explanation: На своём сервере данные не покидают инфраструктуру компании, но нужна поддержка сервера.
    lessonId: m08-02
  - id: bot-notifications
    type: single
    scenario: Бот каждый час пишет в общий чат список просроченных задач с именами.
    prompt: Что улучшить в первую очередь?
    options:
      - id: a
        text: Добавить эмодзи
      - id: b
        text: Раз в день, каждому лично его задачи, а PM — общая сводка
      - id: c
        text: Писать каждые 15 минут
    correct: b
    explanation: Частые публичные уведомления — шум и давление.
    lessonId: m08-02
  - id: agent-vs-scenario
    type: single
    prompt: Когда лучше использовать обычный сценарий, а не ИИ-агента?
    options:
      - id: a
        text: Когда шаги известны заранее и описываются правилами «если — то»
      - id: b
        text: Когда нужно разобрать неструктурированные письма
      - id: c
        text: Никогда
    correct: a
    explanation: Сценарий надёжнее и дешевле, если порядок действий известен.
    lessonId: m08-03
  - id: agent-autonomy
    type: single
    prompt: Какое действие агента по сбору статусов можно оставить без подтверждения человека?
    options:
      - id: a
        text: Закрывать задачи, если подрядчик написал «готово»
      - id: b
        text: Записывать ответы во внутреннюю таблицу статусов
      - id: c
        text: Отправлять отчёт директору
    correct: b
    explanation: Запись во внутреннюю таблицу обратима и не уходит наружу.
    lessonId: m08-03
  - id: agent-account
    type: single
    prompt: Под какой учётной записью должен работать ИИ-агент?
    options:
      - id: a
        text: Под учётной записью PM
      - id: b
        text: Под отдельной учётной записью с минимальными правами
      - id: c
        text: Под учётной записью администратора, чтобы хватило прав
    correct: b
    explanation: Отдельная учётная запись ограничивает права и делает действия агента видимыми в логах.
    lessonId: m08-03
  - id: silent-failure
    type: single
    prompt: Как защититься от того, что сценарий начнёт тихо отправлять пустые отчёты?
    options:
      - id: a
        text: Проверять содержимое перед отправкой и уведомлять владельца при аномалиях
      - id: b
        text: Проверять только факт запуска
      - id: c
        text: Надеяться, что адресат заметит
    correct: a
    explanation: Сценарий может запускаться успешно и выдавать неверный результат.
    lessonId: m08-04
  - id: personal-token
    type: single
    prompt: Чем опасен сценарий, работающий на личном токене сотрудника?
    options:
      - id: a
        text: Сломается при смене пароля или увольнении, а действия будут выглядеть как действия человека
      - id: b
        text: Ничем
      - id: c
        text: Работает медленнее
    correct: a
    explanation: Для автоматизаций нужны служебные учётные записи.
    lessonId: m08-04
  - id: closure-automation
    type: single
    prompt: Что делать с автоматизациями при закрытии проекта?
    options:
      - id: a
        text: Оставить — вдруг пригодятся
      - id: b
        text: Отключить и отозвать доступы — это пункт чек-листа закрытия
      - id: c
        text: Передать заказчику без описания
    correct: b
    explanation: Забытые автоматизации держат доступы и передают данные годами.
    lessonId: m08-04
  - id: inventory
    type: single
    prompt: С чего начать автоматизацию рутины?
    options:
      - id: a
        text: С выбора платформы
      - id: b
        text: С инвентаризации повторяющихся задач
      - id: c
        text: С найма разработчика
      - id: d
        text: С ИИ-агента
    correct: b
    explanation: Сначала понять, что автоматизировать.
    lessonId: m08-01
  - id: rare-task
    type: single
    prompt: Почему не стоит автоматизировать задачу, которая бывает раз в год?
    options:
      - id: a
        text: Она неважна
      - id: b
        text: Настройка и поддержка займут больше, чем сэкономят
      - id: c
        text: Это запрещено
      - id: d
        text: Её нельзя описать
    correct: b
    explanation: Автоматизация должна окупаться.
    lessonId: m08-01
  - id: mass-send
    type: single
    prompt: Почему осторожно с автоматической массовой рассылкой всем дилерам?
    options:
      - id: a
        text: Это дорого
      - id: b
        text: Ошибка автоматизации ударит по всем адресатам сразу
      - id: c
        text: Дилеры не читают
      - id: d
        text: Это медленно
    correct: b
    explanation: Цена ошибки выше, чем при ручной работе.
    lessonId: m08-01
  - id: builtin-first
    type: single
    prompt: С каких автоматизаций начинать?
    options:
      - id: a
        text: С собственного сервера
      - id: b
        text: Со встроенных автоматизаций трекера
      - id: c
        text: С ИИ-агента
      - id: d
        text: С покупки платформы
    correct: b
    explanation: Данные не уходят наружу, не нужны отдельные доступы.
    lessonId: m08-02
  - id: condition-block
    type: single
    prompt: Что делает блок «условие» в сценарии?
    options:
      - id: a
        text: Запускает сценарий
      - id: b
        text: Фильтрует случаи, для которых выполняются действия
      - id: c
        text: Отправляет сообщение
      - id: d
        text: Удаляет задачи
    correct: b
    explanation: Например, только задачи с прошедшим сроком.
    lessonId: m08-02
  - id: bot-buttons
    type: single
    prompt: Почему в боте для сбора статусов удобны кнопки?
    options:
      - id: a
        text: Они красивые
      - id: b
        text: Стандартный ответ одним нажатием, легко собрать в таблицу
      - id: c
        text: Они бесплатные
      - id: d
        text: Так требует мессенджер
    correct: b
    explanation: Кнопки упрощают ответ и обработку.
    lessonId: m08-02
  - id: ai-last-step
    type: single
    prompt: "Сценарий: собрал статусы → модель написала отчёт → отправил директору. Что изменить?"
    options:
      - id: a
        text: Ничего
      - id: b
        text: "Сделать последний шаг ручным: PM проверяет черновик и отправляет сам"
      - id: c
        text: Убрать модель
      - id: d
        text: Отправлять чаще
    correct: b
    explanation: Внешние отправки с участием ИИ проходят через человека.
    lessonId: m08-02
  - id: n8n-self
    type: single
    prompt: Что даёт размещение платформы автоматизации на своём сервере?
    options:
      - id: a
        text: Данные не покидают инфраструктуру компании, но нужна поддержка сервера
      - id: b
        text: Бесплатность без усилий
      - id: c
        text: Отсутствие ошибок
      - id: d
        text: Ничего
    correct: a
    explanation: Выбор зависит от данных и ресурсов на поддержку.
    lessonId: m08-02
  - id: agent-when
    type: single
    prompt: Когда агент уместнее сценария?
    options:
      - id: a
        text: Когда порядок действий заранее неизвестен и нужно работать с неструктурированными письмами
      - id: b
        text: Когда шаги известны
      - id: c
        text: Для простых напоминаний
      - id: d
        text: Никогда
    correct: a
    explanation: Для известных шагов сценарий надёжнее.
    lessonId: m08-03
  - id: agent-never
    type: single
    prompt: Какое действие агенту по сбору статусов лучше не давать вовсе?
    options:
      - id: a
        text: Чтение задач
      - id: b
        text: Удаление данных и изменение бюджета
      - id: c
        text: Запись во внутреннюю таблицу
      - id: d
        text: Подготовка черновика
    correct: b
    explanation: Такие права ограничивают на уровне систем.
    lessonId: m08-03
  - id: agent-confirm-meaning
    type: single
    prompt: Когда подтверждение действий агента человеком теряет смысл?
    options:
      - id: a
        text: Когда человек подтверждает не глядя
      - id: b
        text: Когда агент быстрый
      - id: c
        text: Когда логов много
      - id: d
        text: Никогда
    correct: a
    explanation: Подтверждение должно быть осмысленным.
    lessonId: m08-03
  - id: agent-logs-weeks
    type: single
    prompt: Что делать с логами агента в первые недели?
    options:
      - id: a
        text: Не смотреть
      - id: b
        text: Регулярно просматривать, чтобы увидеть ошибки и уточнить границы
      - id: c
        text: Удалять
      - id: d
        text: Отправлять заказчику
    correct: b
    explanation: Так агент становится предсказуемым.
    lessonId: m08-03
  - id: agent-rights-system
    type: single
    prompt: Почему права агента ограничивают на уровне систем, а не только инструкциями?
    options:
      - id: a
        text: Инструкции модель может неправильно понять
      - id: b
        text: Так дешевле
      - id: c
        text: Системы быстрее
      - id: d
        text: Инструкции запрещены
    correct: a
    explanation: Нет права — нет риска.
    lessonId: m08-03
  - id: secrets
    type: single
    prompt: Где хранить ключи API и токены автоматизации?
    options:
      - id: a
        text: В тексте сценария
      - id: b
        text: В хранилище секретов инструмента
      - id: c
        text: В таблице
      - id: d
        text: В чате
    correct: b
    explanation: Секреты вне сценариев и документов.
    lessonId: m08-04
  - id: data-path
    type: single
    prompt: Что нужно описать для каждого шага сценария?
    options:
      - id: a
        text: Цвет блока
      - id: b
        text: Какие данные проходят, где находится сервис, разрешено ли это политикой
      - id: c
        text: Время запуска
      - id: d
        text: Имя автора
    correct: b
    explanation: Путь данных — основа безопасности.
    lessonId: m08-04
  - id: monthly-journal
    type: single
    prompt: Что делает владелец автоматизации раз в месяц?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Смотрит журнал запусков и проверяет результат
      - id: c
        text: Меняет пароль
      - id: d
        text: Удаляет сценарий
    correct: b
    explanation: Регулярная проверка ловит тихие поломки.
    lessonId: m08-04
  - id: automation-registry
    type: single
    prompt: Зачем реестр автоматизаций проекта?
    options:
      - id: a
        text: Для отчёта
      - id: b
        text: Знать, что работает, кто владелец и когда отключить
      - id: c
        text: Для рекламы
      - id: d
        text: Не нужен
    correct: b
    explanation: Иначе автоматизации переживают свои проекты.
    lessonId: m08-04
  - id: deputy
    type: single
    prompt: Зачем у автоматизации замещающий владелец?
    options:
      - id: a
        text: Чтобы кто-то разобрался с поломкой, когда владелец в отпуске
      - id: b
        text: Для красоты
      - id: c
        text: Так требует закон
      - id: d
        text: Не нужен
    correct: a
    explanation: Автоматизации ломаются в неудобный момент.
    lessonId: m08-04
