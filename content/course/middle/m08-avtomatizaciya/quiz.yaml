id: m08-quiz
kind: module
title: "Тест модуля: Автоматизация"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: best-candidate
    type: single
    prompt: "Какая задача — лучший кандидат для автоматизации?"
    options:
      - { id: a, text: "Ежегодный отчёт для аудита с новыми требованиями каждый год" }
      - { id: b, text: "Еженедельное напоминание подрядчику прислать статус со сбором ответа в таблицу" }
      - { id: c, text: "Разговор с сотрудником о качестве работы" }
    correct: b
    explanation: "Частая, одинаковая, предсказуемая задача с высокой ценой ошибки — идеальный кандидат."
    lessonId: m08-01
  - id: automation-cost
    type: multiple
    prompt: "Что входит в стоимость автоматизации помимо настройки? Выберите все подходящие."
    options:
      - { id: a, text: "Исправление поломок при изменении систем" }
      - { id: b, text: "Разбор ошибок сценария" }
      - { id: c, text: "Документация и владелец" }
      - { id: d, text: "Ничего, настроил один раз — и всё" }
    correct: [a, b, c]
    explanation: "Автоматизации требуют поддержки; её стоимость учитывают при оценке окупаемости."
    lessonId: m08-01
  - id: process-first
    type: single
    prompt: "Задачи в трекере без сроков и ответственных. Стоит ли настраивать напоминания о просрочках?"
    options:
      - { id: a, text: "Да, сразу" }
      - { id: b, text: "Сначала договориться о процессе — иначе автоматизация даст автоматический хаос" }
      - { id: c, text: "Да, но только для руководителей" }
    correct: b
    explanation: "Автоматизация хаотичного процесса не работает."
    lessonId: m08-01
  - id: scenario-blocks
    type: order
    prompt: "Расположите блоки no-code сценария в порядке срабатывания."
    items:
      - { id: a, text: "Триггер" }
      - { id: b, text: "Условие" }
      - { id: c, text: "Действие" }
    explanation: "Событие запускает сценарий, условие фильтрует случаи, действие выполняется."
    lessonId: m08-02
  - id: self-hosted
    type: single
    prompt: "Когда стоит выбрать платформу автоматизации на своём сервере вместо облачного сервиса?"
    options:
      - { id: a, text: "Когда через сценарий проходят чувствительные данные, которые нельзя передавать во внешние сервисы" }
      - { id: b, text: "Всегда" }
      - { id: c, text: "Когда сценарий очень простой" }
    correct: a
    explanation: "На своём сервере данные не покидают инфраструктуру компании, но нужна поддержка сервера."
    lessonId: m08-02
  - id: bot-notifications
    type: single
    scenario: "Бот каждый час пишет в общий чат список просроченных задач с именами."
    prompt: "Что улучшить в первую очередь?"
    options:
      - { id: a, text: "Добавить эмодзи" }
      - { id: b, text: "Раз в день, каждому лично его задачи, а PM — общая сводка" }
      - { id: c, text: "Писать каждые 15 минут" }
    correct: b
    explanation: "Частые публичные уведомления — шум и давление."
    lessonId: m08-02
  - id: agent-vs-scenario
    type: single
    prompt: "Когда лучше использовать обычный сценарий, а не ИИ-агента?"
    options:
      - { id: a, text: "Когда шаги известны заранее и описываются правилами «если — то»" }
      - { id: b, text: "Когда нужно разобрать неструктурированные письма" }
      - { id: c, text: "Никогда" }
    correct: a
    explanation: "Сценарий надёжнее и дешевле, если порядок действий известен."
    lessonId: m08-03
  - id: agent-autonomy
    type: single
    prompt: "Какое действие агента по сбору статусов можно оставить без подтверждения человека?"
    options:
      - { id: a, text: "Закрывать задачи, если подрядчик написал «готово»" }
      - { id: b, text: "Записывать ответы во внутреннюю таблицу статусов" }
      - { id: c, text: "Отправлять отчёт директору" }
    correct: b
    explanation: "Запись во внутреннюю таблицу обратима и не уходит наружу."
    lessonId: m08-03
  - id: agent-account
    type: single
    prompt: "Под какой учётной записью должен работать ИИ-агент?"
    options:
      - { id: a, text: "Под учётной записью PM" }
      - { id: b, text: "Под отдельной учётной записью с минимальными правами" }
      - { id: c, text: "Под учётной записью администратора, чтобы хватило прав" }
    correct: b
    explanation: "Отдельная учётная запись ограничивает права и делает действия агента видимыми в логах."
    lessonId: m08-03
  - id: silent-failure
    type: single
    prompt: "Как защититься от того, что сценарий начнёт тихо отправлять пустые отчёты?"
    options:
      - { id: a, text: "Проверять содержимое перед отправкой и уведомлять владельца при аномалиях" }
      - { id: b, text: "Проверять только факт запуска" }
      - { id: c, text: "Надеяться, что адресат заметит" }
    correct: a
    explanation: "Сценарий может запускаться успешно и выдавать неверный результат."
    lessonId: m08-04
  - id: personal-token
    type: single
    prompt: "Чем опасен сценарий, работающий на личном токене сотрудника?"
    options:
      - { id: a, text: "Сломается при смене пароля или увольнении, а действия будут выглядеть как действия человека" }
      - { id: b, text: "Ничем" }
      - { id: c, text: "Работает медленнее" }
    correct: a
    explanation: "Для автоматизаций нужны служебные учётные записи."
    lessonId: m08-04
  - id: closure-automation
    type: single
    prompt: "Что делать с автоматизациями при закрытии проекта?"
    options:
      - { id: a, text: "Оставить — вдруг пригодятся" }
      - { id: b, text: "Отключить и отозвать доступы — это пункт чек-листа закрытия" }
      - { id: c, text: "Передать заказчику без описания" }
    correct: b
    explanation: "Забытые автоматизации держат доступы и передают данные годами."
    lessonId: m08-04
