id: m01
slug: scrum-i-kanban
order: 1
title: Scrum и Kanban в глубину
summary: Роли, события и артефакты, WIP-лимиты и поток. Антипаттерны и как их лечить.
goals:
- Настраивать Scrum и Kanban под контекст
- Видеть и лечить антипаттерны
- Использовать ИИ в груминге бэклога
status: published
artifact: Разбор процесса своей команды
keyConcepts:
- Scrum
- Kanban
- WIP-лимит
- спринт
- поток
- антипаттерны
searchQueries:
- wip лимит что это
- антипаттерны scrum
- scrum и kanban отличия
lessonsPlan:
- slug: kanban-wip-limity
  title: 'Kanban: поток и WIP-лимиты'
  focus: почему меньше параллельной работы — быстрее поставка
  durationMin: 16
  keyPoints:
  - Закон Литтла
  - Скрытые очереди и переключения
  - Внедрение WIP-лимитов шаг за шагом
  - Упор в лимит — сигнал, а не повод поднять лимит
  practice: Рассчитать время прохождения до и после снижения WIP
- slug: scrum-bez-teatra
  title: Scrum без театра
  focus: события, которые приносят пользу, а не отнимают время
  durationMin: 14
  keyPoints:
  - Цель спринта как центр планирования
  - Дейли для синхронизации, а не отчёта
  - Обзор с реальными пользователями
  - Ретро, после которой что-то меняется
  - Признаки «карго-скрама»
  practice: Оценить события своей команды по чек-листу пользы
- slug: beklog-i-gruming
  title: Бэклог и груминг
  focus: как держать бэклог в рабочем состоянии
  durationMin: 13
  keyPoints:
  - Уточнение бэклога как регулярная работа
  - Критерии готовности задачи к работе и к сдаче
  - Размер задач и нарезка
  - 'Старые задачи: удалять не страшно'
  aiAngle: ИИ ищет в бэклоге дубли, неполные описания и задачи без критериев приёмки
  practice: Почистить учебный бэклог из 30 задач
- slug: kanban-politiki
  title: 'Kanban-система: политики и классы обслуживания'
  focus: явные правила потока
  durationMin: 13
  keyPoints:
  - Явные политики на доске
  - 'Классы обслуживания: срочное, фиксированная дата, стандартное'
  - Блокеры и их учёт
  - Возраст задач в работе как ранний сигнал
  practice: Описать политики для своей доски
- slug: antipatterny-processa
  title: Антипаттерны процесса
  focus: как диагностировать процесс и что с этим делать
  durationMin: 14
  keyPoints:
  - Вечные спринты с переносами
  - Всё срочное
  - Доска не отражает реальность
  - Метрики ради отчёта
  - Как предлагать изменения команде
  aiAngle: ИИ помогает сформулировать гипотезы по описанию симптомов
  practice: Найти три антипаттерна в описании процесса учебной команды
assignment:
  title: Разбор процесса своей команды
  deliverable: 'Документ: текущий процесс, проблемы, три изменения с метриками'
  brief: Описать процесс команды, найти антипаттерны, предложить три изменения и как измерить их эффект.
quizFocus:
- закон Литтла и WIP
- цели событий Scrum
- критерии готовности
- классы обслуживания
- антипаттерны
