id: m01-quiz
kind: module
title: "Тест модуля: Scrum и Kanban в глубину"
passScore: 0.7
questionsPerAttempt: 4
questions:
  - id: wip-definition
    type: single
    prompt: Что такое WIP-лимит?
    options:
      - { id: a, text: "Максимальное число задач в спринте" }
      - {
          id: b,
          text: "Ограничение на число задач, одновременно находящихся в работе на этапе процесса",
        }
      - { id: c, text: "Минимальная загрузка каждого участника команды" }
    correct: b
    explanation: WIP-лимит ограничивает незавершённую работу на этапе, чтобы команда заканчивала начатое, а не начинала новое.
    lessonId: m01-01
  - id: little-law
    type: single
    scenario: Команда завершает 10 задач в неделю, в работе одновременно 40 задач.
    prompt: Каково среднее время прохождения задачи по закону Литтла?
    options:
      - { id: a, text: "4 недели" }
      - { id: b, text: "0,25 недели" }
      - { id: c, text: "10 недель" }
    correct: a
    explanation: Время прохождения = незавершённая работа ÷ пропускная способность = 40 ÷ 10 = 4 недели.
    lessonId: m01-01
  - id: little-law-effect
    type: single
    prompt: Что произойдёт со временем прохождения, если сократить незавершённую работу вдвое при той же пропускной способности?
    options:
      - { id: a, text: "Сократится примерно вдвое" }
      - { id: b, text: "Вырастет вдвое" }
      - { id: c, text: "Не изменится" }
    correct: a
    explanation: По закону Литтла время прохождения прямо пропорционально объёму незавершённой работы.
    lessonId: m01-01
  - id: wip-limit-hit
    type: single
    scenario: Колонка «Ревью» упёрлась в WIP-лимит, разработчик закончил свою задачу.
    prompt: Что ему стоит сделать по правилам Kanban?
    options:
      - { id: a, text: "Взять новую задачу из бэклога" }
      - { id: b, text: "Помочь с ревью, чтобы освободить колонку" }
      - { id: c, text: "Попросить поднять лимит" }
    correct: b
    explanation: Упор в лимит — сигнал помочь довести начатое. Поднимать лимит при первом упоре — значит прятать проблему процесса.
    lessonId: m01-01
  - id: wip-causes
    type: multiple
    prompt: Почему большой объём параллельной работы замедляет поставку? Выберите все подходящие.
    options:
      - { id: a, text: "Потери на переключение контекста" }
      - { id: b, text: "Задачи копятся в скрытых очередях ожидания" }
      - { id: c, text: "Команда начинает работать быстрее" }
      - { id: d, text: "Проблемы процесса становятся менее заметными" }
    correct: [a, b, d]
    explanation: Переключения, скрытые очереди и невидимые проблемы — три главные причины. Скорость работы людей при этом не растёт.
    lessonId: m01-01
  - id: wip-rollout
    type: order
    prompt: Расставьте шаги введения WIP-лимитов по порядку.
    items:
      - { id: measure, text: "Измерить текущую незавершённую работу и пропускную способность" }
      - { id: set, text: "Поставить лимит немного ниже текущего уровня" }
      - { id: agree, text: "Договориться о правиле не брать новое при заполненной колонке" }
      - { id: review, text: "Пересмотреть лимиты по метрикам через несколько недель" }
    explanation: Сначала измеряем, затем мягко ограничиваем, договариваемся о правилах и корректируем по данным.
    lessonId: m01-01
