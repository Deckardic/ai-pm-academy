id: m01-quiz
kind: module
title: "Тест модуля: Scrum и Kanban в глубину"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: wip-definition
    type: single
    prompt: Что такое WIP-лимит?
    options:
      - id: a
        text: Максимальное число задач в спринте
      - id: b
        text: Ограничение на число задач, одновременно находящихся в работе на этапе процесса
      - id: c
        text: Минимальная загрузка каждого участника команды
    correct: b
    explanation:
      WIP-лимит ограничивает незавершённую работу на этапе, чтобы команда заканчивала начатое,
      а не начинала новое.
    lessonId: m01-01
  - id: little-law
    type: single
    scenario: Команда завершает 10 задач в неделю, в работе одновременно 40 задач.
    prompt: Каково среднее время прохождения задачи по закону Литтла?
    options:
      - id: a
        text: 4 недели
      - id: b
        text: 0,25 недели
      - id: c
        text: 10 недель
    correct: a
    explanation: Время прохождения = незавершённая работа ÷ пропускная способность = 40 ÷ 10 = 4 недели.
    lessonId: m01-01
  - id: little-law-effect
    type: single
    prompt:
      Что произойдёт со временем прохождения, если сократить незавершённую работу вдвое при той же
      пропускной способности?
    options:
      - id: a
        text: Сократится примерно вдвое
      - id: b
        text: Вырастет вдвое
      - id: c
        text: Не изменится
    correct: a
    explanation: По закону Литтла время прохождения прямо пропорционально объёму незавершённой работы.
    lessonId: m01-01
  - id: wip-limit-hit
    type: single
    scenario: Колонка «Ревью» упёрлась в WIP-лимит, разработчик закончил свою задачу.
    prompt: Что ему стоит сделать по правилам Kanban?
    options:
      - id: a
        text: Взять новую задачу из бэклога
      - id: b
        text: Помочь с ревью, чтобы освободить колонку
      - id: c
        text: Попросить поднять лимит
    correct: b
    explanation:
      Упор в лимит — сигнал помочь довести начатое. Поднимать лимит при первом упоре — значит
      прятать проблему процесса.
    lessonId: m01-01
  - id: wip-causes
    type: multiple
    prompt: Почему большой объём параллельной работы замедляет поставку? Выберите все подходящие.
    options:
      - id: a
        text: Потери на переключение контекста
      - id: b
        text: Задачи копятся в скрытых очередях ожидания
      - id: c
        text: Команда начинает работать быстрее
      - id: d
        text: Проблемы процесса становятся менее заметными
    correct:
      - a
      - b
      - d
    explanation:
      Переключения, скрытые очереди и невидимые проблемы — три главные причины. Скорость работы
      людей при этом не растёт.
    lessonId: m01-01
  - id: wip-rollout
    type: order
    prompt: Расставьте шаги введения WIP-лимитов по порядку.
    items:
      - id: measure
        text: Измерить текущую незавершённую работу и пропускную способность
      - id: set
        text: Поставить лимит немного ниже текущего уровня
      - id: agree
        text: Договориться о правиле не брать новое при заполненной колонке
      - id: review
        text: Пересмотреть лимиты по метрикам через несколько недель
    explanation:
      Сначала измеряем, затем мягко ограничиваем, договариваемся о правилах и корректируем по
      данным.
    lessonId: m01-01
  - id: sprint-goal
    type: single
    prompt: Какая формулировка — цель спринта?
    options:
      - id: a
        text: Сделать задачи PORT-112, PORT-118 и PORT-121
      - id: b
        text: Дилеры могут повторить прошлый заказ в один клик
      - id: c
        text: Закрыть как можно больше задач
    correct: b
    explanation: Цель спринта описывает ценность, ради которой нужен спринт. Задачи — способ её достичь.
    lessonId: m01-02
  - id: daily-report
    type: single
    scenario: На дейли каждый по очереди отчитывается PM, что делал вчера. Встреча идёт 35 минут.
    prompt: Что поможет вернуть пользу встрече?
    options:
      - id: a
        text: Проводить дейли раз в неделю
      - id: b
        text:
          Идти по доске от задач, ближайших к «Готово», говорить о движении к цели; ведёт команда, детали
          — после
      - id: c
        text: Попросить всех присылать письменный отчёт вместо встречи
    correct: b
    explanation: Дейли — синхронизация команды вокруг цели спринта, а не отчёт менеджеру.
    lessonId: m01-02
  - id: cargo-scrum
    type: multiple
    prompt: Какие признаки говорят о карго-скраме? Выберите все подходящие.
    options:
      - id: a
        text: У спринта нет цели, только список задач
      - id: b
        text: Ретро не приводит к изменениям
      - id: c
        text: На обзоре нет пользователей и бэклог не меняется
      - id: d
        text: Команда корректирует план спринта по итогам дейли
    correct:
      - a
      - b
      - c
    explanation:
      Карго-скрам — форма без инспекции и адаптации. Корректировка плана на дейли — как раз признак
      работающего Scrum.
    lessonId: m01-02
  - id: dod
    type: single
    prompt: Зачем команде Definition of Done?
    options:
      - id: a
        text: Чтобы «готово» означало одно и то же для всех
      - id: b
        text: Чтобы оценивать задачи в часах
      - id: c
        text: Чтобы отчитываться перед руководством
    correct: a
    explanation: Без общего критерия готовности незавершённая работа накапливается под видом готовой.
    lessonId: m01-03
  - id: vertical-slicing
    type: single
    prompt: Какая нарезка задачи «Повтор заказа» вертикальная?
    options:
      - id: a
        text: База данных → API → интерфейс
      - id: b
        text: Повтор всего заказа → повтор с изменением количества → повтор с другим складом
      - id: c
        text: Анализ → разработка → тестирование
    correct: b
    explanation:
      Вертикальная нарезка даёт пользу на каждом шаге. Горизонтальная — только когда готовы все
      слои.
    lessonId: m01-03
  - id: old-backlog
    type: single
    prompt: Что делать с задачами, которые лежат в бэклоге больше полугода и ни разу не поднимались?
    options:
      - id: a
        text: Хранить вечно — вдруг пригодятся
      - id: b
        text: "Удалять или переносить в архив: важное вернётся с актуальным контекстом"
      - id: c
        text: Повысить им приоритет
    correct: b
    explanation: Бэклог из сотен задач — это шум, а не запас ценности.
    lessonId: m01-03
  - id: class-of-service
    type: single
    scenario: Портал с утра не принимает заказы от дилеров.
    prompt: К какому классу обслуживания отнести запрос?
    options:
      - id: a
        text: Стандартный
      - id: b
        text: Срочный
      - id: c
        text: Нематериальный
    correct: b
    explanation: Стоимость задержки высокая прямо сейчас — задачу берут сразу, даже при заполненном WIP-лимите.
    lessonId: m01-04
  - id: limit-urgent
    type: single
    prompt: Почему срочный класс обслуживания нужно ограничивать?
    options:
      - id: a
        text: Иначе срочным становится всё, и класс теряет смысл
      - id: b
        text: Срочные задачи всегда неважные
      - id: c
        text: Так требует Kanban-доска
    correct: a
    explanation: Без критериев и лимита любая задача объявляется срочной, а реально срочные тонут.
    lessonId: m01-04
  - id: work-item-age
    type: single
    prompt: Для чего следить за возрастом задачи в работе?
    options:
      - id: a
        text: Чтобы рано заметить застрявшую задачу, пока её ещё можно спасти
      - id: b
        text: Чтобы наказывать медленных исполнителей
      - id: c
        text: Чтобы считать зарплату
    correct: a
    explanation: Время прохождения известно только после завершения, а возраст — ранний сигнал прямо сейчас.
    lessonId: m01-04
  - id: velocity-compare
    type: single
    prompt: Можно ли сравнивать команды по velocity?
    options:
      - id: a
        text: Да, это объективная метрика
      - id: b
        text: "Нет: у каждой команды своя шкала оценок, сравнение приведёт к инфляции оценок"
      - id: c
        text: Да, если команды одного размера
    correct: b
    explanation: Story points — относительная шкала конкретной команды.
    lessonId: m01-05
  - id: change-as-experiment
    type: single
    prompt: Как лучше предложить команде изменение процесса?
    options:
      - id: a
        text: Объявить новые правила с понедельника
      - id: b
        text: Показать данные, обсудить причины и предложить эксперимент с критерием успеха
      - id: c
        text: Попросить руководителя приказать
    correct: b
    explanation: Эксперимент с понятным критерием легче принять, и его можно откатить.
    lessonId: m01-05
  - id: everything-urgent
    type: single
    prompt: Какая частая причина того, что у команды «всё срочное»?
    options:
      - id: a
        text: Заказчики не видят очередь и сроки, поэтому повышают приоритет, чтобы их услышали
      - id: b
        text: Команда работает слишком быстро
      - id: c
        text: Слишком много WIP-лимитов
    correct: a
    explanation: Прозрачная очередь и прогноз сроков снижают давление лучше любых правил.
    lessonId: m01-05
  - id: little-calc
    type: single
    prompt:
      Команда завершает 10 задач в неделю, в работе 30 задач. Каково среднее время прохождения по
      закону Литтла?
    options:
      - id: a
        text: 1 неделя
      - id: b
        text: 3 недели
      - id: c
        text: 30 недель
      - id: d
        text: 10 недель
    correct: b
    explanation: 30 ÷ 10 = 3 недели.
    lessonId: m01-01
  - id: little-cut
    type: single
    prompt:
      Если сократить WIP с 30 до 15 при той же пропускной способности 10 задач в неделю, время прохождения
      станет…
    options:
      - id: a
        text: 6 недель
      - id: b
        text: 1,5 недели
      - id: c
        text: 3 недели
      - id: d
        text: Не изменится
    correct: b
    explanation: 15 ÷ 10 = 1,5 недели.
    lessonId: m01-01
  - id: context-switch
    type: single
    prompt: Почему много задач в работе замедляет поставку?
    options:
      - id: a
        text: Из-за переключения контекста, ожиданий и скрытых очередей
      - id: b
        text: Из-за нехватки задач
      - id: c
        text: Из-за хороших WIP-лимитов
      - id: d
        text: Это не замедляет
    correct: a
    explanation: Каждое переключение отнимает время на «вход».
    lessonId: m01-01
  - id: wip-signal
    type: single
    prompt: Колонка упёрлась в WIP-лимит. Что правильно?
    options:
      - id: a
        text: Поднять лимит
      - id: b
        text: Помочь завершить задачи в колонке или разобрать причину затора
      - id: c
        text: Взять новую задачу в обход
      - id: d
        text: Удалить лимит
    correct: b
    explanation: Упор в лимит — сигнал, а не повод его поднять.
    lessonId: m01-01
  - id: goal-flex
    type: single
    prompt: Задача спринта оказалась сложнее. Цель спринта сохраняется. Что может сделать команда?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Изменить состав работ, сохраняя цель, по договорённости с Product Owner
      - id: c
        text: Удлинить спринт
      - id: d
        text: Отменить спринт
    correct: b
    explanation: Цель даёт гибкость в составе задач.
    lessonId: m01-02
  - id: review-users
    type: single
    prompt: Кого особенно полезно звать на обзор спринта портала для дилеров?
    options:
      - id: a
        text: Только команду
      - id: b
        text: Одного-двух реальных пользователей, например менеджеров дилеров
      - id: c
        text: Никого
      - id: d
        text: Только юриста
    correct: b
    explanation: Обратная связь от пользователей — главная ценность обзора.
    lessonId: m01-02
  - id: retro-check
    type: single
    prompt: С чего полезно начинать ретроспективу?
    options:
      - id: a
        text: С поиска виноватых
      - id: b
        text: С проверки, выполнены ли действия прошлой ретро
      - id: c
        text: С отчёта о задачах
      - id: d
        text: С презентации
    correct: b
    explanation: Так ретро приводит к реальным изменениям.
    lessonId: m01-02
  - id: pm-near-scrum
    type: single
    prompt: Что НЕ стоит делать PM рядом со Scrum-командой?
    options:
      - id: a
        text: Снимать внешние блокеры
      - id: b
        text: Помогать Product Owner со стейкхолдерами
      - id: c
        text: Раздавать задачи на дейли
      - id: d
        text: Смотреть на метрики потока
    correct: c
    explanation: PM не вмешивается в самоорганизацию команды.
    lessonId: m01-02
  - id: pillars
    type: single
    prompt: На каких трёх опорах держится Scrum?
    options:
      - id: a
        text: Прозрачность, инспекция, адаптация
      - id: b
        text: План, контроль, отчёт
      - id: c
        text: Скорость, качество, цена
      - id: d
        text: Роли, встречи, документы
    correct: a
    explanation: Каждое событие — точка инспекции и адаптации.
    lessonId: m01-02
  - id: iceberg
    type: single
    prompt: Как устроен хороший бэклог?
    options:
      - id: a
        text: Все задачи одинаково детальны
      - id: b
        text: "Как айсберг: сверху маленькие детальные задачи, ниже — крупные и менее определённые"
      - id: c
        text: Только эпики
      - id: d
        text: Только мелкие задачи
    correct: b
    explanation: Детализировать всё заранее бессмысленно.
    lessonId: m01-03
  - id: dor-barrier
    type: single
    prompt: Чем опасен слишком строгий Definition of Ready?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Превращается в бюрократический барьер, задачи не берут в работу
      - id: c
        text: Ускоряет работу
      - id: d
        text: Отменяет Definition of Done
    correct: b
    explanation: DoR — договорённость, а не шлагбаум.
    lessonId: m01-03
  - id: horizontal-bad
    type: single
    prompt: Чем плоха нарезка «база данных → API → интерфейс»?
    options:
      - id: a
        text: Каждая часть бесполезна сама по себе, риски прячутся до конца
      - id: b
        text: Она слишком мелкая
      - id: c
        text: Она вертикальная
      - id: d
        text: Она лучше всех
    correct: a
    explanation: Ценность появляется, только когда готовы все слои.
    lessonId: m01-03
  - id: ai-dups
    type: single
    prompt: Модель объединила две задачи как дубли. Что проверить?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Что задачи одинаковы по сути, а не только по словам
      - id: c
        text: Длину заголовков
      - id: d
        text: Даты
    correct: b
    explanation: Похожие слова не значат одинаковый смысл.
    lessonId: m01-03
  - id: class-fixed-date
    type: single
    prompt: Изменение цен к началу сезона — какой это класс обслуживания?
    options:
      - id: a
        text: Срочный
      - id: b
        text: С фиксированной датой
      - id: c
        text: Нематериальный
      - id: d
        text: Стандартный
    correct: b
    explanation: Ценность резко падает после даты — планируют заранее с запасом.
    lessonId: m01-04
  - id: intangible
    type: single
    prompt: Зачем нематериальному классу (техдолг, улучшения) фиксированная доля ёмкости?
    options:
      - id: a
        text: Он всегда срочный
      - id: b
        text: Иначе он всегда проигрывает «важным» задачам, пока не станет поздно
      - id: c
        text: Для отчёта
      - id: d
        text: Он не нужен
    correct: b
    explanation: Это защищает долгосрочное здоровье системы.
    lessonId: m01-04
  - id: blocker-count
    type: single
    prompt: Зачем раз в месяц считать блокеры?
    options:
      - id: a
        text: Чтобы наказать
      - id: b
        text: Это данные для разговора с руководством и соседними командами
      - id: c
        text: Для красоты
      - id: d
        text: Не нужно
    correct: b
    explanation: Причины блокировок показывают системные проблемы.
    lessonId: m01-04
  - id: policies-owner
    type: single
    prompt: Кто формулирует политики Kanban-доски?
    options:
      - id: a
        text: Руководитель единолично
      - id: b
        text: Команда вместе с теми, кто приносит ей работу
      - id: c
        text: ИИ
      - id: d
        text: Никто
    correct: b
    explanation: Правило без понимания «зачем» не выполняется.
    lessonId: m01-04
  - id: observe-first
    type: single
    prompt: Новый PM в команде. С чего начать диагностику процесса?
    options:
      - id: a
        text: Сразу ввести десять улучшений
      - id: b
        text: Одна-две недели наблюдать и собирать данные
      - id: c
        text: Сменить трекер
      - id: d
        text: Отменить все встречи
    correct: b
    explanation: Сначала понять систему, потом менять.
    lessonId: m01-05
  - id: five-whys
    type: single
    prompt:
      Переносы задач → берём слишком много → планируем по желаемому → нет данных о факте. Что это
      за приём?
    options:
      - id: a
        text: Мозговой штурм
      - id: b
        text: Поиск причины повторяющимся вопросом «почему?»
      - id: c
        text: SWOT
      - id: d
        text: Покер планирования
    correct: b
    explanation: Так отделяют симптомы от причин.
    lessonId: m01-05
  - id: fake-board
    type: single
    prompt: "Признак доски, которая не отражает реальность:"
    options:
      - id: a
        text: WIP-лимиты соблюдаются
      - id: b
        text: Карточки не двигаются неделями, работу обсуждают в чатах, доску обновляют перед встречей
      - id: c
