id: m01-quiz
kind: module
title: "Тест модуля: Scrum и Kanban в глубину"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: wip-definition
    type: single
    prompt: "Что такое WIP-лимит?"
    options:
      - { id: a, text: "Максимальное число задач в спринте" }
      - {
          id: b,
          text: "Ограничение на число задач, одновременно находящихся в работе на этапе процесса",
        }
      - { id: c, text: "Минимальная загрузка каждого участника команды" }
    correct: b
    explanation: "WIP-лимит ограничивает незавершённую работу на этапе, чтобы команда заканчивала начатое, а не начинала новое."
    lessonId: m01-01
  - id: little-law
    type: single
    scenario: "Команда завершает 10 задач в неделю, в работе одновременно 40 задач."
    prompt: "Каково среднее время прохождения задачи по закону Литтла?"
    options:
      - { id: a, text: "4 недели" }
      - { id: b, text: "0,25 недели" }
      - { id: c, text: "10 недель" }
    correct: a
    explanation: "Время прохождения = незавершённая работа ÷ пропускная способность = 40 ÷ 10 = 4 недели."
    lessonId: m01-01
  - id: little-law-effect
    type: single
    prompt: "Что произойдёт со временем прохождения, если сократить незавершённую работу вдвое при той же пропускной способности?"
    options:
      - { id: a, text: "Сократится примерно вдвое" }
      - { id: b, text: "Вырастет вдвое" }
      - { id: c, text: "Не изменится" }
    correct: a
    explanation: "По закону Литтла время прохождения прямо пропорционально объёму незавершённой работы."
    lessonId: m01-01
  - id: wip-limit-hit
    type: single
    scenario: "Колонка «Ревью» упёрлась в WIP-лимит, разработчик закончил свою задачу."
    prompt: "Что ему стоит сделать по правилам Kanban?"
    options:
      - { id: a, text: "Взять новую задачу из бэклога" }
      - { id: b, text: "Помочь с ревью, чтобы освободить колонку" }
      - { id: c, text: "Попросить поднять лимит" }
    correct: b
    explanation: "Упор в лимит — сигнал помочь довести начатое. Поднимать лимит при первом упоре — значит прятать проблему процесса."
    lessonId: m01-01
  - id: wip-causes
    type: multiple
    prompt: "Почему большой объём параллельной работы замедляет поставку? Выберите все подходящие."
    options:
      - { id: a, text: "Потери на переключение контекста" }
      - { id: b, text: "Задачи копятся в скрытых очередях ожидания" }
      - { id: c, text: "Команда начинает работать быстрее" }
      - { id: d, text: "Проблемы процесса становятся менее заметными" }
    correct: [a, b, d]
    explanation: "Переключения, скрытые очереди и невидимые проблемы — три главные причины. Скорость работы людей при этом не растёт."
    lessonId: m01-01
  - id: wip-rollout
    type: order
    prompt: "Расставьте шаги введения WIP-лимитов по порядку."
    items:
      - { id: measure, text: "Измерить текущую незавершённую работу и пропускную способность" }
      - { id: set, text: "Поставить лимит немного ниже текущего уровня" }
      - { id: agree, text: "Договориться о правиле не брать новое при заполненной колонке" }
      - { id: review, text: "Пересмотреть лимиты по метрикам через несколько недель" }
    explanation: "Сначала измеряем, затем мягко ограничиваем, договариваемся о правилах и корректируем по данным."
    lessonId: m01-01
  - id: sprint-goal
    type: single
    prompt: "Какая формулировка — цель спринта?"
    options:
      - { id: a, text: "Сделать задачи PORT-112, PORT-118 и PORT-121" }
      - { id: b, text: "Дилеры могут повторить прошлый заказ в один клик" }
      - { id: c, text: "Закрыть как можно больше задач" }
    correct: b
    explanation: "Цель спринта описывает ценность, ради которой нужен спринт. Задачи — способ её достичь."
    lessonId: m01-02
  - id: daily-report
    type: single
    scenario: "На дейли каждый по очереди отчитывается PM, что делал вчера. Встреча идёт 35 минут."
    prompt: "Что поможет вернуть пользу встрече?"
    options:
      - { id: a, text: "Проводить дейли раз в неделю" }
      - {
          id: b,
          text: "Идти по доске от задач, ближайших к «Готово», говорить о движении к цели; ведёт команда, детали — после",
        }
      - { id: c, text: "Попросить всех присылать письменный отчёт вместо встречи" }
    correct: b
    explanation: "Дейли — синхронизация команды вокруг цели спринта, а не отчёт менеджеру."
    lessonId: m01-02
  - id: cargo-scrum
    type: multiple
    prompt: "Какие признаки говорят о карго-скраме? Выберите все подходящие."
    options:
      - { id: a, text: "У спринта нет цели, только список задач" }
      - { id: b, text: "Ретро не приводит к изменениям" }
      - { id: c, text: "На обзоре нет пользователей и бэклог не меняется" }
      - { id: d, text: "Команда корректирует план спринта по итогам дейли" }
    correct: [a, b, c]
    explanation: "Карго-скрам — форма без инспекции и адаптации. Корректировка плана на дейли — как раз признак работающего Scrum."
    lessonId: m01-02
  - id: dod
    type: single
    prompt: "Зачем команде Definition of Done?"
    options:
      - { id: a, text: "Чтобы «готово» означало одно и то же для всех" }
      - { id: b, text: "Чтобы оценивать задачи в часах" }
      - { id: c, text: "Чтобы отчитываться перед руководством" }
    correct: a
    explanation: "Без общего критерия готовности незавершённая работа накапливается под видом готовой."
    lessonId: m01-03
  - id: vertical-slicing
    type: single
    prompt: "Какая нарезка задачи «Повтор заказа» вертикальная?"
    options:
      - { id: a, text: "База данных → API → интерфейс" }
      - {
          id: b,
          text: "Повтор всего заказа → повтор с изменением количества → повтор с другим складом",
        }
      - { id: c, text: "Анализ → разработка → тестирование" }
    correct: b
    explanation: "Вертикальная нарезка даёт пользу на каждом шаге. Горизонтальная — только когда готовы все слои."
    lessonId: m01-03
  - id: old-backlog
    type: single
    prompt: "Что делать с задачами, которые лежат в бэклоге больше полугода и ни разу не поднимались?"
    options:
      - { id: a, text: "Хранить вечно — вдруг пригодятся" }
      - { id: b, text: "Удалять или переносить в архив: важное вернётся с актуальным контекстом" }
      - { id: c, text: "Повысить им приоритет" }
    correct: b
    explanation: "Бэклог из сотен задач — это шум, а не запас ценности."
    lessonId: m01-03
  - id: class-of-service
    type: single
    scenario: "Портал с утра не принимает заказы от дилеров."
    prompt: "К какому классу обслуживания отнести запрос?"
    options:
      - { id: a, text: "Стандартный" }
      - { id: b, text: "Срочный" }
      - { id: c, text: "Нематериальный" }
    correct: b
    explanation: "Стоимость задержки высокая прямо сейчас — задачу берут сразу, даже при заполненном WIP-лимите."
    lessonId: m01-04
  - id: limit-urgent
    type: single
    prompt: "Почему срочный класс обслуживания нужно ограничивать?"
    options:
      - { id: a, text: "Иначе срочным становится всё, и класс теряет смысл" }
      - { id: b, text: "Срочные задачи всегда неважные" }
      - { id: c, text: "Так требует Kanban-доска" }
    correct: a
    explanation: "Без критериев и лимита любая задача объявляется срочной, а реально срочные тонут."
    lessonId: m01-04
  - id: work-item-age
    type: single
    prompt: "Для чего следить за возрастом задачи в работе?"
    options:
      - { id: a, text: "Чтобы рано заметить застрявшую задачу, пока её ещё можно спасти" }
      - { id: b, text: "Чтобы наказывать медленных исполнителей" }
      - { id: c, text: "Чтобы считать зарплату" }
    correct: a
    explanation: "Время прохождения известно только после завершения, а возраст — ранний сигнал прямо сейчас."
    lessonId: m01-04
  - id: velocity-compare
    type: single
    prompt: "Можно ли сравнивать команды по velocity?"
    options:
      - { id: a, text: "Да, это объективная метрика" }
      - {
          id: b,
          text: "Нет: у каждой команды своя шкала оценок, сравнение приведёт к инфляции оценок",
        }
      - { id: c, text: "Да, если команды одного размера" }
    correct: b
    explanation: "Story points — относительная шкала конкретной команды."
    lessonId: m01-05
  - id: change-as-experiment
    type: single
    prompt: "Как лучше предложить команде изменение процесса?"
    options:
      - { id: a, text: "Объявить новые правила с понедельника" }
      - {
          id: b,
          text: "Показать данные, обсудить причины и предложить эксперимент с критерием успеха",
        }
      - { id: c, text: "Попросить руководителя приказать" }
    correct: b
    explanation: "Эксперимент с понятным критерием легче принять, и его можно откатить."
    lessonId: m01-05
  - id: everything-urgent
    type: single
    prompt: "Какая частая причина того, что у команды «всё срочное»?"
    options:
      - {
          id: a,
          text: "Заказчики не видят очередь и сроки, поэтому повышают приоритет, чтобы их услышали",
        }
      - { id: b, text: "Команда работает слишком быстро" }
      - { id: c, text: "Слишком много WIP-лимитов" }
    correct: a
    explanation: "Прозрачная очередь и прогноз сроков снижают давление лучше любых правил."
    lessonId: m01-05
