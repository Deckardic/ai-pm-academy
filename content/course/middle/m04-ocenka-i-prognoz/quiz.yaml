id: m04-quiz
kind: module
title: "Тест модуля: Оценка и планирование на данных"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: planning-fallacy
    type: single
    prompt: Какой приём лучше всего защищает от ошибки планирования?
    options:
      - id: a
        text: Представить работу шаг за шагом подробнее
      - id: b
        text: "Взгляд снаружи: посмотреть, сколько фактически заняли похожие задачи и проекты"
      - id: c
        text: Попросить команду работать быстрее
    correct: b
    explanation: Фактические данные похожих работ надёжнее представления о гладком сценарии.
    lessonId: m04-01
  - id: anchoring
    type: single
    scenario: Руководитель говорит команде «думаю, это на месяц, но оцените сами».
    prompt: Какая ловушка здесь срабатывает?
    options:
      - id: a
        text: "Якорение: оценки будут тяготеть к названному месяцу"
      - id: b
        text: Ошибка выжившего
      - id: c
        text: Никакая
    correct: a
    explanation:
      Первая названная цифра становится якорем. Оценку лучше просить до того, как кто-то назовёт
      срок.
    lessonId: m04-01
  - id: estimate-vs-commitment
    type: single
    prompt: Чем оценка отличается от обязательства?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Оценка — прогноз с неопределённостью, обязательство — решение взяться сделать к дате
      - id: c
        text: Обязательство всегда меньше оценки
    correct: b
    explanation:
      Смешивание оценки и обязательства либо делает команду заложником прогноза, либо прячет
      риски.
    lessonId: m04-01
  - id: availability-calc
    type: single
    prompt:
      Команда оценила релиз в 60 рабочих дней чистой работы, но половину времени занята поддержкой.
      Какой срок реалистичнее?
    options:
      - id: a
        text: 60 рабочих дней
      - id: b
        text: Около 120 рабочих дней плюс запас на ожидания и доработки
      - id: c
        text: 30 рабочих дней
    correct: b
    explanation: При доступности около 50% чистая работа растягивается вдвое.
    lessonId: m04-01
  - id: poker-spread
    type: single
    scenario: На покере планирования один разработчик поставил 2, другой — 13.
    prompt: Что делать?
    options:
      - id: a
        text: Взять среднее
      - id: b
        text: Попросить обоих объяснить оценки — они по-разному понимают задачу
      - id: c
        text: Взять оценку старшего
    correct: b
    explanation: Расхождение — сигнал о разном понимании. Обсуждение — главная польза покера.
    lessonId: m04-02
  - id: story-points-meaning
    type: single
    prompt: Что отражают story points?
    options:
      - id: a
        text: Точное количество часов
      - id: b
        text: Относительный объём, сложность и неопределённость задачи по сравнению с эталоном
      - id: c
        text: Стоимость задачи в рублях
    correct: b
    explanation: Story points — относительная шкала конкретной команды.
    lessonId: m04-02
  - id: count-items
    type: single
    prompt: Когда для прогноза достаточно просто считать количество задач?
    options:
      - id: a
        text: Когда задачи нарезаны примерно одного размера
      - id: b
        text: Никогда
      - id: c
        text: Когда команда больше десяти человек
    correct: a
    explanation: При сопоставимом размере задач количество даёт прогноз не хуже, чем сумма оценок.
    lessonId: m04-02
  - id: average-date
    type: single
    prompt: Какова примерно вероятность успеть к дате, рассчитанной по средней пропускной способности?
    options:
      - id: a
        text: Около 50%
      - id: b
        text: Около 95%
      - id: c
        text: 100%
    correct: a
    explanation: Средняя дата — это «монетка». Для обязательств берут более высокий уровень уверенности.
    lessonId: m04-03
  - id: monte-carlo-input
    type: single
    prompt: Какие данные нужны для простого прогноза Монте-Карло?
    options:
      - id: a
        text: История пропускной способности по неделям и объём оставшейся работы
      - id: b
        text: Оценки задач в часах от руководителя
      - id: c
        text: Зарплаты команды
    correct: a
    explanation: Симуляция случайно выбирает недели из истории, пока не закончится объём.
    lessonId: m04-03
  - id: backlog-growth
    type: single
    prompt: В прошлом релизе исходные 40 задач выросли до 55. Как учесть это в прогнозе?
    options:
      - id: a
        text: Никак — прогноз на 40 задач
      - id: b
        text: Заложить рост объёма по историческим данным или прогнозировать диапазон объёма
      - id: c
        text: Попросить заказчика больше ничего не добавлять
    correct: b
    explanation: Без учёта роста бэклога прогноз заведомо оптимистичен.
    lessonId: m04-03
  - id: forecast-shift
    type: single
    scenario: За месяц до релиза прогноз с уверенностью 85% сдвинулся на неделю из-за новых задач.
    prompt: Когда сообщить заказчику?
    options:
      - id: a
        text: В день релиза
      - id: b
        text: Сразу, с причиной и вариантами
      - id: c
        text: Когда станет точно понятно
    correct: b
    explanation: Регулярный прогноз нужен, чтобы заказчик успел отреагировать.
    lessonId: m04-04
  - id: one-date
    type: single
    prompt: Заказчику нужна одна дата для обещания дилерам. Какую дату предложить?
    options:
      - id: a
        text: Самую раннюю из симуляций
      - id: b
        text: Дату с высокой уверенностью, с условиями и рычагами
      - id: c
        text: Дату по средней пропускной способности
    correct: b
    explanation: Дата с высокой уверенностью и названными условиями строит доверие.
    lessonId: m04-04
  - id: outside-view
    type: single
    prompt: Что такое «взгляд снаружи» в оценке?
    options:
      - id: a
        text: Спросить руководителя
      - id: b
        text: Опереться на фактические данные похожих задач и проектов
      - id: c
        text: Оценить на глаз
      - id: d
        text: Прочитать форумы
    correct: b
    explanation: Это противоядие от ошибки планирования.
    lessonId: m04-01
  - id: deadline-pressure
    type: single
    prompt: "Признак давления сроком на оценки:"
    options:
      - id: a
        text: Оценки совпадают с желаемой датой, люди говорят «постараемся»
      - id: b
        text: Оценки даны диапазоном
      - id: c
        text: Есть трёхточечная оценка
      - id: d
        text: Команда задаёт вопросы
    correct: a
    explanation: "Разделите разговор: сначала честная оценка, потом как уложиться."
    lessonId: m04-01
  - id: unaccounted
    type: single
    prompt: Что часто не входит в оценки и потом срывает срок?
    options:
      - id: a
        text: Чистая разработка
      - id: b
        text: Поддержка, встречи, ожидания, доработки после показов, отпуска
      - id: c
        text: Название задачи
      - id: d
        text: Эпики
    correct: b
    explanation: Поэтому «40 дней работы» превращаются в месяцы.
    lessonId: m04-01
  - id: commit-phrase
    type: single
    prompt: Как правильно сформулировать обязательство на основе оценки 8–12 недель?
    options:
      - id: a
        text: «Сделаем за 8 недель»
      - id: b
        text: «Беру 12 недель при условии, что объём не вырастет, и еженедельно сообщаю о рисках»
      - id: c
        text: «Как получится»
      - id: d
        text: «Постараемся»
    correct: b
    explanation: Обязательство — решение с условиями, а не прогноз.
    lessonId: m04-01
  - id: fib-scale
    type: single
    prompt: Почему шкала story points растёт с разрывами (1, 2, 3, 5, 8, 13…)?
    options:
      - id: a
        text: Так красивее
      - id: b
        text: Чем больше задача, тем меньше точность оценки
      - id: c
        text: Так требует Scrum
      - id: d
        text: Случайно
    correct: b
    explanation: Спорить 11 или 12 бессмысленно, 8 или 13 — полезно.
    lessonId: m04-02
  - id: sp-meaning2
    type: single
    prompt: Задача, которую команда делала много раз, объёмная, но простая. Как это отразится в story points?
    options:
      - id: a
        text: Всегда максимальная оценка
      - id: b
        text: Оценка учитывает объём, сложность и неопределённость вместе
      - id: c
        text: Её нельзя оценить
      - id: d
        text: Минимальная оценка всегда
    correct: b
    explanation: Story points — совокупная относительная величина.
    lessonId: m04-02
  - id: hours-when
    type: single
    prompt: Когда часы честнее story points?
    options:
      - id: a
        text: Для известной повторяемой работы и расчёта стоимости по времени
      - id: b
        text: Для исследовательских задач
      - id: c
        text: Никогда
      - id: d
        text: Для сравнения команд
    correct: a
    explanation: Например, почасовая оплата подрядчика.
    lessonId: m04-02
  - id: hours-control
    type: single
    prompt: Чем опасно сравнивать оценку в часах с фактом для контроля людей?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Люди начнут завышать оценки
      - id: c
        text: Оценки станут точнее
      - id: d
        text: Факт исчезнет
    correct: b
    explanation: «Оценил 8, делал 12» — и в следующий раз будет 16.
    lessonId: m04-02
  - id: poker-simultaneous
    type: single
    prompt: Зачем в покере планирования карты открывают одновременно?
    options:
      - id: a
        text: Для игры
      - id: b
        text: Чтобы никто не «якорился» на чужой оценке
      - id: c
        text: Для скорости
      - id: d
        text: Так положено
    correct: b
    explanation: Одновременное открытие даёт независимые оценки.
    lessonId: m04-02
  - id: mc-history-length
    type: single
    prompt: Какой период истории обычно достаточен для первого прогноза Монте-Карло?
    options:
      - id: a
        text: 1 неделя
      - id: b
        text: 10–15 недель
      - id: c
        text: 5 лет
      - id: d
        text: Не нужен
    correct: b
    explanation: Слишком длинная история может включать устаревшие условия.
    lessonId: m04-03
  - id: mc-stable
    type: single
    prompt: Команда сильно поменялась месяц назад. Какую историю брать для прогноза?
    options:
      - id: a
        text: Всю за три года
      - id: b
        text: После изменения состава
      - id: c
        text: Никакую
      - id: d
        text: Только первую неделю
    correct: b
    explanation: Нужна стабильная система.
    lessonId: m04-03
  - id: mc-how-many
    type: single
    prompt: Как построить прогноз «сколько задач успеем к дате»?
    options:
      - id: a
        text: Нельзя
      - id: b
        text: Симулировать заданное число недель и смотреть, сколько задач завершилось
      - id: c
        text: Поделить срок пополам
      - id: d
        text: Спросить заказчика
    correct: b
    explanation: Прогноз работает в обе стороны.
    lessonId: m04-03
  - id: mc-small-check
    type: single
    prompt: Как проверить таблицу симуляции Монте-Карло?
    options:
      - id: a
        text: Никак
      - id: b
        text: Объём 5 задач и история из одного значения «5» — всегда 1 неделя
      - id: c
        text: Посчитать среднее вручную
      - id: d
        text: Попросить ИИ
    correct: b
    explanation: Проверка на малых числах ловит ошибки формул.
    lessonId: m04-03
  - id: mc-median
    type: single
    prompt: С чем сравнить медиану симуляции для проверки здравым смыслом?
    options:
      - id: a
        text: С «объём ÷ средняя пропускная способность»
      - id: b
        text: С бюджетом
      - id: c
        text: С числом людей
      - id: d
        text: Ни с чем
    correct: a
    explanation: Медиана должна быть близка к этому значению.
    lessonId: m04-03
  - id: mc-slices
    type: single
    prompt: В истории — мелкие доработки, впереди — крупные функции. Что сделать перед прогнозом?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Нарезать работу до сопоставимых задач
      - id: c
        text: Удвоить результат
      - id: d
        text: Отказаться от прогноза
    correct: b
    explanation: Метод работает на сопоставимых задачах.
    lessonId: m04-03
  - id: forecast-words
    type: single
    prompt: Как сказать «около 85% уверенности» без процентов?
    options:
      - id: a
        text: «С высокой уверенностью, можно планировать на эту дату»
      - id: b
        text: «Точно»
      - id: c
        text: «Может быть»
      - id: d
        text: «Если повезёт»
    correct: a
    explanation: Понятные формулировки для тех, кто не любит проценты.
    lessonId: m04-04
  - id: forecast-levers
    type: single
    prompt: Что такое рычаги в разговоре о сроке?
    options:
      - id: a
        text: Угрозы
      - id: b
        text: Что заказчик может изменить, чтобы получить дату раньше — например, перенести часть функций
      - id: c
        text: Бонусы команде
      - id: d
        text: Отговорки
    correct: b
    explanation: Рычаги дают заказчику управление датой.
    lessonId: m04-04
  - id: two-dates
    type: single
    prompt: Что такое внутренняя цель и внешнее обязательство?
    options:
      - id: a
        text: Одно и то же
      - id: b
        text: Дата около 50% для команды и дата 85%+ для заказчика с осознанным буфером
      - id: c
        text: Две даты для разных заказчиков
      - id: d
        text: Даты начала и конца
    correct: b
    explanation: Буфер между ними защищает обязательство.
    lessonId: m04-04
  - id: forecast-weekly
    type: single
    prompt: Как часто обновлять прогноз сроков?
    options:
      - id: a
        text: Один раз
      - id: b
        text: Каждую неделю или каждый спринт, с объяснением изменений
      - id: c
        text: Раз в год
      - id: d
        text: Только по запросу
    correct: b
    explanation: Регулярный прогноз снимает страх внезапного срыва.
    lessonId: m04-04
