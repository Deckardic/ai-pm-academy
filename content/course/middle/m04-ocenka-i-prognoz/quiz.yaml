id: m04-quiz
kind: module
title: "Тест модуля: Оценка и планирование на данных"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: planning-fallacy
    type: single
    prompt: "Какой приём лучше всего защищает от ошибки планирования?"
    options:
      - { id: a, text: "Представить работу шаг за шагом подробнее" }
      - { id: b, text: "Взгляд снаружи: посмотреть, сколько фактически заняли похожие задачи и проекты" }
      - { id: c, text: "Попросить команду работать быстрее" }
    correct: b
    explanation: "Фактические данные похожих работ надёжнее представления о гладком сценарии."
    lessonId: m04-01
  - id: anchoring
    type: single
    scenario: "Руководитель говорит команде «думаю, это на месяц, но оцените сами»."
    prompt: "Какая ловушка здесь срабатывает?"
    options:
      - { id: a, text: "Якорение: оценки будут тяготеть к названному месяцу" }
      - { id: b, text: "Ошибка выжившего" }
      - { id: c, text: "Никакая" }
    correct: a
    explanation: "Первая названная цифра становится якорем. Оценку лучше просить до того, как кто-то назовёт срок."
    lessonId: m04-01
  - id: estimate-vs-commitment
    type: single
    prompt: "Чем оценка отличается от обязательства?"
    options:
      - { id: a, text: "Ничем" }
      - { id: b, text: "Оценка — прогноз с неопределённостью, обязательство — решение взяться сделать к дате" }
      - { id: c, text: "Обязательство всегда меньше оценки" }
    correct: b
    explanation: "Смешивание оценки и обязательства либо делает команду заложником прогноза, либо прячет риски."
    lessonId: m04-01
  - id: availability-calc
    type: single
    prompt: "Команда оценила релиз в 60 рабочих дней чистой работы, но половину времени занята поддержкой. Какой срок реалистичнее?"
    options:
      - { id: a, text: "60 рабочих дней" }
      - { id: b, text: "Около 120 рабочих дней плюс запас на ожидания и доработки" }
      - { id: c, text: "30 рабочих дней" }
    correct: b
    explanation: "При доступности около 50% чистая работа растягивается вдвое."
    lessonId: m04-01
  - id: poker-spread
    type: single
    scenario: "На покере планирования один разработчик поставил 2, другой — 13."
    prompt: "Что делать?"
    options:
      - { id: a, text: "Взять среднее" }
      - { id: b, text: "Попросить обоих объяснить оценки — они по-разному понимают задачу" }
      - { id: c, text: "Взять оценку старшего" }
    correct: b
    explanation: "Расхождение — сигнал о разном понимании. Обсуждение — главная польза покера."
    lessonId: m04-02
  - id: story-points-meaning
    type: single
    prompt: "Что отражают story points?"
    options:
      - { id: a, text: "Точное количество часов" }
      - { id: b, text: "Относительный объём, сложность и неопределённость задачи по сравнению с эталоном" }
      - { id: c, text: "Стоимость задачи в рублях" }
    correct: b
    explanation: "Story points — относительная шкала конкретной команды."
    lessonId: m04-02
  - id: count-items
    type: single
    prompt: "Когда для прогноза достаточно просто считать количество задач?"
    options:
      - { id: a, text: "Когда задачи нарезаны примерно одного размера" }
      - { id: b, text: "Никогда" }
      - { id: c, text: "Когда команда больше десяти человек" }
    correct: a
    explanation: "При сопоставимом размере задач количество даёт прогноз не хуже, чем сумма оценок."
    lessonId: m04-02
  - id: average-date
    type: single
    prompt: "Какова примерно вероятность успеть к дате, рассчитанной по средней пропускной способности?"
    options:
      - { id: a, text: "Около 50%" }
      - { id: b, text: "Около 95%" }
      - { id: c, text: "100%" }
    correct: a
    explanation: "Средняя дата — это «монетка». Для обязательств берут более высокий уровень уверенности."
    lessonId: m04-03
  - id: monte-carlo-input
    type: single
    prompt: "Какие данные нужны для простого прогноза Монте-Карло?"
    options:
      - { id: a, text: "История пропускной способности по неделям и объём оставшейся работы" }
      - { id: b, text: "Оценки задач в часах от руководителя" }
      - { id: c, text: "Зарплаты команды" }
    correct: a
    explanation: "Симуляция случайно выбирает недели из истории, пока не закончится объём."
    lessonId: m04-03
  - id: backlog-growth
    type: single
    prompt: "В прошлом релизе исходные 40 задач выросли до 55. Как учесть это в прогнозе?"
    options:
      - { id: a, text: "Никак — прогноз на 40 задач" }
      - { id: b, text: "Заложить рост объёма по историческим данным или прогнозировать диапазон объёма" }
      - { id: c, text: "Попросить заказчика больше ничего не добавлять" }
    correct: b
    explanation: "Без учёта роста бэклога прогноз заведомо оптимистичен."
    lessonId: m04-03
  - id: forecast-shift
    type: single
    scenario: "За месяц до релиза прогноз с уверенностью 85% сдвинулся на неделю из-за новых задач."
    prompt: "Когда сообщить заказчику?"
    options:
      - { id: a, text: "В день релиза" }
      - { id: b, text: "Сразу, с причиной и вариантами" }
      - { id: c, text: "Когда станет точно понятно" }
    correct: b
    explanation: "Регулярный прогноз нужен, чтобы заказчик успел отреагировать."
    lessonId: m04-04
  - id: one-date
    type: single
    prompt: "Заказчику нужна одна дата для обещания дилерам. Какую дату предложить?"
    options:
      - { id: a, text: "Самую раннюю из симуляций" }
      - { id: b, text: "Дату с высокой уверенностью, с условиями и рычагами" }
      - { id: c, text: "Дату по средней пропускной способности" }
    correct: b
    explanation: "Дата с высокой уверенностью и названными условиями строит доверие."
    lessonId: m04-04
