id: m04
slug: ocenka-i-prognoz
order: 4
title: Оценка и планирование на данных
summary: Story points и часы, прогнозирование методом Монте-Карло, буферы.
goals:
  - Прогнозировать сроки по историческим данным
  - Объяснять прогноз стейкхолдерам
status: published
artifact: Прогноз сроков релиза
keyConcepts:
  - story points
  - Монте-Карло
  - throughput
  - прогноз
searchQueries:
  - прогнозирование сроков проекта монте карло
lessonsPlan:
  - slug: lovushki-ocenok
    title: Почему оценки ошибаются
    focus: систематические ловушки планирования
    durationMin: 12
    keyPoints:
      - Ошибка планирования
      - Якорение и давление сроком
      - Неучтённая работа и прерывания
      - Оценка — не обязательство
    practice: Найти ловушки в истории сорванного проекта
  - slug: story-points-i-chasy
    title: Story points и часы
    focus: относительные и абсолютные оценки
    durationMin: 12
    keyPoints:
      - Относительная оценка и покер планирования
      - Когда часы честнее
      - Велосити не сравнивают между командами
      - "Подход без оценок: считать задачи"
    practice: Провести учебный покер планирования на 8 задачах
  - slug: prognoz-monte-karlo
    title: Прогноз методом Монте-Карло
    focus: сроки по данным, а не по ощущениям
    durationMin: 15
    keyPoints:
      - Пропускная способность из истории
      - Много симуляций вместо одной даты
      - Прогноз с уверенностью 85%
      - Какие данные нужны и сколько
    aiAngle: расчёт симуляции в таблице с помощью ИИ и проверка на небольших числах
    practice: Сделать прогноз даты для 40 задач
  - slug: kommunikaciya-prognoza
    title: Как говорить о сроках
    focus: диапазоны и уверенность вместо обещаний
    durationMin: 11
    keyPoints:
      - Диапазон дат и вероятность
      - Что меняет прогноз
      - Регулярное обновление прогноза
      - Разговор с заказчиком, который хочет одну дату
    practice: Подготовить сообщение заказчику с прогнозом
assignment:
  title: Прогноз сроков релиза
  deliverable: Таблица с симуляцией и сообщение заказчику
  brief: Исторические данные, прогноз Монте-Карло с датами на 50/85/95%, допущения и текст для заказчика.
quizFocus:
  - ловушки оценок
  - относительные оценки
  - прогноз по данным
  - коммуникация прогноза
