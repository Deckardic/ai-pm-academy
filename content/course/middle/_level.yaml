id: middle
slug: middle
order: 2
title: Middle
tagline: Системное управление и ИИ-воркфлоу
description: >-
  Для тех, кто уже ведёт проекты и хочет работать системно: зрелые Agile-практики, требования и
  приоритизация, прогнозирование сроков на данных, метрики и бюджет, работа со стейкхолдерами и
  командой. ИИ здесь — уже не чат для писем, а часть рабочих процессов и автоматизаций.
audience: >-
  Для PM с опытом от года: ведёте один-три проекта, знаете базу и хотите тратить меньше времени на
  рутину и больше — на решения.
outcomes:
  - Настраивать Scrum и Kanban под контекст команды и лечить их антипаттерны
  - Приоритизировать бэклог по RICE и WSJF и управлять изменениями скоупа
  - Прогнозировать сроки по данным, а не по ощущениям
  - Строить дашборд метрик потока и контролировать бюджет через EVM
  - Проектировать ИИ-воркфлоу и автоматизации с проверкой качества
status: published
