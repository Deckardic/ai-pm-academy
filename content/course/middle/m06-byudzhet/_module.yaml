lessonsPlan:
- slug: ocenka-zatrat
  title: Оценка затрат
  focus: из чего складывается бюджет проекта
  durationMin: 12
  keyPoints:
  - Оценка снизу вверх и по аналогии
  - Трудозатраты, закупки, подрядчики
  - Резерв на риски и управленческий резерв
  - Бюджет по времени
  practice: Собрать бюджет учебного проекта
- slug: kontrol-byudzheta
  title: Контроль бюджета
  focus: план-факт и работа с отклонениями
  durationMin: 11
  keyPoints:
  - План-факт по периодам
  - Отклонения и их причины
  - Ранние сигналы перерасхода
  - Как сообщать о перерасходе
  practice: Разобрать отклонения в учебной таблице
- slug: evm
  title: Метод освоенного объёма (EVM)
  focus: PV, EV, AC и индексы CPI и SPI
  durationMin: 15
  keyPoints:
  - Плановый объём, освоенный объём, фактическая стоимость
  - Отклонения по стоимости и срокам
  - Индексы CPI и SPI
  - Когда EVM полезен, а когда нет
  aiAngle: расчёт индексов с ИИ и проверка формул вручную
  practice: Рассчитать EVM для проекта на 4 месяца
- slug: prognoz-eac
  title: Прогноз стоимости завершения
  focus: EAC, ETC и VAC
  durationMin: 12
  keyPoints:
  - Прогноз по текущей эффективности
  - Оставшиеся затраты
  - Ожидаемое отклонение на завершение
  - Что делать с плохим прогнозом
  practice: Сделать прогноз стоимости и варианты действий
assignment:
  title: Бюджетная модель
  deliverable: Таблица бюджета с план-фактом и EVM
  brief: Бюджет по статьям и периодам, резервы, план-факт, расчёт CPI и SPI, прогноз EAC и выводы.
