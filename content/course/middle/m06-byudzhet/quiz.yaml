id: m06-quiz
kind: module
title: "Тест модуля: Бюджет"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: reserve-type
    type: single
    scenario: Подрядчик может задержать интеграцию, и тогда понадобится доплата за ускорение.
    prompt: Из какого резерва разумно покрывать этот риск?
    options:
      - id: a
        text: Из управленческого резерва
      - id: b
        text: Из резерва на риски — это известный риск из реестра
      - id: c
        text: Из бюджета обучения
    correct: b
    explanation: Резерв на риски — для известных рисков; управленческий — для непредвиденного.
    lessonId: m06-01
  - id: budget-completeness
    type: multiple
    prompt: Что должно входить в бюджет проекта портала? Выберите все подходящие.
    options:
      - id: a
        text: Трудозатраты команды
      - id: b
        text: Работы подрядчиков и закупки
      - id: c
        text: Обучение пользователей и резервы
      - id: d
        text: Годовой бюджет отдела маркетинга
    correct:
      - a
      - b
      - c
    explanation:
      Бюджет проекта включает все затраты на результат проекта и резервы, но не бюджеты других
      подразделений.
    lessonId: m06-01
  - id: estimate-early
    type: single
    prompt: Какой способ оценки затрат уместнее на самом старте, когда WBS ещё не детализирована?
    options:
      - id: a
        text: По аналогии с прошлыми проектами, с широким диапазоном
      - id: b
        text: Снизу вверх по пакетам работ
      - id: c
        text: Не оценивать до конца проекта
    correct: a
    explanation: Снизу вверх требует детальной WBS. На старте — аналогия с явным диапазоном.
    lessonId: m06-01
  - id: underspend
    type: single
    scenario:
      К концу второго месяца потрачено на 0,6 млн меньше плана. Подрядчик не выставил счёт, потому
      что его этап не сдан.
    prompt: Как оценить ситуацию?
    options:
      - id: a
        text: Экономия
      - id: b
        text: Скорее сдвиг во времени и сигнал отставания по срокам
      - id: c
        text: Всё идеально
    correct: b
    explanation: Недорасход часто означает, что работа отстаёт.
    lessonId: m06-02
  - id: commitments
    type: single
    prompt:
      Когда учитывать в прогнозе бюджета подписанное допсоглашение с подрядчиком, оплата по которому
      через два месяца?
    options:
      - id: a
        text: Сразу — это обязательство и будущий расход
      - id: b
        text: Когда придёт счёт
      - id: c
        text: Никогда
    correct: a
    explanation: Учёт обязательств показывает перерасход в момент решения, а не оплаты.
    lessonId: m06-02
  - id: ev-meaning
    type: single
    prompt: Что такое освоенный объём (EV)?
    options:
      - id: a
        text: Сколько фактически потрачено
      - id: b
        text: Плановая стоимость фактически выполненной работы
      - id: c
        text: Плановая стоимость работы к дате
    correct: b
    explanation: PV — план к дате, AC — фактические затраты, EV — выполненная работа в плановых ценах.
    lessonId: m06-03
  - id: cpi-calc
    type: single
    prompt: EV = 3,2 млн, AC = 4,0 млн. Чему равен CPI и что он значит?
    options:
      - id: a
        text: 0,8 — работа обходится дороже плана
      - id: b
        text: 1,25 — работа обходится дешевле плана
      - id: c
        text: 0,8 — проект опережает график
    correct: a
    explanation: CPI = EV ÷ AC = 0,8. На рубль затрат получаем работы на 80 копеек.
    lessonId: m06-03
  - id: spi-cpi-case
    type: single
    prompt: PV = 5 млн, EV = 4 млн, AC = 3,5 млн. Что верно?
    options:
      - id: a
        text: Отставание по графику, но работа обходится дешевле плана
      - id: b
        text: Опережение графика и перерасход
      - id: c
        text: Всё по плану
    correct: a
    explanation: SPI = 0,8 — отставание; CPI ≈ 1,14 — дешевле плана.
    lessonId: m06-03
  - id: evm-limits
    type: single
    prompt: В каком проекте EVM менее полезен?
    options:
      - id: a
        text: Внедрение по договору с фиксированным объёмом
      - id: b
        text: Гибкий продуктовый проект с постоянно меняющимся скоупом
      - id: c
        text: Строительство по утверждённому проекту
    correct: b
    explanation: При постоянно меняющемся скоупе базовый план быстро устаревает.
    lessonId: m06-03
  - id: eac-calc
    type: single
    prompt: BAC = 12 млн, CPI = 0,75. Каков EAC при сохранении эффективности?
    options:
      - id: a
        text: 16 млн
      - id: b
        text: 9 млн
      - id: c
        text: 12 млн
    correct: a
    explanation: EAC = BAC ÷ CPI = 12 ÷ 0,75 = 16 млн.
    lessonId: m06-04
  - id: eac-one-off
    type: single
    prompt:
      Перерасход вызван разовой доплатой, дальше работа пойдёт по плановой стоимости. Какую формулу
      EAC выбрать?
    options:
      - id: a
        text: EAC = BAC ÷ CPI
      - id: b
        text: EAC = AC + (BAC − EV)
      - id: c
        text: EAC = BAC
    correct: b
    explanation: Если отклонение разовое, оставшаяся работа оценивается по плану.
    lessonId: m06-04
  - id: bad-forecast
    type: single
    prompt: Прогноз показывает перерасход 2 млн. Что сделать PM?
    options:
      - id: a
        text: Подождать — CPI может выправиться
      - id: b
        text: Найти причину, подготовить варианты и сразу сообщить спонсору с рекомендацией
      - id: c
        text: Сократить тестирование, чтобы уложиться
    correct: b
    explanation: Чем раньше спонсор узнает, тем больше вариантов остаётся.
    lessonId: m06-04
  - id: bottom-up
    type: single
    prompt: Что нужно для оценки затрат снизу вверх?
    options:
      - id: a
        text: Детальная WBS
      - id: b
        text: Только аналог
      - id: c
        text: Только интуиция
      - id: d
        text: Ничего
    correct: a
    explanation: Каждый пакет работ оценивают и суммируют.
    lessonId: m06-01
  - id: parametric
    type: single
    prompt: Что такое параметрическая оценка?
    options:
      - id: a
        text: Оценка через стоимость единицы, например «настройка одного дилера — N рублей»
      - id: b
        text: Оценка на глаз
      - id: c
        text: Оценка ИИ
      - id: d
        text: Отказ от оценки
    correct: a
    explanation: Работает для повторяемых работ.
    lessonId: m06-01
  - id: budget-by-time
    type: single
    prompt: Зачем распределять бюджет по месяцам?
    options:
      - id: a
        text: Для финансовой службы, план-факта по ходу проекта и EVM
      - id: b
        text: Для красоты
      - id: c
        text: Так короче
      - id: d
        text: Не нужно
    correct: a
    explanation: Итоговая сумма не позволяет контролировать расход по ходу.
    lessonId: m06-01
  - id: hidden-reserve
    type: single
    prompt: Чем плох резерв, спрятанный в каждом пакете работ?
    options:
      - id: a
        text: Он невидим и незаметно расходуется
      - id: b
        text: Он слишком большой
      - id: c
        text: Он запрещён
      - id: d
        text: Ничем
    correct: a
    explanation: Явный резерв легче согласовать и контролировать.
    lessonId: m06-01
  - id: contractor-milestones
    type: single
    prompt: Как платежи подрядчику влияют на бюджет по времени?
    options:
      - id: a
        text: Никак
      - id: b
        text: Они привязаны к вехам договора — это нужно учесть в распределении
      - id: c
        text: Всегда в начале
      - id: d
        text: Всегда в конце
    correct: b
    explanation: Сдвиг вехи сдвигает платёж.
    lessonId: m06-01
  - id: three-causes
    type: single
    prompt: Какие три причины отклонений план-факт выделяют?
    options:
      - id: a
        text: Сдвиг во времени, перерасход или экономия, изменение объёма
      - id: b
        text: Ошибка бухгалтерии, лень, погода
      - id: c
        text: Люди, процессы, инструменты
      - id: d
        text: Риски, проблемы, возможности
    correct: a
    explanation: Сначала причина, потом выводы.
    lessonId: m06-02
  - id: early-overrun
    type: single
    prompt: Какой из сигналов — ранний сигнал перерасхода?
    options:
      - id: a
        text: Сверхурочные и дополнительные люди в команде
      - id: b
        text: Экономия на канцелярии
      - id: c
        text: Хорошая погода
      - id: d
        text: Закрытая задача
    correct: a
    explanation: Деньги тратятся позже, чем принимаются решения.
    lessonId: m06-02
  - id: overrun-hope
    type: single
    prompt: «Сэкономим во втором полугодии» — насколько это надёжный план?
    options:
      - id: a
        text: Надёжный
      - id: b
        text: Обычно не случается; сообщать о перерасходе нужно в том же месяце
      - id: c
        text: Гарантирован
      - id: d
        text: Лучший вариант
    correct: b
    explanation: Скрытый перерасход растёт, варианты сокращаются.
    lessonId: m06-02
  - id: status-budget-line
    type: single
    prompt: Что достаточно писать о бюджете в статус-отчёте?
    options:
      - id: a
        text: Всю таблицу
      - id: b
        text: "Одну строку: статус, прогноз на завершение, изменения"
      - id: c
        text: Ничего
      - id: d
        text: Только сумму
    correct: b
    explanation: Подробности — в приложении.
    lessonId: m06-02
  - id: ev-honest
    type: single
    prompt: Как надёжнее считать освоенный объём?
    options:
      - id: a
        text: «На глаз, процентов 70»
      - id: b
        text: По завершённым пакетам работ или по правилу 50/50
      - id: c
        text: По числу встреч
      - id: d
        text: По затратам
    correct: b
    explanation: Иначе EVM бессмыслен.
    lessonId: m06-03
  - id: sv-units
    type: single
    prompt: В чём выражено отклонение по срокам SV в EVM?
    options:
      - id: a
        text: В днях
      - id: b
        text: В деньгах
      - id: c
        text: В задачах
      - id: d
        text: В процентах
    correct: b
    explanation: SV = EV − PV — это деньги, а не дни.
    lessonId: m06-03
  - id: cv-calc
    type: single
    prompt: EV = 5 млн, AC = 6 млн. CV = ?
    options:
      - id: a
        text: +1 млн
      - id: b
        text: −1 млн
      - id: c
        text: 11 млн
      - id: d
        text: "0"
    correct: b
    explanation: CV = EV − AC = −1 млн — перерасход.
    lessonId: m06-03
  - id: evm-early
    type: single
    prompt: Почему ранние значения CPI важны?
    options:
      - id: a
        text: Они случайны
      - id: b
        text: CPI обычно мало меняется после первых месяцев, поэтому ранний сигнал ценен
      - id: c
        text: Они всегда 1
      - id: d
        text: Их никто не смотрит
    correct: b
    explanation: Резко улучшить эффективность потом редко удаётся.
    lessonId: m06-03
  - id: ev-first
    type: single
    prompt: Как запомнить формулы EVM?
    options:
      - id: a
        text: Во всех формулах на первом месте EV
      - id: b
        text: PV всегда первый
      - id: c
        text: AC всегда первый
      - id: d
        text: Никак
    correct: a
    explanation: Сравниваем сделанную работу с планом и затратами.
    lessonId: m06-03
  - id: etc-calc
    type: single
    prompt: EAC = 10 млн, AC = 4 млн. ETC = ?
    options:
      - id: a
        text: 6 млн
      - id: b
        text: 14 млн
      - id: c
        text: 4 млн
      - id: d
        text: 10 млн
    correct: a
    explanation: ETC = EAC − AC.
    lessonId: m06-04
  - id: vac-sign
    type: single
    prompt: VAC = −2 млн. Что это значит?
    options:
      - id: a
        text: Экономия 2 млн
      - id: b
        text: Прогноз перерасхода 2 млн
      - id: c
        text: Бюджет не изменится
      - id: d
        text: Ошибка
    correct: b
    explanation: VAC = BAC − EAC.
    lessonId: m06-04
  - id: eac-bottomup
    type: single
    prompt: Когда уместна новая оценка оставшейся работы снизу вверх для EAC?
    options:
      - id: a
        text: Когда исходный план сильно устарел
      - id: b
        text: Всегда
      - id: c
        text: Никогда
      - id: d
        text: Только в начале
    correct: a
    explanation: Трудоёмко, но иногда точнее формул.
    lessonId: m06-04
  - id: eac-range
    type: single
    prompt: Как лучше сообщить спонсору прогноз стоимости?
    options:
      - id: a
        text: Одной точной цифрой
      - id: b
        text: Диапазоном с допущениями о том, какая формула ближе к реальности
      - id: c
        text: Не сообщать
      - id: d
        text: Только в конце проекта
    correct: b
    explanation: Честнее показать диапазон.
    lessonId: m06-04
  - id: bad-eac-first
    type: single
    prompt: Что первым делом сделать при плохом прогнозе EAC?
    options:
      - id: a
        text: Сократить тестирование
      - id: b
        text: Найти причину перерасхода
      - id: c
        text: Скрыть прогноз
      - id: d
        text: Попросить команду работать больше
    correct: b
    explanation: Без причины варианты действий будут случайными.
    lessonId: m06-04
