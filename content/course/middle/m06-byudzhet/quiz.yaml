id: m06-quiz
kind: module
title: "Тест модуля: Бюджет"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: reserve-type
    type: single
    scenario: "Подрядчик может задержать интеграцию, и тогда понадобится доплата за ускорение."
    prompt: "Из какого резерва разумно покрывать этот риск?"
    options:
      - { id: a, text: "Из управленческого резерва" }
      - { id: b, text: "Из резерва на риски — это известный риск из реестра" }
      - { id: c, text: "Из бюджета обучения" }
    correct: b
    explanation: "Резерв на риски — для известных рисков; управленческий — для непредвиденного."
    lessonId: m06-01
  - id: budget-completeness
    type: multiple
    prompt: "Что должно входить в бюджет проекта портала? Выберите все подходящие."
    options:
      - { id: a, text: "Трудозатраты команды" }
      - { id: b, text: "Работы подрядчиков и закупки" }
      - { id: c, text: "Обучение пользователей и резервы" }
      - { id: d, text: "Годовой бюджет отдела маркетинга" }
    correct: [a, b, c]
    explanation: "Бюджет проекта включает все затраты на результат проекта и резервы, но не бюджеты других подразделений."
    lessonId: m06-01
  - id: estimate-early
    type: single
    prompt: "Какой способ оценки затрат уместнее на самом старте, когда WBS ещё не детализирована?"
    options:
      - { id: a, text: "По аналогии с прошлыми проектами, с широким диапазоном" }
      - { id: b, text: "Снизу вверх по пакетам работ" }
      - { id: c, text: "Не оценивать до конца проекта" }
    correct: a
    explanation: "Снизу вверх требует детальной WBS. На старте — аналогия с явным диапазоном."
    lessonId: m06-01
  - id: underspend
    type: single
    scenario: "К концу второго месяца потрачено на 0,6 млн меньше плана. Подрядчик не выставил счёт, потому что его этап не сдан."
    prompt: "Как оценить ситуацию?"
    options:
      - { id: a, text: "Экономия" }
      - { id: b, text: "Скорее сдвиг во времени и сигнал отставания по срокам" }
      - { id: c, text: "Всё идеально" }
    correct: b
    explanation: "Недорасход часто означает, что работа отстаёт."
    lessonId: m06-02
  - id: commitments
    type: single
    prompt: "Когда учитывать в прогнозе бюджета подписанное допсоглашение с подрядчиком, оплата по которому через два месяца?"
    options:
      - { id: a, text: "Сразу — это обязательство и будущий расход" }
      - { id: b, text: "Когда придёт счёт" }
      - { id: c, text: "Никогда" }
    correct: a
    explanation: "Учёт обязательств показывает перерасход в момент решения, а не оплаты."
    lessonId: m06-02
  - id: ev-meaning
    type: single
    prompt: "Что такое освоенный объём (EV)?"
    options:
      - { id: a, text: "Сколько фактически потрачено" }
      - { id: b, text: "Плановая стоимость фактически выполненной работы" }
      - { id: c, text: "Плановая стоимость работы к дате" }
    correct: b
    explanation: "PV — план к дате, AC — фактические затраты, EV — выполненная работа в плановых ценах."
    lessonId: m06-03
  - id: cpi-calc
    type: single
    prompt: "EV = 3,2 млн, AC = 4,0 млн. Чему равен CPI и что он значит?"
    options:
      - { id: a, text: "0,8 — работа обходится дороже плана" }
      - { id: b, text: "1,25 — работа обходится дешевле плана" }
      - { id: c, text: "0,8 — проект опережает график" }
    correct: a
    explanation: "CPI = EV ÷ AC = 0,8. На рубль затрат получаем работы на 80 копеек."
    lessonId: m06-03
  - id: spi-cpi-case
    type: single
    prompt: "PV = 5 млн, EV = 4 млн, AC = 3,5 млн. Что верно?"
    options:
      - { id: a, text: "Отставание по графику, но работа обходится дешевле плана" }
      - { id: b, text: "Опережение графика и перерасход" }
      - { id: c, text: "Всё по плану" }
    correct: a
    explanation: "SPI = 0,8 — отставание; CPI ≈ 1,14 — дешевле плана."
    lessonId: m06-03
  - id: evm-limits
    type: single
    prompt: "В каком проекте EVM менее полезен?"
    options:
      - { id: a, text: "Внедрение по договору с фиксированным объёмом" }
      - { id: b, text: "Гибкий продуктовый проект с постоянно меняющимся скоупом" }
      - { id: c, text: "Строительство по утверждённому проекту" }
    correct: b
    explanation: "При постоянно меняющемся скоупе базовый план быстро устаревает."
    lessonId: m06-03
  - id: eac-calc
    type: single
    prompt: "BAC = 12 млн, CPI = 0,75. Каков EAC при сохранении эффективности?"
    options:
      - { id: a, text: "16 млн" }
      - { id: b, text: "9 млн" }
      - { id: c, text: "12 млн" }
    correct: a
    explanation: "EAC = BAC ÷ CPI = 12 ÷ 0,75 = 16 млн."
    lessonId: m06-04
  - id: eac-one-off
    type: single
    prompt: "Перерасход вызван разовой доплатой, дальше работа пойдёт по плановой стоимости. Какую формулу EAC выбрать?"
    options:
      - { id: a, text: "EAC = BAC ÷ CPI" }
      - { id: b, text: "EAC = AC + (BAC − EV)" }
      - { id: c, text: "EAC = BAC" }
    correct: b
    explanation: "Если отклонение разовое, оставшаяся работа оценивается по плану."
    lessonId: m06-04
  - id: bad-forecast
    type: single
    prompt: "Прогноз показывает перерасход 2 млн. Что сделать PM?"
    options:
      - { id: a, text: "Подождать — CPI может выправиться" }
      - { id: b, text: "Найти причину, подготовить варианты и сразу сообщить спонсору с рекомендацией" }
      - { id: c, text: "Сократить тестирование, чтобы уложиться" }
    correct: b
    explanation: "Чем раньше спонсор узнает, тем больше вариантов остаётся."
    lessonId: m06-04
