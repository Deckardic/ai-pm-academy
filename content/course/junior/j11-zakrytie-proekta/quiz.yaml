id: j11-quiz
kind: module
title: "Тест модуля: Закрытие проекта"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: acceptance-criteria
    type: single
    prompt: По чему проводят приёмку результата проекта?
    options:
      - id: a
        text: По впечатлению заказчика на демонстрации
      - id: b
        text: По критериям приёмки, согласованным заранее в уставе, требованиях или договоре
      - id: c
        text: По количеству закрытых задач в трекере
    correct: b
    explanation: Без заранее согласованных критериев приёмка превращается в спор о вкусах.
    lessonId: j11-01
  - id: new-wishes
    type: single
    scenario:
      На приёмке заказчик говорит «а давайте ещё добавим запись для родственников», хотя этого не
      было в границах проекта.
    prompt: Как правильно поступить?
    options:
      - id: a
        text: Не подписывать акт, пока не сделаем
      - id: b
        text: Зафиксировать как запрос на следующий этап, а приёмку проводить по согласованным критериям
      - id: c
        text: Сделать бесплатно, чтобы не портить отношения
    correct: b
    explanation: Новое пожелание — это новая работа, а не замечание к приёмке.
    lessonId: j11-01
  - id: handover
    type: multiple
    prompt: Что нужно передать при передаче результата в эксплуатацию? Выберите все подходящие.
    options:
      - id: a
        text: "Документацию: как устроено и что делать при сбоях"
      - id: b
        text: Доступы к системам
      - id: c
        text: Контакты и назначенного ответственного за поддержку
      - id: d
        text: Личные телефоны разработчиков проекта для круглосуточной связи
    correct:
      - a
      - b
      - c
    explanation:
      Поддержка должна справляться сама. Личные телефоны команды проекта — признак того, что
      передачи не было.
    lessonId: j11-01
  - id: tails
    type: single
    prompt: Что делать с незакрытыми мелкими задачами на момент приёмки?
    options:
      - id: a
        text: Оставить висеть — как-нибудь доделаем
      - id: b
        text: "Составить список с ответственными и сроками: сделать, передать в поддержку, перенести или отказаться"
      - id: c
        text: Удалить из трекера
    correct: b
    explanation: Хвосты без владельца висят месяцами и не дают закрыть проект.
    lessonId: j11-01
  - id: retro-safety
    type: single
    prompt: Что важнее всего для честной ретроспективы?
    options:
      - id: a
        text: Красивая онлайн-доска
      - id: b
        text: "Безопасная атмосфера: ищем причины в процессе, а не виноватых"
      - id: c
        text: Присутствие руководства
    correct: b
    explanation: Люди говорят правду, когда уверены, что их не накажут.
    lessonId: j11-02
  - id: retro-actions
    type: single
    scenario: На ретроспективе выписали 15 проблем.
    prompt: Что лучше сделать?
    options:
      - id: a
        text: Записать все 15 в план улучшений
      - id: b
        text: Выбрать 2–3 главные и превратить в конкретные действия с ответственными и сроками
      - id: c
        text: Отправить список руководителю
    correct: b
    explanation: Двадцать действий никто не выполнит. Два-три конкретных — реально изменят работу.
    lessonId: j11-02
  - id: format-4l
    type: multiple
    prompt: Какие колонки есть в формате ретроспективы 4L? Выберите все подходящие.
    options:
      - id: a
        text: Понравилось
      - id: b
        text: Узнали
      - id: c
        text: Не хватало
      - id: d
        text: Хотелось бы
      - id: e
        text: Кто виноват
    correct:
      - a
      - b
      - c
      - d
    explanation: 4L — Liked, Learned, Lacked, Longed for. Поиска виноватых в ретроспективе нет.
    lessonId: j11-02
  - id: good-lesson
    type: single
    prompt: Какой урок проекта сформулирован лучше?
    options:
      - id: a
        text: Надо лучше планировать
      - id: b
        text:
          Юриста подключили на тестировании, форму согласия переделывали неделю; в проектах с персональными
          данными — согласование с юристом на этапе макетов
      - id: c
        text: Юрист всё задержал
    correct: b
    explanation: Хороший урок содержит ситуацию, причину и конкретную рекомендацию.
    lessonId: j11-03
  - id: lesson-learned
    type: single
    prompt: Когда урок проекта можно считать выученным?
    options:
      - id: a
        text: Когда его записали в отчёт
      - id: b
        text: Когда он изменил шаблоны, чек-листы или планы следующих проектов
      - id: c
        text: Когда его обсудили на ретроспективе
    correct: b
    explanation: Урок выучен, когда он изменил практику.
    lessonId: j11-03
  - id: closure-report
    type: single
    prompt: Проект опоздал на две недели. Как отразить это в отчёте о закрытии?
    options:
      - id: a
        text: Не упоминать — проект же запущен
      - id: b
        text: "Честно: план и факт, причины отклонения, уроки"
      - id: c
        text: Написать, что сроки были перенесены по желанию заказчика
    correct: b
    explanation: Приукрашенный отчёт лишает организацию возможности учиться.
    lessonId: j11-03
  - id: demo-before-accept
    type: single
    prompt: Что делает финальную приёмку формальностью?
    options:
      - id: a
        text: Длинный акт
      - id: b
        text: Промежуточные демонстрации результата заказчику
      - id: c
        text: Строгий тон
      - id: d
        text: Сжатые сроки
    correct: b
    explanation: Если заказчик видел результат по ходу, сюрпризов на приёмке нет.
    lessonId: j11-01
  - id: acceptance-steps
    type: order
    prompt: Расположите шаги приёмки по порядку.
    items:
      - id: a
        text: Подготовить чек-лист
      - id: b
        text: Провести демонстрацию
      - id: c
        text: Зафиксировать замечания
      - id: d
        text: Договориться о судьбе замечаний
      - id: e
        text: Подписать акт
    explanation: Приёмка идёт от критериев к подписанию.
    lessonId: j11-01
  - id: support-period
    type: single
    prompt: Что такое период сопровождения после запуска?
    options:
      - id: a
        text: Отпуск команды
      - id: b
        text: Одна-две недели, когда команда проекта помогает поддержке, прежде чем передать всё полностью
      - id: c
        text: Продление проекта на год
      - id: d
        text: Гарантийный ремонт
    correct: b
    explanation: Так поддержка успевает освоиться.
    lessonId: j11-01
  - id: close-access
    type: single
    prompt: Что сделать с временными доступами при закрытии?
    options:
      - id: a
        text: Оставить
      - id: b
        text: Вернуть или отозвать
      - id: c
        text: Передать всем
      - id: d
        text: Ничего
    correct: b
    explanation: Незакрытые доступы — риск безопасности.
    lessonId: j11-01
  - id: tail-options
    type: single
    prompt: Какой вариант НЕ подходит для незакрытых хвостов?
    options:
      - id: a
        text: Сделать до закрытия
      - id: b
        text: Передать в поддержку со сроком
      - id: c
        text: Оставить без владельца «на потом»
      - id: d
        text: Перенести в следующий этап
    correct: c
    explanation: Хвосты без владельца висят месяцами.
    lessonId: j11-01
  - id: prime-directive
    type: single
    prompt: Зачем в начале ретроспективы читают «главную директиву»?
    options:
      - id: a
        text: По традиции
      - id: b
        text: "Чтобы создать безопасность: каждый делал лучшее, что мог, в тех условиях"
      - id: c
        text: Чтобы сэкономить время
      - id: d
        text: Так требует Scrum
    correct: b
    explanation: Без безопасности люди не говорят правду.
    lessonId: j11-02
  - id: pm-own-mistakes
    type: single
    prompt: Что помогает команде честно говорить о проблемах на ретро?
    options:
      - id: a
        text: PM молчит
      - id: b
        text: PM первым говорит о своих ошибках
      - id: c
        text: Присутствие директора
      - id: d
        text: Анкета с именами
    correct: b
    explanation: Это показывает, что признавать ошибки нормально.
    lessonId: j11-02
  - id: retro-format-choice
    type: single
    prompt: Какой формат ретро удобен для первых встреч и небольших команд?
    options:
      - id: a
        text: «Старт — стоп — продолжить»
      - id: b
        text: Годовой отчёт
      - id: c
        text: Экзамен
      - id: d
        text: Презентация на 40 слайдов
    correct: a
    explanation: Простой и понятный формат.
    lessonId: j11-02
  - id: facilitator-neutral
    type: single
    prompt: Когда PM лучше пригласить внешнего фасилитатора ретро?
    options:
      - id: a
        text: Никогда
      - id: b
        text: Когда сам был участником спорных решений и трудно быть нейтральным
      - id: c
        text: Всегда
      - id: d
        text: Когда встреча короткая
    correct: b
    explanation: Фасилитатор ведёт процесс, а не содержание.
    lessonId: j11-02
  - id: ai-retro-groups
    type: single
    prompt: Как использовать ИИ на ретроспективе?
    options:
      - id: a
        text: Отдать модели выводы
      - id: b
        text: Попросить сгруппировать обезличенные стикеры, а группы и выводы обсудить командой
      - id: c
        text: Не использовать
      - id: d
        text: Попросить найти виноватых
    correct: b
    explanation: Модель помогает с механикой, решения — за командой.
    lessonId: j11-02
  - id: good-action
    type: single
    prompt: Какое действие по итогам ретро сформулировано лучше?
    options:
      - id: a
        text: «Лучше общаться»
      - id: b
        text:
          «С первой недели следующего проекта — еженедельный 15-минутный созвон с подрядчиком; PM включает
          его в план коммуникаций»
      - id: c
        text: «Стараться»
      - id: d
        text: «Не ошибаться»
    correct: b
    explanation: Конкретное действие с владельцем выполняют.
    lessonId: j11-02
  - id: positive-lessons
    type: single
    prompt: Нужно ли записывать положительные уроки?
    options:
      - id: a
        text: Нет, только ошибки
      - id: b
        text: Да — что сработало, стоит повторить
      - id: c
        text: Только по просьбе спонсора
      - id: d
        text: Только в больших проектах
    correct: b
    explanation: Сохранить удачные практики так же важно.
    lessonId: j11-03
  - id: lessons-registry
    type: single
    prompt: Где лучше хранить уроки проектов?
    options:
      - id: a
        text: В папке закрытого проекта
      - id: b
        text: В общем реестре уроков с метками по темам
      - id: c
        text: В личной почте
      - id: d
        text: Нигде
    correct: b
    explanation: Так их находят на старте новых проектов.
    lessonId: j11-03
  - id: read-lessons
    type: single
    prompt: Когда особенно полезно читать уроки прошлых проектов?
    options:
      - id: a
        text: На закрытии
      - id: b
        text: На старте нового проекта
      - id: c
        text: Никогда
      - id: d
        text: Раз в пять лет
    correct: b
    explanation: Рекомендации переносят в устав, реестр рисков и план.
    lessonId: j11-03
  - id: lessons-count-check
    type: single
    prompt: ИИ посчитал, что проблема встречается в 7 проектах из 12. Что сделать?
    options:
      - id: a
        text: Принять
      - id: b
        text: Пересчитать сами — модели ошибаются в подсчётах
      - id: c
        text: Удалить уроки
      - id: d
        text: Уменьшить число проектов
    correct: b
    explanation: Подсчёты модели проверяют.
    lessonId: j11-03
  - id: closure-sections
    type: multiple
    prompt: Что входит в отчёт о закрытии? Выберите все подходящие.
    options:
      - id: a
        text: Критерии успеха с фактами
      - id: b
        text: Отклонения по срокам и бюджету с причинами
      - id: c
        text: Уроки и незакрытые вопросы
      - id: d
        text: Оценки работы конкретных сотрудников
    correct:
      - a
      - b
      - c
    explanation: Уроки — про процесс, а не про людей.
    lessonId: j11-03
  - id: lessons-no-names
    type: single
    prompt: Почему в уроках проекта не пишут имён?
    options:
      - id: a
        text: Экономия места
      - id: b
        text: Уроки про процесс, а имена превращают их в поиск виноватых
      - id: c
        text: Так короче
      - id: d
        text: Это запрещено законом
    correct: b
    explanation: Иначе о проблемах перестанут говорить.
    lessonId: j11-03
  - id: warranty-tails
    type: single
    prompt: Заказчик после подписания акта нашёл некритичную ошибку. Как поступить?
    options:
      - id: a
        text: Возобновить проект
      - id: b
        text: Передать в поддержку по согласованной процедуре с приоритетом
      - id: c
        text: Игнорировать
    correct: b
    explanation: После приёмки работу ведёт поддержка.
    lessonId: j11-01
  - id: retro-no-boss
    type: single
    prompt: Присутствие руководителя сковывает команду на ретро. Что сделать?
    options:
      - id: a
        text: Провести ретро без него и передать ему выводы
      - id: b
        text: Отменить ретро
      - id: c
        text: Запретить говорить о проблемах
    correct: a
    explanation: Безопасность важнее формального состава.
    lessonId: j11-02
  - id: retro-anon
    type: single
    prompt: Как дать высказаться тем, кто не любит говорить при всех?
    options:
      - id: a
        text: Письменный сбор мнений — стикеры или анонимная форма
      - id: b
        text: Спрашивать по очереди громко
      - id: c
        text: Никак
    correct: a
    explanation: Письменный сбор снижает барьер.
    lessonId: j11-02
  - id: closure-lessons-where
    type: single
    prompt: Куда перенести рекомендации из уроков прошлого проекта на старте нового?
    options:
      - id: a
        text: В устав, реестр рисков и план
      - id: b
        text: В архив
      - id: c
        text: Никуда
    correct: a
    explanation: Так уроки меняют практику.
    lessonId: j11-03
  - id: closure-auto-off
    type: single
    prompt: Что сделать с автоматизациями и ботами проекта при закрытии?
    options:
      - id: a
        text: Отключить и отозвать доступы
      - id: b
        text: Оставить работать
      - id: c
        text: Передать всем
    correct: a
    explanation: Это пункт чек-листа закрытия.
    lessonId: j11-01
  - id: closure-archive
    type: single
    prompt: Что делать с документами закрытого проекта?
    options:
      - id: a
        text: Перенести в архив по правилам компании
      - id: b
        text: Удалить
      - id: c
        text: Разослать всем
    correct: a
    explanation: Архив нужен для уроков и аудита.
    lessonId: j11-01
