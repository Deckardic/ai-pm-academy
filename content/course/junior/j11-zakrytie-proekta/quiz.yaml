id: j11-quiz
kind: module
title: "Тест модуля: Закрытие проекта"
passScore: 0.7
questionsPerAttempt: 5
questions:
  - id: acceptance-criteria
    type: single
    prompt: "По чему проводят приёмку результата проекта?"
    options:
      - { id: a, text: "По впечатлению заказчика на демонстрации" }
      - { id: b, text: "По критериям приёмки, согласованным заранее в уставе, требованиях или договоре" }
      - { id: c, text: "По количеству закрытых задач в трекере" }
    correct: b
    explanation: "Без заранее согласованных критериев приёмка превращается в спор о вкусах."
    lessonId: j11-01
  - id: new-wishes
    type: single
    scenario: "На приёмке заказчик говорит «а давайте ещё добавим запись для родственников», хотя этого не было в границах проекта."
    prompt: "Как правильно поступить?"
    options:
      - { id: a, text: "Не подписывать акт, пока не сделаем" }
      - { id: b, text: "Зафиксировать как запрос на следующий этап, а приёмку проводить по согласованным критериям" }
      - { id: c, text: "Сделать бесплатно, чтобы не портить отношения" }
    correct: b
    explanation: "Новое пожелание — это новая работа, а не замечание к приёмке."
    lessonId: j11-01
  - id: handover
    type: multiple
    prompt: "Что нужно передать при передаче результата в эксплуатацию? Выберите все подходящие."
    options:
      - { id: a, text: "Документацию: как устроено и что делать при сбоях" }
      - { id: b, text: "Доступы к системам" }
      - { id: c, text: "Контакты и назначенного ответственного за поддержку" }
      - { id: d, text: "Личные телефоны разработчиков проекта для круглосуточной связи" }
    correct: [a, b, c]
    explanation: "Поддержка должна справляться сама. Личные телефоны команды проекта — признак того, что передачи не было."
    lessonId: j11-01
  - id: tails
    type: single
    prompt: "Что делать с незакрытыми мелкими задачами на момент приёмки?"
    options:
      - { id: a, text: "Оставить висеть — как-нибудь доделаем" }
      - { id: b, text: "Составить список с ответственными и сроками: сделать, передать в поддержку, перенести или отказаться" }
      - { id: c, text: "Удалить из трекера" }
    correct: b
    explanation: "Хвосты без владельца висят месяцами и не дают закрыть проект."
    lessonId: j11-01
  - id: retro-safety
    type: single
    prompt: "Что важнее всего для честной ретроспективы?"
    options:
      - { id: a, text: "Красивая онлайн-доска" }
      - { id: b, text: "Безопасная атмосфера: ищем причины в процессе, а не виноватых" }
      - { id: c, text: "Присутствие руководства" }
    correct: b
    explanation: "Люди говорят правду, когда уверены, что их не накажут."
    lessonId: j11-02
  - id: retro-actions
    type: single
    scenario: "На ретроспективе выписали 15 проблем."
    prompt: "Что лучше сделать?"
    options:
      - { id: a, text: "Записать все 15 в план улучшений" }
      - { id: b, text: "Выбрать 2–3 главные и превратить в конкретные действия с ответственными и сроками" }
      - { id: c, text: "Отправить список руководителю" }
    correct: b
    explanation: "Двадцать действий никто не выполнит. Два-три конкретных — реально изменят работу."
    lessonId: j11-02
  - id: format-4l
    type: multiple
    prompt: "Какие колонки есть в формате ретроспективы 4L? Выберите все подходящие."
    options:
      - { id: a, text: "Понравилось" }
      - { id: b, text: "Узнали" }
      - { id: c, text: "Не хватало" }
      - { id: d, text: "Хотелось бы" }
      - { id: e, text: "Кто виноват" }
    correct: [a, b, c, d]
    explanation: "4L — Liked, Learned, Lacked, Longed for. Поиска виноватых в ретроспективе нет."
    lessonId: j11-02
  - id: good-lesson
    type: single
    prompt: "Какой урок проекта сформулирован лучше?"
    options:
      - { id: a, text: "Надо лучше планировать" }
      - { id: b, text: "Юриста подключили на тестировании, форму согласия переделывали неделю; в проектах с персональными данными — согласование с юристом на этапе макетов" }
      - { id: c, text: "Юрист всё задержал" }
    correct: b
    explanation: "Хороший урок содержит ситуацию, причину и конкретную рекомендацию."
    lessonId: j11-03
  - id: lesson-learned
    type: single
    prompt: "Когда урок проекта можно считать выученным?"
    options:
      - { id: a, text: "Когда его записали в отчёт" }
      - { id: b, text: "Когда он изменил шаблоны, чек-листы или планы следующих проектов" }
      - { id: c, text: "Когда его обсудили на ретроспективе" }
    correct: b
    explanation: "Урок выучен, когда он изменил практику."
    lessonId: j11-03
  - id: closure-report
    type: single
    prompt: "Проект опоздал на две недели. Как отразить это в отчёте о закрытии?"
    options:
      - { id: a, text: "Не упоминать — проект же запущен" }
      - { id: b, text: "Честно: план и факт, причины отклонения, уроки" }
      - { id: c, text: "Написать, что сроки были перенесены по желанию заказчика" }
    correct: b
    explanation: "Приукрашенный отчёт лишает организацию возможности учиться."
    lessonId: j11-03
