id: j05-quiz
kind: module
title: "Тест модуля: Инициация проекта"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: smart-goal
    type: single
    prompt: "Какая формулировка — цель проекта по SMART?"
    options:
      - { id: a, text: "Улучшить работу регистратуры" }
      - { id: b, text: "Разработать и протестировать модуль онлайн-записи" }
      - { id: c, text: "К 1 декабря пациенты всех пяти отделений могут записаться к врачу на сайте без звонка" }
    correct: c
    explanation: "Третья формулировка конкретна, измерима, ограничена по времени и описывает результат. Первая размыта, вторая — список работ."
    lessonId: j05-01
  - id: business-vs-project-goal
    type: single
    prompt: "Что из этого — бизнес-цель, а не цель проекта?"
    options:
      - { id: a, text: "Снизить нагрузку на регистратуру" }
      - { id: b, text: "Запустить онлайн-запись на сайте к 1 декабря" }
      - { id: c, text: "Обучить администраторов работе с новой записью" }
    correct: a
    explanation: "Бизнес-цель описывает пользу для организации. Запуск записи — результат проекта, обучение — работа внутри проекта."
    lessonId: j05-01
  - id: goal-as-work-list
    type: single
    prompt: "Что не так с целью «Разработать модуль, провести тестирование и обучить администраторов»?"
    options:
      - { id: a, text: "Слишком короткая" }
      - { id: b, text: "Это список работ, а не результат" }
      - { id: c, text: "В ней нет бюджета" }
    correct: b
    explanation: "Работы могут быть выполнены, а результат не достигнут. Цель описывает результат."
    lessonId: j05-01
  - id: hidden-stakeholders
    type: multiple
    prompt: "Какие вопросы помогают найти неочевидных стейкхолдеров? Выберите все подходящие."
    options:
      - { id: a, text: "Чью работу изменит проект?" }
      - { id: b, text: "Кто может остановить или заблокировать проект?" }
      - { id: c, text: "Кого ещё стоит вовлечь, по мнению уже найденных стейкхолдеров?" }
      - { id: d, text: "Кто в компании самый дружелюбный?" }
    correct: [a, b, c]
    explanation: "Неочевидные стейкхолдеры — те, чью работу меняет проект, те, кто может его заблокировать, и те, о ком знают другие участники."
    lessonId: j05-02
  - id: power-interest
    type: single
    scenario: "Юрист клиники может остановить запуск, но пока проектом не интересуется."
    prompt: "Как с ним работать?"
    options:
      - { id: a, text: "Не беспокоить до запуска" }
      - { id: b, text: "Держать удовлетворённым: заранее согласовать решения в его зоне ответственности" }
      - { id: c, text: "Звать на все встречи команды" }
    correct: b
    explanation: "При высокой власти и низком интересе не перегружайте человека, но заранее согласуйте то, что он может заблокировать."
    lessonId: j05-02
  - id: hidden-expectations
    type: single
    prompt: "Какой приём лучше всего проявляет скрытые ожидания стейкхолдера?"
    options:
      - { id: a, text: "Спросить «у вас есть пожелания?»" }
      - { id: b, text: "Разобрать конкретные сценарии и показать ранние наброски" }
      - { id: c, text: "Ждать приёмки — там всё выяснится" }
    correct: b
    explanation: "Конкретные сценарии и макеты вызывают реакции, которые не всплывают в общих вопросах."
    lessonId: j05-02
  - id: charter-vs-plan
    type: single
    prompt: "Чем устав проекта отличается от плана проекта?"
    options:
      - { id: a, text: "Ничем" }
      - { id: b, text: "Устав фиксирует цель, границы и рамки и запускает проект; план детализирует работы и график" }
      - { id: c, text: "Устав пишет спонсор, а план — команда" }
    correct: b
    explanation: "Устав — договор о том, что и зачем делаем. План описывает, как это сделать."
    lessonId: j05-03
  - id: sponsor-signature
    type: multiple
    prompt: "Что означает подпись спонсора под уставом? Выберите все подходящие."
    options:
      - { id: a, text: "Организация берёт обязательства по проекту и выделяет ресурсы" }
      - { id: b, text: "У PM появляются полномочия действовать в рамках устава" }
      - { id: c, text: "Появляется точка отсчёта для управления изменениями" }
      - { id: d, text: "Проект больше нельзя изменить" }
    correct: [a, b, c]
    explanation: "Подпись фиксирует обязательства и полномочия и служит базой для изменений. Изменять проект можно — через процедуру изменений."
    lessonId: j05-03
  - id: charter-stuck
    type: single
    scenario: "Согласование устава идёт третью неделю — стейкхолдеры правят документ по очереди."
    prompt: "Что поможет?"
    options:
      - { id: a, text: "Ждать, пока все согласуют" }
      - { id: b, text: "Собрать разногласия на короткой встрече и установить дедлайн для замечаний" }
      - { id: c, text: "Начать работу без устава" }
    correct: b
    explanation: "Разногласия быстрее решаются на встрече, а дедлайн не даёт согласованию растягиваться."
    lessonId: j05-03
  - id: out-of-scope
    type: single
    prompt: "Зачем в границах проекта раздел «не входит»?"
    options:
      - { id: a, text: "Чтобы отказать заказчику в лишних работах" }
      - { id: b, text: "Чтобы сделать видимыми ожидания, которые заказчик считает само собой разумеющимися" }
      - { id: c, text: "Он нужен только в больших проектах" }
    correct: b
    explanation: "«Не входит» выявляет скрытые ожидания на старте, когда их дешевле обсудить."
    lessonId: j05-04
  - id: assumption
    type: single
    prompt: "«Подрядчик даст доступ к расписанию в первую неделю» — это…"
    options:
      - { id: a, text: "Допущение: на нём строится план, и его нужно проверить" }
      - { id: b, text: "Ограничение: его нельзя изменить" }
      - { id: c, text: "Критерий успеха" }
    correct: a
    explanation: "Допущение считается верным без доказательства. Если оно ложное, план придётся менять."
    lessonId: j05-04
  - id: scope-creep
    type: single
    scenario: "Заказчик просит «ещё одно маленькое поле» в форме записи. Этого нет в границах проекта."
    prompt: "Что делать?"
    options:
      - { id: a, text: "Сделать молча — это мелочь" }
      - { id: b, text: "Назвать это изменением, оценить влияние и зафиксировать решение" }
      - { id: c, text: "Отказать без обсуждения" }
    correct: b
    explanation: "Маленькие просьбы складываются в недели работы. Каждую фиксируют как изменение, даже если решили сделать."
    lessonId: j05-04
