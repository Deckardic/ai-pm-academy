id: j05-quiz
kind: module
title: "Тест модуля: Инициация проекта"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: smart-goal
    type: single
    prompt: Какая формулировка — цель проекта по SMART?
    options:
      - id: a
        text: Улучшить работу регистратуры
      - id: b
        text: Разработать и протестировать модуль онлайн-записи
      - id: c
        text: К 1 декабря пациенты всех пяти отделений могут записаться к врачу на сайте без звонка
    correct: c
    explanation:
      Третья формулировка конкретна, измерима, ограничена по времени и описывает результат. Первая
      размыта, вторая — список работ.
    lessonId: j05-01
  - id: business-vs-project-goal
    type: single
    prompt: Что из этого — бизнес-цель, а не цель проекта?
    options:
      - id: a
        text: Снизить нагрузку на регистратуру
      - id: b
        text: Запустить онлайн-запись на сайте к 1 декабря
      - id: c
        text: Обучить администраторов работе с новой записью
    correct: a
    explanation:
      Бизнес-цель описывает пользу для организации. Запуск записи — результат проекта, обучение
      — работа внутри проекта.
    lessonId: j05-01
  - id: goal-as-work-list
    type: single
    prompt: Что не так с целью «Разработать модуль, провести тестирование и обучить администраторов»?
    options:
      - id: a
        text: Слишком короткая
      - id: b
        text: Это список работ, а не результат
      - id: c
        text: В ней нет бюджета
    correct: b
    explanation: Работы могут быть выполнены, а результат не достигнут. Цель описывает результат.
    lessonId: j05-01
  - id: hidden-stakeholders
    type: multiple
    prompt: Какие вопросы помогают найти неочевидных стейкхолдеров? Выберите все подходящие.
    options:
      - id: a
        text: Чью работу изменит проект?
      - id: b
        text: Кто может остановить или заблокировать проект?
      - id: c
        text: Кого ещё стоит вовлечь, по мнению уже найденных стейкхолдеров?
      - id: d
        text: Кто в компании самый дружелюбный?
    correct:
      - a
      - b
      - c
    explanation:
      Неочевидные стейкхолдеры — те, чью работу меняет проект, те, кто может его заблокировать,
      и те, о ком знают другие участники.
    lessonId: j05-02
  - id: power-interest
    type: single
    scenario: Юрист клиники может остановить запуск, но пока проектом не интересуется.
    prompt: Как с ним работать?
    options:
      - id: a
        text: Не беспокоить до запуска
      - id: b
        text: "Держать удовлетворённым: заранее согласовать решения в его зоне ответственности"
      - id: c
        text: Звать на все встречи команды
    correct: b
    explanation:
      При высокой власти и низком интересе не перегружайте человека, но заранее согласуйте то,
      что он может заблокировать.
    lessonId: j05-02
  - id: hidden-expectations
    type: single
    prompt: Какой приём лучше всего проявляет скрытые ожидания стейкхолдера?
    options:
      - id: a
        text: Спросить «у вас есть пожелания?»
      - id: b
        text: Разобрать конкретные сценарии и показать ранние наброски
      - id: c
        text: Ждать приёмки — там всё выяснится
    correct: b
    explanation: Конкретные сценарии и макеты вызывают реакции, которые не всплывают в общих вопросах.
    lessonId: j05-02
  - id: charter-vs-plan
    type: single
    prompt: Чем устав проекта отличается от плана проекта?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Устав фиксирует цель, границы и рамки и запускает проект; план детализирует работы и график
      - id: c
        text: Устав пишет спонсор, а план — команда
    correct: b
    explanation: Устав — договор о том, что и зачем делаем. План описывает, как это сделать.
    lessonId: j05-03
  - id: sponsor-signature
    type: multiple
    prompt: Что означает подпись спонсора под уставом? Выберите все подходящие.
    options:
      - id: a
        text: Организация берёт обязательства по проекту и выделяет ресурсы
      - id: b
        text: У PM появляются полномочия действовать в рамках устава
      - id: c
        text: Появляется точка отсчёта для управления изменениями
      - id: d
        text: Проект больше нельзя изменить
    correct:
      - a
      - b
      - c
    explanation:
      Подпись фиксирует обязательства и полномочия и служит базой для изменений. Изменять проект
      можно — через процедуру изменений.
    lessonId: j05-03
  - id: charter-stuck
    type: single
    scenario: Согласование устава идёт третью неделю — стейкхолдеры правят документ по очереди.
    prompt: Что поможет?
    options:
      - id: a
        text: Ждать, пока все согласуют
      - id: b
        text: Собрать разногласия на короткой встрече и установить дедлайн для замечаний
      - id: c
        text: Начать работу без устава
    correct: b
    explanation: Разногласия быстрее решаются на встрече, а дедлайн не даёт согласованию растягиваться.
    lessonId: j05-03
  - id: out-of-scope
    type: single
    prompt: Зачем в границах проекта раздел «не входит»?
    options:
      - id: a
        text: Чтобы отказать заказчику в лишних работах
      - id: b
        text: Чтобы сделать видимыми ожидания, которые заказчик считает само собой разумеющимися
      - id: c
        text: Он нужен только в больших проектах
    correct: b
    explanation: «Не входит» выявляет скрытые ожидания на старте, когда их дешевле обсудить.
    lessonId: j05-04
  - id: assumption
    type: single
    prompt: «Подрядчик даст доступ к расписанию в первую неделю» — это…
    options:
      - id: a
        text: "Допущение: на нём строится план, и его нужно проверить"
      - id: b
        text: "Ограничение: его нельзя изменить"
      - id: c
        text: Критерий успеха
    correct: a
    explanation: Допущение считается верным без доказательства. Если оно ложное, план придётся менять.
    lessonId: j05-04
  - id: scope-creep
    type: single
    scenario: Заказчик просит «ещё одно маленькое поле» в форме записи. Этого нет в границах проекта.
    prompt: Что делать?
    options:
      - id: a
        text: Сделать молча — это мелочь
      - id: b
        text: Назвать это изменением, оценить влияние и зафиксировать решение
      - id: c
        text: Отказать без обсуждения
    correct: b
    explanation:
      Маленькие просьбы складываются в недели работы. Каждую фиксируют как изменение, даже если
      решили сделать.
    lessonId: j05-04
  - id: smart-m
    type: single
    prompt: Что означает буква M в SMART?
    options:
      - id: a
        text: Мотивирующая
      - id: b
        text: Измеримая
      - id: c
        text: Минимальная
      - id: d
        text: Массовая
    correct: b
    explanation: Measurable — есть способ проверить, что результат достигнут.
    lessonId: j05-01
  - id: smart-a
    type: single
    prompt:
      Команда из трёх человек должна за месяц запустить запись, кабинет, телемедицину и приложение.
      Какой критерий SMART нарушен?
    options:
      - id: a
        text: Конкретность
      - id: b
        text: Достижимость
      - id: c
        text: Срок
      - id: d
        text: Значимость
    correct: b
    explanation: Цель недостижима при таких ресурсах — её нужно сузить.
    lessonId: j05-01
  - id: too-many-goals
    type: single
    prompt: У проекта пять равноправных целей. Что это скорее всего означает?
    options:
      - id: a
        text: Всё хорошо
      - id: b
        text: Это пять проектов; нужна одна главная цель и критерии успеха
      - id: c
        text: Нужно шестую
      - id: d
        text: Цели не нужны
    correct: b
    explanation: Обычно у проекта одна главная цель.
    lessonId: j05-01
  - id: goal-ask-customer
    type: single
    prompt: Заказчик сформулировал цель «улучшить работу регистратуры». Что делает PM?
    options:
      - id: a
        text: Принимает как есть
      - id: b
        text: Задаёт вопросы, пока цель не станет проверяемой, и согласует формулировку
      - id: c
        text: Сам придумывает цель
      - id: d
        text: Отказывается от проекта
    correct: b
    explanation: Заказчик не обязан знать SMART; превратить пожелание в цель — работа PM.
    lessonId: j05-01
  - id: goal-link
    type: single
    prompt: Какой вопрос проверяет связь цели проекта с бизнес-целью?
    options:
      - id: a
        text: «Сколько это стоит?»
      - id: b
        text: «Как наш результат поможет достичь этой пользы?»
      - id: c
        text: «Кто будет делать?»
      - id: d
        text: «Когда отпуск?»
    correct: b
    explanation: Иногда ответ показывает, что нужен другой проект.
    lessonId: j05-01
  - id: ask-who-else
    type: single
    prompt: Какой вопрос стоит задать каждому стейкхолдеру на старте?
    options:
      - id: a
        text: «Кого ещё стоит вовлечь?»
      - id: b
        text: «Какой у вас бюджет на обед?»
      - id: c
        text: «Вы довольны?»
      - id: d
        text: «Сколько вам лет?»
    correct: a
    explanation: Стейкхолдеры знают неочевидных участников.
    lessonId: j05-02
  - id: invite-extra
    type: single
    prompt: "Что лучше: позвать лишнего стейкхолдера или пропустить важного?"
    options:
      - id: a
        text: Пропустить — меньше встреч
      - id: b
        text: "Позвать лишнего: его легко перестать приглашать, а пропущенный может остановить проект на приёмке"
      - id: c
        text: Всё равно
      - id: d
        text: Никого не звать
    correct: b
    explanation: Цена пропуска гораздо выше.
    lessonId: j05-02
  - id: low-power-high-interest
    type: single
    prompt: "Администраторы регистратуры: власть низкая, интерес высокий. Как работать?"
    options:
      - id: a
        text: Наблюдать
      - id: b
        text: Держать в курсе и собирать обратную связь
      - id: c
        text: Управлять плотно
      - id: d
        text: Игнорировать
    correct: b
    explanation: Они будут жить с системой каждый день — их опыт важен.
    lessonId: j05-02
  - id: interview-summary
    type: single
    prompt: Что сделать после первого интервью со стейкхолдером?
    options:
      - id: a
        text: Ничего
      - id: b
        text: В тот же день отправить короткое резюме и попросить поправить
      - id: c
        text: Переслать запись всем
      - id: d
        text: Через месяц напомнить
    correct: b
    explanation: Резюме закрепляет понимание и показывает уважение.
    lessonId: j05-02
  - id: what-not-happen
    type: single
    prompt: Какой вопрос хорошо проявляет скрытые ожидания?
    options:
      - id: a
        text: «Всё понятно?»
      - id: b
        text: «Что точно не должно произойти в результате проекта?»
      - id: c
        text: «Какой у вас любимый цвет?»
      - id: d
        text: «Вы согласны?»
    correct: b
    explanation: Ответы о недопустимом раскрывают ожидания лучше прямых вопросов.
    lessonId: j05-02
  - id: charter-sections
    type: multiple
    prompt: Какие разделы входят в минимальный устав? Выберите все подходящие.
    options:
      - id: a
        text: Цель и критерии успеха
      - id: b
        text: Границы и ключевые вехи
      - id: c
        text: Полномочия PM
      - id: d
        text: Детальный график всех задач
    correct:
      - a
      - b
      - c
    explanation: Детальный график — часть плана, а не устава.
    lessonId: j05-03
  - id: charter-small-company
    type: single
    prompt: В небольшой компании нет формальных подписей. Что считать утверждением устава?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Явное письменное «да» от спонсора, например в почте
      - id: c
        text: Устное «ну ок» в коридоре
      - id: d
        text: Лайк в чате
    correct: b
    explanation: Главное — явное подтверждение человека, отвечающего за проект.
    lessonId: j05-03
  - id: charter-draft-time
    type: single
    prompt: Когда писать черновик устава после встречи с заказчиком?
    options:
      - id: a
        text: Через месяц
      - id: b
        text: В течение суток, пока все помнят договорённости
      - id: c
        text: Перед закрытием проекта
      - id: d
        text: Не писать
    correct: b
    explanation: Быстрый черновик уменьшает расхождения в памяти участников.
    lessonId: j05-03
  - id: charter-deadline
    type: single
    prompt: Как ускорить согласование устава?
    options:
      - id: a
        text: Рассылать правки по одному
      - id: b
        text: Разослать с дедлайном для замечаний и решить разногласия на короткой встрече
      - id: c
        text: Ждать, пока все прочитают
      - id: d
        text: Не согласовывать
    correct: b
    explanation: Дедлайн и встреча не дают согласованию растянуться.
    lessonId: j05-03
  - id: charter-unknown
    type: single
    prompt: Что делать с разделом устава, по которому пока нет данных?
    options:
      - id: a
        text: Выдумать
      - id: b
        text: Записать как допущение или открытый вопрос с датой решения
      - id: c
        text: Удалить раздел
      - id: d
        text: Отложить устав
    correct: b
    explanation: Устав не обязан ответить на всё.
    lessonId: j05-03
  - id: ai-charter-check
    type: single
    prompt: Что особенно проверить в черновике устава от ИИ?
    options:
      - id: a
        text: Шрифт
      - id: b
        text: Раздел «входит» — модель любит добавлять необсуждённое
      - id: c
        text: Количество слов
      - id: d
        text: Порядок разделов
    correct: b
    explanation: Лишнее в «входит» создаст ложные ожидания.
    lessonId: j05-03
  - id: constraint-example
    type: single
    prompt: Что из этого — ограничение?
    options:
      - id: a
        text: «Подрядчик даст доступ в первую неделю»
      - id: b
        text: «Данные пациентов хранятся только в России»
      - id: c
        text: «Расписание врачей актуально»
      - id: d
        text: «Администраторы пройдут обучение»
    correct: b
    explanation: Требование к хранению данных нельзя изменить — это ограничение.
    lessonId: j05-04
  - id: not-included-tone
    type: single
    prompt: Как сформулировать пункт «не входит», чтобы не звучать отказом?
    options:
      - id: a
        text: «Не будем делать никогда»
      - id: b
        text: «Не входит в этот проект; можно рассмотреть следующим этапом»
      - id: c
        text: Не писать вовсе
      - id: d
        text: «Это не наша работа»
    correct: b
    explanation: Вы договариваетесь о порядке, а не отказываете.
    lessonId: j05-04
  - id: change-path
    type: order
    prompt: Расположите шаги реакции на просьбу вне границ проекта.
    items:
      - id: a
        text: Сравнить с границами
      - id: b
        text: Назвать изменением
      - id: c
        text: Оценить влияние
      - id: d
        text: Предложить варианты
      - id: e
        text: Зафиксировать решение
    explanation: Спокойная процедура превращает просьбу в осознанное решение.
    lessonId: j05-04
  - id: assumption-risk
    type: single
    prompt: Как связаны допущения и риски?
    options:
      - id: a
        text: Никак
      - id: b
        text: Каждое непроверенное допущение — потенциальный риск
      - id: c
        text: Допущения важнее рисков
      - id: d
        text: Риски — это допущения заказчика
    correct: b
    explanation: Поэтому допущения проверяют как можно раньше.
    lessonId: j05-04
  - id: ai-hidden-work
    type: single
    prompt: Как ИИ помогает с границами проекта?
    options:
      - id: a
        text: Утверждает границы
      - id: b
        text: Предлагает функции и работы, которые заказчик может неявно ожидать
      - id: c
        text: Подписывает устав
      - id: d
        text: Никак
    correct: b
    explanation: Каждое предложение — вопрос для обсуждения, а не решение.
    lessonId: j05-04
