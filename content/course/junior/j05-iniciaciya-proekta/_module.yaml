lessonsPlan:
- slug: celi-proekta-smart
  title: Цели проекта и SMART
  focus: как формулировать измеримые цели
  durationMin: 12
  keyPoints:
  - Бизнес-цель и цель проекта
  - Критерии SMART на примерах
  - Цель — результат, а не список работ
  - Типичные ошибки формулировок
  aiAngle: ИИ проверяет цель на SMART и предлагает варианты формулировок
  practice: Переписать 4 размытые цели по SMART
- slug: steykholdery-na-starte
  title: Стейкхолдеры на старте
  focus: кого вовлекать и как узнать их ожидания
  durationMin: 12
  keyPoints:
  - Как найти всех заинтересованных, включая неочевидных
  - 'Базовая карта: власть и интерес'
  - 'Первое интервью: цель, вопросы, фиксация'
  - Скрытые ожидания и как их проявить
  aiAngle: подготовка вопросов к интервью с помощью ИИ
  practice: Составить карту стейкхолдеров учебного проекта
- slug: ustav-proekta
  title: Устав проекта
  focus: документ, который официально запускает проект
  durationMin: 13
  keyPoints:
  - Структура устава на одну страницу
  - Зачем подпись спонсора
  - Как согласовывать устав и не застрять
  - Черновик устава с ИИ по вводным встречи
  practice: Собрать устав учебного проекта по шаблону
- slug: granicy-proekta
  title: Границы проекта
  focus: что входит и что не входит в проект
  durationMin: 11
  keyPoints:
  - Описание содержания проекта
  - Раздел «не входит» обязателен
  - Допущения и ограничения
  - Как границы защищают от разрастания
  aiAngle: ИИ ищет неявные работы, которые заказчик может считать «само собой разумеющимися»
  practice: Выписать 5 пунктов «не входит» для учебного проекта
assignment:
