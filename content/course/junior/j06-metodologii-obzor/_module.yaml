id: j06
slug: metodologii-obzor
order: 6
title: "Методологии: обзор"
summary: Waterfall, Agile, Scrum, Kanban и гибрид — когда что выбирать.
goals:
  - Понимать идеи Waterfall и Agile
  - Знать базу Scrum и Kanban
  - Выбирать подход под проект
status: published
artifact: Шпаргалка выбора подхода
keyConcepts:
  - Waterfall
  - Agile
  - Scrum
  - Kanban
  - гибрид
searchQueries:
  - agile и waterfall разница
  - scrum или kanban что выбрать
lessonsPlan:
  - slug: waterfall
    title: Каскадная модель (Waterfall)
    focus: "последовательный подход: когда он уместен"
    durationMin: 11
    keyPoints:
      - Последовательные этапы и контрольные точки
      - "Где подходит: стабильные требования, регуляторика, стройка"
      - Главный риск — поздняя обратная связь
      - Waterfall — не синоним «плохо»
    practice: Определить, подходит ли каскад для трёх проектов
  - slug: agile-manifest
    title: "Agile: ценности и принципы"
    focus: откуда появился Agile и что он меняет
    durationMin: 11
    keyPoints:
      - Четыре ценности манифеста
      - Итеративная поставка и обратная связь
      - Agile — про неопределённость, а не про скорость
      - "Мифы: «без планов» и «без документации»"
    practice: Найти в своём опыте пример, где помогла бы короткая итерация
  - slug: scrum-i-kanban-osnovy
    title: "Scrum и Kanban: основа"
    focus: ключевые элементы двух самых популярных подходов
    durationMin: 13
    keyPoints:
      - "Scrum: роли, события, артефакты, спринт"
      - "Kanban: визуализация, ограничение работы в процессе, поток"
      - Чем они принципиально отличаются
      - Что взять из каждого в небольшой команде
    practice: Нарисовать доску для учебного проекта в Scrum и в Kanban
  - slug: kak-vybrat-podhod
    title: Как выбрать подход
    focus: критерии выбора и гибридные варианты
    durationMin: 12
    keyPoints:
      - Неопределённость требований и технологий
      - Договор, бюджет и регуляторика
      - Готовность заказчика участвовать
      - "Гибрид: каскад на верхнем уровне, итерации внутри"
    aiAngle: "ИИ как собеседник: разобрать аргументы за и против подхода для конкретного проекта"
    practice: Выбрать подход для трёх кейсов и обосновать
assignment:
  title: Шпаргалка выбора подхода
  deliverable: Таблица критериев и три разобранных кейса
  brief: Критерии выбора между Waterfall, Scrum, Kanban и гибридом; применение к трём кейсам с обоснованием.
quizFocus:
  - когда уместен Waterfall
  - ценности Agile
  - элементы Scrum
  - принципы Kanban
  - критерии выбора подхода
