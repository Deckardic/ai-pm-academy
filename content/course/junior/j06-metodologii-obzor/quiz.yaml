id: j06-quiz
kind: module
title: "Тест модуля: Методологии — обзор"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: waterfall-fit
    type: single
    prompt: "В каком проекте каскадная модель уместнее всего?"
    options:
      - { id: a, text: "Новое мобильное приложение, где неясно, что понравится пользователям" }
      - {
          id: b,
          text: "Ремонт офиса по утверждённому дизайн-проекту с фиксированной датой переезда",
        }
      - { id: c, text: "Поиск идеи нового продукта" }
    correct: b
    explanation: "Каскад подходит, когда требования известны, изменения дороги, а результат нельзя поставлять частями."
    lessonId: j06-01
  - id: waterfall-risk
    type: single
    prompt: "Какой главный риск каскадной модели?"
    options:
      - { id: a, text: "Поздняя обратная связь: ошибки в требованиях выясняются на приёмке" }
      - { id: b, text: "Слишком много встреч" }
      - { id: c, text: "Нет плана проекта" }
    correct: a
    explanation: "Заказчик видит результат в конце, когда переделывать дороже всего. Риск снижают прототипы и промежуточные демонстрации."
    lessonId: j06-01
  - id: waterfall-order
    type: order
    prompt: "Расположите этапы каскадной модели по порядку."
    items:
      - { id: a, text: "Требования" }
      - { id: b, text: "Проектирование" }
      - { id: c, text: "Реализация" }
      - { id: d, text: "Проверка" }
      - { id: e, text: "Внедрение" }
    explanation: "В каскаде этапы идут строго последовательно — от требований к внедрению."
    lessonId: j06-01
  - id: agile-values
    type: multiple
    prompt: "Что Манифест Agile ценит больше? Выберите все подходящие."
    options:
      - { id: a, text: "Люди и взаимодействие" }
      - { id: b, text: "Работающий продукт" }
      - { id: c, text: "Готовность к изменениям" }
      - { id: d, text: "Исчерпывающая документация" }
      - { id: e, text: "Следование первоначальному плану" }
    correct: [a, b, c]
    explanation: "Манифест ценит людей, работающий продукт, сотрудничество и изменения больше, чем процессы, документацию, контракты и план."
    lessonId: j06-02
  - id: agile-purpose
    type: single
    prompt: "Для чего Agile подходит лучше всего?"
    options:
      - { id: a, text: "Чтобы делать всё быстрее" }
      - { id: b, text: "Чтобы работать в условиях неопределённости, получая раннюю обратную связь" }
      - { id: c, text: "Чтобы отказаться от планов и документации" }
    correct: b
    explanation: "Agile про неопределённость. Итерации требуют времени и не ускоряют работу автоматически."
    lessonId: j06-02
  - id: agile-chaos
    type: single
    scenario: "В команде нет приоритетов и планов, задачи меняются по звонку руководителя каждый день. Руководитель называет это Agile."
    prompt: "Прав ли он?"
    options:
      - { id: a, text: "Да, это и есть гибкость" }
      - {
          id: b,
          text: "Нет, это хаос: гибкость требует коротких циклов, прозрачных приоритетов и обратной связи",
        }
      - { id: c, text: "Да, если команда маленькая" }
    correct: b
    explanation: "Agile — это дисциплина итераций и обратной связи, а не отсутствие правил."
    lessonId: j06-02
  - id: scrum-events
    type: multiple
    prompt: "Какие события есть в Scrum? Выберите все подходящие."
    options:
      - { id: a, text: "Планирование спринта" }
      - { id: b, text: "Ежедневный Scrum" }
      - { id: c, text: "Обзор спринта" }
      - { id: d, text: "Ретроспектива спринта" }
      - { id: e, text: "Ежемесячный отчёт спонсору" }
    correct: [a, b, c, d]
    explanation: "В Scrum пять событий — спринт, планирование, ежедневный Scrum, обзор и ретроспектива. Отчёт спонсору в Scrum не входит."
    lessonId: j06-03
  - id: product-owner
    type: single
    prompt: "Кто в Scrum отвечает за приоритеты бэклога продукта?"
    options:
      - { id: a, text: "Scrum Master" }
      - { id: b, text: "Product Owner" }
      - { id: c, text: "Проект-менеджер" }
    correct: b
    explanation: "Product Owner отвечает за ценность продукта и порядок бэклога. Роли проект-менеджера в Scrum нет."
    lessonId: j06-03
  - id: wip-purpose
    type: single
    prompt: "Зачем в Kanban ограничивают работу в процессе (WIP-лимиты)?"
    options:
      - { id: a, text: "Чтобы команда меньше работала" }
      - { id: b, text: "Чтобы заканчивать начатое, а не копить незавершённые задачи" }
      - { id: c, text: "Чтобы доска выглядела аккуратно" }
    correct: b
    explanation: "Когда задач в работе меньше, каждая быстрее доходит до конца."
    lessonId: j06-03
  - id: support-approach
    type: single
    scenario: "Команда поддержки получает заявки весь день, срочность каждой заранее неизвестна."
    prompt: "Какой подход подходит лучше?"
    options:
      - { id: a, text: "Scrum с двухнедельными спринтами" }
      - { id: b, text: "Kanban с WIP-лимитами и приоритетами" }
      - { id: c, text: "Каскадная модель" }
    correct: b
    explanation: "Поток заявок с разной срочностью плохо укладывается в спринты. Kanban позволяет менять приоритеты в любой момент."
    lessonId: j06-03
  - id: hybrid-case
    type: single
    scenario: "Бюджет и дата запуска зафиксированы, но детали интерфейса станут понятны только после показа пользователям."
    prompt: "Какой подход разумнее?"
    options:
      - { id: a, text: "Чистый каскад с подробным ТЗ" }
      - { id: b, text: "Гибрид: вехи и бюджет фиксированы, разработка идёт итерациями с показами" }
      - { id: c, text: "Kanban без сроков" }
    correct: b
    explanation: "Фиксированные рамки требуют вех, а неопределённость деталей — итераций. Это классический гибрид."
    lessonId: j06-04
  - id: customer-involvement
    type: single
    prompt: "Заказчик готов появляться только на старте и на приёмке. Что это значит для выбора подхода?"
    options:
      - { id: a, text: "Ничего" }
      - {
          id: b,
          text: "Итерации теряют смысл без обратной связи — нужен тщательный сбор требований на старте",
        }
      - { id: c, text: "Нужно обязательно работать по Scrum" }
    correct: b
    explanation: "Гибкие подходы требуют регулярного участия заказчика. Без него обратную связь получить не от кого."
    lessonId: j06-04
