id: j06-quiz
kind: module
title: "Тест модуля: Методологии — обзор"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: waterfall-fit
    type: single
    prompt: В каком проекте каскадная модель уместнее всего?
    options:
      - id: a
        text: Новое мобильное приложение, где неясно, что понравится пользователям
      - id: b
        text: Ремонт офиса по утверждённому дизайн-проекту с фиксированной датой переезда
      - id: c
        text: Поиск идеи нового продукта
    correct: b
    explanation:
      Каскад подходит, когда требования известны, изменения дороги, а результат нельзя поставлять
      частями.
    lessonId: j06-01
  - id: waterfall-risk
    type: single
    prompt: Какой главный риск каскадной модели?
    options:
      - id: a
        text: "Поздняя обратная связь: ошибки в требованиях выясняются на приёмке"
      - id: b
        text: Слишком много встреч
      - id: c
        text: Нет плана проекта
    correct: a
    explanation:
      Заказчик видит результат в конце, когда переделывать дороже всего. Риск снижают прототипы
      и промежуточные демонстрации.
    lessonId: j06-01
  - id: waterfall-order
    type: order
    prompt: Расположите этапы каскадной модели по порядку.
    items:
      - id: a
        text: Требования
      - id: b
        text: Проектирование
      - id: c
        text: Реализация
      - id: d
        text: Проверка
      - id: e
        text: Внедрение
    explanation: В каскаде этапы идут строго последовательно — от требований к внедрению.
    lessonId: j06-01
  - id: agile-values
    type: multiple
    prompt: Что Манифест Agile ценит больше? Выберите все подходящие.
    options:
      - id: a
        text: Люди и взаимодействие
      - id: b
        text: Работающий продукт
      - id: c
        text: Готовность к изменениям
      - id: d
        text: Исчерпывающая документация
      - id: e
        text: Следование первоначальному плану
    correct:
      - a
      - b
      - c
    explanation:
      Манифест ценит людей, работающий продукт, сотрудничество и изменения больше, чем процессы,
      документацию, контракты и план.
    lessonId: j06-02
  - id: agile-purpose
    type: single
    prompt: Для чего Agile подходит лучше всего?
    options:
      - id: a
        text: Чтобы делать всё быстрее
      - id: b
        text: Чтобы работать в условиях неопределённости, получая раннюю обратную связь
      - id: c
        text: Чтобы отказаться от планов и документации
    correct: b
    explanation: Agile про неопределённость. Итерации требуют времени и не ускоряют работу автоматически.
    lessonId: j06-02
  - id: agile-chaos
    type: single
    scenario:
      В команде нет приоритетов и планов, задачи меняются по звонку руководителя каждый день. Руководитель
      называет это Agile.
    prompt: Прав ли он?
    options:
      - id: a
        text: Да, это и есть гибкость
      - id: b
        text: "Нет, это хаос: гибкость требует коротких циклов, прозрачных приоритетов и обратной связи"
      - id: c
        text: Да, если команда маленькая
    correct: b
    explanation: Agile — это дисциплина итераций и обратной связи, а не отсутствие правил.
    lessonId: j06-02
  - id: scrum-events
    type: multiple
    prompt: Какие события есть в Scrum? Выберите все подходящие.
    options:
      - id: a
        text: Планирование спринта
      - id: b
        text: Ежедневный Scrum
      - id: c
        text: Обзор спринта
      - id: d
        text: Ретроспектива спринта
      - id: e
        text: Ежемесячный отчёт спонсору
    correct:
      - a
      - b
      - c
      - d
    explanation:
      В Scrum пять событий — спринт, планирование, ежедневный Scrum, обзор и ретроспектива. Отчёт
      спонсору в Scrum не входит.
    lessonId: j06-03
  - id: product-owner
    type: single
    prompt: Кто в Scrum отвечает за приоритеты бэклога продукта?
    options:
      - id: a
        text: Scrum Master
      - id: b
        text: Product Owner
      - id: c
        text: Проект-менеджер
    correct: b
    explanation:
      Product Owner отвечает за ценность продукта и порядок бэклога. Роли проект-менеджера в
      Scrum нет.
    lessonId: j06-03
  - id: wip-purpose
    type: single
    prompt: Зачем в Kanban ограничивают работу в процессе (WIP-лимиты)?
    options:
      - id: a
        text: Чтобы команда меньше работала
      - id: b
        text: Чтобы заканчивать начатое, а не копить незавершённые задачи
      - id: c
        text: Чтобы доска выглядела аккуратно
    correct: b
    explanation: Когда задач в работе меньше, каждая быстрее доходит до конца.
    lessonId: j06-03
  - id: support-approach
    type: single
    scenario: Команда поддержки получает заявки весь день, срочность каждой заранее неизвестна.
    prompt: Какой подход подходит лучше?
    options:
      - id: a
        text: Scrum с двухнедельными спринтами
      - id: b
        text: Kanban с WIP-лимитами и приоритетами
      - id: c
        text: Каскадная модель
    correct: b
    explanation:
      Поток заявок с разной срочностью плохо укладывается в спринты. Kanban позволяет менять
      приоритеты в любой момент.
    lessonId: j06-03
  - id: hybrid-case
    type: single
    scenario:
      Бюджет и дата запуска зафиксированы, но детали интерфейса станут понятны только после показа
      пользователям.
    prompt: Какой подход разумнее?
    options:
      - id: a
        text: Чистый каскад с подробным ТЗ
      - id: b
        text: "Гибрид: вехи и бюджет фиксированы, разработка идёт итерациями с показами"
      - id: c
        text: Kanban без сроков
    correct: b
    explanation:
      Фиксированные рамки требуют вех, а неопределённость деталей — итераций. Это классический
      гибрид.
    lessonId: j06-04
  - id: customer-involvement
    type: single
    prompt: Заказчик готов появляться только на старте и на приёмке. Что это значит для выбора подхода?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Итерации теряют смысл без обратной связи — нужен тщательный сбор требований на старте
      - id: c
        text: Нужно обязательно работать по Scrum
    correct: b
    explanation:
      Гибкие подходы требуют регулярного участия заказчика. Без него обратную связь получить
      не от кого.
    lessonId: j06-04
  - id: waterfall-gates
    type: single
    prompt: Что стоит между этапами каскадной модели?
    options:
      - id: a
        text: Ничего
      - id: b
        text: "Контрольные точки: следующий этап начинается после принятия результата предыдущего"
      - id: c
        text: Спринты
      - id: d
        text: Ретроспективы
    correct: b
    explanation: Возвращаться назад можно, но дорого.
    lessonId: j06-01
  - id: waterfall-strength
    type: single
    prompt: В чём сильная сторона каскада?
    options:
      - id: a
        text: Гибкость к изменениям
      - id: b
        text: Предсказуемость плана, бюджета и сроков при известных требованиях
      - id: c
        text: Частая обратная связь
      - id: d
        text: Отсутствие документов
    correct: b
    explanation: Если требования известны, заказчик с начала знает, что и когда получит.
    lessonId: j06-01
  - id: waterfall-mitigate
    type: single
    prompt: Как снизить риск поздней обратной связи, не отказываясь от каскада?
    options:
      - id: a
        text: Никак
      - id: b
        text: Прототипы, промежуточные демонстрации, тщательное выявление требований
      - id: c
        text: Сократить тестирование
      - id: d
        text: Убрать контрольные точки
    correct: b
    explanation: Это позволяет рано увидеть ошибки понимания.
    lessonId: j06-01
  - id: royce
    type: single
    prompt: Что интересного в статье Ройса 1970 года, которую считают описанием каскада?
    options:
      - id: a
        text: Она запрещала итерации
      - id: b
        text: Она сама предупреждала о рисках строгой последовательности и предлагала возвраты и прототипы
      - id: c
        text: Она про Scrum
      - id: d
        text: Она про стройку
    correct: b
    explanation: Строгий «водопад» — упрощение, а не замысел автора.
    lessonId: j06-01
  - id: waterfall-not-working
    type: single
    prompt: Какой признак говорит, что каскад проекту не подходит?
    options:
      - id: a
        text: Заказчик «поймёт, когда увидит»
      - id: b
        text: Требования стабильны
      - id: c
        text: Есть договор с фиксированным объёмом
      - id: d
        text: Результат нельзя поставлять частями
    correct: a
    explanation: При такой неопределённости нужны итерации.
    lessonId: j06-01
  - id: manifesto-year
    type: single
    prompt: Когда был сформулирован Манифест гибкой разработки?
    options:
      - id: a
        text: В 1970 году
      - id: b
        text: В 2001 году
      - id: c
        text: В 2020 году
      - id: d
        text: В 1995 году
    correct: b
    explanation: Его сформулировала группа разработчиков программного обеспечения в 2001 году.
    lessonId: j06-02
  - id: manifesto-more-than
    type: single
    prompt: Что значит «ценим больше» в Манифесте Agile?
    options:
      - id: a
        text: Правая часть не нужна
      - id: b
        text: При конфликте приоритет у левой части, но правая тоже важна
      - id: c
        text: Обе части равны
      - id: d
        text: Левая часть запрещена
    correct: b
    explanation: Манифест не отменяет процессы, документацию, контракты и планы.
    lessonId: j06-02
  - id: agile-docs
    type: single
    prompt: Как в Agile относятся к документации?
    options:
      - id: a
        text: Её нет
      - id: b
        text: Документации ровно столько, сколько нужно, например инструкции пользователям обязательны
      - id: c
        text: Нужно ТЗ на 200 страниц
      - id: d
        text: Документы пишет только заказчик
    correct: b
    explanation: Миф «Agile без документации» неверен.
    lessonId: j06-02
  - id: agile-fit
    type: multiple
    prompt: Когда Agile особенно уместен? Выберите все подходящие.
    options:
      - id: a
        text: Требования станут понятны только в процессе
      - id: b
        text: Результат можно поставлять частями
      - id: c
        text: Заказчик готов регулярно участвовать
      - id: d
        text: Требования полностью известны и не изменятся
    correct:
      - a
      - b
      - c
    explanation: При полной определённости каскад может быть быстрее.
    lessonId: j06-02
  - id: agile-check
    type: single
    prompt: Какой вопрос лучше всего проверяет, работает ли команда по Agile на деле?
    options:
      - id: a
        text: «Есть ли у вас дейли?»
      - id: b
        text:
          «Показываем ли мы работающий результат заказчику хотя бы раз в месяц и меняем ли планы по его
          итогам?»
      - id: c
        text: «Есть ли доска?»
      - id: d
        text: «Называемся ли мы Agile-командой?»
    correct: b
    explanation: Ритуалы без обратной связи — это каскад.
    lessonId: j06-02
  - id: sprint-length
    type: single
    prompt: Какая максимальная длина спринта по Scrum?
    options:
      - id: a
        text: Неделя
      - id: b
        text: Месяц
      - id: c
        text: Квартал
      - id: d
        text: Не ограничена
    correct: b
    explanation: Спринт длится не больше месяца, чаще одну-две недели.
    lessonId: j06-03
  - id: daily-length
    type: single
    prompt: Сколько длится ежедневный Scrum?
    options:
      - id: a
        text: 15 минут
      - id: b
        text: Час
      - id: c
        text: Полдня
      - id: d
        text: Сколько нужно
    correct: a
    explanation: Короткая синхронизация команды.
    lessonId: j06-03
  - id: scrum-artifacts
    type: single
    prompt: Какие артефакты есть в Scrum?
    options:
      - id: a
        text: Бэклог продукта, бэклог спринта, инкремент
      - id: b
        text: Устав, WBS, Ганта
      - id: c
        text: Реестр рисков, журнал проблем
      - id: d
        text: Протокол, отчёт, письмо
    correct: a
    explanation: Три артефакта Scrum.
    lessonId: j06-03
  - id: pm-in-scrum
    type: single
    prompt: Где обычно работает PM в компании, где команды работают по Scrum?
    options:
      - id: a
        text: Раздаёт задачи на дейли
      - id: b
        text: "На уровне выше: несколько команд, бюджет, внешние стейкхолдеры, зависимости"
      - id: c
        text: Заменяет Product Owner
      - id: d
        text: Нигде
    correct: b
    explanation: Роли PM в Scrum нет, но координация на уровне выше нужна.
    lessonId: j06-03
  - id: kanban-no-sprints
    type: single
    prompt: Как в Kanban можно менять приоритеты?
    options:
      - id: a
        text: Только между спринтами
      - id: b
        text: В любой момент — работа идёт непрерывным потоком
      - id: c
        text: Никогда
      - id: d
        text: Раз в квартал
    correct: b
    explanation: Это главное отличие от фиксированной цели спринта в Scrum.
    lessonId: j06-03
  - id: mix-small-team
    type: single
    prompt: Что можно взять небольшой команде из обоих подходов?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Демонстрации и ретро из Scrum, доску с этапами и WIP-лимиты из Kanban
      - id: c
        text: Только названия
      - id: d
        text: Только Ганта
    correct: b
    explanation: Важно понимать, зачем нужна каждая практика.
    lessonId: j06-03
  - id: uncertainty-criterion
    type: single
    prompt: Какой главный критерий выбора подхода?
    options:
      - id: a
        text: Мода
      - id: b
        text: Неопределённость требований и технологий
      - id: c
        text: Любимый трекер
      - id: d
        text: Размер офиса
    correct: b
    explanation: От неопределённости зависит, нужна ли ранняя обратная связь.
    lessonId: j06-04
  - id: fixed-contract
    type: single
    prompt: Договор с фиксированной ценой и объёмом тянет проект к…
    options:
      - id: a
        text: Каскаду или требует особой модели договора для гибкого подхода
      - id: b
        text: Kanban
      - id: c
        text: Отказу от договора
      - id: d
        text: Хаосу
    correct: a
    explanation: Фиксированный объём нужно описать заранее.
    lessonId: j06-04
  - id: fixed-budget-time
    type: single
    prompt: Бюджет и срок фиксированы, объём гибкий. Какой подход сочетается хорошо?
    options:
      - id: a
        text: "Итеративный: делаем самое ценное, пока не закончатся время и деньги"
      - id: b
        text: Только каскад
      - id: c
        text: Никакой
      - id: d
        text: Kanban без сроков
    correct: a
    explanation: Гибкость переносится на содержание.
    lessonId: j06-04
  - id: change-approach
    type: single
    prompt: После запуска работа превратилась в поток доработок и заявок. Что разумно?
    options:
      - id: a
        text: Оставить прежний подход навсегда
      - id: b
        text: Пересмотреть подход — например, перейти к Kanban
      - id: c
        text: Остановить работу
      - id: d
        text: Вернуться к каскаду
    correct: b
    explanation: Подход меняют, когда меняется проект.
    lessonId: j06-04
  - id: ai-approach
    type: single
    prompt: Какая часть ответа ИИ при выборе подхода обычно самая ценная?
    options:
      - id: a
        text: Итоговое решение
      - id: b
        text: Вопросы, которые нужно выяснить у заказчика
      - id: c
        text: Длина ответа
      - id: d
        text: Ссылки
    correct: b
    explanation: Решение принимают PM и заказчик, а вопросы помогают его подготовить.
    lessonId: j06-04
