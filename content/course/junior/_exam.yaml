id: junior-exam
kind: exam
title: Итоговый экзамен Junior
passScore: 0.75
questionsPerAttempt: 12
timeLimitMin: 60
cooldownHours: 24
questions:
  - id: x-project-signs
    type: single
    scenario: Вы пришли в компанию, где любую работу называют проектом.
    prompt:
      Руководитель просит «вести проект по поддержке сайта». Какой вопрос поможет понять, проект ли
      это?
    options:
      - id: a
        text: Сколько человек в команде?
      - id: b
        text: Когда работа закончится и как мы поймём, что она сделана?
      - id: c
        text: Какой бюджет выделен на год?
    correct: b
    explanation:
      Проект временный и создаёт уникальный результат. Если у работы нет финала — это операционная
      деятельность.
    lessonId: j01-01
  - id: x-ops-as-project
    type: single
    prompt: Что обычно происходит, если операционную работу вести как проект?
    options:
      - id: a
        text: Команда живёт в вечном дедлайне и выгорает
      - id: b
        text: Работа становится дешевле
      - id: c
        text: Ничего не меняется
    correct: a
    explanation:
      Инструменты проекта — вехи, дедлайны, закрытие — не подходят для бесконечной повторяющейся
      работы.
    lessonId: j01-01
  - id: x-product-inside
    type: single
    scenario: Приложение доставки успешно работает в России три года.
    prompt: Продуктовая команда решила выйти на рынок Казахстана к 1 июня. Как это назвать?
    options:
      - id: a
        text: Операционная работа продукта
      - id: b
        text: Проект внутри жизни продукта
      - id: c
        text: Новый продукт
    correct: b
    explanation: Выход на новый рынок — временная работа с уникальным результатом внутри жизни продукта.
    lessonId: j01-01
  - id: x-role-split
    type: single
    prompt: Кто в первую очередь отвечает за то, чтобы выбранная функция была сделана в срок и в бюджет?
    options:
      - id: a
        text: Product Manager
      - id: b
        text: Project Manager
      - id: c
        text: Scrum Master
    correct: b
    explanation: Продакт отвечает за «правильную ли вещь делаем», PM — за «правильно ли делаем».
    lessonId: j01-02
  - id: x-sm-deadline
    type: single
    scenario: В компании есть Scrum Master и Product Owner, но нет отдельного PM.
    prompt: Команда работает по Scrum и срывает сроки релиза. Кто отвечает за сроки?
    options:
      - id: a
        text: Scrum Master
      - id: b
        text: Project Manager или владелец продукта — в зависимости от устройства компании
      - id: c
        text: Команда разработки целиком, без ответственного
    correct: b
    explanation: Scrum Master отвечает за процесс, а не за сроки. Сроки — зона PM или Product Owner.
    lessonId: j01-02
  - id: x-ai-human
    type: multiple
    prompt: Что остаётся за PM даже при активном использовании ИИ? Выберите все подходящие.
    options:
      - id: a
        text: Решения и ответственность за них
      - id: b
        text: Черновик протокола встречи
      - id: c
        text: Договорённости со стейкхолдерами
      - id: d
        text: Знание неформального контекста команды
    correct:
      - a
      - c
      - d
    explanation: ИИ ускоряет текстовую работу, но решения, отношения и контекст — зона человека.
    lessonId: j01-03
  - id: x-ai-numbers
    type: single
    scenario: Вы отдали ИИ выгрузку задач и попросили подготовить статус для руководства.
    prompt: Как поступить с цифрой бюджета, которую ИИ вставил в статус-отчёт?
    options:
      - id: a
        text: Оставить — модель считала по вашим данным
      - id: b
        text: Сверить с первоисточником перед отправкой
      - id: c
        text: Удалить все цифры из отчёта
    correct: b
    explanation:
      Всё, что звучит как факт, проверяется по первоисточнику. Ответственность за отчёт — на
      PM.
    lessonId: j01-03
  - id: x-llm-truth
    type: single
    prompt: Почему модель может уверенно ошибаться?
    options:
      - id: a
        text: Она выбирает правдоподобное продолжение текста, а не проверяет истину
      - id: b
        text: Её намеренно обучают ошибаться
      - id: c
        text: Она ошибается только на русском языке
    correct: a
    explanation: Правдоподобное не равно истинному — отсюда галлюцинации.
    lessonId: j03-01
  - id: x-legal-ref
    type: single
    scenario: Вы готовите обоснование для заказчика с помощью ИИ.
    prompt: Модель сослалась на пункт отраслевого стандарта, которого вы не знаете. Что делать?
    options:
      - id: a
        text: Спросить модель, уверена ли она
      - id: b
        text: Найти стандарт и проверить пункт по первоисточнику
      - id: c
        text: Использовать — стандарты модель знает хорошо
    correct: b
    explanation: Вопрос «ты уверена?» ничего не гарантирует. Ссылки на документы проверяются по первоисточнику.
    lessonId: j03-01
  - id: x-anonymize-case
    type: single
    scenario: Нужно подготовить ответ на претензию заказчика, в переписке ФИО и суммы по договору.
    prompt: Что сделать перед тем, как отправить задачу во внешний ИИ-сервис?
    options:
      - id: a
        text: Отправить как есть — сервис надёжный
      - id: b
        text: Заменить имена, название компании и суммы на условные
      - id: c
        text: Отправить только первую половину текста
    correct: b
    explanation: Обезличивание сохраняет суть задачи и убирает персональные данные и коммерческую тайну.
    lessonId: j03-02
  - id: x-company-policy
    type: single
    prompt: Кто определяет, какие ИИ-сервисы можно использовать для рабочих задач?
    options:
      - id: a
        text: Каждый сотрудник сам
      - id: b
        text: Политика компании
      - id: c
        text: Поставщик ИИ-сервиса
    correct: b
    explanation:
      Разрешённые сервисы и правила определяет компания — особенно если есть требования службы
      безопасности.
    lessonId: j03-02
  - id: x-wbs-missing
    type: single
    scenario: "WBS внедрения CRM: «Настройка системы», «Перенос данных», «Интеграция с сайтом»."
    prompt: Чего, скорее всего, не хватает в WBS?
    options:
      - id: a
        text: Выбора цветовой схемы
      - id: b
        text: Тестирования, обучения пользователей и управления проектом
      - id: c
        text: Ничего, WBS полная
    correct: b
    explanation:
      Тестирование, обучение и управленческие работы — самые частые потери. Правило 100% требует
      их включить.
    lessonId: j07-01
  - id: x-wbs-too-big
    type: single
    prompt: Пакет работ «Разработать мобильное приложение» оценён в 900 часов. Что не так?
    options:
      - id: a
        text: Всё в порядке
      - id: b
        text: Пакет слишком крупный — его не оценить и не проконтролировать
      - id: c
        text: Пакет слишком мелкий
    correct: b
    explanation: "Правило 8–80 часов: крупный пакет нужно декомпозировать дальше."
    lessonId: j07-01
  - id: x-wbs-ai-role
    type: single
    prompt: Как лучше всего использовать ИИ при работе с WBS?
    options:
      - id: a
        text: Поручить составить WBS целиком и утвердить
      - id: b
        text: Попросить найти пропуски в уже составленной WBS
      - id: c
        text: Не использовать ИИ для планирования
    correct: b
    explanation: "ИИ полезен как критик: вы остаётесь автором структуры, а модель ищет пропуски."
    lessonId: j07-01
  - id: x-wbs-levels
    type: order
    prompt: Расставьте элементы WBS интернет-магазина сверху вниз.
    items:
      - id: top
        text: Интернет-магазин запущен
      - id: mid
        text: Оплата и доставка
      - id: low
        text: Подключить эквайринг
    explanation: Результат проекта → крупный результат → пакет работ.
    lessonId: j07-01
  - id: x-ai-suggestions
    type: single
    scenario: Вы попросили ИИ проверить WBS внутреннего проекта на 2 месяца.
    prompt: ИИ предложил 12 «пропущенных» работ для вашей WBS. Как поступить?
    options:
      - id: a
        text: Добавить все
      - id: b
        text: Рассмотреть каждую как вопрос и добавить только нужные проекту
      - id: c
        text: Проигнорировать все
    correct: b
    explanation: Предложения модели — гипотезы. Часть из них вашему проекту не нужна.
    lessonId: j07-01
  - id: x-project-list
    type: multiple
    prompt: Что из этого — проекты? Выберите все подходящие.
    options:
      - id: a
        text: Проведение конференции 15 октября
      - id: b
        text: Ежемесячное закрытие бухгалтерского периода
      - id: c
        text: Миграция базы данных на новый сервер
      - id: d
        text: Ответы на обращения в чате поддержки
    correct:
      - a
      - c
    explanation:
      У конференции и миграции есть срок и уникальный результат. Закрытие периода и поддержка
      — операционная работа.
    lessonId: j01-01
  - id: x-responsibility-final
    type: single
    scenario: Заказчик переспросил, почему запуск «перенесли» на месяц раньше.
    prompt: ИИ подготовил письмо заказчику с неверной датой запуска, вы отправили его не проверив. Что правильно?
    options:
      - id: a
        text: Сослаться на ошибку ИИ
      - id: b
        text: Признать ошибку, исправить дату и ввести проверку фактов перед отправкой
      - id: c
        text: Ничего не делать, если заказчик не заметил
    correct: b
    explanation:
      Ответственность за отправленное — на PM. Правильная реакция — исправить и изменить процесс
      проверки.
    lessonId: j01-03
  - id: x-phase-accepted
    type: single
    scenario: "PM закончил план проекта и разослал его. Через неделю спонсор впервые его открывает и просит сократить бюджет."
    prompt: Когда на самом деле закончилась фаза планирования?
    options:
      - { id: a, text: "Когда PM разослал план" }
      - { id: b, text: "Когда спонсор принял план после правок" }
      - { id: c, text: "Когда команда начала работу" }
    correct: b
    explanation: "Фаза закончена, когда результат принят человеком с правом решения."
    lessonId: j02-01
  - id: x-triangle-options
    type: single
    scenario: "Заказчик просит сдать проект на месяц раньше, ничего не меняя."
    prompt: Какой ответ PM профессиональнее?
    options:
      - { id: a, text: "«Невозможно»" }
      - { id: b, text: "«Хорошо» — и попросить команду работать по выходным" }
      - { id: c, text: "Два-три варианта с влиянием на скоуп, бюджет и риски и рекомендация" }
    correct: c
    explanation: "Изменение срока требует изменить другие стороны треугольника. PM показывает варианты и их цену."
    lessonId: j02-02
  - id: x-success-criteria
    type: single
    prompt: "Какой критерий успеха онлайн-записи проверяется однозначно?"
    options:
      - { id: a, text: "Пациенты будут довольны" }
      - {
          id: b,
          text: "Через 3 месяца после запуска доля онлайн-записей достигает согласованного уровня при известной базе",
        }
      - { id: c, text: "Регистратура станет работать лучше" }
    correct: b
    explanation: "У критерия есть мера, база и срок — его можно проверить."
    lessonId: j02-03
  - id: x-gate
    type: single
    prompt: Чем контрольная точка отличается от обычной вехи?
    options:
      - {
          id: a,
          text: "На контрольной точке принимают решение: продолжать, изменить или остановить проект",
        }
      - { id: b, text: "Контрольная точка длится дольше" }
      - { id: c, text: "Ничем" }
    correct: a
    explanation: "Веха отмечает результат, контрольная точка — момент решения о судьбе проекта."
    lessonId: j02-04
  - id: x-ai-tool-choice
    type: single
    scenario: "Коллега советует удобный зарубежный чат-ассистент для протоколов встреч с клиентами. Компания его не разрешала."
    prompt: Как поступить?
    options:
      - { id: a, text: "Пользоваться, если обезличить имена" }
      - {
          id: b,
          text: "Не отправлять туда рабочие материалы, пока сервис не разрешён; уточнить политику",
        }
      - { id: c, text: "Пользоваться с личного аккаунта" }
    correct: b
    explanation: "Выбор инструмента начинается с данных и политики компании."
    lessonId: j03-03
  - id: x-check-numbers
    type: single
    prompt: Что в ответе ИИ нужно сверять с первоисточником в первую очередь?
    options:
      - { id: a, text: "Стиль и длину абзацев" }
      - { id: b, text: "Даты, цифры, имена и ссылки" }
      - { id: c, text: "Количество пунктов в списке" }
    correct: b
    explanation: "Правдоподобные ошибки в фактах — самые опасные, их не видно без сверки."
    lessonId: j03-04
  - id: x-prompt-constraints
    type: single
    scenario: "Модель в письмах заказчику сама придумывает причины задержек."
    prompt: Что добавить в промпт?
    options:
      - { id: a, text: "Роль «лучший в мире PM»" }
      - {
          id: b,
          text: "Ограничение: использовать только факты из контекста, недостающее — спрашивать",
        }
      - { id: c, text: "Просьбу писать короче" }
    correct: b
    explanation: "Ограничения прямо запрещают додумывать."
    lessonId: j04-01
  - id: x-few-shot
    type: single
    prompt: Как быстрее всего добиться, чтобы модель писала отчёты в стиле, который нравится руководителю?
    options:
      - { id: a, text: "Добавить в промпт обезличенный пример одобренного отчёта" }
      - { id: b, text: "Написать «пиши хорошо»" }
      - { id: c, text: "Менять модель, пока не повезёт" }
    correct: a
    explanation: "Пример передаёт стиль, объём и структуру точнее описаний."
    lessonId: j04-02
  - id: x-smart
    type: single
    prompt: Какая цель проекта сформулирована по SMART?
    options:
      - { id: a, text: "Оптимизировать документооборот" }
      - {
          id: b,
          text: "К 1 марта все договоры отдела продаж согласуются в электронном виде без бумажных копий",
        }
      - { id: c, text: "Внедрить систему, провести обучение, настроить маршруты" }
    correct: b
    explanation: "Во втором варианте есть конкретный результат, мера и срок. Третий — список работ."
    lessonId: j05-01
  - id: x-hidden-stakeholder
    type: single
    scenario: "Онлайн-запись почти готова, и тут юрист спрашивает о согласии пациентов на обработку данных."
    prompt: Какую ошибку допустил PM на старте?
    options:
      - { id: a, text: "Не нашёл неочевидного стейкхолдера, который может заблокировать проект" }
      - { id: b, text: "Выбрал неправильную методологию" }
      - { id: c, text: "Неправильно оценил задачи" }
    correct: a
    explanation: "Вопрос «кто может остановить проект?» помогает найти юристов, безопасность и финансы на старте."
    lessonId: j05-02
  - id: x-charter-signature
    type: single
    prompt: Что даёт PM подписанный спонсором устав?
    options:
      - { id: a, text: "Полномочия действовать в рамках устава и точку отсчёта для изменений" }
      - { id: b, text: "Право не отчитываться" }
      - { id: c, text: "Гарантию, что проект не изменится" }
    correct: a
    explanation: "Устав фиксирует обязательства организации и полномочия PM."
    lessonId: j05-03
  - id: x-out-of-scope
    type: single
    scenario: "На демонстрации заказчик спрашивает, где онлайн-оплата. В документах о ней ничего не было."
    prompt: Что помогло бы избежать спора?
    options:
      - { id: a, text: "Раздел «не входит» в границах проекта" }
      - { id: b, text: "Более длинное ТЗ" }
      - { id: c, text: "Больше встреч" }
    correct: a
    explanation: "Раздел «не входит» делает скрытые ожидания видимыми на старте."
    lessonId: j05-04
  - id: x-method-choice
    type: single
    scenario: "Требования к новому внутреннему сервису неясны, заказчик готов смотреть результат каждые две недели."
    prompt: Какой подход уместнее?
    options:
      - { id: a, text: "Каскад с подробным ТЗ" }
      - { id: b, text: "Итеративный подход с регулярными демонстрациями" }
      - { id: c, text: "Отложить проект до появления требований" }
    correct: b
    explanation: "При высокой неопределённости и вовлечённом заказчике нужны итерации и обратная связь."
    lessonId: j06-04
  - id: x-agile-myth
    type: single
    prompt: Какое утверждение об Agile верно?
    options:
      - { id: a, text: "В Agile нет планов" }
      - {
          id: b,
          text: "Agile помогает работать в неопределённости через короткие итерации и обратную связь",
        }
      - { id: c, text: "Agile всегда быстрее каскада" }
    correct: b
    explanation: "Планы и документы в Agile есть, а скорость не растёт автоматически."
    lessonId: j06-02
  - id: x-kanban-wip
    type: single
    prompt: Что происходит, когда в Kanban лимит колонки «В работе» заполнен?
    options:
      - { id: a, text: "Новую задачу не берут, пока не доведут начатую" }
      - { id: b, text: "Лимит увеличивают" }
      - { id: c, text: "Берут задачу в обход доски" }
    correct: a
    explanation: "WIP-лимит заставляет заканчивать, а не начинать."
    lessonId: j06-03
  - id: x-estimate-owner
    type: single
    scenario: "Разработчик оценил задачу в две недели, руководитель просит «уложиться в неделю»."
    prompt: Как правильно поступить PM?
    options:
      - { id: a, text: "Записать неделю" }
      - { id: b, text: "Обсуждать объём, ресурсы или подход, а не торговаться за цифру" }
      - { id: c, text: "Записать полторы недели как компромисс" }
    correct: b
    explanation: "Торг превращает оценку в неправду, а работа быстрее не становится."
    lessonId: j07-02
  - id: x-critical-path
    type: single
    scenario: "Цепочки работ: А→В — 12 дней, Б→Г — 15 дней, обе заканчиваются запуском. Работа А задержалась на 2 дня."
    prompt: Как это повлияет на срок запуска?
    options:
      - { id: a, text: "Сдвинется на 2 дня" }
      - { id: b, text: "Не сдвинется: у цепочки А→В резерв 3 дня" }
      - { id: c, text: "Сдвинется на 5 дней" }
    correct: b
    explanation: "Критический путь — Б→Г, 15 дней. У цепочки А→В резерв 3 дня, задержка на 2 дня его не исчерпает."
    lessonId: j07-04
  - id: x-overload
    type: single
    prompt: Чего не показывает диаграмма Ганта и что стоит проверять отдельно?
    options:
      - { id: a, text: "Сроки работ" }
      - { id: b, text: "Загрузку людей по неделям" }
      - { id: c, text: "Вехи" }
    correct: b
    explanation: "Параллельные работы на одном человеке на деле идут последовательно."
    lessonId: j07-05
  - id: x-risk-vs-issue
    type: single
    scenario: "В реестре рисков третью неделю висит «Подрядчик задерживает интеграцию», хотя срок уже сорван."
    prompt: Что не так?
    options:
      - { id: a, text: "Это уже проблема: её нужно перенести в журнал проблем и решать" }
      - { id: b, text: "Нужно повысить оценку риска" }
      - { id: c, text: "Всё правильно" }
    correct: a
    explanation: "Случившееся событие — проблема. Держать его в реестре рисков — значит откладывать действия."
    lessonId: j08-01
  - id: x-risk-trigger
    type: single
    prompt: Какой триггер лучше для риска «подрядчик не успеет с интеграцией к 1 ноября»?
    options:
      - { id: a, text: "1 ноября интеграция не готова" }
      - { id: b, text: "К 15 сентября не выдан тестовый доступ" }
      - { id: c, text: "Спонсор спросил о статусе" }
    correct: b
    explanation: "Хороший триггер наступает заранее, пока есть время реагировать."
    lessonId: j08-03
  - id: x-escalate-early
    type: single
    prompt: Когда лучше эскалировать риск, который PM не может обработать сам?
    options:
      - { id: a, text: "Когда он случится" }
      - {
          id: b,
          text: "Как только понятно, что нужны решения за пределами полномочий, — с вариантами",
        }
      - { id: c, text: "Никогда — PM должен справляться сам" }
    correct: b
    explanation: "Ранняя эскалация с вариантами сохраняет время на реакцию и доверие спонсора."
    lessonId: j08-04
  - id: x-minutes-decision
    type: single
    prompt: Какая запись в протоколе — полноценное решение с задачей?
    options:
      - { id: a, text: "Обсудили напоминания" }
      - { id: b, text: "Напоминание — за сутки; текст готовит дизайнер до 17 октября" }
      - { id: c, text: "Надо подумать над напоминаниями" }
    correct: b
    explanation: "Решение сформулировано однозначно, у задачи есть ответственный и дата."
    lessonId: j09-03
  - id: x-status-colors
    type: single
    scenario: "Пять недель подряд проект был зелёным, на шестой — сразу красный."
    prompt: О чём это скорее всего говорит?
    options:
      - { id: a, text: "Проблемы накапливались, но их не показывали вовремя" }
      - { id: b, text: "Внезапно случилось непредвиденное" }
      - { id: c, text: "Статус-отчёты не нужны" }
    correct: a
    explanation: "Жёлтый статус — нормальный ранний сигнал. Его отсутствие перед красным — признак скрытых проблем."
    lessonId: j09-04
  - id: x-bad-news
    type: single
    prompt: С чего начинать письмо руководителю о переносе срока?
    options:
      - { id: a, text: "С извинений и истории переговоров" }
      - { id: b, text: "С сути: что произошло и какое решение нужно — уже в теме и первом абзаце" }
      - { id: c, text: "С описания всех усилий команды" }
    correct: b
    explanation: "Адресат решает, читать ли дальше, по теме и первым строкам."
    lessonId: j09-05
  - id: x-board-waiting
    type: single
    prompt: Зачем на доске проекта колонка «Ждёт внешних»?
    options:
      - { id: a, text: "Чтобы видеть, сколько работы заблокировано и кем" }
      - { id: b, text: "Для красоты" }
      - { id: c, text: "Чтобы прятать просроченные задачи" }
    correct: a
    explanation: "Колонка ожидания отделяет активную работу от заблокированной."
    lessonId: j10-02
  - id: x-ai-in-tools
    type: single
    prompt: Какой главный риск ИИ-поиска по базе знаний?
    options:
      - { id: a, text: "Он медленный" }
      - { id: b, text: "Он может процитировать устаревший или слишком широко открытый документ" }
      - { id: c, text: "Он работает только на английском" }
    correct: b
    explanation: "Права доступа становятся правами ИИ, а устаревшие документы — источником уверенных ошибок."
    lessonId: j10-04
  - id: x-acceptance
    type: single
    scenario: "На приёмке заказчик просит добавить функцию, которой не было в границах проекта, и не подписывает акт."
    prompt: Как поступить?
    options:
      - { id: a, text: "Сделать функцию бесплатно" }
      - {
          id: b,
          text: "Провести приёмку по согласованным критериям, а запрос оформить как следующий этап",
        }
      - { id: c, text: "Закрыть проект без акта" }
    correct: b
    explanation: "Новое пожелание — новая работа, а не замечание к приёмке."
    lessonId: j11-01
  - id: x-retro-blame
    type: single
    prompt: Какая формулировка в ретроспективе полезнее?
    options:
      - { id: a, text: "Подрядчик всё сорвал" }
      - {
          id: b,
          text: "Не было регулярного контакта с подрядчиком, поэтому задержку заметили поздно",
        }
      - { id: c, text: "Разработчик плохо работал" }
    correct: b
    explanation: "Ретроспектива ищет причины в процессе, а не виноватых."
    lessonId: j11-02
  - id: x-closure-honest
    type: single
    prompt: Зачем честно описывать отклонения в отчёте о закрытии?
    options:
      - { id: a, text: "Чтобы наказать виноватых" }
      - { id: b, text: "Чтобы организация могла учиться и не повторять ошибок" }
      - { id: c, text: "Так требует закон" }
    correct: b
    explanation: "Приукрашенный отчёт лишает организацию уроков."
    lessonId: j11-03
  - id: x-portfolio-ai
    type: single
    prompt: Какой рассказ о работе с ИИ убедительнее на собеседовании?
    options:
      - { id: a, text: "«ИИ делает за меня всю рутину»" }
      - {
          id: b,
          text: "«Готовлю черновики протоколов по своим промптам, сверяю даты и цифры, не отправляю персональные данные» — и пример",
        }
      - { id: c, text: "«Я не пользуюсь ИИ»" }
    correct: b
    explanation: "Конкретика показывает осознанное использование и ответственность за результат."
    lessonId: j12-03
