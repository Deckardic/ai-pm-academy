id: j10-quiz
kind: module
title: "Тест модуля: Инструменты"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: tracker-criteria
    type: multiple
    prompt: "По каким критериям стоит выбирать таск-трекер? Выберите все подходящие."
    options:
      - { id: a, text: "Команда и её процесс работы" }
      - { id: b, text: "Интеграции с другими сервисами" }
      - { id: c, text: "Где хранятся данные" }
      - { id: d, text: "Что используют конкуренты" }
    correct: [a, b, c]
    explanation: "Трекер выбирают по команде, процессу, интеграциям, хранению данных и стоимости. Выбор конкурентов ничего не говорит о ваших потребностях."
    lessonId: j10-01
  - id: tool-vs-process
    type: single
    scenario: "В старом трекере задачи терялись. Команда переехала в новый, через месяц картина та же."
    prompt: "В чём наиболее вероятная причина?"
    options:
      - { id: a, text: "Новый трекер тоже плохой" }
      - {
          id: b,
          text: "Не было договорённостей о процессе: этапы, ответственные, критерии готовности",
        }
      - { id: c, text: "Слишком мало полей в задачах" }
    correct: b
    explanation: "Трекер отражает процесс, а не создаёт его. Без договорённостей хаос переезжает вместе с задачами."
    lessonId: j10-01
  - id: jira-migration
    type: single
    prompt: "Почему многие российские компании переезжают с Jira?"
    options:
      - { id: a, text: "Jira перестала поддерживать канбан-доски" }
      - {
          id: b,
          text: "Atlassian прекратила продажи в России, а поддержка серверных версий закончилась",
        }
      - { id: c, text: "Jira запрещена законом" }
    correct: b
    explanation: "После ухода Atlassian с российского рынка и окончания поддержки серверных версий компании ищут альтернативы."
    lessonId: j10-01
  - id: pilot
    type: single
    prompt: "Как надёжнее всего выбрать между двумя-тремя трекерами?"
    options:
      - { id: a, text: "Прочитать обзоры" }
      - { id: b, text: "Провести пилот на реальном небольшом проекте" }
      - { id: c, text: "Выбрать самый дорогой" }
    correct: b
    explanation: "Несколько недель реальной работы показывают больше, чем обзоры."
    lessonId: j10-01
  - id: waiting-column
    type: single
    scenario: "Задача третью неделю «В работе», хотя исполнитель ждёт доступ от подрядчика."
    prompt: "Что поможет доске показывать реальную картину?"
    options:
      - { id: a, text: "Удалить задачу" }
      - { id: b, text: "Колонка «Ждёт внешних» с пометкой, кого ждём" }
      - { id: c, text: "Ничего" }
    correct: b
    explanation: "Колонка ожидания отделяет активную работу от заблокированной и показывает, кто блокирует."
    lessonId: j10-02
  - id: required-fields
    type: multiple
    prompt: "Какие поля стоит сделать обязательными для задачи? Выберите все подходящие."
    options:
      - { id: a, text: "Ответственный" }
      - { id: b, text: "Срок" }
      - { id: c, text: "Описание результата" }
      - { id: d, text: "Любимый цвет исполнителя" }
    correct: [a, b, c]
    explanation: "Без ответственного, срока и описания результата задачу нельзя нормально выполнить и проверить."
    lessonId: j10-02
  - id: transition-rules
    type: single
    prompt: "Зачем нужны правила перехода между колонками?"
    options:
      - { id: a, text: "Чтобы статус задачи был однозначным для всех" }
      - { id: b, text: "Чтобы задачи двигались медленнее" }
      - { id: c, text: "Так требует трекер" }
    correct: a
    explanation: "Без правил для одного «Готово» — «код написан», для другого — «пациенты могут записаться»."
    lessonId: j10-02
  - id: decision-log
    type: single
    scenario: "Через два месяца заказчик снова хочет обсудить уже принятое решение."
    prompt: "Какой документ поможет больше всего?"
    options:
      - { id: a, text: "Статус-отчёт" }
      - { id: b, text: "Журнал решений с датой, автором и причиной" }
      - { id: c, text: "Реестр рисков" }
    correct: b
    explanation: "Журнал решений показывает, что, кто и почему решил, — можно не начинать обсуждение с нуля."
    lessonId: j10-03
  - id: outdated-docs
    type: single
    prompt: "Что опаснее для проекта?"
    options:
      - { id: a, text: "Отсутствующий документ" }
      - { id: b, text: "Устаревший документ, которому доверяют" }
      - { id: c, text: "Короткий документ" }
    correct: b
    explanation: "По устаревшему документу люди действуют уверенно и неправильно. Актуальность важнее полноты."
    lessonId: j10-03
  - id: ai-access-rights
    type: single
    prompt: "Почему перед включением ИИ-поиска по базе знаний нужно проверить права доступа?"
    options:
      - { id: a, text: "ИИ-поиск работает только с публичными документами" }
      - {
          id: b,
          text: "ИИ может найти и процитировать чувствительный документ, если он доступен слишком широко",
        }
      - { id: c, text: "Права доступа ускоряют поиск" }
    correct: b
    explanation: "Права доступа в сервисе становятся правами ИИ. Небрежно открытые документы попадут в ответы."
    lessonId: j10-04
  - id: ai-search-outdated
    type: single
    scenario: "ИИ-поиск ответил со ссылкой на протокол, но ответ противоречит журналу решений."
    prompt: "Что делать?"
    options:
      - { id: a, text: "Доверять ИИ — у него есть ссылка" }
      - { id: b, text: "Открыть источник, проверить актуальность и пометить устаревший документ" }
      - { id: c, text: "Удалить журнал решений" }
    correct: b
    explanation: "Ссылка не гарантирует правильности — поиск мог найти устаревший документ."
    lessonId: j10-04
  - id: summary-risk
    type: single
    prompt: "Какой главный риск саммари длинного обсуждения?"
    options:
      - { id: a, text: "Оно слишком длинное" }
      - { id: b, text: "Модель может потерять важную деталь из середины обсуждения" }
      - { id: c, text: "Оно всегда на английском" }
    correct: b
    explanation: "Модели чаще теряют детали из середины длинного текста. Перед решением пробегите оригинал."
    lessonId: j10-04
