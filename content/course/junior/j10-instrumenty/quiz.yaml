id: j10-quiz
kind: module
title: "Тест модуля: Инструменты"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: tracker-criteria
    type: multiple
    prompt: По каким критериям стоит выбирать таск-трекер? Выберите все подходящие.
    options:
      - id: a
        text: Команда и её процесс работы
      - id: b
        text: Интеграции с другими сервисами
      - id: c
        text: Где хранятся данные
      - id: d
        text: Что используют конкуренты
    correct:
      - a
      - b
      - c
    explanation:
      Трекер выбирают по команде, процессу, интеграциям, хранению данных и стоимости. Выбор конкурентов
      ничего не говорит о ваших потребностях.
    lessonId: j10-01
  - id: tool-vs-process
    type: single
    scenario: В старом трекере задачи терялись. Команда переехала в новый, через месяц картина та же.
    prompt: В чём наиболее вероятная причина?
    options:
      - id: a
        text: Новый трекер тоже плохой
      - id: b
        text: "Не было договорённостей о процессе: этапы, ответственные, критерии готовности"
      - id: c
        text: Слишком мало полей в задачах
    correct: b
    explanation:
      Трекер отражает процесс, а не создаёт его. Без договорённостей хаос переезжает вместе с
      задачами.
    lessonId: j10-01
  - id: jira-migration
    type: single
    prompt: Почему многие российские компании переезжают с Jira?
    options:
      - id: a
        text: Jira перестала поддерживать канбан-доски
      - id: b
        text: Atlassian прекратила продажи в России, а поддержка серверных версий закончилась
      - id: c
        text: Jira запрещена законом
    correct: b
    explanation:
      После ухода Atlassian с российского рынка и окончания поддержки серверных версий компании
      ищут альтернативы.
    lessonId: j10-01
  - id: pilot
    type: single
    prompt: Как надёжнее всего выбрать между двумя-тремя трекерами?
    options:
      - id: a
        text: Прочитать обзоры
      - id: b
        text: Провести пилот на реальном небольшом проекте
      - id: c
        text: Выбрать самый дорогой
    correct: b
    explanation: Несколько недель реальной работы показывают больше, чем обзоры.
    lessonId: j10-01
  - id: waiting-column
    type: single
    scenario: Задача третью неделю «В работе», хотя исполнитель ждёт доступ от подрядчика.
    prompt: Что поможет доске показывать реальную картину?
    options:
      - id: a
        text: Удалить задачу
      - id: b
        text: Колонка «Ждёт внешних» с пометкой, кого ждём
      - id: c
        text: Ничего
    correct: b
    explanation: Колонка ожидания отделяет активную работу от заблокированной и показывает, кто блокирует.
    lessonId: j10-02
  - id: required-fields
    type: multiple
    prompt: Какие поля стоит сделать обязательными для задачи? Выберите все подходящие.
    options:
      - id: a
        text: Ответственный
      - id: b
        text: Срок
      - id: c
        text: Описание результата
      - id: d
        text: Любимый цвет исполнителя
    correct:
      - a
      - b
      - c
    explanation: Без ответственного, срока и описания результата задачу нельзя нормально выполнить и проверить.
    lessonId: j10-02
  - id: transition-rules
    type: single
    prompt: Зачем нужны правила перехода между колонками?
    options:
      - id: a
        text: Чтобы статус задачи был однозначным для всех
      - id: b
        text: Чтобы задачи двигались медленнее
      - id: c
        text: Так требует трекер
    correct: a
    explanation: Без правил для одного «Готово» — «код написан», для другого — «пациенты могут записаться».
    lessonId: j10-02
  - id: decision-log
    type: single
    scenario: Через два месяца заказчик снова хочет обсудить уже принятое решение.
    prompt: Какой документ поможет больше всего?
    options:
      - id: a
        text: Статус-отчёт
      - id: b
        text: Журнал решений с датой, автором и причиной
      - id: c
        text: Реестр рисков
    correct: b
    explanation: Журнал решений показывает, что, кто и почему решил, — можно не начинать обсуждение с нуля.
    lessonId: j10-03
  - id: outdated-docs
    type: single
    prompt: Что опаснее для проекта?
    options:
      - id: a
        text: Отсутствующий документ
      - id: b
        text: Устаревший документ, которому доверяют
      - id: c
        text: Короткий документ
    correct: b
    explanation: По устаревшему документу люди действуют уверенно и неправильно. Актуальность важнее полноты.
    lessonId: j10-03
  - id: ai-access-rights
    type: single
    prompt: Почему перед включением ИИ-поиска по базе знаний нужно проверить права доступа?
    options:
      - id: a
        text: ИИ-поиск работает только с публичными документами
      - id: b
        text: ИИ может найти и процитировать чувствительный документ, если он доступен слишком широко
      - id: c
        text: Права доступа ускоряют поиск
    correct: b
    explanation: Права доступа в сервисе становятся правами ИИ. Небрежно открытые документы попадут в ответы.
    lessonId: j10-04
  - id: ai-search-outdated
    type: single
    scenario: ИИ-поиск ответил со ссылкой на протокол, но ответ противоречит журналу решений.
    prompt: Что делать?
    options:
      - id: a
        text: Доверять ИИ — у него есть ссылка
      - id: b
        text: Открыть источник, проверить актуальность и пометить устаревший документ
      - id: c
        text: Удалить журнал решений
    correct: b
    explanation: Ссылка не гарантирует правильности — поиск мог найти устаревший документ.
    lessonId: j10-04
  - id: summary-risk
    type: single
    prompt: Какой главный риск саммари длинного обсуждения?
    options:
      - id: a
        text: Оно слишком длинное
      - id: b
        text: Модель может потерять важную деталь из середины обсуждения
      - id: c
        text: Оно всегда на английском
    correct: b
    explanation: Модели чаще теряют детали из середины длинного текста. Перед решением пробегите оригинал.
    lessonId: j10-04
  - id: fields-minimum
    type: single
    prompt: Как настраивать поля в новом трекере?
    options:
      - id: a
        text: Сразу 30 полей на всякий случай
      - id: b
        text: Начать с минимума и добавлять поле, когда оно реально нужно для решений
      - id: c
        text: Не настраивать
      - id: d
        text: Скопировать все поля из старого трекера
    correct: b
    explanation: Лишние поля перестают заполнять через неделю.
    lessonId: j10-01
  - id: migration-cleanup
    type: single
    prompt: Чем хорош переезд с одного трекера на другой?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Поводом пересмотреть статусы, поля и правила и оставить только нужное
      - id: c
        text: Можно перенести хаос как есть
      - id: d
        text: Можно не обучать людей
    correct: b
    explanation: Не переносите хаос один к одному.
    lessonId: j10-01
  - id: jira-knowledge
    type: single
    prompt: Полезно ли знание Jira после ухода Atlassian из России?
    options:
      - id: a
        text: Нет, совсем
      - id: b
        text: "Да: её логика — эпики, задачи, рабочие процессы — перенесена во многие сервисы"
      - id: c
        text: Только для разработчиков
      - id: d
        text: Только за рубежом
    correct: b
    explanation: Понятия переносятся между трекерами.
    lessonId: j10-01
  - id: tracker-data
    type: single
    prompt: Для компании важно хранить данные на своих серверах. Как это влияет на выбор трекера?
    options:
      - id: a
        text: Никак
      - id: b
        text: Сразу отсекает варианты без размещения на своих серверах
      - id: c
        text: Нужен самый дешёвый
      - id: d
        text: Нужен самый популярный
    correct: b
    explanation: Требования к данным — решающий критерий.
    lessonId: j10-01
  - id: columns-real
    type: single
    prompt: Как проектировать колонки доски?
    options:
      - id: a
        text: Скопировать из интернета
      - id: b
        text: Восстановить реальные этапы нескольких недавних задач, включая ожидания
      - id: c
        text: Сделать одну колонку «В работе»
      - id: d
        text: Сделать 20 колонок
    correct: b
    explanation: Колонки отражают реальный процесс.
    lessonId: j10-02
  - id: task-types
    type: single
    prompt: Сколько типов задач обычно достаточно небольшому проекту?
    options:
      - id: a
        text: Один
      - id: b
        text: "Три-четыре: задача, ошибка, согласование, веха"
      - id: c
        text: Пятнадцать
      - id: d
        text: Типы не нужны
    correct: b
    explanation: Типы различают работу по смыслу.
    lessonId: j10-02
  - id: done-rule
    type: single
    prompt: Какое правило перехода в колонку «Готово» лучше?
    options:
      - id: a
        text: «Код написан»
      - id: b
        text: «Результат проверен и принят тем, кто его заказывал»
      - id: c
        text: «Прошла неделя»
      - id: d
        text: «PM так решил»
    correct: b
    explanation: Иначе «готово» у каждого своё.
    lessonId: j10-02
  - id: stale-rule
    type: single
    prompt: Задача без движения больше двух недель — что делать?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Спросить, актуальна ли она, и разобрать
      - id: c
        text: Удалить без вопросов
      - id: d
        text: Повысить приоритет
    correct: b
    explanation: Правило давности не даёт доске стать кладбищем.
    lessonId: j10-02
  - id: daily-by-board
    type: single
    prompt: Как поддерживать доску актуальной?
    options:
      - id: a
        text: Обновлять перед отчётом
      - id: b
        text: Проводить синхронизацию команды по доске и чистить её еженедельно
      - id: c
        text: Не трогать
      - id: d
        text: Поручить ИИ
    correct: b
    explanation: Доска живёт, когда по ней работают.
    lessonId: j10-02
  - id: kb-what
    type: single
    prompt: Что хранить в базе знаний, а не в трекере?
    options:
      - id: a
        text: Задачи
      - id: b
        text: Устав, решения, протоколы, инструкции — документы, к которым возвращаются
      - id: c
        text: Переписку в чате
      - id: d
        text: Личные заметки
    correct: b
    explanation: Задачи — в трекере, переписка — в мессенджере.
    lessonId: j10-03
  - id: kb-one-version
    type: single
    prompt: Как избежать файлов «Устав_финал_2_испр»?
    options:
      - id: a
        text: Хранить одну страницу, которую обновляют; историю ведёт система
      - id: b
        text: Запретить правки
      - id: c
        text: Удалять старые файлы
      - id: d
        text: Сохранять копии каждый день
    correct: a
    explanation: Одна версия документа — меньше путаницы.
    lessonId: j10-03
  - id: kb-owner
    type: single
    prompt: Что помогает держать документ базы знаний актуальным?
    options:
      - id: a
        text: Владелец и дата обновления наверху
      - id: b
        text: Длинный текст
      - id: c
        text: Пароль
      - id: d
        text: Картинки
    correct: a
    explanation: Читатель сразу видит, насколько документ свежий.
    lessonId: j10-03
  - id: kb-archive
    type: single
    prompt: Что делать с устаревшими документами?
    options:
      - id: a
        text: Оставить среди актуальных
      - id: b
        text: Перенести в архив с пометкой
      - id: c
        text: Удалить без следа
      - id: d
        text: Переименовать
    correct: b
    explanation: Так их можно найти, но они не вводят в заблуждение.
    lessonId: j10-03
  - id: kb-docs-end
    type: single
    prompt: Почему не стоит писать документацию в конце проекта?
    options:
      - id: a
        text: Это скучно
      - id: b
        text: В конце никто не помнит, почему принимались решения, и нет времени
      - id: c
        text: Документация не нужна
      - id: d
        text: Так проще
    correct: b
    explanation: База пополняется по ходу работы.
    lessonId: j10-03
  - id: ai-summary-80
    type: single
    prompt: Вы вернулись из отпуска и видите задачу с 80 комментариями. Как использовать саммари от ИИ?
    options:
      - id: a
        text: Принять решение только по саммари
      - id: b
        text: Прочитать саммари, а перед решением пробежать исходное обсуждение
      - id: c
        text: Не читать ничего
      - id: d
        text: Удалить комментарии
    correct: b
    explanation: Саммари может потерять важное возражение из середины.
    lessonId: j10-04
  - id: ai-subtasks
    type: single
    prompt: Встроенный ИИ предложил 8 подзадач. Что проверить?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Нет ли лишних подзадач вне границ проекта и не пропущено ли важное
      - id: c
        text: Количество
      - id: d
        text: Цвет
    correct: b
    explanation: Модель не знает специфики и границ вашего проекта.
    lessonId: j10-04
  - id: ask-admin
    type: multiple
    prompt: Что выяснить у администратора перед включением ИИ-функций сервиса? Выберите все подходящие.
    options:
      - id: a
        text: Где обрабатываются данные
      - id: b
        text: Используются ли данные для обучения моделей
      - id: c
        text: Что видит модель
      - id: d
        text: Какой цвет у кнопки
    correct:
      - a
      - b
      - c
    explanation: Также — разрешено ли это политикой компании.
    lessonId: j10-04
  - id: ai-good-cases
    type: single
    prompt: Когда встроенный ИИ особенно полезен?
    options:
      - id: a
        text: Решения по спорным обсуждениям
      - id: b
        text: Возвращение к задачам после отпуска и поиск в большой базе знаний
      - id: c
        text: Работа с чувствительными данными без разрешения
      - id: d
        text: Никогда
    correct: b
    explanation: Для спорных решений читайте оригинал.
    lessonId: j10-04
  - id: rights-leak
    type: single
    prompt: В базе знаний документ с зарплатами открыт всем. Чем это опасно при ИИ-поиске?
    options:
      - id: a
        text: Ничем
      - id: b
        text: ИИ может найти и процитировать его в ответе на невинный вопрос
      - id: c
        text: Поиск станет медленнее
      - id: d
        text: Документ удалится
    correct: b
    explanation: Права доступа становятся правами ИИ.
    lessonId: j10-04
