id: j10
slug: instrumenty
order: 10
title: Инструменты
summary: Таск-трекеры, базы знаний и доски, доступные в России, и ИИ-функции внутри них.
goals:
- Ориентироваться в российских таск-трекерах
- Настраивать доску проекта
- Использовать встроенные ИИ-функции
status: planned
artifact: Настроенная учебная доска проекта
keyConcepts:
- Яндекс Трекер
- Kaiten
- YouGile
- Битрикс24
- Weeek
- Jira
searchQueries:
- таск трекер для команды
- аналоги jira в россии
lessonsPlan:
- slug: task-trekery
  title: Таск-трекеры
  focus: обзор инструментов, доступных в России, и как выбрать
  durationMin: 12
  keyPoints:
  - Яндекс Трекер, Kaiten, YouGile, Битрикс24, Weeek, YouTrack
  - Jira как отраслевой стандарт и переезды с неё
  - 'Критерии выбора: команда, процесс, интеграции, где хранятся данные'
  - Инструмент не заменяет процесс
  practice: Сравнить два трекера по пяти критериям
- slug: doska-proekta
  title: Доска проекта
  focus: как настроить доску под процесс
  durationMin: 12
  keyPoints:
  - Колонки отражают реальные этапы
  - Типы задач и обязательные поля
  - Правила перехода между колонками
  - Как не превратить доску в кладбище задач
  practice: Настроить учебную доску
- slug: baza-znaniy
  title: База знаний проекта
  focus: где и как хранить документы
  durationMin: 10
  keyPoints:
  - 'Что хранить: устав, решения, протоколы, риски'
  - Структура разделов
  - Яндекс Вики и аналоги
  - Актуальность важнее полноты
  practice: Спроектировать структуру базы знаний учебного проекта
- slug: ii-vnutri-instrumentov
  title: ИИ внутри инструментов
  focus: что уже встроено в трекеры и базы знаний
  durationMin: 11
  keyPoints:
  - Саммари задач и обсуждений
  - Генерация описаний и подзадач
  - Поиск по базе знаний
  - 'Риски: данные и качество'
  practice: Попробовать встроенную ИИ-функцию и оценить результат
assignment:
  title: Учебная доска проекта
  deliverable: Скриншот доски и описание правил работы
  brief: 'Настроенная доска учебного проекта: колонки, типы задач, правила перехода, связь с базой знаний.'
quizFocus:
- выбор трекера
- настройка доски
- база знаний
- ИИ-функции инструментов и данные
