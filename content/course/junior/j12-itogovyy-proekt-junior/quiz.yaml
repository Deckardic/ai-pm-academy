id: j12-quiz
kind: module
title: "Тест модуля: Итоговый проект Junior"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: artifact-order
    type: order
    prompt: Расположите артефакты проекта в порядке, в котором их логично создавать.
    items:
      - id: a
        text: Устав проекта
      - id: b
        text: WBS
      - id: c
        text: План-график с критическим путём
      - id: d
        text: Статус-отчёт
      - id: e
        text: Отчёт о закрытии
    explanation: Каждый следующий артефакт опирается на предыдущие — от устава к закрытию.
    lessonId: j12-02
  - id: missing-data
    type: single
    prompt: В кейсе не хватает данных для части устава. Что делать?
    options:
      - id: a
        text: Пропустить эти разделы
      - id: b
        text: Сформулировать допущения и записать вопросы к заказчику
      - id: c
        text: Попросить ИИ придумать недостающие цифры
    correct: b
    explanation: Недостающие данные оформляют допущениями и вопросами — так и в реальной работе.
    lessonId: j12-01
  - id: contradiction
    type: single
    scenario:
      Спонсор хочет запуск во всех трёх клиниках к 1 октября, а подрядчик оценивает интеграцию в
      два-четыре месяца.
    prompt: Как правильно отразить это в уставе?
    options:
      - id: a
        text: Записать запуск всех клиник 1 октября
      - id: b
        text: Показать риск, предложить варианты и зафиксировать выбранный
      - id: c
        text: Отложить устав до точной оценки подрядчика
    correct: b
    explanation: Противоречие — главный риск проекта. Его показывают спонсору с вариантами и фиксируют решение.
    lessonId: j12-01
  - id: start-point
    type: single
    prompt: С чего лучше начать работу над итоговым кейсом?
    options:
      - id: a
        text: С диаграммы Ганта
      - id: b
        text: С вопросов к заказчику и устава
      - id: c
        text: С отчёта о закрытии
    correct: b
    explanation: Без целей, границ и стейкхолдеров график строится на песке.
    lessonId: j12-01
  - id: coherence
    type: single
    scenario: В статус-отчёте сработал риск, которого нет в реестре рисков.
    prompt: Что это говорит о работе?
    options:
      - id: a
        text: Ничего страшного
      - id: b
        text: "Нарушена связность: риск нужно было предусмотреть или сделать из этого урок в отчёте о закрытии"
      - id: c
        text: Нужно удалить событие из статуса
    correct: b
    explanation: Артефакты должны быть согласованы между собой.
    lessonId: j12-02
  - id: typical-errors
    type: multiple
    prompt: Какие ошибки типичны для итоговых работ? Выберите все подходящие.
    options:
      - id: a
        text: Всё идёт по плану, статус всегда зелёный
      - id: b
        text: Общие риски, не связанные с кейсом
      - id: c
        text: Противоречия вводных не разрешены
      - id: d
        text: Отклонения честно объяснены в отчёте о закрытии
    correct:
      - a
      - b
      - c
    explanation: Честные отклонения — признак хорошей работы, а не ошибка.
    lessonId: j12-02
  - id: ai-journal
    type: single
    prompt: Зачем вести журнал работы с ИИ над итоговым проектом?
    options:
      - id: a
        text: Чтобы показать, что работу сделал ИИ
      - id: b
        text: Чтобы показать, где ИИ помогал, что вы проверили и исправили
      - id: c
        text: Это не нужно
    correct: b
    explanation: Журнал показывает осознанную работу с ИИ и пригодится на собеседовании.
    lessonId: j12-02
  - id: portfolio-story
    type: single
    prompt: Что сильнее всего покажет ваш уровень в рассказе о проекте?
    options:
      - id: a
        text: Список методологий, которые вы знаете
      - id: b
        text: "Решения, которые вы приняли: варианты, выбор, обоснование"
      - id: c
        text: Количество проведённых встреч
    correct: b
    explanation: Работодателю важно, как вы думаете и принимаете решения.
    lessonId: j12-03
  - id: ai-interview
    type: single
    prompt: Как лучше рассказать о работе с ИИ на собеседовании?
    options:
      - id: a
        text: «Работаю с нейросетями»
      - id: b
        text: "Конкретно: какие задачи ускоряю, как проверяю, какие данные не отправляю, с примером"
      - id: c
        text: Не упоминать ИИ вообще
    correct: b
    explanation: Конкретика показывает, что вы используете ИИ осознанно и отвечаете за результат.
    lessonId: j12-03
  - id: portfolio-data
    type: single
    prompt: Что сделать с кейсом из текущей работы перед публикацией в портфолио?
    options:
      - id: a
        text: Ничего, так достовернее
      - id: b
        text: "Обезличить: убрать названия компаний и клиентов, имена, суммы и внутренние данные"
      - id: c
        text: Не использовать рабочие кейсы вообще
    correct: b
    explanation: Портфолио публично. Умение обращаться с конфиденциальной информацией — тоже навык PM.
    lessonId: j12-03
  - id: case-questions
    type: single
    prompt: Какой первый шаг работы с итоговым кейсом?
    options:
      - id: a
        text: Нарисовать Ганта
      - id: b
        text: Выписать, что известно, что противоречиво и чего не хватает
      - id: c
        text: Написать отчёт о закрытии
      - id: d
        text: Выбрать шрифт
    correct: b
    explanation: Вопросы и допущения — основа устава.
    lessonId: j12-01
  - id: case-pilot
    type: single
    prompt: Главный врач хочет исключить часть врачей из записи, спонсор — «всех». Как отразить это в уставе?
    options:
      - id: a
        text: Не упоминать
      - id: b
        text: Показать противоречие, предложить варианты и зафиксировать решение с обоснованием
      - id: c
        text: Выбрать мнение спонсора без обсуждения
      - id: d
        text: Отказаться от проекта
    correct: b
    explanation: Противоречия разрешают явно.
    lessonId: j12-01
  - id: case-long
    type: single
    prompt: Почему устав на 10 страниц плохо подходит спонсору из кейса?
    options:
      - id: a
        text: Он любит длинные тексты
      - id: b
        text: Спонсор не любит длинных документов — страдает критерий ясности
      - id: c
        text: Устав всегда короче страницы
      - id: d
        text: Длина неважна
    correct: b
    explanation: Учитывайте особенности адресата.
    lessonId: j12-01
  - id: case-old-people
    type: single
    prompt: Какой риск кейса «Клиника рядом» связан с пациентами пригорода?
    options:
      - id: a
        text: Их нет
      - id: b
        text: Много пожилых пациентов могут не пользоваться онлайн-записью
      - id: c
        text: Они не болеют
      - id: d
        text: Им не нужна запись
    correct: b
    explanation: Это риск для успеха продукта, его учитывают в реестре и критериях.
    lessonId: j12-01
  - id: case-it-half
    type: single
    prompt: ИТ-специалист занят в проекте на половину времени. Как это учесть?
    options:
      - id: a
        text: Никак
      - id: b
        text: В графике и загрузке — работы с ним растягиваются, возможен риск
      - id: c
        text: Уволить
      - id: d
        text: Поручить всё ему
    correct: b
    explanation: Доступность меньше 100% влияет на сроки.
    lessonId: j12-01
  - id: iterate-artifacts
    type: single
    prompt: Как лучше работать над комплектом артефактов?
    options:
      - id: a
        text: Сделать каждый идеально по очереди
      - id: b
        text: Сделать сквозной черновой проход, а потом улучшать — так раньше видны противоречия
      - id: c
        text: Начать с отчёта о закрытии
      - id: d
        text: Делать всё одновременно
    correct: b
    explanation: Черновой проход показывает связи между документами.
    lessonId: j12-02
  - id: status-realism
    type: single
    prompt: Почему в итоговой работе полезно показать неделю, когда что-то пошло не так?
    options:
      - id: a
        text: Чтобы получить меньше баллов
      - id: b
        text: Показать, как вы работаете с проблемами; «всё по плану» неправдоподобно
      - id: c
        text: Так требует шаблон
      - id: d
        text: Это необязательно
    correct: b
    explanation: Работа с отклонениями — ключевой навык PM.
    lessonId: j12-02
  - id: general-risks
    type: single
    prompt: Чем плох риск «могут возникнуть технические проблемы» в итоговой работе?
    options:
      - id: a
        text: Он слишком длинный
      - id: b
        text: Он общий и не связан с кейсом
      - id: c
        text: Он слишком конкретный
      - id: d
        text: Ничем
    correct: b
    explanation: "Нужны риски этого кейса: подрядчик, расписание, пожилые пациенты, юрист."
    lessonId: j12-02
  - id: coherence-scope
    type: single
    prompt: Какая проверка связности верна?
    options:
      - id: a
        text: Всё из «входит» есть в WBS, а в WBS нет того, что «не входит»
      - id: b
        text: WBS длиннее устава
      - id: c
        text: Вехи отличаются от графика
      - id: d
        text: Реестр рисков пустой
    correct: a
    explanation: Артефакты должны быть согласованы.
    lessonId: j12-02
  - id: ai-log
    type: single
    prompt: Что записывать в журнал работы с ИИ?
    options:
      - id: a
        text: Только название модели
      - id: b
        text: Шаг, промпт, что сделала модель и что вы исправили
      - id: c
        text: Время суток
      - id: d
        text: Ничего
    correct: b
    explanation: Журнал — часть сдачи и материал для собеседования.
    lessonId: j12-02
  - id: portfolio-count
    type: single
    prompt: Сколько кейсов достаточно для портфолио Junior?
    options:
      - id: a
        text: Один абзац
      - id: b
        text: Два-три хорошо оформленных кейса
      - id: c
        text: Двадцать
      - id: d
        text: Кейсы не нужны
    correct: b
    explanation: Лучше меньше, но с артефактами и историей.
    lessonId: j12-03
  - id: portfolio-link
    type: single
    prompt: Какое требование к ссылке на портфолио?
    options:
      - id: a
        text: Она должна открываться без запроса доступа
      - id: b
        text: Она должна быть длинной
      - id: c
        text: Она должна вести в личную почту
      - id: d
        text: Неважно
    correct: a
    explanation: Работодатель не будет запрашивать доступ.
    lessonId: j12-03
  - id: story-3min
    type: single
    prompt: Рассказ о проекте на 3 минуты получается длинным. Что сокращать?
    options:
      - id: a
        text: Решения
      - id: b
        text: Контекст
      - id: c
        text: Выводы
      - id: d
        text: Результат
    correct: b
    explanation: Решения — самая ценная часть рассказа.
    lessonId: j12-03
  - id: what-differently
    type: single
    prompt: Зачем в истории проекта раздел «что сделал бы иначе»?
    options:
      - id: a
        text: Для самокритики
      - id: b
        text: Показывает зрелость и умение учиться
      - id: c
        text: Чтобы заполнить место
      - id: d
        text: Он необязателен
    correct: b
    explanation: Работодатель ценит способность делать выводы.
    lessonId: j12-03
  - id: cert-plus-cases
    type: single
    prompt: Как сертификат соотносится с кейсами в портфолио?
    options:
      - id: a
        text: Сертификат заменяет кейсы
      - id: b
        text: Сертификат подтверждает программу и экзамен, кейсы показывают применение — вместе сильнее
      - id: c
        text: Кейсы не нужны при сертификате
      - id: d
        text: Сертификат не нужен
    correct: b
    explanation: Одно дополняет другое.
    lessonId: j12-03
  - id: interview-ai-example
    type: single
    prompt: Какой пример про ИИ сильнее всего на собеседовании?
    options:
      - id: a
        text: «Я всё делаю в ИИ»
      - id: b
        text:
          «Модель предложила работы вне границ проекта — я их убрал; в расчёте критического пути ошиблась
          — пересчитал вручную»
      - id: c
        text: «Я не пользуюсь ИИ»
      - id: d
        text: «ИИ пишет за меня отчёты»
    correct: b
    explanation: Пример показывает осознанное использование и проверку.
    lessonId: j12-03
  - id: case-deliverables
    type: single
    prompt: Что НЕ входит в комплект итогового проекта Junior?
    options:
      - id: a
        text: Устав и реестр рисков
      - id: b
        text: Статус-отчёт и отчёт о закрытии
      - id: c
        text: Исходный код портала
    correct: c
    explanation: Сдаются управленческие артефакты.
    lessonId: j12-01
  - id: case-scores
    type: single
    prompt: Какой критерий оценки итоговой работы проверяет согласованность документов?
    options:
      - id: a
        text: Связность
      - id: b
        text: Ясность
      - id: c
        text: Полнота
    correct: a
    explanation: Риски из реестра должны быть отражены в графике и статусе.
    lessonId: j12-01
  - id: case-time
    type: single
    prompt: Сколько времени закладывать на итоговый проект?
    options:
      - id: a
        text: 8–12 часов в несколько подходов
      - id: b
        text: 30 минут
      - id: c
        text: Месяц без перерыва
    correct: a
    explanation: Первые шаги — самые важные.
    lessonId: j12-02
  - id: case-ai-whole
    type: single
    prompt: Можно ли отправлять вымышленный кейс в ИИ целиком?
    options:
      - id: a
        text: Да, но при адаптации под реальный проект — обезличить
      - id: b
        text: Нет, никогда
      - id: c
        text: Только частями
    correct: a
    explanation: Правила данных касаются реальной информации.
    lessonId: j12-02
  - id: portfolio-steps
    type: single
    prompt: Как построить историю проекта для портфолио?
    options:
      - id: a
        text: Контекст, роль, решения, результат, что сделал бы иначе
      - id: b
        text: Только результат
      - id: c
        text: Только обязанности
    correct: a
    explanation: История вокруг решений.
    lessonId: j12-03
  - id: portfolio-questions
    type: single
    prompt: К какому вопросу стоит подготовиться после рассказа о проекте?
    options:
      - id: a
        text: «Что пошло не по плану и что вы сделали?»
      - id: b
        text: «Какой ваш любимый цвет?»
      - id: c
        text: «Сколько вам платили?»
    correct: a
    explanation: Работодатель проверяет работу с проблемами.
    lessonId: j12-03
