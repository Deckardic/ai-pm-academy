id: j12-quiz
kind: module
title: "Тест модуля: Итоговый проект Junior"
passScore: 0.7
questionsPerAttempt: 5
questions:
  - id: artifact-order
    type: order
    prompt: "Расположите артефакты проекта в порядке, в котором их логично создавать."
    items:
      - { id: a, text: "Устав проекта" }
      - { id: b, text: "WBS" }
      - { id: c, text: "План-график с критическим путём" }
      - { id: d, text: "Статус-отчёт" }
      - { id: e, text: "Отчёт о закрытии" }
    explanation: "Каждый следующий артефакт опирается на предыдущие — от устава к закрытию."
    lessonId: j12-02
  - id: missing-data
    type: single
    prompt: "В кейсе не хватает данных для части устава. Что делать?"
    options:
      - { id: a, text: "Пропустить эти разделы" }
      - { id: b, text: "Сформулировать допущения и записать вопросы к заказчику" }
      - { id: c, text: "Попросить ИИ придумать недостающие цифры" }
    correct: b
    explanation: "Недостающие данные оформляют допущениями и вопросами — так и в реальной работе."
    lessonId: j12-01
  - id: contradiction
    type: single
    scenario: "Спонсор хочет запуск во всех трёх клиниках к 1 октября, а подрядчик оценивает интеграцию в два-четыре месяца."
    prompt: "Как правильно отразить это в уставе?"
    options:
      - { id: a, text: "Записать запуск всех клиник 1 октября" }
      - { id: b, text: "Показать риск, предложить варианты и зафиксировать выбранный" }
      - { id: c, text: "Отложить устав до точной оценки подрядчика" }
    correct: b
    explanation: "Противоречие — главный риск проекта. Его показывают спонсору с вариантами и фиксируют решение."
    lessonId: j12-01
  - id: start-point
    type: single
    prompt: "С чего лучше начать работу над итоговым кейсом?"
    options:
      - { id: a, text: "С диаграммы Ганта" }
      - { id: b, text: "С вопросов к заказчику и устава" }
      - { id: c, text: "С отчёта о закрытии" }
    correct: b
    explanation: "Без целей, границ и стейкхолдеров график строится на песке."
    lessonId: j12-01
  - id: coherence
    type: single
    scenario: "В статус-отчёте сработал риск, которого нет в реестре рисков."
    prompt: "Что это говорит о работе?"
    options:
      - { id: a, text: "Ничего страшного" }
      - {
          id: b,
          text: "Нарушена связность: риск нужно было предусмотреть или сделать из этого урок в отчёте о закрытии",
        }
      - { id: c, text: "Нужно удалить событие из статуса" }
    correct: b
    explanation: "Артефакты должны быть согласованы между собой."
    lessonId: j12-02
  - id: typical-errors
    type: multiple
    prompt: "Какие ошибки типичны для итоговых работ? Выберите все подходящие."
    options:
      - { id: a, text: "Всё идёт по плану, статус всегда зелёный" }
      - { id: b, text: "Общие риски, не связанные с кейсом" }
      - { id: c, text: "Противоречия вводных не разрешены" }
      - { id: d, text: "Отклонения честно объяснены в отчёте о закрытии" }
    correct: [a, b, c]
    explanation: "Честные отклонения — признак хорошей работы, а не ошибка."
    lessonId: j12-02
  - id: ai-journal
    type: single
    prompt: "Зачем вести журнал работы с ИИ над итоговым проектом?"
    options:
      - { id: a, text: "Чтобы показать, что работу сделал ИИ" }
      - { id: b, text: "Чтобы показать, где ИИ помогал, что вы проверили и исправили" }
      - { id: c, text: "Это не нужно" }
    correct: b
    explanation: "Журнал показывает осознанную работу с ИИ и пригодится на собеседовании."
    lessonId: j12-02
  - id: portfolio-story
    type: single
    prompt: "Что сильнее всего покажет ваш уровень в рассказе о проекте?"
    options:
      - { id: a, text: "Список методологий, которые вы знаете" }
      - { id: b, text: "Решения, которые вы приняли: варианты, выбор, обоснование" }
      - { id: c, text: "Количество проведённых встреч" }
    correct: b
    explanation: "Работодателю важно, как вы думаете и принимаете решения."
    lessonId: j12-03
  - id: ai-interview
    type: single
    prompt: "Как лучше рассказать о работе с ИИ на собеседовании?"
    options:
      - { id: a, text: "«Работаю с нейросетями»" }
      - {
          id: b,
          text: "Конкретно: какие задачи ускоряю, как проверяю, какие данные не отправляю, с примером",
        }
      - { id: c, text: "Не упоминать ИИ вообще" }
    correct: b
    explanation: "Конкретика показывает, что вы используете ИИ осознанно и отвечаете за результат."
    lessonId: j12-03
  - id: portfolio-data
    type: single
    prompt: "Что сделать с кейсом из текущей работы перед публикацией в портфолио?"
    options:
      - { id: a, text: "Ничего, так достовернее" }
      - {
          id: b,
          text: "Обезличить: убрать названия компаний и клиентов, имена, суммы и внутренние данные",
        }
      - { id: c, text: "Не использовать рабочие кейсы вообще" }
    correct: b
    explanation: "Портфолио публично. Умение обращаться с конфиденциальной информацией — тоже навык PM."
    lessonId: j12-03
