id: j07-quiz
kind: module
title: "Тест модуля: Планирование"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: wbs-definition
    type: single
    prompt: Что такое WBS?
    options:
      - { id: a, text: "Диаграмма сроков проекта" }
      - { id: b, text: "Иерархическая структура, раскладывающая результат проекта на пакеты работ" }
      - { id: c, text: "Список участников проекта" }
    correct: b
    explanation: WBS — дерево, которое раскладывает результат проекта до пакетов работ, которые можно оценить и поручить.
    lessonId: j07-01
  - id: rule-100
    type: single
    prompt: Что означает правило 100% для WBS?
    options:
      - { id: a, text: "Каждый пакет работ должен быть готов на 100% перед стартом следующего" }
      - { id: b, text: "WBS включает всю работу проекта и ничего сверх неё" }
      - { id: c, text: "Команда должна быть загружена на 100%" }
    correct: b
    explanation: Если работы нет в WBS, её нет в плане, бюджете и сроках. Лишняя работа тоже нарушает правило.
    lessonId: j07-01
  - id: wbs-results
    type: single
    prompt: Какой элемент сформулирован правильно для WBS?
    options:
      - { id: a, text: "«Позвонить в банк»" }
      - { id: b, text: "«Договор с платёжным сервисом»" }
      - { id: c, text: "«Думать над дизайном»" }
    correct: b
    explanation: WBS строится из результатов (существительных), а не действий. Действия появятся при планировании пакета работ.
    lessonId: j07-01
  - id: forgotten-work
    type: multiple
    prompt: Какие работы чаще всего забывают включить в WBS? Выберите все подходящие.
    options:
      - { id: a, text: "Управление проектом и согласования" }
      - { id: b, text: "Тестирование и исправление ошибок" }
      - { id: c, text: "Основная разработка" }
      - { id: d, text: "Обучение пользователей и документация" }
    correct: [a, b, d]
    explanation: Управленческие работы, тестирование и обучение теряют чаще всего. Основную разработку забыть трудно.
    lessonId: j07-01
  - id: rule-8-80
    type: single
    prompt: Какой ориентир по размеру пакета работ даёт правило 8–80?
    options:
      - { id: a, text: "От 8 до 80 часов" }
      - { id: b, text: "От 8 до 80 задач" }
      - { id: c, text: "От 8 до 80 дней" }
    correct: a
    explanation: Пакет работ на 8–80 часов достаточно мелкий, чтобы оценить и контролировать, и достаточно крупный, чтобы не утонуть в деталях.
    lessonId: j07-01
  - id: wbs-order
    type: order
    prompt: Расставьте уровни WBS сверху вниз.
    items:
      - { id: result, text: "Результат проекта" }
      - { id: deliverables, text: "Крупные результаты" }
      - { id: packages, text: "Пакеты работ" }
    explanation: Вершина — результат проекта, ниже — крупные результаты, в самом низу — пакеты работ, которые оценивают и поручают.
    lessonId: j07-01
  - id: pert
    type: single
    prompt: "Оценки задачи: оптимистичная — 2 дня, наиболее вероятная — 4, пессимистичная — 12. Какая ожидаемая длительность по формуле PERT (O + 4M + P) / 6?"
    options:
      - { id: a, text: "4 дня" }
      - { id: b, text: "5 дней" }
      - { id: c, text: "6 дней" }
    correct: b
    explanation: "(2 + 16 + 12) / 6 = 5 дней. Пессимистичный сценарий сдвигает ожидание вправо от наиболее вероятной оценки."
    lessonId: j07-02
  - id: who-estimates
    type: single
    prompt: Кто должен давать оценку трудозатрат пакета работ?
    options:
      - { id: a, text: "PM на основе своего опыта" }
      - { id: b, text: "Исполнитель, который будет делать работу, при поддержке PM" }
      - { id: c, text: "ИИ-ассистент по аналогии с похожими проектами" }
    correct: b
    explanation: "Исполнитель знает устройство работы и свою доступность. PM помогает учесть всё, а ИИ может подсказать факторы риска."
    lessonId: j07-02
  - id: buffer-placement
    type: single
    prompt: Где лучше держать буфер времени?
    options:
      - { id: a, text: "Спрятать понемногу в каждую задачу" }
      - { id: b, text: "Явным общим буфером проекта или перед важной вехой" }
      - { id: c, text: "Буфер не нужен, если оценки хорошие" }
    correct: b
    explanation: "Спрятанный в задачах запас обычно съедается. Явный буфер виден, и PM следит за его расходом."
    lessonId: j07-02
  - id: fs-dependency
    type: single
    prompt: Какой тип зависимости встречается чаще всего?
    options:
      - { id: a, text: "Окончание — начало" }
      - { id: b, text: "Начало — окончание" }
      - { id: c, text: "Окончание — окончание" }
    correct: a
    explanation: "Большинство связей в планах — «окончание — начало»: следующая работа стартует после окончания предыдущей."
    lessonId: j07-03
  - id: gantt-limits
    type: single
    prompt: Чего диаграмма Ганта НЕ показывает?
    options:
      - { id: a, text: "Сроки начала и окончания работ" }
      - { id: b, text: "Загрузку людей: две параллельные работы могут быть назначены на одного человека" }
      - { id: c, text: "Вехи" }
    correct: b
    explanation: "Ганта показывает сроки, связи и вехи, но не загрузку исполнителей и не неопределённость оценок."
    lessonId: j07-03
  - id: external-dependency
    type: single
    scenario: "Подрядчик обещал дать доступ к системе расписания к 10 октября. От этого зависит интеграция."
    prompt: Как отразить это в плане?
    options:
      - { id: a, text: "Считать 10 октября гарантированной датой" }
      - { id: b, text: "Отметить как внешнюю зависимость: владелец, контроль заранее, буфер и план Б" }
      - { id: c, text: "Не включать в план — это работа подрядчика" }
    correct: b
    explanation: "Внешняя дата — допущение, а не факт. Внешние зависимости — главный источник сдвигов."
    lessonId: j07-03
  - id: critical-path-def
    type: single
    prompt: Что такое критический путь?
    options:
      - { id: a, text: "Самая длинная цепочка зависимых работ, определяющая минимальный срок проекта" }
      - { id: b, text: "Список самых рискованных работ" }
      - { id: c, text: "Самая короткая дорога к запуску" }
    correct: a
    explanation: "Проект закончится, только когда закончится самая длинная цепочка. Задержка на ней сдвигает весь проект."
    lessonId: j07-04
  - id: slack-use
    type: single
    scenario: "Работа вне критического пути задержалась на 2 дня, её резерв — 3 дня."
    prompt: Как это повлияет на срок проекта?
    options:
      - { id: a, text: "Проект сдвинется на 2 дня" }
      - { id: b, text: "Не повлияет, но резерв цепочки уменьшится до 1 дня" }
      - { id: c, text: "Проект сдвинется на 3 дня" }
    correct: b
    explanation: "Задержка в пределах резерва не сдвигает проект, но резерв общий для цепочки и уменьшается."
    lessonId: j07-04
  - id: speed-up
    type: single
    prompt: Какие работы имеет смысл ускорять, чтобы сократить срок проекта?
    options:
      - { id: a, text: "Любые" }
      - { id: b, text: "Работы на критическом пути" }
      - { id: c, text: "Самые дешёвые" }
    correct: b
    explanation: "Ускорение некритических работ не меняет срок проекта — он определяется критическим путём."
    lessonId: j07-04
  - id: raci-a
    type: single
    prompt: Сколько человек с ролью A (Accountable) должно быть у одной работы в RACI?
    options:
      - { id: a, text: "Ровно один" }
      - { id: b, text: "Не меньше двух" }
      - { id: c, text: "Сколько угодно" }
    correct: a
    explanation: "Если ответственных несколько, ответственность размывается. У каждой работы — один A."
    lessonId: j07-05
  - id: availability
    type: single
    scenario: "Разработчик занят в проекте на половину времени. Оценка работы — 5 дней чистого времени."
    prompt: Когда разумно ждать результат?
    options:
      - { id: a, text: "Через 5 рабочих дней" }
      - { id: b, text: "Примерно через две недели" }
      - { id: c, text: "Через 2,5 дня" }
    correct: b
    explanation: "При доступности 50% пять дней работы растягиваются примерно на десять рабочих дней."
    lessonId: j07-05
  - id: leveling
    type: single
    prompt: С чего начинают устранение перегрузки человека?
    options:
      - { id: a, text: "С просьбы поработать по выходным" }
      - { id: b, text: "Со сдвига некритических работ в пределах их резерва" }
      - { id: c, text: "Со сдвига срока проекта" }
    correct: b
    explanation: "Сдвиг в пределах резерва не меняет срок и не перегружает людей. Сдвиг срока — последний вариант."
    lessonId: j07-05
