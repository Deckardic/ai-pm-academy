id: j07-quiz
kind: module
title: "Тест модуля: Планирование"
passScore: 0.7
questionsPerAttempt: 4
questions:
  - id: wbs-definition
    type: single
    prompt: Что такое WBS?
    options:
      - { id: a, text: "Диаграмма сроков проекта" }
      - { id: b, text: "Иерархическая структура, раскладывающая результат проекта на пакеты работ" }
      - { id: c, text: "Список участников проекта" }
    correct: b
    explanation: WBS — дерево, которое раскладывает результат проекта до пакетов работ, которые можно оценить и поручить.
    lessonId: j07-01
  - id: rule-100
    type: single
    prompt: Что означает правило 100% для WBS?
    options:
      - { id: a, text: "Каждый пакет работ должен быть готов на 100% перед стартом следующего" }
      - { id: b, text: "WBS включает всю работу проекта и ничего сверх неё" }
      - { id: c, text: "Команда должна быть загружена на 100%" }
    correct: b
    explanation: Если работы нет в WBS, её нет в плане, бюджете и сроках. Лишняя работа тоже нарушает правило.
    lessonId: j07-01
  - id: wbs-results
    type: single
    prompt: Какой элемент сформулирован правильно для WBS?
    options:
      - { id: a, text: "«Позвонить в банк»" }
      - { id: b, text: "«Договор с платёжным сервисом»" }
      - { id: c, text: "«Думать над дизайном»" }
    correct: b
    explanation: WBS строится из результатов (существительных), а не действий. Действия появятся при планировании пакета работ.
    lessonId: j07-01
  - id: forgotten-work
    type: multiple
    prompt: Какие работы чаще всего забывают включить в WBS? Выберите все подходящие.
    options:
      - { id: a, text: "Управление проектом и согласования" }
      - { id: b, text: "Тестирование и исправление ошибок" }
      - { id: c, text: "Основная разработка" }
      - { id: d, text: "Обучение пользователей и документация" }
    correct: [a, b, d]
    explanation: Управленческие работы, тестирование и обучение теряют чаще всего. Основную разработку забыть трудно.
    lessonId: j07-01
  - id: rule-8-80
    type: single
    prompt: Какой ориентир по размеру пакета работ даёт правило 8–80?
    options:
      - { id: a, text: "От 8 до 80 часов" }
      - { id: b, text: "От 8 до 80 задач" }
      - { id: c, text: "От 8 до 80 дней" }
    correct: a
    explanation: Пакет работ на 8–80 часов достаточно мелкий, чтобы оценить и контролировать, и достаточно крупный, чтобы не утонуть в деталях.
    lessonId: j07-01
  - id: wbs-order
    type: order
    prompt: Расставьте уровни WBS сверху вниз.
    items:
      - { id: result, text: "Результат проекта" }
      - { id: deliverables, text: "Крупные результаты" }
      - { id: packages, text: "Пакеты работ" }
    explanation: Вершина — результат проекта, ниже — крупные результаты, в самом низу — пакеты работ, которые оценивают и поручают.
    lessonId: j07-01
