id: j07
slug: planirovanie
order: 7
title: Планирование
summary: Декомпозиция работ, оценки, зависимости, вехи и план-график. ИИ помогает проверить полноту плана.
goals:
  - Строить WBS и не терять работы
  - Оценивать задачи и учитывать неопределённость
  - Собирать план-график с вехами и зависимостями
status: published
artifact: WBS и план-график
keyConcepts:
  - WBS
  - декомпозиция
  - оценка
  - зависимости
  - диаграмма Ганта
  - веха
  - критический путь
searchQueries:
  - wbs что это
  - как составить план проекта
  - декомпозиция задач проекта
lessonsPlan:
  - slug: wbs
    title: "WBS: декомпозиция работ"
    focus: структура и правило 100%
    durationMin: 15
    keyPoints:
      - WBS из результатов, а не действий
      - Правило 100%
      - Правило 8–80 часов
      - ИИ как критик готовой WBS
    practice: Найти пропуски в WBS переезда офиса
  - slug: ocenka-zadach
    title: Оценка задач
    focus: как оценивать и почему оценки ошибаются
    durationMin: 13
    keyPoints:
      - Экспертная оценка, аналогия, трёхточечная оценка
      - Оценивает тот, кто делает
      - "Буферы: где и сколько"
      - Почему оценки систематически занижены
    aiAngle: ИИ предлагает диапазон по аналогии — но не заменяет оценку команды
    practice: Сделать трёхточечную оценку 6 пакетов работ
  - slug: zavisimosti-i-grafik
    title: Зависимости и диаграмма Ганта
    focus: как собрать план-график
    durationMin: 13
    keyPoints:
      - Типы зависимостей, чаще всего «окончание — начало»
      - Внешние зависимости и их риски
      - "Диаграмма Ганта: что показывает и чего нет"
      - Вехи на графике
    practice: Построить график учебного проекта в таблице или трекере
  - slug: kriticheskiy-put
    title: Критический путь
    focus: какие работы определяют срок проекта
    durationMin: 13
    keyPoints:
      - Критический путь — самая длинная цепочка зависимых работ
      - Резерв времени у некритических работ
      - Расчёт на простом примере
      - Что делать, если критическая работа сдвигается
    aiAngle: ИИ проверяет расчёт критического пути — пересчитайте вручную
    practice: Найти критический путь в сети из 8 работ
  - slug: resursy-i-zagruzka
    title: Ресурсы и загрузка
    focus: кто что делает и не перегружен ли
    durationMin: 12
    keyPoints:
      - Назначение ответственных и RACI
      - "Загрузка: доступность людей меньше 100%"
      - Перегрузка и выравнивание
      - Общие ресурсы между проектами
    practice: Проверить загрузку команды учебного проекта по неделям
assignment:
  title: WBS и план-график
  deliverable: WBS учебного проекта и план-график с критическим путём
  brief:
    WBS по правилу 100%, трёхточечные оценки пакетов работ, зависимости, план-график с вехами, критический
    путь и загрузка команды.
quizFocus:
  - WBS и правило 100%
  - методы оценки
  - зависимости и график
  - критический путь
  - загрузка ресурсов
