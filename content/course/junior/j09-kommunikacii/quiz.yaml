id: j09-quiz
kind: module
title: "Тест модуля: Коммуникации"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: comm-plan-basis
    type: single
    prompt: От чего строится план коммуникаций?
    options:
      - id: a
        text: "От потребностей аудиторий: кому что и зачем нужно знать"
      - id: b
        text: От списка доступных каналов связи
      - id: c
        text: От количества встреч в неделю, которое удобно PM
    correct: a
    explanation: Разным аудиториям нужна разная глубина и частота информации. План начинается с их потребностей.
    lessonId: j09-01
  - id: sponsor-late
    type: single
    scenario: Спонсор жалуется, что узнаёт о проблемах проекта последним.
    prompt: Что изменить в плане коммуникаций в первую очередь?
    options:
      - id: a
        text: Приглашать спонсора на все встречи команды
      - id: b
        text: Добавить правило срочного информирования о рисках красной зоны и проблемах, сдвигающих вехи
      - id: c
        text: Отправлять спонсору копии всех писем
    correct: b
    explanation: Спонсору нужны важные новости вовремя, а не весь поток информации.
    lessonId: j09-01
  - id: async
    type: multiple
    prompt: Что обычно можно перевести из встреч в асинхронный формат? Выберите все подходящие.
    options:
      - id: a
        text: Еженедельный статус
      - id: b
        text: Информирование «чтобы все были в курсе»
      - id: c
        text: Сбор мнений по документу
      - id: d
        text: Разговор о конфликте в команде
    correct:
      - a
      - b
      - c
    explanation:
      Статус, информирование и сбор мнений работают письменно. Конфликты и деликатные разговоры
      лучше вести вживую.
    lessonId: j09-01
  - id: meeting-goal
    type: single
    prompt: Какая формулировка цели встречи лучше?
    options:
      - id: a
        text: Обсудить макеты
      - id: b
        text: Утвердить макеты записи или получить финальный список правок
      - id: c
        text: Поговорить о текущих вопросах
    correct: b
    explanation: Хорошая цель описывает, что должно измениться к концу встречи.
    lessonId: j09-02
  - id: stuck-discussion
    type: single
    scenario: Обсуждение пункта повестки затянулось, время вышло, решения нет.
    prompt: Что лучше сделать ведущему?
    options:
      - id: a
        text: Продолжать, пока не договорятся
      - id: b
        text: Зафиксировать открытый вопрос с ответственным за варианты и сроком решения
      - id: c
        text: Пропустить вопрос и не возвращаться к нему
    correct: b
    explanation: Так остальные вопросы не пострадают, а к открытому вернутся с подготовленными вариантами.
    lessonId: j09-02
  - id: meeting-not-needed
    type: single
    prompt: В каком случае встреча скорее всего не нужна?
    options:
      - id: a
        text: Нужно вместе выбрать один из трёх вариантов запуска
      - id: b
        text: Нужно сообщить команде о переносе демонстрации на день
      - id: c
        text: Нужно разрешить конфликт между подрядчиком и командой
    correct: b
    explanation: Информирование без совместного решения проще и дешевле сделать сообщением.
    lessonId: j09-02
  - id: task-in-minutes
    type: single
    prompt: Какая запись в протоколе оформлена правильно?
    options:
      - id: a
        text: Команда подумает над экраном отмены
      - id: b
        text: Дизайнер вносит правку в экран отмены записи до 14 октября
      - id: c
        text: Решили поработать над экраном отмены в ближайшее время
    correct: b
    explanation: У задачи в протоколе есть конкретное действие, один ответственный и дата.
    lessonId: j09-03
  - id: minutes-sections
    type: multiple
    prompt: Что обязательно должно быть в протоколе встречи? Выберите все подходящие.
    options:
      - id: a
        text: Принятые решения
      - id: b
        text: Задачи с ответственными и сроками
      - id: c
        text: Открытые вопросы
      - id: d
        text: Дословная стенограмма обсуждения
    correct:
      - a
      - b
      - c
    explanation: Протокол фиксирует итоги, а не ход обсуждения.
    lessonId: j09-03
  - id: recording-data
    type: single
    prompt: Можно ли отправить расшифровку встречи о бюджете и условиях договора в личный ИИ-ассистент?
    options:
      - id: a
        text: Да, если удалить из неё мат
      - id: b
        text: "Нет: в ней персональные данные и коммерческая информация — только разрешённые компанией сервисы"
      - id: c
        text: Да, если встреча длилась меньше часа
    correct: b
    explanation: Записи встреч содержат персональные данные участников, а здесь ещё и коммерческую тайну.
    lessonId: j09-03
  - id: yellow-status
    type: single
    scenario: Подрядчик задерживает работу на неделю, буфер на две недели, дата запуска не под угрозой.
    prompt: Какой статус честнее?
    options:
      - id: a
        text: Зелёный
      - id: b
        text: Жёлтый
      - id: c
        text: Красный
    correct: b
    explanation:
      Отклонение есть и буфер расходуется — руководитель должен знать. Решение руководства не
      нужно, поэтому не красный.
    lessonId: j09-04
  - id: done-results
    type: single
    prompt: Как лучше заполнить раздел «Сделано» в статус-отчёте?
    options:
      - id: a
        text: Провели три встречи, работали над макетами
      - id: b
        text: Макеты утверждены, подрядчик подтвердил дату тестового доступа
      - id: c
        text: Много работали, всё идёт хорошо
    correct: b
    explanation: Руководителю важны результаты, а не активность.
    lessonId: j09-04
  - id: status-ai-check
    type: single
    prompt: Что в статус-отчёте, подготовленном с ИИ, PM должен определить сам?
    options:
      - id: a
        text: Шрифт и оформление
      - id: b
        text: Общий статус и запрос к руководителю
      - id: c
        text: Порядок разделов
    correct: b
    explanation:
      Статус и запрос к руководству — управленческие решения PM. Модель склонна смягчать статус
      и не знает договорённостей со спонсором.
    lessonId: j09-04
  - id: bad-news-order
    type: order
    prompt: Расположите части письма с плохой новостью в правильном порядке.
    items:
      - id: a
        text: Факты
      - id: b
        text: Влияние на цели проекта
      - id: c
        text: План и варианты
      - id: d
        text: Запрос решения со сроком
    explanation: Сначала что произошло, затем что это значит, что вы предлагаете и что нужно от адресата.
    lessonId: j09-05
  - id: escalation-vs-complaint
    type: single
    scenario: Подрядчик третий раз срывает промежуточный срок, договорённости с его менеджером не работают.
    prompt: Какой шаг лучше?
    options:
      - id: a
        text: "Написать спонсору: «Подрядчик опять всё сорвал, разберитесь»"
      - id: b
        text:
          Предупредить менеджера подрядчика и отправить спонсору письмо с фактами, влиянием, вариантами
          и запросом
      - id: c
        text: Молча работать сверхурочно
    correct: b
    explanation: Эскалация — не жалоба. Она про ситуацию и решение, а предупреждение сохраняет отношения.
    lessonId: j09-05
  - id: comm-depth
    type: single
    prompt: Что нужно спонсору в коммуникациях проекта?
    options:
      - id: a
        text: Список из 40 задач
      - id: b
        text: Статус, прогноз, главные риски и нужные решения
      - id: c
        text: Все письма команды
      - id: d
        text: Ничего
    correct: b
    explanation: Разным аудиториям нужна разная глубина.
    lessonId: j09-01
  - id: comm-owner
    type: single
    prompt: Кто отвечает за то, чтобы коммуникации в проекте происходили?
    options:
      - id: a
        text: Никто
      - id: b
        text: PM, даже если отдельные коммуникации поручены другим
      - id: c
        text: Только спонсор
      - id: d
        text: Отдел кадров
    correct: b
    explanation: У каждой строки плана есть ответственный, но систему держит PM.
    lessonId: j09-01
  - id: chat-only
    type: single
    prompt: Чем опасно обсуждать всё только в одном чате?
    options:
      - id: a
        text: Ничем
      - id: b
        text: Решения теряются среди мелочей; их нужно фиксировать в протоколах и базе знаний
      - id: c
        text: Чаты дорогие
      - id: d
        text: Чат быстрый
    correct: b
    explanation: В чат — ссылку на решение, а не само решение.
    lessonId: j09-01
  - id: keep-meeting
    type: single
    prompt: Что лучше оставить встречей, а не письмом?
    options:
      - id: a
        text: Еженедельный статус
      - id: b
        text: Сложное решение с несколькими сторонами или конфликт
      - id: c
        text: Информирование «чтобы были в курсе»
      - id: d
        text: Сбор мнений по документу
    correct: b
    explanation: Встречи нужны там, где нужен живой разговор.
    lessonId: j09-01
  - id: no-agenda
    type: single
    prompt: Если вы не можете сформулировать цель встречи, что это значит?
    options:
      - id: a
        text: Нужно больше участников
      - id: b
        text: Встреча пока не нужна
      - id: c
        text: Встреча должна быть длиннее
      - id: d
        text: Нужна презентация
    correct: b
    explanation: Сначала разберитесь, чего хотите добиться.
    lessonId: j09-02
  - id: who-invite
    type: single
    prompt: Какой вопрос помогает решить, звать ли человека на встречу?
    options:
      - id: a
        text: «Обидится ли он?»
      - id: b
        text: «Что изменится, если его не будет?»
      - id: c
        text: «Какая у него должность?»
      - id: d
        text: «Он свободен?»
    correct: b
    explanation: Если ничего не изменится — хватит протокола.
    lessonId: j09-02
  - id: secretary
    type: single
    prompt: Зачем на большой встрече отдельный секретарь?
    options:
      - id: a
        text: Для солидности
      - id: b
        text: PM не может одновременно вести, спорить по существу и записывать решения
      - id: c
        text: Так требует закон
      - id: d
        text: Чтобы было кому опоздать
    correct: b
    explanation: Секретарь фиксирует итоги, а не стенограмму.
    lessonId: j09-02
  - id: parking
    type: single
    prompt: Что делать с важной темой, которая не относится к повестке?
    options:
      - id: a
        text: Обсудить сразу
      - id: b
        text: Записать на «парковку» и вернуться к ней позже
      - id: c
        text: Забыть
      - id: d
        text: Закончить встречу
    correct: b
    explanation: Так встреча держит фокус.
    lessonId: j09-02
  - id: start-on-time
    type: single
    prompt: Как поступить с опоздавшими?
    options:
      - id: a
        text: Ждать всех
      - id: b
        text: Начинать вовремя
      - id: c
        text: Переносить встречу
      - id: d
        text: Отменять встречу
    correct: b
    explanation: Ожидание наказывает пришедших вовремя.
    lessonId: j09-02
  - id: minutes-same-day
    type: single
    prompt: Когда отправлять протокол?
    options:
      - id: a
        text: Через неделю
      - id: b
        text: В тот же день, с просьбой сообщить об ошибках
      - id: c
        text: Перед следующей встречей
      - id: d
        text: Не отправлять
    correct: b
    explanation: Пока все помнят, ошибки легко исправить.
    lessonId: j09-03
  - id: minutes-where
    type: single
    prompt: Где хранить протоколы?
    options:
      - id: a
        text: В личной почте PM
      - id: b
        text: В базе знаний проекта с понятными названиями по дате, а задачи — в трекере
      - id: c
        text: В чате
      - id: d
        text: Нигде
    correct: b
    explanation: Через месяц любой найдёт, что решили.
    lessonId: j09-03
  - id: minutes-sensitive
    type: single
    prompt: Какие встречи лучше протоколировать вручную, без внешних ИИ-сервисов?
    options:
      - id: a
        text: Планирование спринта
      - id: b
        text: Встречи об оценке людей, конфликтах, деньгах и клиентах
      - id: c
        text: Демонстрации
      - id: d
        text: Все
    correct: b
    explanation: Там особенно много чувствительных данных.
    lessonId: j09-03
  - id: ai-decision-risk
    type: single
    prompt: Какая ошибка ИИ в протоколе самая частая?
    options:
      - id: a
        text: Опечатки
      - id: b
        text: Превращение обсуждения в «решение», которого не было
      - id: c
        text: Слишком короткий текст
      - id: d
        text: Лишние заголовки
    correct: b
    explanation: Сверяйте каждое решение со своими заметками.
    lessonId: j09-03
  - id: status-screen
    type: single
    prompt: Каким по объёму должен быть еженедельный статус-отчёт?
    options:
      - id: a
        text: На один экран
      - id: b
        text: На 10 страниц
      - id: c
        text: Одно слово
      - id: d
        text: Как получится
    correct: a
    explanation: Хороший отчёт читается за минуту.
    lessonId: j09-04
  - id: status-nothing
    type: single
    prompt: Что писать в разделе «Нужно от вас», если руководителю ничего не нужно делать?
    options:
      - id: a
        text: Ничего, удалить раздел
      - id: b
        text: "«Нужно от вас: ничего»"
      - id: c
        text: Придумать просьбу
      - id: d
        text: «Всё хорошо»
    correct: b
    explanation: "Это тоже информация: руководитель может не вмешиваться."
    lessonId: j09-04
  - id: red-criteria
    type: single
    prompt: Когда статус проекта красный?
    options:
      - id: a
        text: Когда что-то пошло не так
      - id: b
        text: Когда цели проекта под угрозой без решения руководства
      - id: c
        text: Когда PM устал
      - id: d
        text: Всегда в конце проекта
    correct: b
    explanation: Критерии статусов договаривают со спонсором заранее.
    lessonId: j09-04
  - id: status-tracker-only
    type: single
    prompt: Чего не хватает отчёту, собранному только по выгрузке трекера?
    options:
      - id: a
        text: Задач
      - id: b
        text: Рисков, разговоров с подрядчиком, контекста — заметок PM
      - id: c
        text: Цифр
      - id: d
        text: Дат
    correct: b
    explanation: Трекер показывает задачи, но не риски.
    lessonId: j09-04
  - id: one-topic
    type: single
    prompt: Сколько тем должно быть в одном деловом письме?
    options:
      - id: a
        text: Одна
      - id: b
        text: Столько, сколько накопилось
      - id: c
        text: Три
      - id: d
        text: Не важно
    correct: a
    explanation: Одну тему проще найти, переслать и ответить на неё.
    lessonId: j09-05
  - id: bad-news-speed
    type: single
    prompt: Почему плохие новости сообщают быстро?
    options:
      - id: a
        text: Чтобы отделаться
      - id: b
        text: Каждый день промедления сокращает варианты и подрывает доверие
      - id: c
        text: Так требует шаблон
      - id: d
        text: Чтобы никто не заметил
    correct: b
    explanation: Ранняя новость — рабочий вопрос, поздняя — кризис.
    lessonId: j09-05
  - id: tone-customer
    type: single
    prompt: Что убрать из письма заказчику о задержке?
    options:
      - id: a
        text: Факты
      - id: b
        text: Внутреннюю кухню и поиск виноватых
      - id: c
        text: Варианты
      - id: d
        text: Запрос решения
    correct: b
    explanation: Заказчику важно, что это значит для него и что вы предлагаете.
    lessonId: j09-05
  - id: ai-softening
    type: single
    prompt: Что особенно проверить в письме, которое помогла написать модель?
    options:
      - id: a
        text: Количество абзацев
      - id: b
        text: Не превратился ли «сдвиг на две недели» в «небольшую корректировку»
      - id: c
        text: Шрифт
      - id: d
        text: Подпись
    correct: b
    explanation: Модель склонна смягчать неприятные формулировки.
    lessonId: j09-05
