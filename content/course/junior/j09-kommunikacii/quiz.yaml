id: j09-quiz
kind: module
title: "Тест модуля: Коммуникации"
passScore: 0.7
questionsPerAttempt: 7
questions:
  - id: comm-plan-basis
    type: single
    prompt: "От чего строится план коммуникаций?"
    options:
      - { id: a, text: "От потребностей аудиторий: кому что и зачем нужно знать" }
      - { id: b, text: "От списка доступных каналов связи" }
      - { id: c, text: "От количества встреч в неделю, которое удобно PM" }
    correct: a
    explanation: "Разным аудиториям нужна разная глубина и частота информации. План начинается с их потребностей."
    lessonId: j09-01
  - id: sponsor-late
    type: single
    scenario: "Спонсор жалуется, что узнаёт о проблемах проекта последним."
    prompt: "Что изменить в плане коммуникаций в первую очередь?"
    options:
      - { id: a, text: "Приглашать спонсора на все встречи команды" }
      - { id: b, text: "Добавить правило срочного информирования о рисках красной зоны и проблемах, сдвигающих вехи" }
      - { id: c, text: "Отправлять спонсору копии всех писем" }
    correct: b
    explanation: "Спонсору нужны важные новости вовремя, а не весь поток информации."
    lessonId: j09-01
  - id: async
    type: multiple
    prompt: "Что обычно можно перевести из встреч в асинхронный формат? Выберите все подходящие."
    options:
      - { id: a, text: "Еженедельный статус" }
      - { id: b, text: "Информирование «чтобы все были в курсе»" }
      - { id: c, text: "Сбор мнений по документу" }
      - { id: d, text: "Разговор о конфликте в команде" }
    correct: [a, b, c]
    explanation: "Статус, информирование и сбор мнений работают письменно. Конфликты и деликатные разговоры лучше вести вживую."
    lessonId: j09-01
  - id: meeting-goal
    type: single
    prompt: "Какая формулировка цели встречи лучше?"
    options:
      - { id: a, text: "Обсудить макеты" }
      - { id: b, text: "Утвердить макеты записи или получить финальный список правок" }
      - { id: c, text: "Поговорить о текущих вопросах" }
    correct: b
    explanation: "Хорошая цель описывает, что должно измениться к концу встречи."
    lessonId: j09-02
  - id: stuck-discussion
    type: single
    scenario: "Обсуждение пункта повестки затянулось, время вышло, решения нет."
    prompt: "Что лучше сделать ведущему?"
    options:
      - { id: a, text: "Продолжать, пока не договорятся" }
      - { id: b, text: "Зафиксировать открытый вопрос с ответственным за варианты и сроком решения" }
      - { id: c, text: "Пропустить вопрос и не возвращаться к нему" }
    correct: b
    explanation: "Так остальные вопросы не пострадают, а к открытому вернутся с подготовленными вариантами."
    lessonId: j09-02
  - id: meeting-not-needed
    type: single
    prompt: "В каком случае встреча скорее всего не нужна?"
    options:
      - { id: a, text: "Нужно вместе выбрать один из трёх вариантов запуска" }
      - { id: b, text: "Нужно сообщить команде о переносе демонстрации на день" }
      - { id: c, text: "Нужно разрешить конфликт между подрядчиком и командой" }
    correct: b
    explanation: "Информирование без совместного решения проще и дешевле сделать сообщением."
    lessonId: j09-02
  - id: task-in-minutes
    type: single
    prompt: "Какая запись в протоколе оформлена правильно?"
    options:
      - { id: a, text: "Команда подумает над экраном отмены" }
      - { id: b, text: "Дизайнер вносит правку в экран отмены записи до 14 октября" }
      - { id: c, text: "Решили поработать над экраном отмены в ближайшее время" }
    correct: b
    explanation: "У задачи в протоколе есть конкретное действие, один ответственный и дата."
    lessonId: j09-03
  - id: minutes-sections
    type: multiple
    prompt: "Что обязательно должно быть в протоколе встречи? Выберите все подходящие."
    options:
      - { id: a, text: "Принятые решения" }
      - { id: b, text: "Задачи с ответственными и сроками" }
      - { id: c, text: "Открытые вопросы" }
      - { id: d, text: "Дословная стенограмма обсуждения" }
    correct: [a, b, c]
    explanation: "Протокол фиксирует итоги, а не ход обсуждения."
    lessonId: j09-03
  - id: recording-data
    type: single
    prompt: "Можно ли отправить расшифровку встречи о бюджете и условиях договора в личный ИИ-ассистент?"
    options:
      - { id: a, text: "Да, если удалить из неё мат" }
      - { id: b, text: "Нет: в ней персональные данные и коммерческая информация — только разрешённые компанией сервисы" }
      - { id: c, text: "Да, если встреча длилась меньше часа" }
    correct: b
    explanation: "Записи встреч содержат персональные данные участников, а здесь ещё и коммерческую тайну."
    lessonId: j09-03
  - id: yellow-status
    type: single
    scenario: "Подрядчик задерживает работу на неделю, буфер на две недели, дата запуска не под угрозой."
    prompt: "Какой статус честнее?"
    options:
      - { id: a, text: "Зелёный" }
      - { id: b, text: "Жёлтый" }
      - { id: c, text: "Красный" }
    correct: b
    explanation: "Отклонение есть и буфер расходуется — руководитель должен знать. Решение руководства не нужно, поэтому не красный."
    lessonId: j09-04
  - id: done-results
    type: single
    prompt: "Как лучше заполнить раздел «Сделано» в статус-отчёте?"
    options:
      - { id: a, text: "Провели три встречи, работали над макетами" }
      - { id: b, text: "Макеты утверждены, подрядчик подтвердил дату тестового доступа" }
      - { id: c, text: "Много работали, всё идёт хорошо" }
    correct: b
    explanation: "Руководителю важны результаты, а не активность."
    lessonId: j09-04
  - id: status-ai-check
    type: single
    prompt: "Что в статус-отчёте, подготовленном с ИИ, PM должен определить сам?"
    options:
      - { id: a, text: "Шрифт и оформление" }
      - { id: b, text: "Общий статус и запрос к руководителю" }
      - { id: c, text: "Порядок разделов" }
    correct: b
    explanation: "Статус и запрос к руководству — управленческие решения PM. Модель склонна смягчать статус и не знает договорённостей со спонсором."
    lessonId: j09-04
  - id: bad-news-order
    type: order
    prompt: "Расположите части письма с плохой новостью в правильном порядке."
    items:
      - { id: a, text: "Факты" }
      - { id: b, text: "Влияние на цели проекта" }
      - { id: c, text: "План и варианты" }
      - { id: d, text: "Запрос решения со сроком" }
    explanation: "Сначала что произошло, затем что это значит, что вы предлагаете и что нужно от адресата."
    lessonId: j09-05
  - id: escalation-vs-complaint
    type: single
    scenario: "Подрядчик третий раз срывает промежуточный срок, договорённости с его менеджером не работают."
    prompt: "Какой шаг лучше?"
    options:
      - { id: a, text: "Написать спонсору: «Подрядчик опять всё сорвал, разберитесь»" }
      - { id: b, text: "Предупредить менеджера подрядчика и отправить спонсору письмо с фактами, влиянием, вариантами и запросом" }
      - { id: c, text: "Молча работать сверхурочно" }
    correct: b
    explanation: "Эскалация — не жалоба. Она про ситуацию и решение, а предупреждение сохраняет отношения."
    lessonId: j09-05
