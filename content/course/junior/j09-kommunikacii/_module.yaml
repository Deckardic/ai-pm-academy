id: j09
slug: kommunikacii
order: 9
title: Коммуникации
summary: План коммуникаций, встречи, протоколы и статус-отчёты — и как ИИ экономит на них часы.
goals:
- Составлять план коммуникаций
- Проводить встречи с результатом
- Писать статус-отчёты и протоколы с ИИ
status: published
artifact: Шаблон статус-отчёта и протокол встречи
keyConcepts:
- план коммуникаций
- статус-отчёт
- протокол
- эскалация
searchQueries:
- статус отчет по проекту пример
- протокол совещания
lessonsPlan:
- slug: plan-kommunikaciy
  title: План коммуникаций
  focus: кому, что и как часто сообщать
  durationMin: 11
  keyPoints:
  - Аудитории и их потребности
  - Каналы и регулярность
  - Ответственный за каждую коммуникацию
  - Меньше встреч, больше асинхронности
  practice: Составить план коммуникаций учебного проекта
- slug: vstrechi-s-rezultatom
  title: Встречи с результатом
  focus: как проводить встречи, после которых что-то меняется
  durationMin: 12
  keyPoints:
  - Цель и повестка заранее
  - 'Роли: ведущий, секретарь, тайм-кипер'
  - Решения фиксируются на встрече
  - Когда встреча не нужна
  practice: Переписать повестку неудачной встречи
- slug: protokoly-vstrech
  title: Протоколы встреч
  focus: решения, задачи и открытые вопросы
  durationMin: 11
  keyPoints:
  - Структура протокола
  - Решение без ответственного и срока — не решение
  - Транскрибация и протокол с ИИ
  - Какие записи встреч нельзя отправлять во внешние сервисы
  practice: Сделать протокол по заметкам встречи с помощью промпта
- slug: status-otchet
  title: Статус-отчёт
  focus: короткий и честный отчёт для руководства
  durationMin: 12
  keyPoints:
  - Общий статус и почему
  - Сделано, в работе, риски
  - Что нужно от руководства
  - Жёлтый статус — это нормально
  aiAngle: черновик статуса из выгрузки трекера и проверка фактов
  practice: Написать статус-отчёт по учебным данным
- slug: pisma-i-eskalacii
  title: Письма и эскалации
  focus: как сообщать плохие новости и эскалировать без конфликта
  durationMin: 12
  keyPoints:
  - Структура делового письма
  - 'Плохие новости: факты, влияние, план'
  - Эскалация — не жалоба
  - Тон и адресат
  aiAngle: ИИ помогает с тоном; суть и цифры — ваши
  practice: Написать письмо о переносе срока
assignment:
  title: Статус-отчёт и протокол встречи
  deliverable: Два документа по данным учебного проекта
  brief: Протокол встречи по заметкам и еженедельный статус-отчёт для руководства; указать, что было сделано
    с ИИ и как проверено.
quizFocus:
- план коммуникаций
- эффективные встречи
- структура протокола
- статус-отчёт
- эскалации
