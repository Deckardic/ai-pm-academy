id: junior
slug: junior
order: 1
title: Junior
tagline: Основы проектного управления и ИИ-грамотность
description: >-
  Системная база профессии с нуля: что делает проект-менеджер, как устроен жизненный цикл проекта,
  как планировать, управлять рисками и коммуникациями — и как с первого дня делать это быстрее
  с помощью ИИ-ассистентов, не нарушая правил работы с данными.
audience: >-
  Для тех, кто только входит в профессию: студенты, координаторы, специалисты поддержки,
  аналитики и маркетологи, которые хотят перейти в управление проектами.
outcomes:
  - Понимать роль PM и отличать проект от продукта и операционной деятельности
  - Составлять устав проекта, WBS, план-график и реестр рисков
  - Выбирать между Waterfall, Scrum и Kanban под задачу
  - Писать рабочие промпты для статусов, протоколов и планирования
  - Знать, какие данные нельзя отправлять в ИИ, и проверять его ответы
status: published
