id: j08
slug: riski
order: 8
title: Риски и проблемы
summary: Риск и проблема — не одно и то же. Реестр рисков, оценка и реакции.
goals:
- Отличать риск от проблемы
- Вести реестр рисков
- Выбирать стратегию реагирования
status: planned
artifact: Реестр рисков
keyConcepts:
- риск
- issue
- вероятность
- влияние
- реестр рисков
searchQueries:
- реестр рисков проекта пример
- управление рисками проекта
lessonsPlan:
- slug: risk-i-problema
  title: Риск и проблема
  focus: в чём разница и почему она важна
  durationMin: 10
  keyPoints:
  - Риск — неопределённое будущее событие
  - Проблема — то, что уже случилось
  - Возможности как «положительные риски»
  - Формулировка «Если …, то …»
  practice: Разделить 10 утверждений на риски и проблемы
- slug: reestr-riskov
  title: Реестр рисков
  focus: как оценивать и вести риски
  durationMin: 13
  keyPoints:
  - Структура реестра
  - Вероятность и влияние, матрица рисков
  - Владелец риска
  - Как не превратить реестр в свалку
  aiAngle: брейншторм рисков с ИИ по категориям
  practice: Заполнить реестр на 10 рисков учебного проекта
- slug: reagirovanie-na-riski
  title: Реакции на риски
  focus: что делать с риском
  durationMin: 12
  keyPoints:
  - 'Четыре стратегии: избежать, снизить, передать, принять'
  - План реагирования и триггеры
  - Резервы времени и бюджета
  - Стоимость реакции и ценность снижения риска
  practice: Выбрать стратегию для 5 главных рисков
- slug: monitoring-riskov
  title: Мониторинг рисков
  focus: как держать риски под контролем
  durationMin: 11
  keyPoints:
  - Регулярный пересмотр
  - Триггеры и ранние сигналы
  - Эскалация риска
  - Поиск слепых зон с ИИ
  practice: Провести мини-ревью реестра и обновить оценки
assignment:
  title: Реестр рисков
  deliverable: Реестр на 10+ рисков с оценкой, владельцами и реакциями
  brief: Риски в формате «Если …, то …» по категориям, оценка вероятности и влияния, стратегии и меры,
    владельцы и триггеры.
quizFocus:
- риск и проблема
- оценка вероятности и влияния
- стратегии реагирования
- мониторинг и триггеры
