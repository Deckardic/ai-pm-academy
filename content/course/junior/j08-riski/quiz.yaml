id: j08-quiz
kind: module
title: "Тест модуля: Риски и проблемы"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: risk-or-issue
    type: single
    prompt: "Какая из записей — риск, а не проблема?"
    options:
      - { id: a, text: "Главный врач в отпуске, макеты не утверждены, работа стоит" }
      - { id: b, text: "Если главный врач уйдёт в отпуск в октябре, то утверждение макетов задержится на две недели" }
      - { id: c, text: "Юрист отказался согласовать текст согласия" }
    correct: b
    explanation: "Риск — событие, которое может произойти в будущем. Остальные уже случились — это проблемы."
    lessonId: j08-01
  - id: realized-risk
    type: single
    prompt: "Риск из реестра реализовался. Что с ним делать?"
    options:
      - { id: a, text: "Повысить оценку до максимальной и оставить в реестре" }
      - { id: b, text: "Закрыть в реестре рисков и завести проблему с ответственным и сроком решения" }
      - { id: c, text: "Удалить, чтобы не портить статистику" }
    correct: b
    explanation: "Случившееся событие — это проблема, её решают сейчас. Держать её в реестре рисков — значит откладывать действия."
    lessonId: j08-01
  - id: risk-wording
    type: single
    prompt: "Какая формулировка риска лучше всего подходит для оценки и управления?"
    options:
      - { id: a, text: "Проблемы с подрядчиком" }
      - { id: b, text: "Если подрядчик задержит доступ к расписанию больше чем на неделю, то интеграция не будет готова к 1 ноября и запуск сдвинется" }
      - { id: c, text: "Человеческий фактор" }
    correct: b
    explanation: "Формулировка «Если …, то …» содержит событие и последствие — её можно оценить и понять, за чем следить."
    lessonId: j08-01
  - id: opportunity
    type: single
    prompt: "Что такое возможность в управлении рисками?"
    options:
      - { id: a, text: "Неопределённое событие, которое может улучшить результат проекта" }
      - { id: b, text: "Риск с низкой вероятностью" }
      - { id: c, text: "Проблема, которую уже решили" }
    correct: a
    explanation: "Возможности — положительные риски. Ими тоже управляют — оценивают и повышают шанс реализации."
    lessonId: j08-01
  - id: risk-score
    type: single
    prompt: "Риск оценён по вероятности на 4 и по влиянию на 4 по шкале 1–5. Какая у него оценка и зона?"
    options:
      - { id: a, text: "8, зелёная зона" }
      - { id: b, text: "16, красная зона" }
      - { id: c, text: "4, жёлтая зона" }
    correct: b
    explanation: "Оценка — произведение вероятности и влияния, 4 × 4 = 16. Это красная зона — нужны активные меры."
    lessonId: j08-02
  - id: low-prob-high-impact
    type: single
    prompt: "Риск с вероятностью 2 и влиянием 5 (запуск сдвинется больше чем на месяц). Как с ним работать?"
    options:
      - { id: a, text: "Игнорировать — маловероятно" }
      - { id: b, text: "Держать в поле зрения и продумать меры — влияние критическое" }
      - { id: c, text: "Эскалировать как случившуюся проблему" }
    correct: b
    explanation: "Маловероятные риски с критическим влиянием нельзя игнорировать, но и проблемой они ещё не стали."
    lessonId: j08-02
  - id: risk-owner
    type: single
    prompt: "Кто лучше всего подходит на роль владельца риска задержки подрядчика?"
    options:
      - { id: a, text: "PM — он владелец всех рисков" }
      - { id: b, text: "Тот, кто непосредственно работает с подрядчиком" }
      - { id: c, text: "Спонсор проекта" }
    correct: b
    explanation: "Владелец риска — тот, кто ближе всего к источнику и первым заметит триггеры."
    lessonId: j08-02
  - id: strategies
    type: order
    prompt: "Расположите стратегии реагирования на угрозу от самой радикальной (риск исчезает) к самой пассивной."
    items:
      - { id: a, text: "Избежать" }
      - { id: b, text: "Снизить" }
      - { id: c, text: "Передать" }
      - { id: d, text: "Принять" }
    explanation: "Избежать — изменить план, чтобы риск исчез; снизить — уменьшить вероятность или влияние; передать — переложить последствия; принять — осознанно ничего не делать заранее."
    lessonId: j08-03
  - id: transfer-limit
    type: single
    prompt: "Что НЕ даёт штраф в договоре с подрядчиком за задержку?"
    options:
      - { id: a, text: "Частичную компенсацию потерь" }
      - { id: b, text: "Возврат потерянного времени" }
      - { id: c, text: "Мотивацию подрядчика соблюдать сроки" }
    correct: b
    explanation: "Передача помогает с деньгами, но не со сроками. Поэтому её сочетают со снижением риска."
    lessonId: j08-03
  - id: good-trigger
    type: single
    prompt: "Какой триггер лучше для риска задержки интеграции к 1 ноября?"
    options:
      - { id: a, text: "Интеграция не готова к 1 ноября" }
      - { id: b, text: "Тестовый доступ не выдан к 15 сентября" }
      - { id: c, text: "Главный врач спросил о статусе" }
    correct: b
    explanation: "Хороший триггер наступает раньше события, пока есть время реагировать. Первый вариант — уже проблема."
    lessonId: j08-03
  - id: early-signals
    type: multiple
    prompt: "Какие признаки — ранние сигналы проблем? Выберите все подходящие."
    options:
      - { id: a, text: "Подрядчик перестал отвечать вовремя" }
      - { id: b, text: "Промежуточные сроки сдвигаются «на пару дней»" }
      - { id: c, text: "Ответы «почти готово» без конкретики" }
      - { id: d, text: "Команда закрывает задачи в срок" }
    correct: [a, b, c]
    explanation: "Молчание, переносы и размытые ответы часто предшествуют срыву сроков."
    lessonId: j08-04
  - id: escalation
    type: single
    prompt: "Как правильно эскалировать риск спонсору?"
    options:
      - { id: a, text: "Когда риск уже случился, чтобы не беспокоить зря" }
      - { id: b, text: "Вовремя, коротко, с вариантами решения и конкретным запросом" }
      - { id: c, text: "Переслать весь реестр рисков без комментариев" }
    correct: b
    explanation: "Ранняя эскалация с вариантами сохраняет доверие спонсора и оставляет время на реакцию."
    lessonId: j08-04
