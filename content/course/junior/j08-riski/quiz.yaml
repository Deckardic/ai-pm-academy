id: j08-quiz
kind: module
title: "Тест модуля: Риски и проблемы"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: risk-or-issue
    type: single
    prompt: Какая из записей — риск, а не проблема?
    options:
      - id: a
        text: Главный врач в отпуске, макеты не утверждены, работа стоит
      - id: b
        text: Если главный врач уйдёт в отпуск в октябре, то утверждение макетов задержится на две недели
      - id: c
        text: Юрист отказался согласовать текст согласия
    correct: b
    explanation: Риск — событие, которое может произойти в будущем. Остальные уже случились — это проблемы.
    lessonId: j08-01
  - id: realized-risk
    type: single
    prompt: Риск из реестра реализовался. Что с ним делать?
    options:
      - id: a
        text: Повысить оценку до максимальной и оставить в реестре
      - id: b
        text: Закрыть в реестре рисков и завести проблему с ответственным и сроком решения
      - id: c
        text: Удалить, чтобы не портить статистику
    correct: b
    explanation:
      Случившееся событие — это проблема, её решают сейчас. Держать её в реестре рисков — значит
      откладывать действия.
    lessonId: j08-01
  - id: risk-wording
    type: single
    prompt: Какая формулировка риска лучше всего подходит для оценки и управления?
    options:
      - id: a
        text: Проблемы с подрядчиком
      - id: b
        text:
          Если подрядчик задержит доступ к расписанию больше чем на неделю, то интеграция не будет готова
          к 1 ноября и запуск сдвинется
      - id: c
        text: Человеческий фактор
    correct: b
    explanation:
      Формулировка «Если …, то …» содержит событие и последствие — её можно оценить и понять,
      за чем следить.
    lessonId: j08-01
  - id: opportunity
    type: single
    prompt: Что такое возможность в управлении рисками?
    options:
      - id: a
        text: Неопределённое событие, которое может улучшить результат проекта
      - id: b
        text: Риск с низкой вероятностью
      - id: c
        text: Проблема, которую уже решили
    correct: a
    explanation: Возможности — положительные риски. Ими тоже управляют — оценивают и повышают шанс реализации.
    lessonId: j08-01
  - id: risk-score
    type: single
    prompt: Риск оценён по вероятности на 4 и по влиянию на 4 по шкале 1–5. Какая у него оценка и зона?
    options:
      - id: a
        text: 8, зелёная зона
      - id: b
        text: 16, красная зона
      - id: c
        text: 4, жёлтая зона
    correct: b
    explanation:
      Оценка — произведение вероятности и влияния, 4 × 4 = 16. Это красная зона — нужны активные
      меры.
    lessonId: j08-02
  - id: low-prob-high-impact
    type: single
    prompt: Риск с вероятностью 2 и влиянием 5 (запуск сдвинется больше чем на месяц). Как с ним работать?
    options:
      - id: a
        text: Игнорировать — маловероятно
      - id: b
        text: Держать в поле зрения и продумать меры — влияние критическое
      - id: c
        text: Эскалировать как случившуюся проблему
    correct: b
    explanation:
      Маловероятные риски с критическим влиянием нельзя игнорировать, но и проблемой они ещё
      не стали.
    lessonId: j08-02
  - id: risk-owner
    type: single
    prompt: Кто лучше всего подходит на роль владельца риска задержки подрядчика?
    options:
      - id: a
        text: PM — он владелец всех рисков
      - id: b
        text: Тот, кто непосредственно работает с подрядчиком
      - id: c
        text: Спонсор проекта
    correct: b
    explanation: Владелец риска — тот, кто ближе всего к источнику и первым заметит триггеры.
    lessonId: j08-02
  - id: strategies
    type: order
    prompt: Расположите стратегии реагирования на угрозу от самой радикальной (риск исчезает) к самой пассивной.
    items:
      - id: a
        text: Избежать
      - id: b
        text: Снизить
      - id: c
        text: Передать
      - id: d
        text: Принять
    explanation:
      Избежать — изменить план, чтобы риск исчез; снизить — уменьшить вероятность или влияние;
      передать — переложить последствия; принять — осознанно ничего не делать заранее.
    lessonId: j08-03
  - id: transfer-limit
    type: single
    prompt: Что НЕ даёт штраф в договоре с подрядчиком за задержку?
    options:
      - id: a
        text: Частичную компенсацию потерь
      - id: b
        text: Возврат потерянного времени
      - id: c
        text: Мотивацию подрядчика соблюдать сроки
    correct: b
    explanation: Передача помогает с деньгами, но не со сроками. Поэтому её сочетают со снижением риска.
    lessonId: j08-03
  - id: good-trigger
    type: single
    prompt: Какой триггер лучше для риска задержки интеграции к 1 ноября?
    options:
      - id: a
        text: Интеграция не готова к 1 ноября
      - id: b
        text: Тестовый доступ не выдан к 15 сентября
      - id: c
        text: Главный врач спросил о статусе
    correct: b
    explanation:
      Хороший триггер наступает раньше события, пока есть время реагировать. Первый вариант —
      уже проблема.
    lessonId: j08-03
  - id: early-signals
    type: multiple
    prompt: Какие признаки — ранние сигналы проблем? Выберите все подходящие.
    options:
      - id: a
        text: Подрядчик перестал отвечать вовремя
      - id: b
        text: Промежуточные сроки сдвигаются «на пару дней»
      - id: c
        text: Ответы «почти готово» без конкретики
      - id: d
        text: Команда закрывает задачи в срок
    correct:
      - a
      - b
      - c
    explanation: Молчание, переносы и размытые ответы часто предшествуют срыву сроков.
    lessonId: j08-04
  - id: escalation
    type: single
    prompt: Как правильно эскалировать риск спонсору?
    options:
      - id: a
        text: Когда риск уже случился, чтобы не беспокоить зря
      - id: b
        text: Вовремя, коротко, с вариантами решения и конкретным запросом
      - id: c
        text: Переслать весь реестр рисков без комментариев
    correct: b
    explanation: Ранняя эскалация с вариантами сохраняет доверие спонсора и оставляет время на реакцию.
    lessonId: j08-04
  - id: risk-issue-log
    type: single
    prompt: Где ведут случившиеся проблемы?
    options:
      - id: a
        text: В реестре рисков
      - id: b
        text: В журнале проблем с ответственным и сроком
      - id: c
        text: В чате
      - id: d
        text: Нигде
    correct: b
    explanation: Случившееся событие решают сейчас.
    lessonId: j08-01
  - id: opportunity-example
    type: single
    prompt: Что из этого — возможность?
    options:
      - id: a
        text: Подрядчик может задержать доступ
      - id: b
        text: Обновление системы расписания может ускорить интеграцию вдвое
      - id: c
        text: Разработчик заболел
      - id: d
        text: Бюджет превышен
    correct: b
    explanation: Возможность — неопределённое событие, улучшающее результат.
    lessonId: j08-01
  - id: risk-parts
    type: single
    prompt: Какие части есть в формулировке «Если …, то … для …»?
    options:
      - id: a
        text: Событие, последствие, цель проекта
      - id: b
        text: Имя, дата, подпись
      - id: c
        text: Цена, срок, бюджет
      - id: d
        text: Роль, задача, формат
    correct: a
    explanation: Такую формулировку можно оценить и понять, за чем следить.
    lessonId: j08-01
  - id: masked-issues
    type: single
    prompt: Почему опасно держать проблемы в реестре рисков?
    options:
      - id: a
        text: Реестр становится длиннее
      - id: b
        text: Проблемы маскируются под риски, и проект выглядит лучше, чем есть
      - id: c
        text: Так нельзя по закону
      - id: d
        text: Это не опасно
    correct: b
    explanation: Честность статуса страдает до самого срыва.
    lessonId: j08-01
  - id: scale-describe
    type: single
    prompt: Зачем описывать шкалу влияния для своего проекта?
    options:
      - id: a
        text: Для красоты
      - id: b
        text: Чтобы разные люди оценивали одинаково
      - id: c
        text: Так требует ИИ
      - id: d
        text: Чтобы оценки были выше
    correct: b
    explanation: "Например: «5 — сдвиг запуска больше месяца»."
    lessonId: j08-02
  - id: assess-together
    type: single
    prompt: Как лучше оценивать риски?
    options:
      - id: a
        text: PM в одиночку
      - id: b
        text: Вместе с командой и владельцами рисков
      - id: c
        text: ИИ сам
      - id: d
        text: Не оценивать
    correct: b
    explanation: Оценка — договорённость, а не расчёт.
    lessonId: j08-02
  - id: register-size
    type: single
    prompt: Сколько активных рисков обычно достаточно для проекта среднего размера?
    options:
      - id: a
        text: "3"
      - id: b
        text: 10–20
      - id: c
        text: "200"
      - id: d
        text: Чем больше, тем лучше
    correct: b
    explanation: Реестр из сотни строк никто не читает.
    lessonId: j08-02
  - id: ai-brainstorm-filter
    type: single
    prompt: Что сделать с результатом брейншторма рисков с ИИ в первую очередь?
    options:
      - id: a
        text: Добавить всё
      - id: b
        text: Отфильтровать общие риски и переформулировать остальные под проект
      - id: c
        text: Удалить
      - id: d
        text: Отправить спонсору
    correct: b
    explanation: Общие риски вроде «команда может заболеть» не помогают.
    lessonId: j08-02
  - id: register-fields
    type: multiple
    prompt: Какие поля нужны в реестре рисков? Выберите все подходящие.
    options:
      - id: a
        text: Формулировка «Если …, то …»
      - id: b
        text: Вероятность и влияние
      - id: c
        text: Владелец и триггер
      - id: d
        text: Имя виновного
    correct:
      - a
      - b
      - c
    explanation: Реестр — про управление, а не поиск виноватых.
    lessonId: j08-02
  - id: avoid-example
    type: single
    prompt: Какая мера соответствует стратегии «избежать»?
    options:
      - id: a
        text: Заложить буфер
      - id: b
        text: Выбрать решение с готовым модулем, чтобы риск интеграции исчез
      - id: c
        text: Прописать штраф
      - id: d
        text: Ничего не делать
    correct: b
    explanation: Избегание меняет план так, что риск исчезает.
    lessonId: j08-03
  - id: accept-active
    type: single
    prompt: Что отличает активное принятие риска от пассивного?
    options:
      - id: a
        text: Ничего
      - id: b
        text: У активного есть план на случай срабатывания и резерв
      - id: c
        text: Пассивное лучше
      - id: d
        text: Активное — это снижение
    correct: b
    explanation: Пассивное принятие — просто наблюдать.
    lessonId: j08-03
  - id: reserve-hotelki
    type: single
    prompt: Заказчик просит оплатить новую функцию из резерва на риски. Что ответить?
    options:
      - id: a
        text: Согласиться
      - id: b
        text: Резерв — для рисков; новые работы — через управление изменениями
      - id: c
        text: Отдать весь резерв
      - id: d
        text: Удалить резерв
    correct: b
    explanation: Иначе при срабатывании риска защиты не будет.
    lessonId: j08-03
  - id: cheap-measure
    type: single
    prompt: Мера почти ничего не стоит, а ущерб от риска большой. Что делать?
    options:
      - id: a
        text: Отложить
      - id: b
        text: Делать без раздумий
      - id: c
        text: Эскалировать
      - id: d
        text: Принять риск
    correct: b
    explanation: Например, еженедельный 15-минутный созвон с подрядчиком.
    lessonId: j08-03
  - id: opportunity-strategies
    type: single
    prompt: Какие стратегии применяют к возможностям?
    options:
      - id: a
        text: Использовать, усилить, разделить, принять
      - id: b
        text: Избежать, снизить, передать
      - id: c
        text: Игнорировать
      - id: d
        text: Эскалировать
    correct: a
    explanation: Они зеркальны стратегиям для угроз.
    lessonId: j08-03
  - id: review-frequency
    type: single
    prompt: Как часто полезно пересматривать риски?
    options:
      - id: a
        text: Раз в год
      - id: b
        text: Раз в одну-две недели
      - id: c
        text: Только на старте
      - id: d
        text: Никогда
    correct: b
    explanation: Риски меняются вместе с проектом.
    lessonId: j08-04
  - id: review-questions
    type: single
    prompt: Что эффективнее на пересмотре рисков?
    options:
      - id: a
        text: Зачитывать реестр вслух
      - id: b
        text: "Задавать вопросы: что изменилось, что беспокоит больше, что недооцениваем"
      - id: c
        text: Молчать
      - id: d
        text: Удалять старые риски без обсуждения
    correct: b
    explanation: Пересмотр — это разговор, а не чтение таблицы.
    lessonId: j08-04
  - id: status-match
    type: single
    prompt: Что должно совпадать с реестром рисков?
    options:
      - id: a
        text: Главные риски в статус-отчёте
      - id: b
        text: Список команды
      - id: c
        text: Бюджет
      - id: d
        text: Название проекта
    correct: a
    explanation: Иначе отчёт и реестр рассказывают разные истории.
    lessonId: j08-04
  - id: warn-before-escalate
    type: single
    prompt: Что сделать перед эскалацией риска?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Предупредить тех, кого она касается
      - id: c
        text: Удалить переписку
      - id: d
        text: Сменить подрядчика
    correct: b
    explanation: Эскалация за спиной разрушает доверие.
    lessonId: j08-04
  - id: blind-spots-ai
    type: single
    prompt: Как ИИ помогает при мониторинге рисков?
    options:
      - id: a
        text: Меняет оценки
      - id: b
        text: Находит категории рисков, которых нет в реестре
      - id: c
        text: Утверждает реестр
      - id: d
        text: Закрывает риски
    correct: b
    explanation: Оценки меняют владельцы рисков.
    lessonId: j08-04
  - id: silence-signal
    type: single
    prompt: Подрядчик перестал отвечать вовремя. Как это расценить?
    options:
      - id: a
        text: Нормально
      - id: b
        text: Ранний сигнал, требующий уточнить статус
      - id: c
        text: Повод для расторжения договора
      - id: d
        text: Ничего не значит
    correct: b
    explanation: Молчание часто предшествует задержке.
    lessonId: j08-04
