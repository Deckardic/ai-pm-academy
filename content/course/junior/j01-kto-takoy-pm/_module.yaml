id: j01
slug: kto-takoy-pm
order: 1
title: Кто такой PM сегодня
summary: Чем проект отличается от продукта и операционной работы, какие роли бывают рядом с PM и как ИИ
  меняет профессию.
goals:
- Отличать проект от продукта и операционной деятельности
- Понимать зону ответственности PM и соседних ролей
- Видеть, какие задачи PM ИИ ускоряет, а какие — нет
status: published
artifact: Карта своих сильных сторон и плана развития
keyConcepts:
- проект
- продукт
- операционная деятельность
- роль PM
- Delivery Manager
- Scrum Master
searchQueries:
- кто такой проект менеджер
- чем занимается project manager
- проект и продукт разница
lessonsPlan:
- slug: proekt-produkt-operacii
  title: Проект, продукт и операционная работа
  focus: определения и границы трёх типов работы
  durationMin: 12
  keyPoints:
  - 'Проект: временная работа с уникальным результатом'
  - 'Операционная деятельность: повторяющаяся работа по регламентам'
  - Продукт живёт, пока приносит ценность; внутри него возникают проекты
  - Почему путаница типов работы стоит дорого
  aiAngle: ИИ помогает разложить размытые вводные на проектную и операционную части, решение остаётся
    за PM
  practice: Классифицировать 8 рабочих ситуаций на проект, продукт и операционную работу
- slug: roli-ryadom-s-pm
  title: Роли рядом с PM
  focus: зоны ответственности PM, Product Manager, Scrum Master и Delivery Manager
  durationMin: 10
  keyPoints:
  - Project Manager отвечает за то, как довести проект до результата
  - Product Manager — за то, что и зачем делать
  - Scrum Master — за процесс команды по Scrum, а не за сроки
  - Delivery Manager — за стабильную поставку в системе команд
  - Совмещение ролей в небольших компаниях
  aiAngle: черновик RACI по описанию ролей с последующей проверкой командой
  practice: Составить RACI для учебного проекта из 5 задач и 4 ролей
- slug: kak-ii-menyaet-rabotu-pm
  title: Как ИИ меняет работу PM
  focus: что ИИ ускоряет уже сегодня и что остаётся за человеком
  durationMin: 11
  keyPoints:
  - 'Черновики: протоколы, статусы, письма'
  - Структурирование и поиск пропусков
  - Решения, отношения и ответственность остаются за PM
  - Реальная экономия времени появляется с готовыми промптами и проверкой
  aiAngle: сравнение одной задачи вручную и с ИИ, с оценкой времени на проверку
  practice: Выписать 5 своих повторяющихся задач и отметить, где ИИ поможет и что придётся проверять
- slug: kompetencii-i-kariera
  title: Компетенции и карьерный путь PM
  focus: из чего состоит профессия и куда в ней расти
  durationMin: 12
  keyPoints:
  - 'Три группы навыков: управление проектом, работа с людьми, понимание бизнеса'
  - Чем отличаются Junior, Middle и Senior на практике
  - Как выглядит неделя проект-менеджера
  - 'Траектории роста: программы, PMO, продукт, delivery'
  - Как собрать портфолио без опыта работы PM
  aiAngle: 'ИИ как тренажёр: задать себе вопросы для самооценки и подготовиться к собеседованию'
  practice: Оценить себя по карте компетенций и выбрать две зоны роста
assignment:
  title: Карта сильных сторон и план развития
  deliverable: Документ на 1–2 страницы с картой навыков и планом на три месяца
  brief: Самооценка по пяти навыкам PM с примерами из опыта, две зоны роста с конкретными действиями и
    сроками, где и как будет использоваться ИИ.
quizFocus:
- отличие проекта, продукта и операционной работы
- зоны ответственности PM и соседних ролей
- где ИИ помогает PM и где нет
- ответственность за результат работы ИИ
