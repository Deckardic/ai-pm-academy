id: j01-quiz
kind: module
title: "Тест модуля: Кто такой PM сегодня"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: project-definition
    type: single
    prompt: Какое определение проекта точнее?
    options:
      - id: a
        text: Любая работа, у которой есть ответственный
      - id: b
        text: Временная деятельность, направленная на создание уникального результата
      - id: c
        text: Работа, которую выполняет команда из нескольких человек
      - id: d
        text: Любая задача сроком больше месяца
    correct: b
    explanation:
      Ключевые признаки проекта — временный характер и уникальный результат. Размер команды и
      длительность здесь не главное.
    lessonId: j01-01
  - id: operations-example
    type: single
    scenario: Отдел кадров каждый месяц рассчитывает отпуска сотрудников по регламенту.
    prompt: Что это за тип работы?
    options:
      - id: a
        text: Проект
      - id: b
        text: Операционная деятельность
      - id: c
        text: Продукт
    correct: b
    explanation:
      Работа повторяется по регламенту и не создаёт уникального результата — это операционная
      деятельность.
    lessonId: j01-01
  - id: project-examples
    type: multiple
    prompt: Что из перечисленного — проекты? Выберите все подходящие варианты.
    options:
      - id: a
        text: Внедрение новой CRM к концу квартала
      - id: b
        text: Ежедневная обработка входящих заявок
      - id: c
        text: Переезд офиса в новое здание
      - id: d
        text: Выпуск годового отчёта, который делают по шаблону каждый год
      - id: e
        text: Запуск онлайн-курса для клиентов
    correct:
      - a
      - c
      - e
    explanation:
      У внедрения CRM, переезда и запуска курса есть срок и уникальный результат. Обработка заявок
      и отчёт по шаблону — повторяющаяся операционная работа.
    lessonId: j01-01
  - id: product-vs-project
    type: single
    prompt: Чем продукт отличается от проекта?
    options:
      - id: a
        text: У продукта нет даты окончания — он развивается, пока приносит ценность
      - id: b
        text: Продукт всегда меньше проекта
      - id: c
        text: Продуктом управляет Project Manager
    correct: a
    explanation:
      Продукт живёт, пока приносит ценность, а внутри его жизни возникают проекты с началом и
      концом.
    lessonId: j01-01
  - id: pm-vs-product
    type: single
    scenario: Стейкхолдер спрашивает, почему в релиз вошла функция экспорта, а не интеграция с мессенджером.
    prompt: Чей это вопрос в первую очередь?
    options:
      - id: a
        text: Project Manager
      - id: b
        text: Product Manager
      - id: c
        text: Scrum Master
      - id: d
        text: Delivery Manager
    correct: b
    explanation:
      Что и зачем делать — зона Product Manager. PM подключится, чтобы оценить влияние решения
      на сроки и бюджет.
    lessonId: j01-02
  - id: scrum-master-role
    type: single
    prompt: Что НЕ входит в обязанности Scrum Master?
    options:
      - id: a
        text: Фасилитировать события Scrum
      - id: b
        text: Помогать убирать препятствия команды
      - id: c
        text: Раздавать задачи и отвечать за сроки проекта
    correct: c
    explanation:
      Scrum Master помогает команде работать по Scrum, но не распределяет задачи и не отвечает
      за сроки — это отличает его от PM.
    lessonId: j01-02
  - id: ai-strengths
    type: multiple
    prompt: С какими задачами ИИ-ассистент помогает PM лучше всего? Выберите все подходящие.
    options:
      - id: a
        text: Черновик протокола встречи по заметкам
      - id: b
        text: Решение, переносить ли релиз
      - id: c
        text: Поиск пропусков в списке рисков
      - id: d
        text: Разговор с разработчиком о снижении качества его работы
      - id: e
        text: Структурирование хаотичных вводных в таблицу
    correct:
      - a
      - c
      - e
    explanation:
      ИИ силён в черновиках, структурировании и поиске пропусков. Решения и сложные разговоры
      с людьми остаются за PM.
    lessonId: j01-03
  - id: ai-responsibility
    type: single
    scenario: ИИ подготовил статус-отчёт, в который попала неверная цифра по бюджету. Отчёт ушёл руководству.
    prompt: Кто отвечает за ошибку?
    options:
      - id: a
        text: Разработчик ИИ-сервиса
      - id: b
        text: PM, который отправил отчёт
      - id: c
        text: Никто — это сбой модели
    correct: b
    explanation: ИИ — инструмент. Ответственность за проверку и отправку результата остаётся за проект-менеджером.
    lessonId: j01-03
  - id: middle-expectation
    type: single
    scenario: Подрядчик сорвал срок поставки оборудования на две недели.
    prompt: Как поступит проект-менеджер уровня Middle?
    options:
      - id: a
        text: Подождёт, вдруг подрядчик успеет
      - id: b
        text: Сообщит руководителю о проблеме и принесёт варианты решения с их ценой
      - id: c
        text: Попросит руководителя самому разобраться с подрядчиком
    correct: b
    explanation:
      От Middle ждут не только сигнала о проблеме, но и вариантов решения с последствиями для
      сроков и бюджета.
    lessonId: j01-04
  - id: portfolio-case
    type: single
    prompt: Что делает кейс в портфолио PM убедительным?
    options:
      - id: a
        text: "Список обязанностей: «координировал команду, взаимодействовал со стейкхолдерами»"
      - id: b
        text: Цель, ваши действия, созданные артефакты и измеримый результат
      - id: c
        text: Название известного клиента и сумма договора
    correct: b
    explanation:
      Кейс показывает, как вы думаете и действуете. Общие слова ничего не доказывают, а данные
      клиента раскрывать нельзя.
    lessonId: j01-04
  - id: ops-signs
    type: single
    prompt: По какому признаку работу скорее всего стоит считать операционной?
    options:
      - id: a
        text: У неё есть дата окончания и уникальный результат
      - id: b
        text: Она повторяется по регламенту и не имеет финала
      - id: c
        text: В ней участвует больше пяти человек
      - id: d
        text: Её ведёт проект-менеджер
    correct: b
    explanation:
      Операционная деятельность — регулярная работа без финала. Размер команды и роль PM не определяют
      тип работы.
    lessonId: j01-01
  - id: project-in-product
    type: single
    prompt: Как соотносятся продукт и проекты?
    options:
      - id: a
        text: Проект всегда больше продукта
      - id: b
        text: Внутри жизни продукта возникают проекты с началом и концом
      - id: c
        text: Продукт — это проект, который затянулся
      - id: d
        text: Они никак не связаны
    correct: b
    explanation:
      Продукт живёт, пока приносит ценность, а доработки и запуски внутри него часто оформляются
      как проекты.
    lessonId: j01-01
  - id: ops-as-project-cost
    type: single
    scenario: Поддержку сайта оформили как «проект» с дедлайном каждую неделю.
    prompt: Что обычно происходит, если бесконечную операционную работу вести как проект?
    options:
      - id: a
        text: Работа становится дешевле
      - id: b
        text: Команда живёт в вечном дедлайне и выгорает
      - id: c
        text: Ничего не меняется
      - id: d
        text: Качество автоматически растёт
    correct: b
    explanation: Инструменты проекта — вехи, дедлайны, закрытие — не подходят для работы без финала.
    lessonId: j01-01
  - id: classify-launch
    type: single
    prompt: К какому типу работы относится запуск нового курса для клиентов к осени?
    options:
      - id: a
        text: Проект
      - id: b
        text: Операционная деятельность
      - id: c
        text: Продукт
      - id: d
        text: Ни к какому
    correct: a
    explanation: У запуска есть срок и уникальный результат — это проект.
    lessonId: j01-01
  - id: classify-many
    type: multiple
    prompt: Что из перечисленного — операционная работа? Выберите все подходящие.
    options:
      - id: a
        text: Ежемесячное закрытие бухгалтерского периода
      - id: b
        text: Разовый переезд склада
      - id: c
        text: Ответы на обращения клиентов в поддержке
      - id: d
        text: Внедрение новой CRM
    correct:
      - a
      - c
    explanation: Закрытие периода и поддержка повторяются по регламенту. Переезд и внедрение — проекты.
    lessonId: j01-01
  - id: ai-split-work
    type: single
    prompt: Как ИИ может помочь с размытым запросом руководителя «навести порядок в отчётности»?
    options:
      - id: a
        text: Сам решить, что делать
      - id: b
        text: Разложить запрос на проектную и операционную части, а решение оставить PM
      - id: c
        text: Написать приказ
      - id: d
        text: Ничем
    correct: b
    explanation:
      Модель хорошо структурирует вводные, но решение о том, что считать проектом, принимает
      PM.
    lessonId: j01-01
  - id: delivery-focus
    type: single
    prompt: На чём сфокусирован Delivery-менеджер?
    options:
      - id: a
        text: На ценности и метриках продукта
      - id: b
        text: На стабильной поставке результата одной или нескольких командами
      - id: c
        text: На фасилитации событий Scrum
      - id: d
        text: На продажах
    correct: b
    explanation:
      Delivery-менеджер работает с потоком поставки, метриками и зависимостями, а не с одним
      проектом.
    lessonId: j01-02
  - id: sm-not-tasks
    type: single
    prompt: Кто из ролей НЕ раздаёт задачи команде и не отвечает за сроки?
    options:
      - id: a
        text: Scrum Master
      - id: b
        text: Project Manager
      - id: c
        text: Delivery Manager
    correct: a
    explanation:
      Scrum Master помогает команде работать по Scrum, но не распределяет задачи и не отвечает
      за сроки.
    lessonId: j01-02
  - id: roles-combined
    type: single
    prompt: В небольшой компании PM совмещает роли продакта и фасилитатора. Что важно?
    options:
      - id: a
        text: Никогда не совмещать роли
      - id: b
        text: Понимать, какую «шляпу» вы надеваете в каждой ситуации
      - id: c
        text: Отдать все решения команде
      - id: d
        text: Отказаться от ретроспектив
    correct: b
    explanation: Совмещение нормально, если вы осознаёте, в какой роли действуете в конкретный момент.
    lessonId: j01-02
  - id: raci-ai
    type: single
    prompt: Как разумно использовать ИИ для распределения ролей в команде?
    options:
      - id: a
        text: Попросить ИИ назначить ответственных и разослать
      - id: b
        text: Получить черновик RACI и обсудить его с командой
      - id: c
        text: Не использовать ИИ вообще
      - id: d
        text: Взять RACI из интернета
    correct: b
    explanation: Черновик ускоряет работу, но договорённость о ролях принимают люди.
    lessonId: j01-02
  - id: pm-expertise
    type: single
    prompt: В чём главная экспертиза проект-менеджера?
    options:
      - id: a
        text: В предметной области проекта
      - id: b
        text: "В организации работы: планы, риски, люди, договорённости"
      - id: c
        text: В программировании
      - id: d
        text: В продажах
    correct: b
    explanation: PM не обязан быть самым сильным экспертом в предмете — его сила в организации работы.
    lessonId: j01-02
  - id: ai-drafts
    type: multiple
    prompt: С какими задачами ИИ уже сегодня заметно ускоряет работу PM? Выберите все подходящие.
    options:
      - id: a
        text: Черновики протоколов и статусов
      - id: b
        text: Поиск пропусков в списках и планах
      - id: c
        text: Решение о переносе релиза
      - id: d
        text: Структурирование хаотичных заметок
    correct:
      - a
      - b
      - d
    explanation: Черновики, структурирование и поиск пропусков — сильные стороны. Решения остаются за PM.
    lessonId: j01-03
  - id: ai-savings-real
    type: single
    prompt: Когда экономия времени от ИИ становится реальной?
    options:
      - id: a
        text: Сразу после первого запроса
      - id: b
        text: Когда есть готовые промпты и привычка проверять результат
      - id: c
        text: Когда используют самую дорогую модель
      - id: d
        text: Когда проверку пропускают
    correct: b
    explanation: Без готовых промптов и проверки экономия съедается переделками и ошибками.
    lessonId: j01-03
  - id: ai-relationships
    type: single
    prompt: Какая задача остаётся за PM, а не за ИИ?
    options:
      - id: a
        text: Черновик письма
      - id: b
        text: Сложный разговор с разработчиком о качестве работы
      - id: c
        text: Сводка протокола
      - id: d
        text: Список вопросов к интервью
    correct: b
    explanation: Отношения и сложные разговоры требуют человека.
    lessonId: j01-03
  - id: ai-check-time
    type: single
    prompt: Что нужно учитывать, сравнивая работу вручную и с ИИ?
    options:
      - id: a
        text: Только время генерации
      - id: b
        text: Время на проверку и исправления
      - id: c
        text: Стоимость подписки
      - id: d
        text: Скорость интернета
    correct: b
    explanation: Проверка — часть работы с ИИ; без неё экономию легко переоценить.
    lessonId: j01-03
  - id: skills-groups
    type: single
    prompt: Какие три группы навыков выделяют у PM?
    options:
      - id: a
        text: Управление проектом, работа с людьми, понимание бизнеса
      - id: b
        text: Программирование, дизайн, тестирование
      - id: c
        text: Продажи, маркетинг, финансы
      - id: d
        text: Английский, Excel, презентации
    correct: a
    explanation: Эти три группы нужны на любом уровне; работа с ИИ пронизывает все три.
    lessonId: j01-04
  - id: junior-expectation
    type: single
    prompt: Что главное ожидание от Junior PM?
    options:
      - id: a
        text: Стратегические решения
      - id: b
        text: "Надёжность: сказал — сделал, увидел проблему — сообщил"
      - id: c
        text: Управление портфелем
      - id: d
        text: Найм команды
    correct: b
    explanation: Junior ведёт задачи и небольшие проекты и вовремя поднимает флаг.
    lessonId: j01-04
  - id: senior-scope
    type: single
    prompt: Чем обычно отличается Senior PM?
    options:
      - id: a
        text: Пишет больше отчётов
      - id: b
        text: Отвечает за программы, систему управления или сложные проекты с высокой ставкой
      - id: c
        text: Работает только с одной командой
      - id: d
        text: Не общается со стейкхолдерами
    correct: b
    explanation: Senior работает с большим масштабом неопределённости и влияет на систему.
    lessonId: j01-04
  - id: growth-paths
    type: multiple
    prompt: Какие траектории роста после уровня Middle упоминаются в курсе? Выберите все подходящие.
    options:
      - id: a
        text: Программы и портфели
      - id: b
        text: PMO
      - id: c
        text: Продукт
      - id: d
        text: Уход из профессии как единственный путь
    correct:
      - a
      - b
      - c
    explanation: Также есть направление delivery.
    lessonId: j01-04
  - id: portfolio-no-job
    type: single
    prompt: Как собрать портфолио без должности PM?
    options:
      - id: a
        text: Никак
      - id: b
        text: Из учебных, волонтёрских, рабочих и личных проектов с артефактами
      - id: c
        text: Купить сертификат
      - id: d
        text: Придумать кейсы
    correct: b
    explanation: Кейсы из разных источников с реальными артефактами показывают, как вы работаете.
    lessonId: j01-04
  - id: ai-interview-trainer
    type: single
    prompt: Как лучше использовать ИИ при подготовке к собеседованию?
    options:
      - id: a
        text: Попросить оценить ваш уровень
      - id: b
        text: Попросить задавать вопросы и указывать пробелы в ответах
      - id: c
        text: Попросить написать резюме с выдуманным опытом
      - id: d
        text: Не использовать
    correct: b
    explanation: Модель склонна хвалить; полезнее тренировать ответы и находить пробелы.
    lessonId: j01-04
  - id: week-rhythm
    type: single
    prompt: Почему PM важно держать в порядке план, реестр рисков и журнал решений?
    options:
      - id: a
        text: Для отчёта руководству
      - id: b
        text: Чтобы быстро возвращаться к работе после постоянных прерываний
      - id: c
        text: Так требует закон
      - id: d
        text: Чтобы меньше общаться с командой
    correct: b
    explanation: Неделя PM состоит из прерываний; артефакты помогают не терять нить.
    lessonId: j01-04
