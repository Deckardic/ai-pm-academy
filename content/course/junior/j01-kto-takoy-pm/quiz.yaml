id: j01-quiz
kind: module
title: "Тест модуля: Кто такой PM сегодня"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: project-definition
    type: single
    prompt: Какое определение проекта точнее?
    options:
      - { id: a, text: "Любая работа, у которой есть ответственный" }
      - { id: b, text: "Временная деятельность, направленная на создание уникального результата" }
      - { id: c, text: "Работа, которую выполняет команда из нескольких человек" }
      - { id: d, text: "Любая задача сроком больше месяца" }
    correct: b
    explanation: Ключевые признаки проекта — временный характер и уникальный результат. Размер команды и длительность здесь не главное.
    lessonId: j01-01
  - id: operations-example
    type: single
    scenario: Отдел кадров каждый месяц рассчитывает отпуска сотрудников по регламенту.
    prompt: Что это за тип работы?
    options:
      - { id: a, text: "Проект" }
      - { id: b, text: "Операционная деятельность" }
      - { id: c, text: "Продукт" }
    correct: b
    explanation: Работа повторяется по регламенту и не создаёт уникального результата — это операционная деятельность.
    lessonId: j01-01
  - id: project-examples
    type: multiple
    prompt: Что из перечисленного — проекты? Выберите все подходящие варианты.
    options:
      - { id: a, text: "Внедрение новой CRM к концу квартала" }
      - { id: b, text: "Ежедневная обработка входящих заявок" }
      - { id: c, text: "Переезд офиса в новое здание" }
      - { id: d, text: "Выпуск годового отчёта, который делают по шаблону каждый год" }
      - { id: e, text: "Запуск онлайн-курса для клиентов" }
    correct: [a, c, e]
    explanation: У внедрения CRM, переезда и запуска курса есть срок и уникальный результат. Обработка заявок и отчёт по шаблону — повторяющаяся операционная работа.
    lessonId: j01-01
  - id: product-vs-project
    type: single
    prompt: Чем продукт отличается от проекта?
    options:
      - { id: a, text: "У продукта нет даты окончания — он развивается, пока приносит ценность" }
      - { id: b, text: "Продукт всегда меньше проекта" }
      - { id: c, text: "Продуктом управляет Project Manager" }
    correct: a
    explanation: Продукт живёт, пока приносит ценность, а внутри его жизни возникают проекты с началом и концом.
    lessonId: j01-01
  - id: pm-vs-product
    type: single
    scenario: Стейкхолдер спрашивает, почему в релиз вошла функция экспорта, а не интеграция с мессенджером.
    prompt: Чей это вопрос в первую очередь?
    options:
      - { id: a, text: "Project Manager" }
      - { id: b, text: "Product Manager" }
      - { id: c, text: "Scrum Master" }
      - { id: d, text: "Delivery Manager" }
    correct: b
    explanation: Что и зачем делать — зона Product Manager. PM подключится, чтобы оценить влияние решения на сроки и бюджет.
    lessonId: j01-02
  - id: scrum-master-role
    type: single
    prompt: Что НЕ входит в обязанности Scrum Master?
    options:
      - { id: a, text: "Фасилитировать события Scrum" }
      - { id: b, text: "Помогать убирать препятствия команды" }
      - { id: c, text: "Раздавать задачи и отвечать за сроки проекта" }
    correct: c
    explanation: Scrum Master помогает команде работать по Scrum, но не распределяет задачи и не отвечает за сроки — это отличает его от PM.
    lessonId: j01-02
  - id: ai-strengths
    type: multiple
    prompt: С какими задачами ИИ-ассистент помогает PM лучше всего? Выберите все подходящие.
    options:
      - { id: a, text: "Черновик протокола встречи по заметкам" }
      - { id: b, text: "Решение, переносить ли релиз" }
      - { id: c, text: "Поиск пропусков в списке рисков" }
      - { id: d, text: "Разговор с разработчиком о снижении качества его работы" }
      - { id: e, text: "Структурирование хаотичных вводных в таблицу" }
    correct: [a, c, e]
    explanation: ИИ силён в черновиках, структурировании и поиске пропусков. Решения и сложные разговоры с людьми остаются за PM.
    lessonId: j01-03
  - id: ai-responsibility
    type: single
    scenario: ИИ подготовил статус-отчёт, в который попала неверная цифра по бюджету. Отчёт ушёл руководству.
    prompt: Кто отвечает за ошибку?
    options:
      - { id: a, text: "Разработчик ИИ-сервиса" }
      - { id: b, text: "PM, который отправил отчёт" }
      - { id: c, text: "Никто — это сбой модели" }
    correct: b
    explanation: ИИ — инструмент. Ответственность за проверку и отправку результата остаётся за проект-менеджером.
    lessonId: j01-03
  - id: middle-expectation
    type: single
    scenario: Подрядчик сорвал срок поставки оборудования на две недели.
    prompt: Как поступит проект-менеджер уровня Middle?
    options:
      - { id: a, text: "Подождёт, вдруг подрядчик успеет" }
      - { id: b, text: "Сообщит руководителю о проблеме и принесёт варианты решения с их ценой" }
      - { id: c, text: "Попросит руководителя самому разобраться с подрядчиком" }
    correct: b
    explanation: От Middle ждут не только сигнала о проблеме, но и вариантов решения с последствиями для сроков и бюджета.
    lessonId: j01-04
  - id: portfolio-case
    type: single
    prompt: Что делает кейс в портфолио PM убедительным?
    options:
      - {
          id: a,
          text: "Список обязанностей: «координировал команду, взаимодействовал со стейкхолдерами»",
        }
      - { id: b, text: "Цель, ваши действия, созданные артефакты и измеримый результат" }
      - { id: c, text: "Название известного клиента и сумма договора" }
    correct: b
    explanation: Кейс показывает, как вы думаете и действуете. Общие слова ничего не доказывают, а данные клиента раскрывать нельзя.
    lessonId: j01-04
