id: j04-quiz
kind: module
title: "Тест модуля: Промптинг для PM — база"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: prompt-elements
    type: multiple
    prompt: "Какие элементы входят в структуру хорошего промпта? Выберите все подходящие."
    options:
      - { id: a, text: "Роль" }
      - { id: b, text: "Контекст" }
      - { id: c, text: "Формат ответа" }
      - { id: d, text: "Ограничения" }
      - { id: e, text: "Комплимент модели" }
    correct: [a, b, c, d]
    explanation: "Промпт из пяти элементов — роль, контекст, задача, формат и ограничения. Комплименты модели на результат не влияют."
    lessonId: j04-01
  - id: short-prompt
    type: single
    prompt: "Почему запрос «напиши письмо заказчику о переносе срока» даёт средний результат?"
    options:
      - { id: a, text: "Модель не любит короткие запросы" }
      - { id: b, text: "Модели не хватает сведений, и она пишет усреднённый текст для всех случаев" }
      - { id: c, text: "Нужно писать запросы на английском" }
    correct: b
    explanation: "Модель заполняет пробелы типичными догадками. Чем больше конкретики, тем ближе ответ к вашей ситуации."
    lessonId: j04-01
  - id: invented-reasons
    type: single
    scenario: "Модель регулярно добавляет в статус-отчёты причины задержек, которых не было в данных."
    prompt: "Какой элемент промпта поможет лучше всего?"
    options:
      - { id: a, text: "Роль «опытный PM»" }
      - { id: b, text: "Ограничение: не называть причин, которых нет в данных; неизвестное помечать «уточняется»" }
      - { id: c, text: "Формат «до 200 слов»" }
    correct: b
    explanation: "Ограничения прямо запрещают додумывать. Роль и формат влияют на стиль и объём, но не на выдумки."
    lessonId: j04-01
  - id: format-saves-time
    type: single
    prompt: "Что обычно экономит больше всего времени на доработке ответа?"
    options:
      - { id: a, text: "Явно заданный формат результата" }
      - { id: b, text: "Просьба «пиши качественно»" }
      - { id: c, text: "Очень длинное описание роли" }
    correct: a
    explanation: "Переделывать структуру вручную — самая долгая часть работы с ответом. Формат снимает эту проблему."
    lessonId: j04-01
  - id: few-shot
    type: single
    scenario: "Отчёты модели правильные по содержанию, но длиннее и суше, чем любит руководитель."
    prompt: "Что поможет лучше всего?"
    options:
      - { id: a, text: "Написать «пиши лучше»" }
      - { id: b, text: "Добавить в промпт пример отчёта, который руководитель одобрил" }
      - { id: c, text: "Попросить модель быть креативнее" }
    correct: b
    explanation: "Пример желаемого результата (few-shot) передаёт стиль, объём и структуру точнее описаний."
    lessonId: j04-02
  - id: too-much-context
    type: multiple
    prompt: "Какие признаки говорят, что в промпте слишком много контекста? Выберите все подходящие."
    options:
      - { id: a, text: "В ответе всплывают детали, не относящиеся к задаче" }
      - { id: b, text: "Модель теряет пункты из середины длинного текста" }
      - { id: c, text: "Вы не можете объяснить, зачем вставили часть данных" }
      - { id: d, text: "Ответ точно соответствует задаче" }
    correct: [a, b, c]
    explanation: "Избыточный контекст размывает внимание модели и повышает риск утечки лишних данных."
    lessonId: j04-02
  - id: template-in-prompt
    type: single
    prompt: "Какой способ надёжнее всего даёт нужную структуру документа?"
    options:
      - { id: a, text: "Описать структуру словами в одном предложении" }
      - { id: b, text: "Вставить в промпт шаблон документа с пометками в квадратных скобках" }
      - { id: c, text: "Надеяться, что модель знает шаблоны вашей компании" }
    correct: b
    explanation: "Модель хорошо заполняет заданную структуру и плохо угадывает, какую структуру вы хотели."
    lessonId: j04-02
  - id: good-refinement
    type: single
    scenario: "Структура письма хорошая, но тон слишком официальный."
    prompt: "Какое уточнение лучше?"
    options:
      - { id: a, text: "«Переделай письмо»" }
      - { id: b, text: "«Сохрани структуру и факты, сделай тон менее официальным, без канцелярита»" }
      - { id: c, text: "Начать новый диалог и описать всё заново" }
    correct: b
    explanation: "Конкретное уточнение с указанием, что оставить, меняет только нужное."
    lessonId: j04-03
  - id: self-critique
    type: single
    prompt: "Что самокритика модели НЕ найдёт?"
    options:
      - { id: a, text: "Лишние абзацы" }
      - { id: b, text: "Неправильную дату, если модель не знает верную" }
      - { id: c, text: "Непонятный для адресата вывод" }
    correct: b
    explanation: "Модель критикует стиль и структуру, но не знает ваших фактов. Факты сверяете вы."
    lessonId: j04-03
  - id: new-dialog
    type: multiple
    prompt: "Когда стоит начать новый диалог с моделью? Выберите все подходящие."
    options:
      - { id: a, text: "Сменилась тема задачи" }
      - { id: b, text: "Модель повторяет старые ошибки и путает версии текста" }
      - { id: c, text: "Диалог стал очень длинным и инструкции теряются" }
      - { id: d, text: "Модель ответила хорошо с первого раза" }
    correct: [a, b, c]
    explanation: "Длинный или запутанный диалог изнашивается — ранние инструкции влияют на ответ всё слабее."
    lessonId: j04-03
  - id: variables
    type: single
    prompt: "Зачем выносить меняющиеся данные промпта в переменные вроде {{проект}} и {{период}}?"
    options:
      - { id: a, text: "Чтобы модель работала быстрее" }
      - { id: b, text: "Чтобы использовать один проверенный промпт много раз с новыми данными" }
      - { id: c, text: "Так требуют все ИИ-сервисы" }
    correct: b
    explanation: "Переменные отделяют постоянную часть промпта от данных и дают стабильный результат."
    lessonId: j04-04
  - id: prompt-library
    type: single
    prompt: "Что полезнее для работы PM?"
    options:
      - { id: a, text: "Коллекция из 300 промптов из интернета" }
      - { id: b, text: "Десять своих проверенных промптов с пометкой «что проверить»" }
      - { id: c, text: "Писать каждый промпт с нуля" }
    correct: b
    explanation: "Свои проверенные промпты легко найти, и вы знаете, как они работают и что в ответе проверить."
    lessonId: j04-04
