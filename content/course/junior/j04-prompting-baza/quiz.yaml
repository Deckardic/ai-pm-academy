id: j04-quiz
kind: module
title: "Тест модуля: Промптинг для PM — база"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: prompt-elements
    type: multiple
    prompt: Какие элементы входят в структуру хорошего промпта? Выберите все подходящие.
    options:
      - id: a
        text: Роль
      - id: b
        text: Контекст
      - id: c
        text: Формат ответа
      - id: d
        text: Ограничения
      - id: e
        text: Комплимент модели
    correct:
      - a
      - b
      - c
      - d
    explanation:
      Промпт из пяти элементов — роль, контекст, задача, формат и ограничения. Комплименты модели
      на результат не влияют.
    lessonId: j04-01
  - id: short-prompt
    type: single
    prompt: Почему запрос «напиши письмо заказчику о переносе срока» даёт средний результат?
    options:
      - id: a
        text: Модель не любит короткие запросы
      - id: b
        text: Модели не хватает сведений, и она пишет усреднённый текст для всех случаев
      - id: c
        text: Нужно писать запросы на английском
    correct: b
    explanation:
      Модель заполняет пробелы типичными догадками. Чем больше конкретики, тем ближе ответ к
      вашей ситуации.
    lessonId: j04-01
  - id: invented-reasons
    type: single
    scenario: Модель регулярно добавляет в статус-отчёты причины задержек, которых не было в данных.
    prompt: Какой элемент промпта поможет лучше всего?
    options:
      - id: a
        text: Роль «опытный PM»
      - id: b
        text: "Ограничение: не называть причин, которых нет в данных; неизвестное помечать «уточняется»"
      - id: c
        text: Формат «до 200 слов»
    correct: b
    explanation:
      Ограничения прямо запрещают додумывать. Роль и формат влияют на стиль и объём, но не на
      выдумки.
    lessonId: j04-01
  - id: format-saves-time
    type: single
    prompt: Что обычно экономит больше всего времени на доработке ответа?
    options:
      - id: a
        text: Явно заданный формат результата
      - id: b
        text: Просьба «пиши качественно»
      - id: c
        text: Очень длинное описание роли
    correct: a
    explanation:
      Переделывать структуру вручную — самая долгая часть работы с ответом. Формат снимает эту
      проблему.
    lessonId: j04-01
  - id: few-shot
    type: single
    scenario: Отчёты модели правильные по содержанию, но длиннее и суше, чем любит руководитель.
    prompt: Что поможет лучше всего?
    options:
      - id: a
        text: Написать «пиши лучше»
      - id: b
        text: Добавить в промпт пример отчёта, который руководитель одобрил
      - id: c
        text: Попросить модель быть креативнее
    correct: b
    explanation: Пример желаемого результата (few-shot) передаёт стиль, объём и структуру точнее описаний.
    lessonId: j04-02
  - id: too-much-context
    type: multiple
    prompt: Какие признаки говорят, что в промпте слишком много контекста? Выберите все подходящие.
    options:
      - id: a
        text: В ответе всплывают детали, не относящиеся к задаче
      - id: b
        text: Модель теряет пункты из середины длинного текста
      - id: c
        text: Вы не можете объяснить, зачем вставили часть данных
      - id: d
        text: Ответ точно соответствует задаче
    correct:
      - a
      - b
      - c
    explanation: Избыточный контекст размывает внимание модели и повышает риск утечки лишних данных.
    lessonId: j04-02
  - id: template-in-prompt
    type: single
    prompt: Какой способ надёжнее всего даёт нужную структуру документа?
    options:
      - id: a
        text: Описать структуру словами в одном предложении
      - id: b
        text: Вставить в промпт шаблон документа с пометками в квадратных скобках
      - id: c
        text: Надеяться, что модель знает шаблоны вашей компании
    correct: b
    explanation: Модель хорошо заполняет заданную структуру и плохо угадывает, какую структуру вы хотели.
    lessonId: j04-02
  - id: good-refinement
    type: single
    scenario: Структура письма хорошая, но тон слишком официальный.
    prompt: Какое уточнение лучше?
    options:
      - id: a
        text: «Переделай письмо»
      - id: b
        text: «Сохрани структуру и факты, сделай тон менее официальным, без канцелярита»
      - id: c
        text: Начать новый диалог и описать всё заново
    correct: b
    explanation: Конкретное уточнение с указанием, что оставить, меняет только нужное.
    lessonId: j04-03
  - id: self-critique
    type: single
    prompt: Что самокритика модели НЕ найдёт?
    options:
      - id: a
        text: Лишние абзацы
      - id: b
        text: Неправильную дату, если модель не знает верную
      - id: c
        text: Непонятный для адресата вывод
    correct: b
    explanation: Модель критикует стиль и структуру, но не знает ваших фактов. Факты сверяете вы.
    lessonId: j04-03
  - id: new-dialog
    type: multiple
    prompt: Когда стоит начать новый диалог с моделью? Выберите все подходящие.
    options:
      - id: a
        text: Сменилась тема задачи
      - id: b
        text: Модель повторяет старые ошибки и путает версии текста
      - id: c
        text: Диалог стал очень длинным и инструкции теряются
      - id: d
        text: Модель ответила хорошо с первого раза
    correct:
      - a
      - b
      - c
    explanation: Длинный или запутанный диалог изнашивается — ранние инструкции влияют на ответ всё слабее.
    lessonId: j04-03
  - id: variables
    type: single
    prompt: Зачем выносить меняющиеся данные промпта в переменные вроде {{проект}} и {{период}}?
    options:
      - id: a
        text: Чтобы модель работала быстрее
      - id: b
        text: Чтобы использовать один проверенный промпт много раз с новыми данными
      - id: c
        text: Так требуют все ИИ-сервисы
    correct: b
    explanation: Переменные отделяют постоянную часть промпта от данных и дают стабильный результат.
    lessonId: j04-04
  - id: prompt-library
    type: single
    prompt: Что полезнее для работы PM?
    options:
      - id: a
        text: Коллекция из 300 промптов из интернета
      - id: b
        text: Десять своих проверенных промптов с пометкой «что проверить»
      - id: c
        text: Писать каждый промпт с нуля
    correct: b
    explanation: Свои проверенные промпты легко найти, и вы знаете, как они работают и что в ответе проверить.
    lessonId: j04-04
  - id: prompt-order
    type: order
    prompt: Расположите элементы промпта в удобном порядке.
    items:
      - id: a
        text: Роль
      - id: b
        text: Контекст
      - id: c
        text: Задача
      - id: d
        text: Формат
      - id: e
        text: Ограничения
    explanation:
      Роль задаёт точку зрения, контекст — ситуацию, задача — что сделать, формат и ограничения
      — как.
    lessonId: j04-01
  - id: role-effect
    type: single
    prompt: Что даёт роль в промпте?
    options:
      - id: a
        text: Гарантию отсутствия ошибок
      - id: b
        text: Уровень, стиль и точку зрения ответа
      - id: c
        text: Доступ к интернету
      - id: d
        text: Бесплатность
    correct: b
    explanation: Роль влияет на стиль, но не защищает от выдумок.
    lessonId: j04-01
  - id: vague-task
    type: single
    prompt: Что не так с задачей «помоги с рисками»?
    options:
      - id: a
        text: Слишком коротко написано
      - id: b
        text: "Непонятно, что сделать: придумать, оценить или спланировать реакцию"
      - id: c
        text: Нельзя спрашивать ИИ о рисках
      - id: d
        text: Нет смайлика
    correct: b
    explanation: Размытая задача даёт размытый ответ.
    lessonId: j04-01
  - id: format-elements
    type: single
    prompt: Что из этого относится к формату ответа?
    options:
      - id: a
        text: «До 150 слов, таблица с колонками риск / вероятность / влияние»
      - id: b
        text: «Ты — опытный PM»
      - id: c
        text: «Проект — онлайн-запись»
      - id: d
        text: «Не придумывай цифры»
    correct: a
    explanation: Формат задаёт объём, структуру и вид результата.
    lessonId: j04-01
  - id: ask-if-missing
    type: single
    prompt: Зачем добавлять в промпт «если данных не хватает — задай вопросы»?
    options:
      - id: a
        text: Чтобы модель работала медленнее
      - id: b
        text: Чтобы модель не додумывала недостающее
      - id: c
        text: Чтобы ответ был длиннее
      - id: d
        text: Так требуют сервисы
    correct: b
    explanation: Ограничение снижает количество выдумок.
    lessonId: j04-01
  - id: context-questions
    type: single
    prompt: На какие вопросы отвечает хороший контекст?
    options:
      - id: a
        text: Кто адресат, какая ситуация, что известно, какая цель
      - id: b
        text: Какая погода
      - id: c
        text: Сколько лет модели
      - id: d
        text: Какой у вас компьютер
    correct: a
    explanation: Эти четыре вопроса покрывают то, что модель не знает о вашей задаче.
    lessonId: j04-02
  - id: goal-over-audience
    type: single
    prompt: Почему цель письма важнее даже адресата?
    options:
      - id: a
        text: Цель определяет, какой реакции вы ждёте, а значит — структуру и тон
      - id: b
        text: Адресат неважен
      - id: c
        text: Цель легче описать
      - id: d
        text: Так короче
    correct: a
    explanation: Письмо «проинформировать» и письмо «получить решение» устроены по-разному.
    lessonId: j04-02
  - id: template-brackets
    type: single
    prompt: Зачем в шаблоне оставлять пометки в квадратных скобках?
    options:
      - id: a
        text: Для красоты
      - id: b
        text: Чтобы модель поняла, что и как писать в каждое поле
      - id: c
        text: Чтобы шаблон был длиннее
      - id: d
        text: Их нельзя использовать
    correct: b
    explanation: Пометки работают как мини-инструкции для полей.
    lessonId: j04-02
  - id: project-brief
    type: single
    prompt: Что даёт заготовка о проекте на 5–7 строк?
    options:
      - id: a
        text: "Экономит время: её вставляют в начало любого промпта по проекту"
      - id: b
        text: Заменяет план проекта
      - id: c
        text: Нужна только руководителю
      - id: d
        text: Ничего
    correct: a
    explanation: Заготовку обновляют раз в неделю и переиспользуют.
    lessonId: j04-02
  - id: example-anon
    type: single
    prompt: Что сделать с реальным отчётом перед использованием как примера?
    options:
      - id: a
        text: Ничего
      - id: b
        text: "Обезличить: убрать имена, названия и суммы"
      - id: c
        text: Перевести на английский
      - id: d
        text: Сократить вдвое
    correct: b
    explanation: Иначе в модель уходят лишние данные.
    lessonId: j04-02
  - id: iterate-keep
    type: single
    prompt: Что важно сказать модели при уточнении ответа?
    options:
      - id: a
        text: Только «переделай»
      - id: b
        text: Что изменить и что оставить без изменений
      - id: c
        text: Что она плохо работает
      - id: d
        text: Ничего
    correct: b
    explanation: Иначе модель перепишет и хорошие части.
    lessonId: j04-03
  - id: variants
    type: single
    prompt: Когда полезно попросить у модели несколько вариантов?
    options:
      - id: a
        text: Для тем писем и сложных формулировок
      - id: b
        text: Для расчётов бюджета
      - id: c
        text: Никогда
      - id: d
        text: Для дат вех
    correct: a
    explanation: Выбрать из вариантов быстрее, чем объяснять, что не так.
    lessonId: j04-03
  - id: iterations-limit
    type: single
    prompt: Результат не устраивает после пяти итераций. Что это скорее всего значит?
    options:
      - id: a
        text: Модель сломалась
      - id: b
        text: "Проблема в исходном промпте: не хватает контекста или задача размыта"
      - id: c
        text: Нужно ещё 20 итераций
      - id: d
        text: Надо сменить компьютер
    correct: b
    explanation: Лучше переформулировать задачу и начать новый диалог.
    lessonId: j04-03
  - id: summary-before-new
    type: single
    prompt: Что сделать перед тем, как начать новый диалог по той же задаче?
    options:
      - id: a
        text: Ничего
      - id: b
        text: Попросить модель кратко пересказать, что решили, и использовать это как контекст
      - id: c
        text: Удалить все файлы
      - id: d
        text: Сменить аккаунт
    correct: b
    explanation: Пересказ переносит важное в чистый диалог.
    lessonId: j04-03
  - id: critique-glasses
    type: single
    prompt: Какой запрос хорошо запускает самокритику модели?
    options:
      - id: a
        text: «Ты молодец?»
      - id: b
        text: "«Посмотри на письмо глазами занятого главного врача: что непонятно, что лишнее?»"
      - id: c
        text: «Сделай лучше»
      - id: d
        text: «Проверь орфографию»
    correct: b
    explanation: Конкретная точка зрения даёт конкретные замечания.
    lessonId: j04-03
  - id: what-to-promptify
    type: single
    prompt: Какую задачу стоит превратить в промпт из библиотеки?
    options:
      - id: a
        text: Разовую задачу, которой больше не будет
      - id: b
        text: Повторяющуюся задачу с понятной структурой результата
      - id: c
        text: Задачу без текста
      - id: d
        text: Любую
    correct: b
    explanation: Выгода появляется на повторяющихся задачах.
    lessonId: j04-04
  - id: verify-note
    type: single
    prompt: Зачем рядом с промптом пометка «что проверить»?
    options:
      - id: a
        text: Для красоты
      - id: b
        text: Чтобы проверка была быстрой и не зависела от усталости
      - id: c
        text: Её никто не читает
      - id: d
        text: Чтобы промпт был длиннее
    correct: b
    explanation: Готовый чек-лист делает проверку привычкой.
    lessonId: j04-04
  - id: library-no-data
    type: single
    prompt: Что не должно храниться в сохранённом промпте?
    options:
      - id: a
        text: Роль
      - id: b
        text: Имена, суммы и названия клиентов
      - id: c
        text: Формат
      - id: d
        text: Переменные
    correct: b
    explanation: Конкретные данные — только в переменных при запуске.
    lessonId: j04-04
  - id: library-review
    type: single
    prompt: Как часто пересматривать личную библиотеку промптов?
    options:
      - id: a
        text: Никогда
      - id: b
        text: Примерно раз в месяц
      - id: c
        text: Каждый день
      - id: d
        text: Раз в пять лет
    correct: b
    explanation: Модели, шаблоны и задачи меняются.
    lessonId: j04-04
  - id: adapt-library
    type: single
    prompt: Что сделать с готовым промптом из библиотеки курса?
    options:
      - id: a
        text: Использовать без изменений
      - id: b
        text: Адаптировать роль, формат и ограничения под свою работу и проверить на реальных задачах
      - id: c
        text: Не использовать
      - id: d
        text: Удалить переменные
    correct: b
    explanation: Готовый промпт — отправная точка.
    lessonId: j04-04
