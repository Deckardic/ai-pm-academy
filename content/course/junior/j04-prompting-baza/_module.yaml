id: j04
slug: prompting-baza
order: 4
title: "Промптинг для PM: база"
summary: Структура промпта, итерации и проверка результата на типовых задачах PM.
goals:
  - Писать промпты по структуре «роль — контекст — задача — формат — ограничения»
  - Улучшать ответ итерациями
  - Проверять результат по чек-листу
status: published
artifact: 10 личных промптов под задачи PM
keyConcepts:
  - промпт
  - роль
  - контекст
  - формат ответа
  - итерации
  - few-shot
searchQueries:
  - как писать промпты
  - промпты для менеджера проектов
lessonsPlan:
  - slug: anatomiya-prompta
    title: Анатомия промпта
    focus: пять элементов хорошего запроса
    durationMin: 12
    keyPoints:
      - Роль, контекст, задача, формат, ограничения
      - Почему «напиши письмо» даёт средний результат
      - Формат ответа экономит больше всего времени
      - "Ограничения защищают от выдумок: «если не знаешь — напиши»"
    practice: Переписать 3 слабых промпта по структуре из пяти элементов
  - slug: kontekst-i-primery
    title: Контекст и примеры
    focus: как дать модели всё нужное и показать образец
    durationMin: 12
    keyPoints:
      - "Контекст: кто адресат, какая ситуация, что уже известно"
      - Пример желаемого результата (few-shot)
      - Шаблон документа прямо в промпте
      - Сколько контекста — слишком много
    practice: Добавить пример и шаблон в промпт для статус-отчёта
  - slug: iteracii
    title: "Итерации: докручиваем ответ"
    focus: как улучшать результат, а не переписывать его руками
    durationMin: 11
    keyPoints:
      - Уточняющие запросы вместо нового промпта
      - Попросить модель покритиковать свой ответ
      - Несколько вариантов на выбор
      - Когда начать новый диалог
    practice: Довести черновик письма заказчику до готового за три итерации
  - slug: promty-dlya-tipovyh-zadach
    title: Промпты для типовых задач PM
    focus: собираем личную библиотеку
    durationMin: 13
    keyPoints:
      - Письма, протоколы, статусы, списки рисков, вопросы стейкхолдерам
      - "Переменные в промпте: {{проект}}, {{срок}}"
      - Где хранить и как обновлять свои промпты
      - Промпты из библиотеки курса как отправная точка
    practice: Сохранить 5 промптов с переменными в свою библиотеку
assignment:
  title: 10 личных промптов
  deliverable: Файл с 10 промптами под ваши задачи
  brief:
    Каждый промпт — по структуре из пяти элементов, с переменными, пометкой «что проверить в ответе»
    и примером результата.
quizFocus:
  - элементы промпта
  - роль контекста и примеров
  - итерации и критика ответа
  - переменные и шаблоны
