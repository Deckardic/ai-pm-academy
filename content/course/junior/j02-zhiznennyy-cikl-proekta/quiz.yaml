id: j02-quiz
kind: module
title: "Тест модуля: Жизненный цикл проекта"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: phase-order
    type: order
    prompt: "Расположите группы процессов проекта в порядке, в котором они начинаются."
    items:
      - { id: a, text: "Инициация" }
      - { id: b, text: "Планирование" }
      - { id: c, text: "Исполнение" }
      - { id: d, text: "Закрытие" }
    explanation: "Проект начинается с инициации, затем планируется и исполняется, а завершается закрытием. Мониторинг и контроль идут параллельно всем фазам."
    lessonId: j02-01
  - id: initiation-result
    type: single
    prompt: "Какой результат у фазы инициации?"
    options:
      - { id: a, text: "Утверждённый устав проекта: цель, спонсор, ограничения, критерии успеха" }
      - { id: b, text: "Подробный график работ на весь проект" }
      - { id: c, text: "Первая рабочая версия продукта" }
    correct: a
    explanation: "На инициации договариваются, зачем проект нужен и что считать успехом. Подробный график — результат планирования."
    lessonId: j02-01
  - id: phase-done
    type: single
    scenario: "PM отправил план проекта спонсору на согласование и отметил в трекере «Планирование завершено»."
    prompt: "Прав ли PM?"
    options:
      - { id: a, text: "Да, работа над планом закончена" }
      - { id: b, text: "Нет, фаза закончена, когда результат принят человеком с правом решения" }
      - { id: c, text: "Да, если план занимает больше 10 страниц" }
    correct: b
    explanation: "Отправить документ на согласование — не то же самое, что получить решение. Фаза завершается приёмкой результата."
    lessonId: j02-01
  - id: stuck-signs
    type: multiple
    prompt: "Какие признаки говорят, что проект перепрыгнул из идеи сразу в исполнение? Выберите все подходящие."
    options:
      - { id: a, text: "Через месяц работы звучит «а мы думали, что…»" }
      - { id: b, text: "Нет согласованного скоупа, но команда уже делает" }
      - { id: c, text: "Есть утверждённый устав и базовый план" }
      - { id: d, text: "Ключевой стейкхолдер впервые видит результат на приёмке" }
    correct: [a, b, d]
    explanation: "Разные ожидания, отсутствие согласованного скоупа и поздние знакомства стейкхолдеров с результатом — типичные последствия пропущенного планирования."
    lessonId: j02-01
  - id: triangle-cut-budget
    type: single
    scenario: "Заказчик сократил бюджет проекта на 20%, но хочет получить весь результат в прежние сроки."
    prompt: "Что честнее всего предложить?"
    options:
      - { id: a, text: "Молча сократить тестирование" }
      - { id: b, text: "Вместе решить, какую часть скоупа перенести или убрать" }
      - { id: c, text: "Согласиться и попросить команду работать по выходным" }
    correct: b
    explanation: "При меньшем бюджете и тех же сроках разумно пересмотреть скоуп. Экономия на тестировании и переработки ударят по качеству и людям."
    lessonId: j02-02
  - id: triangle-quality
    type: single
    prompt: "Что обычно страдает, если сроки и бюджет сократили, а скоуп оставили прежним?"
    options:
      - { id: a, text: "Качество" }
      - { id: b, text: "Ничего, команда просто станет эффективнее" }
      - { id: c, text: "Только документация, это не страшно" }
    correct: a
    explanation: "Качество находится внутри треугольника. Когда стороны зажаты, первыми сокращают тестирование и проверку."
    lessonId: j02-02
  - id: add-people
    type: single
    prompt: "Почему добавление людей в проект не ускоряет его пропорционально?"
    options:
      - { id: a, text: "Новичкам нужно время на погружение, а часть работ нельзя распараллелить" }
      - { id: b, text: "Новые люди всегда работают хуже" }
      - { id: c, text: "Это запрещено методологиями" }
    correct: a
    explanation: "Ввод в проект отнимает время у команды, а зависимые работы всё равно выполняются по очереди."
    lessonId: j02-02
  - id: measurable-criterion
    type: single
    prompt: "Какой критерий успеха можно проверить однозначно?"
    options:
      - { id: a, text: "Сервис будет удобным для пациентов" }
      - { id: b, text: "Запись к врачам всех отделений доступна на сайте к 1 декабря" }
      - { id: c, text: "Регистратура станет работать эффективнее" }
    correct: b
    explanation: "Во втором критерии есть конкретный результат и срок. Удобство и эффективность в таком виде не измерить."
    lessonId: j02-03
  - id: project-vs-product-success
    type: single
    scenario: "Онлайн-запись запустили в срок и в бюджет, но через три месяца ей почти никто не пользуется."
    prompt: "Как оценить ситуацию?"
    options:
      - { id: a, text: "Проект и продукт успешны" }
      - { id: b, text: "Проект формально успешен, но бизнес-цель не достигнута" }
      - { id: c, text: "Проект провален, потому что PM плохо планировал" }
    correct: b
    explanation: "Успех проекта и успех продукта — разные вопросы. Здесь обещанное сделано, но польза не получена."
    lessonId: j02-03
  - id: criteria-when
    type: single
    prompt: "Когда лучше фиксировать критерии успеха?"
    options:
      - { id: a, text: "На инициации, с утверждением спонсором" }
      - { id: b, text: "В конце проекта, когда видно результат" }
      - { id: c, text: "Не нужно фиксировать, всё и так понятно" }
    correct: a
    explanation: "Критерии на старте управляют решениями по ходу проекта и не дают подогнать оценку задним числом."
    lessonId: j02-03
  - id: milestone-example
    type: single
    prompt: "Что из этого — веха?"
    options:
      - { id: a, text: "Тестирование записи к врачам" }
      - { id: b, text: "Запись к врачам принята главным врачом" }
      - { id: c, text: "Еженедельная встреча команды" }
    correct: b
    explanation: "Веха — момент достижения результата без длительности. Тестирование — работа, встреча — регулярное событие."
    lessonId: j02-04
  - id: gate-decisions
    type: multiple
    prompt: "Какие решения могут быть приняты на контрольной точке? Выберите все подходящие."
    options:
      - { id: a, text: "Продолжать по плану" }
      - { id: b, text: "Изменить скоуп, сроки или бюджет" }
      - { id: c, text: "Остановить проект" }
      - { id: d, text: "Отменить все будущие контрольные точки" }
    correct: [a, b, c]
    explanation: "Контрольная точка существует для решения о судьбе проекта: продолжать, изменить или остановить."
    lessonId: j02-04
  - id: gate-without-decision
    type: single
    scenario: "На «контрольной точке» полчаса обсуждали статус, решений не приняли и договорились встретиться через месяц."
    prompt: "Что пошло не так?"
    options:
      - { id: a, text: "Ничего, так и должно быть" }
      - { id: b, text: "Это была статус-встреча: не был сформулирован вопрос, по которому нужно решение" }
      - { id: c, text: "Встреча была слишком короткой" }
    correct: b
    explanation: "Смысл контрольной точки — решение. Вопрос для решения стоит указать ещё в приглашении."
    lessonId: j02-04
