id: j02-quiz
kind: module
title: "Тест модуля: Жизненный цикл проекта"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: phase-order
    type: order
    prompt: Расположите группы процессов проекта в порядке, в котором они начинаются.
    items:
      - id: a
        text: Инициация
      - id: b
        text: Планирование
      - id: c
        text: Исполнение
      - id: d
        text: Закрытие
    explanation:
      Проект начинается с инициации, затем планируется и исполняется, а завершается закрытием.
      Мониторинг и контроль идут параллельно всем фазам.
    lessonId: j02-01
  - id: initiation-result
    type: single
    prompt: Какой результат у фазы инициации?
    options:
      - id: a
        text: "Утверждённый устав проекта: цель, спонсор, ограничения, критерии успеха"
      - id: b
        text: Подробный график работ на весь проект
      - id: c
        text: Первая рабочая версия продукта
    correct: a
    explanation:
      На инициации договариваются, зачем проект нужен и что считать успехом. Подробный график
      — результат планирования.
    lessonId: j02-01
  - id: phase-done
    type: single
    scenario: PM отправил план проекта спонсору на согласование и отметил в трекере «Планирование завершено».
    prompt: Прав ли PM?
    options:
      - id: a
        text: Да, работа над планом закончена
      - id: b
        text: Нет, фаза закончена, когда результат принят человеком с правом решения
      - id: c
        text: Да, если план занимает больше 10 страниц
    correct: b
    explanation:
      Отправить документ на согласование — не то же самое, что получить решение. Фаза завершается
      приёмкой результата.
    lessonId: j02-01
  - id: stuck-signs
    type: multiple
    prompt: Какие признаки говорят, что проект перепрыгнул из идеи сразу в исполнение? Выберите все подходящие.
    options:
      - id: a
        text: Через месяц работы звучит «а мы думали, что…»
      - id: b
        text: Нет согласованного скоупа, но команда уже делает
      - id: c
        text: Есть утверждённый устав и базовый план
      - id: d
        text: Ключевой стейкхолдер впервые видит результат на приёмке
    correct:
      - a
      - b
      - d
    explanation:
      Разные ожидания, отсутствие согласованного скоупа и поздние знакомства стейкхолдеров с
      результатом — типичные последствия пропущенного планирования.
    lessonId: j02-01
  - id: triangle-cut-budget
    type: single
    scenario: Заказчик сократил бюджет проекта на 20%, но хочет получить весь результат в прежние сроки.
    prompt: Что честнее всего предложить?
    options:
      - id: a
        text: Молча сократить тестирование
      - id: b
        text: Вместе решить, какую часть скоупа перенести или убрать
      - id: c
        text: Согласиться и попросить команду работать по выходным
    correct: b
    explanation:
      При меньшем бюджете и тех же сроках разумно пересмотреть скоуп. Экономия на тестировании
      и переработки ударят по качеству и людям.
    lessonId: j02-02
  - id: triangle-quality
    type: single
    prompt: Что обычно страдает, если сроки и бюджет сократили, а скоуп оставили прежним?
    options:
      - id: a
        text: Качество
      - id: b
        text: Ничего, команда просто станет эффективнее
      - id: c
        text: Только документация, это не страшно
    correct: a
    explanation:
      Качество находится внутри треугольника. Когда стороны зажаты, первыми сокращают тестирование
      и проверку.
    lessonId: j02-02
  - id: add-people
    type: single
    prompt: Почему добавление людей в проект не ускоряет его пропорционально?
    options:
      - id: a
        text: Новичкам нужно время на погружение, а часть работ нельзя распараллелить
      - id: b
        text: Новые люди всегда работают хуже
      - id: c
        text: Это запрещено методологиями
    correct: a
    explanation: Ввод в проект отнимает время у команды, а зависимые работы всё равно выполняются по очереди.
    lessonId: j02-02
  - id: measurable-criterion
    type: single
    prompt: Какой критерий успеха можно проверить однозначно?
    options:
      - id: a
        text: Сервис будет удобным для пациентов
      - id: b
        text: Запись к врачам всех отделений доступна на сайте к 1 декабря
      - id: c
        text: Регистратура станет работать эффективнее
    correct: b
    explanation:
      Во втором критерии есть конкретный результат и срок. Удобство и эффективность в таком виде
      не измерить.
    lessonId: j02-03
  - id: project-vs-product-success
    type: single
    scenario: Онлайн-запись запустили в срок и в бюджет, но через три месяца ей почти никто не пользуется.
    prompt: Как оценить ситуацию?
    options:
      - id: a
        text: Проект и продукт успешны
      - id: b
        text: Проект формально успешен, но бизнес-цель не достигнута
      - id: c
        text: Проект провален, потому что PM плохо планировал
    correct: b
    explanation:
      Успех проекта и успех продукта — разные вопросы. Здесь обещанное сделано, но польза не
      получена.
    lessonId: j02-03
  - id: criteria-when
    type: single
    prompt: Когда лучше фиксировать критерии успеха?
    options:
      - id: a
        text: На инициации, с утверждением спонсором
      - id: b
        text: В конце проекта, когда видно результат
      - id: c
        text: Не нужно фиксировать, всё и так понятно
    correct: a
    explanation:
      Критерии на старте управляют решениями по ходу проекта и не дают подогнать оценку задним
      числом.
    lessonId: j02-03
  - id: milestone-example
    type: single
    prompt: Что из этого — веха?
    options:
      - id: a
        text: Тестирование записи к врачам
      - id: b
        text: Запись к врачам принята главным врачом
      - id: c
        text: Еженедельная встреча команды
    correct: b
    explanation:
      Веха — момент достижения результата без длительности. Тестирование — работа, встреча —
      регулярное событие.
    lessonId: j02-04
  - id: gate-decisions
    type: multiple
    prompt: Какие решения могут быть приняты на контрольной точке? Выберите все подходящие.
    options:
      - id: a
        text: Продолжать по плану
      - id: b
        text: Изменить скоуп, сроки или бюджет
      - id: c
        text: Остановить проект
      - id: d
        text: Отменить все будущие контрольные точки
    correct:
      - a
      - b
      - c
    explanation: "Контрольная точка существует для решения о судьбе проекта: продолжать, изменить или остановить."
    lessonId: j02-04
  - id: gate-without-decision
    type: single
    scenario:
      На «контрольной точке» полчаса обсуждали статус, решений не приняли и договорились встретиться
      через месяц.
    prompt: Что пошло не так?
    options:
      - id: a
        text: Ничего, так и должно быть
      - id: b
        text: "Это была статус-встреча: не был сформулирован вопрос, по которому нужно решение"
      - id: c
        text: Встреча была слишком короткой
    correct: b
    explanation: Смысл контрольной точки — решение. Вопрос для решения стоит указать ещё в приглашении.
    lessonId: j02-04
  - id: control-all-time
    type: single
    prompt: Какая группа процессов идёт на протяжении всего проекта?
    options:
      - id: a
        text: Инициация
      - id: b
        text: Мониторинг и контроль
      - id: c
        text: Закрытие
      - id: d
        text: Исполнение
    correct: b
    explanation: Контроль сравнивает факт с планом на всём протяжении проекта.
    lessonId: j02-01
  - id: progressive-elab
    type: single
    prompt: Что такое последовательная детализация?
    options:
      - id: a
        text: Детальный план на весь проект с первого дня
      - id: b
        text: Крупный план на старте и уточнение ближайших этапов по ходу
      - id: c
        text: Отказ от планирования
      - id: d
        text: План, который никогда не меняется
    correct: b
    explanation: Детали планируют, когда появляется информация, — иначе они всё равно изменятся.
    lessonId: j02-01
  - id: endless-planning
    type: single
    prompt: Какой признак говорит о «бесконечном планировании»?
    options:
      - id: a
        text: План детализирован на полгода, а первого результата нет
      - id: b
        text: Есть утверждённый устав
      - id: c
        text: Команда показывает результат каждые две недели
      - id: d
        text: Есть реестр рисков
    correct: a
    explanation: План переписывают снова и снова, потому что страшно начать.
    lessonId: j02-01
  - id: unclosed-project
    type: single
    prompt: "Признак незакрытого проекта:"
    options:
      - id: a
        text: Результат используют, но акта нет, «последние доработки» тянутся месяцами
      - id: b
        text: Подписан акт приёмки
      - id: c
        text: Проведена ретроспектива
      - id: d
        text: Команда освобождена
    correct: a
    explanation: Без формального закрытия нет приёмки, свободной команды и уроков.
    lessonId: j02-01
  - id: execution-result
    type: single
    prompt: Что является результатом фазы исполнения?
    options:
      - id: a
        text: Устав проекта
      - id: b
        text: Промежуточные и итоговые результаты проекта
      - id: c
        text: Реестр рисков
      - id: d
        text: Уроки проекта
    correct: b
    explanation: На исполнении команда создаёт результаты, а PM координирует работу.
    lessonId: j02-01
  - id: ai-phase-checklist
    type: single
    prompt: Что проверить в чек-листе фазы, подготовленном ИИ?
    options:
      - id: a
        text: Шрифт
      - id: b
        text: Учтена ли специфика проекта, например требования к данным
      - id: c
        text: Количество пунктов
      - id: d
        text: Ничего
    correct: b
    explanation: Модель даёт общий шаблон; специфику проекта проверяете вы.
    lessonId: j02-01
  - id: triangle-sides
    type: single
    prompt: Какие три стороны образуют треугольник ограничений?
    options:
      - id: a
        text: Сроки, бюджет, содержание
      - id: b
        text: Команда, заказчик, подрядчик
      - id: c
        text: Риски, качество, коммуникации
      - id: d
        text: Цель, задачи, метрики
    correct: a
    explanation: Качество находится внутри треугольника.
    lessonId: j02-02
  - id: triangle-response
    type: single
    prompt: Как лучше ответить на просьбу «сделать быстрее»?
    options:
      - id: a
        text: Отказать
      - id: b
        text: Согласиться молча
      - id: c
        text: Показать два-три варианта с ценой и рекомендацию
      - id: d
        text: Сократить тестирование
    correct: c
    explanation: Варианты вместо «нет» сохраняют отношения и делают выбор осознанным.
    lessonId: j02-02
  - id: flex-first
    type: single
    prompt: Какой вопрос заказчику лучше задать на старте, а не в кризисе?
    options:
      - id: a
        text: «Какой цвет логотипа?»
      - id: b
        text: "«Что для вас важнее всего: срок, бюджет или полный набор функций?»"
      - id: c
        text: «Сколько у вас сотрудников?»
      - id: d
        text: «Когда у вас отпуск?»
    correct: b
    explanation: Ответ станет ориентиром для всех будущих компромиссов.
    lessonId: j02-02
  - id: external-fixed
    type: single
    prompt: Что из этого — ограничение, заданное внешним миром?
    options:
      - id: a
        text: Дата вступления закона в силу
      - id: b
        text: Желание команды работать спринтами
      - id: c
        text: Выбор трекера
      - id: d
        text: Формат статус-отчёта
    correct: a
    explanation: Внешние даты сдвинуть нельзя — их учитывают при поиске гибкости.
    lessonId: j02-02
  - id: triangle-options
    type: multiple
    prompt: Какие варианты реакции на сокращение срока корректны? Выберите все подходящие.
    options:
      - id: a
        text: Урезать скоуп первого релиза
      - id: b
        text: Добавить ресурсы с учётом времени на погружение
      - id: c
        text: Тихо сократить тестирование
      - id: d
        text: Честно предложить сдвиг части функций
    correct:
      - a
      - b
      - d
    explanation: Скрытое снижение качества — самый опасный вариант.
    lessonId: j02-02
  - id: ai-triangle-check
    type: single
    prompt: Что обязательно перепроверить в вариантах, предложенных ИИ?
    options:
      - id: a
        text: Грамматику
      - id: b
        text: Цифры трудозатрат и реализуемость с учётом зависимостей
      - id: c
        text: Количество вариантов
      - id: d
        text: Эмодзи
    correct: b
    explanation: Модель не знает ваших ставок, людей и зависимостей.
    lessonId: j02-02
  - id: criteria-owner
    type: single
    prompt: Зачем у критерия успеха нужен владелец измерения?
    options:
      - id: a
        text: Чтобы было кого наказать
      - id: b
        text: Чтобы кто-то реально проверил критерий в назначенный срок
      - id: c
        text: Для красоты
      - id: d
        text: Так требует ГОСТ
    correct: b
    explanation: Без владельца критерий остаётся на бумаге.
    lessonId: j02-03
  - id: criteria-count
    type: single
    prompt: Сколько критериев успеха обычно достаточно?
    options:
      - id: a
        text: Один
      - id: b
        text: Три–пять
      - id: c
        text: Двадцать
      - id: d
        text: Чем больше, тем лучше
    correct: b
    explanation: Слишком много критериев никто не запомнит.
    lessonId: j02-03
  - id: criteria-baseline
    type: single
    prompt: Критерий «сократить число звонков в регистратуру» плох тем, что…
    options:
      - id: a
        text: Нет базы для сравнения и срока
      - id: b
        text: Он слишком короткий
      - id: c
        text: Он про звонки
      - id: d
        text: Он неважен
    correct: a
    explanation: Без базы и срока рост или сокращение не измерить.
    lessonId: j02-03
  - id: criteria-influence
    type: single
    prompt: Почему «выручка клиники вырастет» — слабый критерий успеха проекта онлайн-записи?
    options:
      - id: a
        text: На выручку влияют десятки факторов вне проекта
      - id: b
        text: Выручка неважна
      - id: c
        text: Его нельзя сформулировать по-русски
      - id: d
        text: Он слишком измеримый
    correct: a
    explanation: Лучше выбрать показатель, на который результат проекта влияет напрямую.
    lessonId: j02-03
  - id: ai-criteria-numbers
    type: single
    prompt: Можно ли брать целевые числа критериев из ответа ИИ?
    options:
      - id: a
        text: Да
      - id: b
        text: Нет — модель не знает ваших исходных данных; числа согласуют с заказчиком
      - id: c
        text: Да, если модель платная
      - id: d
        text: Только округлив
    correct: b
    explanation: Модель помогает с формулировками, а не с целевыми значениями.
    lessonId: j02-03
  - id: milestone-wording
    type: single
    prompt: Как лучше сформулировать веху?
    options:
      - id: a
        text: «Подписание договора»
      - id: b
        text: «Договор с подрядчиком подписан»
      - id: c
        text: «Работа с договором»
      - id: d
        text: «Договор»
    correct: b
    explanation: Формулировка как факт сразу отвечает, достигнута ли веха.
    lessonId: j02-04
  - id: gate-stop-good
    type: single
    prompt: Остановка проекта на контрольной точке — это…
    options:
      - id: a
        text: Всегда провал PM
      - id: b
        text: Возможное хорошее управленческое решение, если проект потерял смысл
      - id: c
        text: Нарушение правил
      - id: d
        text: Невозможно
    correct: b
    explanation: Хуже потратить ещё полгода на ненужный результат.
    lessonId: j02-04
  - id: gates-count
    type: single
    prompt: Сколько контрольных точек обычно хватает небольшому проекту?
    options:
      - id: a
        text: Одна в конце
      - id: b
        text: Три–пять
      - id: c
        text: Каждую неделю
      - id: d
        text: Двадцать
    correct: b
    explanation: Остальное — вехи для отслеживания прогресса.
    lessonId: j02-04
  - id: gate-materials
    type: order
    prompt: Расположите содержание материалов контрольной точки в рекомендуемом порядке.
    items:
      - id: a
        text: "Где мы: вехи и статус"
      - id: b
        text: Прогноз
      - id: c
        text: Риски и проблемы
      - id: d
        text: Варианты и рекомендация
      - id: e
        text: Нужное решение
    explanation: От текущего состояния к решению, которое нужно принять.
    lessonId: j02-04
  - id: ai-gate-forecast
    type: single
    prompt: Что в материалах к контрольной точке нельзя отдавать модели?
    options:
      - id: a
        text: Сбор пройденных вех из отчётов
      - id: b
        text: Прогноз и вопрос для решения
      - id: c
        text: Оформление таблицы
      - id: d
        text: Проверку орфографии
    correct: b
    explanation: Прогноз — профессиональная оценка PM, а вопрос для решения — главная часть встречи.
    lessonId: j02-04
