id: j02
slug: zhiznennyy-cikl-proekta
order: 2
title: Жизненный цикл проекта
summary: Фазы проекта от инициации до закрытия, треугольник ограничений и критерии успеха.
goals:
- Знать фазы проекта и их результаты
- Понимать треугольник ограничений
- Формулировать критерии успеха проекта
status: planned
keyConcepts:
- инициация
- планирование
- исполнение
- контроль
- закрытие
- треугольник ограничений
searchQueries:
- жизненный цикл проекта этапы
- треугольник ограничений проекта
lessonsPlan:
- slug: pyat-faz-proekta
  title: Пять фаз проекта
  focus: что происходит и какой результат в каждой фазе
  durationMin: 13
  keyPoints:
  - Инициация, планирование, исполнение, мониторинг и контроль, закрытие
  - Результат каждой фазы и кто его принимает
  - 'Фазы пересекаются: контроль идёт всё время'
  - Почему проекты «застревают» между фазами
  aiAngle: ИИ составляет чек-лист результатов фазы для конкретного проекта
  practice: Разложить учебный проект (запуск онлайн-записи в клинику) по фазам с результатами
- slug: treugolnik-ogranicheniy
  title: Треугольник ограничений
  focus: как сроки, бюджет, скоуп и качество влияют друг на друга
  durationMin: 11
  keyPoints:
  - Сроки, бюджет и скоуп связаны; качество — внутри треугольника
  - Любое изменение одной стороны меняет остальные
  - Как предлагать заказчику варианты вместо «нет»
  - Что зафиксировано в договоре и где есть гибкость
  aiAngle: ИИ помогает сформулировать три варианта ответа на запрос «сделать быстрее»
  practice: Подготовить три варианта реакции на сокращение срока проекта на месяц
- slug: kriterii-uspeha
  title: Критерии успеха проекта
  focus: как понять, что проект удался
  durationMin: 11
  keyPoints:
  - Успех проекта и успех продукта — не одно и то же
  - Измеримые критерии и кто их утверждает
  - Критерии фиксируются на старте, а не в конце
  - 'Типичные ошибки: «сделать в срок» как единственный критерий'
  aiAngle: ИИ проверяет критерии на измеримость и предлагает метрики
  practice: Сформулировать 4 измеримых критерия успеха для учебного проекта
- slug: kontrolnye-tochki
  title: Вехи и контрольные точки
  focus: как проект проходит «ворота» и кто решает идти дальше
  durationMin: 10
  keyPoints:
  - Веха — момент, а не работа
  - 'Контрольная точка: решение продолжать, изменить или остановить'
  - Что показывать на контрольной точке
  - Как не превратить контрольные точки в бюрократию
  aiAngle: ИИ собирает материалы к контрольной точке из статусов и реестра рисков
  practice: Расставить 5 вех в учебном проекте и описать решение на каждой
assignment:
  title: Карта жизненного цикла проекта
  deliverable: 'Схема или таблица: фазы, результаты, вехи, критерии успеха'
  brief: Для учебного проекта описать фазы и их результаты, расставить вехи с решениями и сформулировать
    измеримые критерии успеха.
quizFocus:
- фазы проекта и их результаты
- компромиссы треугольника ограничений
- измеримые критерии успеха
- вехи и контрольные точки
