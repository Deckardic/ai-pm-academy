id: j03-quiz
kind: module
title: "Тест модуля: Основы ИИ для PM"
passScore: 0.7
questionsPerAttempt: 8
questions:
  - id: llm-principle
    type: single
    prompt: Что лежит в основе работы большой языковой модели?
    options:
      - id: a
        text: Поиск ответа в базе проверенных фактов
      - id: b
        text: Предсказание наиболее правдоподобного продолжения текста
      - id: c
        text: Логический вывод по правилам, заданным разработчиками
    correct: b
    explanation:
      LLM продолжает текст наиболее правдоподобным образом. Поэтому ответ может быть правдоподобным,
      но неверным.
    lessonId: j03-01
  - id: hallucination
    type: single
    prompt: Что такое галлюцинация модели?
    options:
      - id: a
        text: Отказ модели отвечать на вопрос
      - id: b
        text: Уверенный, правдоподобный, но неверный или выдуманный ответ
      - id: c
        text: Ответ на другом языке
    correct: b
    explanation:
      Галлюцинация — правдоподобный текст без опоры на факты — например, несуществующая статья
      закона или выдуманная цифра.
    lessonId: j03-01
  - id: context-window
    type: single
    scenario:
      Вы полтора часа обсуждаете с ИИ проект в одном диалоге, и ответы стали хуже учитывать ранние
      договорённости.
    prompt: Что лучше сделать?
    options:
      - id: a
        text: Продолжать — модель со временем подстроится
      - id: b
        text: Начать новый диалог и дать весь нужный контекст в одном запросе
      - id: c
        text: Писать запросы короче
    correct: b
    explanation:
      Контекстное окно ограничено, и длинный диалог уводит модель в сторону. Новый диалог с полным
      контекстом — надёжнее.
    lessonId: j03-01
  - id: forbidden-data
    type: multiple
    prompt: Что нельзя отправлять во внешний ИИ-сервис без разрешения компании? Выберите все подходящие.
    options:
      - id: a
        text: Паспортные данные сотрудников
      - id: b
        text: Условия договора с заказчиком под NDA
      - id: c
        text: Обезличенное описание ситуации с переносом сроков
      - id: d
        text: Токен доступа к рабочему трекеру
      - id: e
        text: Общий вопрос о том, как устроена WBS
    correct:
      - a
      - b
      - d
    explanation:
      Персональные данные, документы под NDA и доступы — красная зона. Обезличенные описания
      и общие вопросы безопасны.
    lessonId: j03-02
  - id: anonymize
    type: single
    prompt: Как безопаснее всего подготовить письмо о переносе сроков с помощью внешнего ИИ?
    options:
      - id: a
        text: Вставить переписку с заказчиком целиком
      - id: b
        text: Описать ситуацию без имён, названий компаний и точных сумм
      - id: c
        text: Приложить договор, чтобы модель учла сроки
    correct: b
    explanation:
      Модели достаточно сути. Переписка и договор почти наверняка содержат персональные данные
      и коммерческую тайну.
    lessonId: j03-02
  - id: on-premise
    type: single
    prompt: Чем модель, развёрнутая внутри компании (on-premise), отличается от публичного облачного сервиса?
    options:
      - id: a
        text: Данные не покидают периметр компании
      - id: b
        text: Она всегда умнее облачной
      - id: c
        text: Она не может ошибаться
    correct: a
    explanation:
      Главное отличие — данные остаются внутри компании. Качество ответов и ошибки от этого не
      зависят.
    lessonId: j03-02
  - id: tool-choice-first
    type: single
    prompt: С какого вопроса начинается выбор ИИ-инструмента для рабочих задач?
    options:
      - id: a
        text: Какая модель выше в рейтингах
      - id: b
        text: Какие данные попадут в инструмент и разрешён ли он в компании
      - id: c
        text: Сколько стоит подписка
    correct: b
    explanation:
      Самый умный ассистент бесполезен, если в него нельзя отправлять рабочие материалы. Сначала
      данные и политика компании, потом качество и цена.
    lessonId: j03-03
  - id: meeting-recording
    type: single
    scenario: PM хочет записывать встречи с заказчиком и получать конспекты через сервис расшифровки.
    prompt: Что нужно сделать в первую очередь?
    options:
      - id: a
        text: Предупредить участников, получить согласие и убедиться, что сервис разрешён
      - id: b
        text: Выбрать сервис с самой точной расшифровкой
      - id: c
        text: Ничего, запись — внутреннее дело PM
    correct: a
    explanation:
      Запись встречи содержит персональные данные участников. Без согласия и разрешённого сервиса
      записывать нельзя.
    lessonId: j03-03
  - id: compare-assistants
    type: single
    prompt: Как честнее сравнить два ИИ-ассистента?
    options:
      - id: a
        text: По одному удачному ответу
      - id: b
        text: На серии своих типовых задач по одинаковым критериям
      - id: c
        text: По отзывам в соцсетях
    correct: b
    explanation:
      Модели отвечают по-разному даже на одинаковые запросы. Выводы можно делать только по серии
      своих задач.
    lessonId: j03-03
  - id: invented-cause
    type: single
    scenario: В отчёте, подготовленном ИИ, указана причина задержки, которой не было в ваших заметках.
    prompt: Что делать?
    options:
      - id: a
        text: Оставить, звучит правдоподобно
      - id: b
        text: Удалить или заменить реальной причиной
      - id: c
        text: Смягчить формулировку
    correct: b
    explanation:
      Если причины не было в исходных данных, модель её выдумала. В отчёт попадают только подтверждённые
      факты.
    lessonId: j03-04
  - id: check-steps
    type: multiple
    prompt: Что входит в проверку ответа ИИ? Выберите все подходящие.
    options:
      - id: a
        text: Сверка фактов, цифр и дат с первоисточником
      - id: b
        text: Поиск пропусков и противоречий
      - id: c
        text: Проверка тона под адресата
      - id: d
        text: Если текст звучит уверенно, проверка не нужна
    correct:
      - a
      - b
      - c
    explanation:
      Проверяют факты, логику и полноту, тон и соответствие задаче. Уверенный тон модели ничего
      не говорит о правильности.
    lessonId: j03-04
  - id: second-model
    type: single
    prompt: Можно ли заменить свою проверку проверкой второй модели?
    options:
      - id: a
        text: Да, две модели не ошибаются одинаково
      - id: b
        text: Нет, вторая модель тоже не знает ваших фактов и может подтвердить выдумку
      - id: c
        text: Да, если вторая модель от другого вендора
    correct: b
    explanation:
      Перекрёстная проверка помогает найти проблемы, но сверка с первоисточником остаётся за
      вами.
    lessonId: j03-04
  - id: when-not-ai
    type: single
    prompt: В какой задаче ИИ лучше не использовать без специалиста?
    options:
      - id: a
        text: Черновик повестки встречи
      - id: b
        text: Ответ регулятору или претензия по договору
      - id: c
        text: Список вопросов к стейкхолдеру
    correct: b
    explanation: В юридически значимых документах ошибка стоит дорого, а проверить их без юриста сложно.
    lessonId: j03-04
  - id: llm-next-token
    type: single
    prompt: Что в упрощённом виде делает языковая модель?
    options:
      - id: a
        text: Ищет ответ в базе проверенных фактов
      - id: b
        text: Предсказывает правдоподобное продолжение текста
      - id: c
        text: Выполняет точные расчёты
      - id: d
        text: Звонит экспертам
    correct: b
    explanation: Поэтому ответ звучит уверенно, даже когда неверен.
    lessonId: j03-01
  - id: hallucination-normal
    type: single
    prompt: Как относиться к галлюцинациям модели?
    options:
      - id: a
        text: Как к редкой поломке
      - id: b
        text: Как к нормальному свойству, которое требует проверки
      - id: c
        text: Как к вине пользователя
      - id: d
        text: Как к признаку дешёвой модели
    correct: b
    explanation: Галлюцинации — следствие того, как устроены модели, поэтому проверка обязательна всегда.
    lessonId: j03-01
  - id: long-chat
    type: single
    prompt: Почему в очень длинном диалоге качество ответов падает?
    options:
      - id: a
        text: Модель устаёт
      - id: b
        text: Ранние инструкции влияют слабее из-за ограниченного контекстного окна
      - id: c
        text: Сервис экономит
      - id: d
        text: Так задумано специально
    correct: b
    explanation: Контекстное окно ограничено; при смене темы полезно начать новый диалог.
    lessonId: j03-01
  - id: context-quality
    type: single
    prompt: От чего сильнее всего зависит качество ответа модели на рабочую задачу?
    options:
      - id: a
        text: От вежливости запроса
      - id: b
        text: От контекста в запросе и последующей проверки
      - id: c
        text: От времени суток
      - id: d
        text: От длины ответа
    correct: b
    explanation: Контекст сужает догадки модели, проверка ловит ошибки.
    lessonId: j03-01
  - id: verify-claims
    type: multiple
    prompt: Какие утверждения в ответе модели нужно сверять с первоисточником? Выберите все подходящие.
    options:
      - id: a
        text: Номера статей закона
      - id: b
        text: Цифры статистики
      - id: c
        text: Даты вех проекта
      - id: d
        text: Общие рекомендации по структуре письма
    correct:
      - a
      - b
      - c
    explanation: Проверяемые факты — законы, цифры, даты — всегда сверяют.
    lessonId: j03-01
  - id: red-zone
    type: single
    prompt: Что НЕ входит в «красную зону» данных для внешних ИИ-сервисов?
    options:
      - id: a
        text: Паспортные данные клиента
      - id: b
        text: Условия договора под NDA
      - id: c
        text: Обезличенное описание типовой ситуации
      - id: d
        text: Логины и пароли
    correct: c
    explanation: Обезличенное описание без имён и сумм обычно можно отправлять.
    lessonId: j03-02
  - id: one-minute-rule
    type: single
    prompt: Что такое «правило одной минуты» перед отправкой запроса в ИИ?
    options:
      - id: a
        text: Ждать минуту перед отправкой
      - id: b
        text: Потратить минуту, чтобы проверить текст на персональные данные и коммерческую тайну
      - id: c
        text: Отправлять не чаще раза в минуту
      - id: d
        text: Писать запрос за минуту
    correct: b
    explanation: Короткая проверка перед отправкой предотвращает большинство утечек.
    lessonId: j03-02
  - id: corporate-vs-public
    type: single
    prompt: Чем корпоративный или внутренний ИИ-сервис отличается от публичного?
    options:
      - id: a
        text: Всегда умнее
      - id: b
        text: Данные обрабатываются по условиям, согласованным компанией, или остаются внутри периметра
      - id: c
        text: Не ошибается
      - id: d
        text: Работает без интернета
    correct: b
    explanation: Главное отличие — где и как обрабатываются данные; ошибки и галлюцинации те же.
    lessonId: j03-02
  - id: anonymize-example
    type: single
    prompt: Какой вариант запроса обезличен правильно?
    options:
      - id: a
        text: «Иван Петров из ООО „Ромашка“ сорвал поставку на 4,2 млн»
      - id: b
        text: «Поставщик А сорвал поставку оборудования на крупную сумму»
      - id: c
        text: «Иван из „Ромашки“ сорвал поставку»
      - id: d
        text: «Поставщик сорвал поставку на 4,2 млн, телефон …»
    correct: b
    explanation: Имена, названия и точные суммы заменены на условные обозначения.
    lessonId: j03-02
  - id: tools-data-first
    type: single
    prompt: Коллега советует мощный зарубежный сервис для работы с документами заказчика. Какой первый вопрос?
    options:
      - id: a
        text: Сколько стоит?
      - id: b
        text: Разрешён ли сервис для таких данных политикой компании?
      - id: c
        text: Какая у него скорость?
      - id: d
        text: Есть ли тёмная тема?
    correct: b
    explanation: Выбор начинается с данных и политики.
    lessonId: j03-03
  - id: meeting-consent
    type: single
    prompt: Что обязательно перед записью встречи для расшифровки?
    options:
      - id: a
        text: Предупредить участников и получить согласие
      - id: b
        text: Выбрать самый точный сервис
      - id: c
        text: Ничего
      - id: d
        text: Отключить камеры
    correct: a
    explanation: Голос и слова участников — их персональные данные.
    lessonId: j03-03
  - id: builtin-ai-risk
    type: single
    prompt: В чём главный риск ИИ-функций внутри трекера или базы знаний?
    options:
      - id: a
        text: Они медленные
      - id: b
        text: Модель может увидеть больше, чем нужно, если права доступа настроены небрежно
      - id: c
        text: Они платные
      - id: d
        text: Они на английском
    correct: b
    explanation: Права доступа в сервисе становятся правами ИИ.
    lessonId: j03-03
  - id: tool-criteria
    type: multiple
    prompt: Какие вопросы важны при выборе ИИ-инструмента? Выберите все подходящие.
    options:
      - id: a
        text: Какая задача
      - id: b
        text: Какие данные туда попадут
      - id: c
        text: Разрешён ли политикой компании
      - id: d
        text: Какой цвет у логотипа
    correct:
      - a
      - b
      - c
    explanation: Также важна доступность и качество на ваших задачах.
    lessonId: j03-03
  - id: ru-models
    type: single
    prompt: Какие модели в курсе приводятся как примеры отечественных?
    options:
      - id: a
        text: YandexGPT и GigaChat
      - id: b
        text: Только зарубежные
      - id: c
        text: Никакие
      - id: d
        text: Модели из игр
    correct: a
    explanation: Названия приведены как примеры, линейки продуктов меняются.
    lessonId: j03-03
  - id: check-steps-x
    type: single
    prompt: С чего начинается проверка ответа ИИ по чек-листу?
    options:
      - id: a
        text: С тона
      - id: b
        text: С фактов, цифр, дат, имён и ссылок
      - id: c
        text: С длины
      - id: d
        text: С форматирования
    correct: b
    explanation: Ошибки в фактах самые опасные.
    lessonId: j03-04
  - id: plausible-error
    type: single
    prompt: Какие ошибки ИИ самые опасные?
    options:
      - id: a
        text: Явная чушь
      - id: b
        text: "Правдоподобные: сдвинутая дата, перепутанный ответственный, типичная выдуманная причина"
      - id: c
        text: Опечатки
      - id: d
        text: Лишние пробелы
    correct: b
    explanation: Явную чушь заметно сразу, правдоподобное — нет.
    lessonId: j03-04
  - id: softening
    type: single
    prompt: Модель написала «небольшая задержка» вместо «сдвиг на две недели». Что это?
    options:
      - id: a
        text: Хороший стиль
      - id: b
        text: Искажение смысла, которое нужно исправить
      - id: c
        text: Незначительная деталь
      - id: d
        text: Ошибка орфографии
    correct: b
    explanation: Смягчения меняют смысл отчёта для руководителя.
    lessonId: j03-04
  - id: verify-cost
    type: single
    prompt: Что делать, если проверка ответа ИИ занимает больше, чем написать текст самому?
    options:
      - id: a
        text: Всё равно пользоваться ИИ
      - id: b
        text: Писать самому или разбить задачу на легко проверяемые части
      - id: c
        text: Не проверять
      - id: d
        text: Сменить модель
    correct: b
    explanation: ИИ полезен, когда проверка дешевле работы.
    lessonId: j03-04
  - id: middle-lost
    type: single
    prompt: Какие пункты исходного текста модели чаще теряют?
    options:
      - id: a
        text: Из начала
      - id: b
        text: Из середины длинного текста
      - id: c
        text: Из конца
      - id: d
        text: Никакие
    correct: b
    explanation: Поэтому сравнивайте списки пунктов исходника и ответа.
    lessonId: j03-04
  - id: no-ai-tasks
    type: multiple
    prompt: Где ИИ лучше не использовать без специалиста или вовсе? Выберите все подходящие.
    options:
      - id: a
        text: Ответ регулятору
      - id: b
        text: Расчёт бюджета, который нельзя перепроверить
      - id: c
        text: Черновик повестки встречи
      - id: d
        text: Разговор об увольнении
    correct:
      - a
      - b
      - d
    explanation: Повестка — безопасная задача; остальное — высокая цена ошибки или нужен человек.
    lessonId: j03-04
