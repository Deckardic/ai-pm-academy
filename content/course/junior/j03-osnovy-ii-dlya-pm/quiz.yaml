id: j03-quiz
kind: module
title: "Тест модуля: Основы ИИ для PM"
passScore: 0.7
questionsPerAttempt: 6
questions:
  - id: llm-principle
    type: single
    prompt: Что лежит в основе работы большой языковой модели?
    options:
      - { id: a, text: "Поиск ответа в базе проверенных фактов" }
      - { id: b, text: "Предсказание наиболее правдоподобного продолжения текста" }
      - { id: c, text: "Логический вывод по правилам, заданным разработчиками" }
    correct: b
    explanation: LLM продолжает текст наиболее правдоподобным образом. Поэтому ответ может быть правдоподобным, но неверным.
    lessonId: j03-01
  - id: hallucination
    type: single
    prompt: Что такое галлюцинация модели?
    options:
      - { id: a, text: "Отказ модели отвечать на вопрос" }
      - { id: b, text: "Уверенный, правдоподобный, но неверный или выдуманный ответ" }
      - { id: c, text: "Ответ на другом языке" }
    correct: b
    explanation: Галлюцинация — правдоподобный текст без опоры на факты — например, несуществующая статья закона или выдуманная цифра.
    lessonId: j03-01
  - id: context-window
    type: single
    scenario: Вы полтора часа обсуждаете с ИИ проект в одном диалоге, и ответы стали хуже учитывать ранние договорённости.
    prompt: Что лучше сделать?
    options:
      - { id: a, text: "Продолжать — модель со временем подстроится" }
      - { id: b, text: "Начать новый диалог и дать весь нужный контекст в одном запросе" }
      - { id: c, text: "Писать запросы короче" }
    correct: b
    explanation: Контекстное окно ограничено, и длинный диалог уводит модель в сторону. Новый диалог с полным контекстом — надёжнее.
    lessonId: j03-01
  - id: forbidden-data
    type: multiple
    prompt: Что нельзя отправлять во внешний ИИ-сервис без разрешения компании? Выберите все подходящие.
    options:
      - { id: a, text: "Паспортные данные сотрудников" }
      - { id: b, text: "Условия договора с заказчиком под NDA" }
      - { id: c, text: "Обезличенное описание ситуации с переносом сроков" }
      - { id: d, text: "Токен доступа к рабочему трекеру" }
      - { id: e, text: "Общий вопрос о том, как устроена WBS" }
    correct: [a, b, d]
    explanation: Персональные данные, документы под NDA и доступы — красная зона. Обезличенные описания и общие вопросы безопасны.
    lessonId: j03-02
  - id: anonymize
    type: single
    prompt: Как безопаснее всего подготовить письмо о переносе сроков с помощью внешнего ИИ?
    options:
      - { id: a, text: "Вставить переписку с заказчиком целиком" }
      - { id: b, text: "Описать ситуацию без имён, названий компаний и точных сумм" }
      - { id: c, text: "Приложить договор, чтобы модель учла сроки" }
    correct: b
    explanation: Модели достаточно сути. Переписка и договор почти наверняка содержат персональные данные и коммерческую тайну.
    lessonId: j03-02
  - id: on-premise
    type: single
    prompt: Чем модель, развёрнутая внутри компании (on-premise), отличается от публичного облачного сервиса?
    options:
      - { id: a, text: "Данные не покидают периметр компании" }
      - { id: b, text: "Она всегда умнее облачной" }
      - { id: c, text: "Она не может ошибаться" }
    correct: a
    explanation: Главное отличие — данные остаются внутри компании. Качество ответов и ошибки от этого не зависят.
    lessonId: j03-02
  - id: tool-choice-first
    type: single
    prompt: С какого вопроса начинается выбор ИИ-инструмента для рабочих задач?
    options:
      - { id: a, text: "Какая модель выше в рейтингах" }
      - { id: b, text: "Какие данные попадут в инструмент и разрешён ли он в компании" }
      - { id: c, text: "Сколько стоит подписка" }
    correct: b
    explanation: "Самый умный ассистент бесполезен, если в него нельзя отправлять рабочие материалы. Сначала данные и политика компании, потом качество и цена."
    lessonId: j03-03
  - id: meeting-recording
    type: single
    scenario: "PM хочет записывать встречи с заказчиком и получать конспекты через сервис расшифровки."
    prompt: Что нужно сделать в первую очередь?
    options:
      - { id: a, text: "Предупредить участников, получить согласие и убедиться, что сервис разрешён" }
      - { id: b, text: "Выбрать сервис с самой точной расшифровкой" }
      - { id: c, text: "Ничего, запись — внутреннее дело PM" }
    correct: a
    explanation: "Запись встречи содержит персональные данные участников. Без согласия и разрешённого сервиса записывать нельзя."
    lessonId: j03-03
  - id: compare-assistants
    type: single
    prompt: Как честнее сравнить два ИИ-ассистента?
    options:
      - { id: a, text: "По одному удачному ответу" }
      - { id: b, text: "На серии своих типовых задач по одинаковым критериям" }
      - { id: c, text: "По отзывам в соцсетях" }
    correct: b
    explanation: "Модели отвечают по-разному даже на одинаковые запросы. Выводы можно делать только по серии своих задач."
    lessonId: j03-03
  - id: invented-cause
    type: single
    scenario: "В отчёте, подготовленном ИИ, указана причина задержки, которой не было в ваших заметках."
    prompt: Что делать?
    options:
      - { id: a, text: "Оставить, звучит правдоподобно" }
      - { id: b, text: "Удалить или заменить реальной причиной" }
      - { id: c, text: "Смягчить формулировку" }
    correct: b
    explanation: "Если причины не было в исходных данных, модель её выдумала. В отчёт попадают только подтверждённые факты."
    lessonId: j03-04
  - id: check-steps
    type: multiple
    prompt: Что входит в проверку ответа ИИ? Выберите все подходящие.
    options:
      - { id: a, text: "Сверка фактов, цифр и дат с первоисточником" }
      - { id: b, text: "Поиск пропусков и противоречий" }
      - { id: c, text: "Проверка тона под адресата" }
      - { id: d, text: "Если текст звучит уверенно, проверка не нужна" }
    correct: [a, b, c]
    explanation: "Проверяют факты, логику и полноту, тон и соответствие задаче. Уверенный тон модели ничего не говорит о правильности."
    lessonId: j03-04
  - id: second-model
    type: single
    prompt: Можно ли заменить свою проверку проверкой второй модели?
    options:
      - { id: a, text: "Да, две модели не ошибаются одинаково" }
      - { id: b, text: "Нет, вторая модель тоже не знает ваших фактов и может подтвердить выдумку" }
      - { id: c, text: "Да, если вторая модель от другого вендора" }
    correct: b
    explanation: "Перекрёстная проверка помогает найти проблемы, но сверка с первоисточником остаётся за вами."
    lessonId: j03-04
  - id: when-not-ai
    type: single
    prompt: В какой задаче ИИ лучше не использовать без специалиста?
    options:
      - { id: a, text: "Черновик повестки встречи" }
      - { id: b, text: "Ответ регулятору или претензия по договору" }
      - { id: c, text: "Список вопросов к стейкхолдеру" }
    correct: b
    explanation: "В юридически значимых документах ошибка стоит дорого, а проверить их без юриста сложно."
    lessonId: j03-04
