id: j03
slug: osnovy-ii-dlya-pm
order: 3
title: Основы ИИ для PM
summary: Что такое языковые модели простыми словами, где они сильны, где ошибаются и какие данные в них
  нельзя отправлять.
goals:
- Понимать, как работает LLM и откуда берутся галлюцинации
- Знать классы ИИ-инструментов и что доступно в России
- Соблюдать правила безопасности данных
status: published
artifact: Личная памятка «Правила работы с ИИ»
keyConcepts:
- LLM
- галлюцинации
- контекстное окно
- персональные данные
- коммерческая тайна
- YandexGPT
- GigaChat
searchQueries:
- нейросети для проектного менеджера
- как работает chatgpt простыми словами
- какие данные нельзя загружать в нейросеть
lessonsPlan:
- slug: kak-rabotaet-yazykovaya-model
  title: Как работает языковая модель
  focus: принцип работы LLM без математики
  durationMin: 14
  keyPoints:
  - Предсказание правдоподобного продолжения текста
  - Галлюцинации как нормальное свойство модели
  - Контекстное окно и почему длинные диалоги деградируют
  - Качество ответа зависит от контекста и проверки
  practice: Найти в ответе модели утверждения, которые нужно проверить по первоисточнику
- slug: dannye-i-bezopasnost
  title: Какие данные можно отправлять в ИИ
  focus: красная зона данных и обезличивание
  durationMin: 13
  keyPoints:
  - Персональные данные, коммерческая тайна, NDA и доступы — красная зона
  - 'Обезличивание: суть без имён, названий и сумм'
  - Облачные сервисы, корпоративные подписки и модели внутри компании
  - Правило одной минуты перед отправкой
  practice: Обезличить три реальных рабочих запроса
- slug: instrumenty-ii
  title: Какие бывают ИИ-инструменты
  focus: классы инструментов и что доступно в России
  durationMin: 12
  keyPoints:
  - 'Чат-ассистенты: YandexGPT, GigaChat и зарубежные сервисы'
  - ИИ внутри таск-трекеров, баз знаний и офисных пакетов
  - Транскрибация и саммари встреч
  - 'Как выбирать: задача, данные, политика компании, доступность и оплата из РФ'
  aiAngle: сравнение одного запроса в двух разных ассистентах
  practice: Составить список разрешённых и полезных вам инструментов
- slug: proverka-otvetov-ii
  title: Как проверять ответы ИИ
  focus: чек-лист верификации результата
  durationMin: 12
  keyPoints:
  - Факты, цифры и ссылки — по первоисточнику
  - 'Логика и полнота: что модель пропустила'
  - Тон и адресат текста
  - Перекрёстная проверка второй моделью — не замена своей
  - Когда ИИ лучше не использовать
  practice: Проверить по чек-листу сгенерированный статус-отчёт с тремя ошибками
assignment:
  title: Личная памятка «Правила работы с ИИ»
  deliverable: Памятка на одну страницу
  brief: Какие данные нельзя отправлять, какие инструменты разрешены, как обезличивать, чек-лист проверки
    ответа из 5–7 пунктов.
quizFocus:
- принцип работы LLM
- галлюцинации и проверка фактов
- контекстное окно
- красная зона данных
- обезличивание
