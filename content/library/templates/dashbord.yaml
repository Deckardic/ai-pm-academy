id: dashbord
slug: dashbord
title: Дашборд проекта
summary: "Описание дашборда: аудитория, вопросы, метрики, определения и решения."
level: middle
body: |-
  # Дашборд: [проект] — для [аудитория]

  | Вопрос аудитории | Метрика или график | Определение | Источник | Обновление | Владелец | Решение по метрике |
  |---|---|---|---|---|---|---|
  | [Успеваем к дате?] | [Burn-up и прогноз 85%] | [что считаем] | [трекер] | [еженедельно] | [роль] | [сократить объём / сдвинуть обещание] |

  **Комментарий PM:** [2–3 строки о том, что за цифрами]

  **Обновлено:** [дата]
howToUse:
  - Не больше пяти элементов
  - Метрики не используются для оценки людей
lessonIds:
  - m05-03
