id: antikrizisnyy-plan
slug: antikrizisnyy-plan
title: Антикризисный план
summary: Шаблон диагностики и плана спасения проекта в три волны.
level: middle
body: |-
  # Антикризисный план: [проект]

  ## Диагноз
  | Направление | Данные | Причина |
  |---|---|---|
  | Поток | [WIP, возраст задач, время цикла] | |
  | Скоуп | [рост бэклога, изменения] | |
  | Бюджет | [CPI, SPI, EAC] | |
  | Стейкхолдеры | [позиции, конфликты] | |

  ## Действия
  | Волна | Действие | Ответственный | Срок | Ожидаемый эффект |
  |---|---|---|---|---|
  | 1. Остановить ухудшение (неделя) | | | | |
  | 2. Стабилизировать (месяц) | | | | |
  | 3. Новый план (до запуска) | | | | |

  ## Прогноз
  | | Без изменений | После изменений |
  |---|---|---|
  | Срок (85%) | | |
  | Стоимость (EAC) | | |

  ## Варианты для руководства
  | Вариант | Что получаем | Срок | Бюджет | Риски |
  |---|---|---|---|---|

  ## Метрики контроля
  - [приток и выход задач, WIP, прогноз 85%, CPI]

  ## Нужные решения
  1. [решение]
howToUse:
  - Сначала диагноз по данным, потом действия
  - Не обещайте «успеем всё» — давайте варианты с ценой
lessonIds:
  - m12-02
  - m12-03
