id: zhurnal-izmeneniy
slug: zhurnal-izmeneniy
title: Журнал запросов на изменение
summary: Реестр запросов на изменение скоупа с оценкой влияния и решением.
level: middle
body: |-
  # Журнал изменений: [проект]

  | № | Дата | Кто просит | Что меняется | Зачем | Влияние: сроки / бюджет / качество / риски | Варианты | Решение | Кто решил | Статус |
  |---|---|---|---|---|---|---|---|---|---|
  | CR-1 | [дата] | [роль] | [описание] | [проблема] | [оценка] | [варианты] | [принято / отклонено / перенесено] | [роль] | [открыт / закрыт] |
howToUse:
  - Каждая просьба, меняющая объём, проходит через журнал
  - Решение принимает владелец рамок проекта
