id: ustav-proekta
slug: ustav-proekta
title: Устав проекта
summary: Одностраничный документ, который фиксирует цель, границы, ключевые сроки и роли проекта.
level: junior
body: "# Устав проекта: [название]


  **Дата:** [дата] · **Версия:** 1.0 · **PM:** [роль/имя]


  ## Цель

  [Одно предложение: какой результат и зачем. Цель по SMART.]


  ## Критерии успеха

  - [Измеримый критерий 1]

  - [Измеримый критерий 2]


  ## Границы

  **Входит в проект:**

  - [Результат 1]

  - [Результат 2]


  **Не входит в проект (out of scope):**

  - [Что явно не делаем]


  ## Ключевые вехи

  | Веха | Дата |

  |---|---|

  | [Старт] | [дата] |

  | [Промежуточный результат] | [дата] |

  | [Завершение] | [дата] |


  ## Бюджет и ресурсы

  [Оценка бюджета, состав команды.]


  ## Стейкхолдеры и роли

  | Роль | Кто | Ответственность |

  |---|---|---|

  | Спонсор | | Принимает ключевые решения |

  | Заказчик | | Принимает результат |

  | PM | | Управляет проектом |


  ## Ключевые риски и допущения

  - [Риск или допущение]


  ## Согласование

  [Подписи или подтверждение спонсора.]"
howToUse:
  - Заполните цель и границы вместе с заказчиком — это главное, что защищает проект от разрастания
  - Раздел «Не входит в проект» обязателен, даже если кажется очевидным
  - Согласуйте устав со спонсором до старта работ
lessonIds:
