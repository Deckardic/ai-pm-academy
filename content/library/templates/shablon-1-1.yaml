id: shablon-1-1
slug: shablon-1-1
title: Встреча один на один
summary: Шаблон регулярной встречи 1:1 с разделами для тем сотрудника и договорённостей.
level: middle
body: |-
  # 1:1 · [дата]

  ## Темы сотрудника
  - [заполняет сотрудник заранее]

  ## Самочувствие
  - Оценка двух недель от 1 до 10: [ ] — почему не на балл выше?

  ## Препятствия
  - Что мешает? Где не хватает решений от меня?

  ## Развитие (раз в месяц)
  - Чему хочешь научиться? Какую задачу хотел бы взять?

  ## Обратная связь для меня
  - Что мне делать иначе?

  ## Договорённости
  | Что | Кто | К какому сроку |
  |---|---|---|
howToUse:
  - Повестку ведёт сотрудник
  - Заметки конфиденциальны — не отправляйте их в ИИ-сервисы
