id: pismo-o-probleme
slug: pismo-o-probleme
title: Письмо о проблеме
summary: Письмо о плохой новости по схеме «факты — влияние — план — запрос».
level: junior
body: |-
  **Тема:** [Проект] — [суть], нужно решение до [дата]

  [Что произошло — одно-два предложения с фактами.]

  **Влияние:** [что это значит для сроков, бюджета, результата].

  **Варианты:**
  1. [вариант] — [цена по срокам, деньгам, рискам]
  2. [вариант] — [цена]

  **Рекомендую:** [вариант], потому что [причина].

  **Прошу:** [какое решение] до [дата].
howToUse:
  - Отправляйте, как только узнали о проблеме
  - Не больше одного извинения, без поиска виноватых
lessonIds:
  - j09-05
