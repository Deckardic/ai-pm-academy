level: middle
body: |-
  # Бюджет: [проект] · BAC = [сумма]

  ## План-факт по статьям
  | Статья | План, мес. [N] | Факт | Отклонение | Причина (сдвиг / перерасход / объём) |
  |---|---|---|---|---|

  ## EVM (накопленно)
  | Месяц | PV | % выполнения | EV = %×BAC | AC | CV = EV−AC | SV = EV−PV | CPI = EV÷AC | SPI = EV÷PV |
  |---|---|---|---|---|---|---|---|---|

  ## Прогноз
  | Способ | Формула | EAC |
  |---|---|---|
  | Эффективность сохранится | BAC ÷ CPI | [ ] |
  | Отклонение разовое | AC + (BAC − EV) | [ ] |

  ETC = EAC − AC · VAC = BAC − EAC

  **Резерв на риски:** [сумма], использовано [сумма] на [риски].
howToUse:
