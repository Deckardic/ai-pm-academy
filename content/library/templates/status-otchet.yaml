id: status-otchet
slug: status-otchet
title: Статус-отчёт
summary: "Короткий еженедельный отчёт для руководства: статус, прогресс, риски и запросы."
level: junior
body: |-
  # Статус проекта: [название] — [период]

  **Общий статус:** 🟢 / 🟡 / 🔴 — [одно предложение почему]

  ## Сделано
  - [Значимый результат]

  ## В работе
  | Что | Ожидаемая дата | Комментарий |
  |---|---|---|
  | | | |

  ## Риски и проблемы
  - **[Риск/проблема]** — [что делаем]

  ## Что нужно от руководства
  - [Конкретное решение или помощь, к какой дате]
howToUse:
  - Держите отчёт в пределах одного экрана
  - Статус «жёлтый» — нормально, если объяснено, что делаете
  - "Раздел «Что нужно от руководства» — самый важный: формулируйте конкретно"
lessonIds:
  - j01-03
  - j04-02
  - j09-04
