id: reestr-riskov
slug: reestr-riskov
title: Реестр рисков
summary: "Таблица для учёта рисков: формулировка, оценка, владелец и меры реагирования."
level: junior
body: |-
  # Реестр рисков: [проект]

  Обновлено: [дата]

  | № | Риск («Если …, то …») | Вероятность (1–5) | Влияние (1–5) | Оценка (В×В) | Стратегия | Меры | Владелец | Статус |
  |---|---|---|---|---|---|---|---|---|
  | 1 | Если [причина], то [последствие] | 3 | 4 | 12 | Снизить | [Что делаем] | [Роль] | Открыт |
  | 2 | | | | | | | | |

  **Стратегии:** избежать · снизить · передать · принять.

  **Правило пересмотра:** еженедельно на статус-встрече; риски с оценкой 12+ — на контроле PM.
howToUse:
  - Формулируйте риск как «Если …, то …», чтобы были видны причина и последствие
  - У каждого риска с высокой оценкой должен быть владелец
  - Закрывайте риски, которые больше неактуальны, — реестр не должен разрастаться
lessonIds:
  - j08-02
  - j08-03
  - j08-04
