id: smart-cel
slug: smart-cel
title: Цель проекта по SMART
summary: Шаблон формулировки бизнес-цели и цели проекта с проверкой по SMART.
level: junior
body: |-
  # Цель проекта: [название]

  **Бизнес-цель:** [какую пользу получит организация]

  **Цель проекта:** [результат] к [дата], чтобы [связь с бизнес-целью].

  | Критерий | Проверка | Выполнен? |
  |---|---|---|
  | Конкретная | Понятно, что именно должно получиться | [да / нет] |
  | Измеримая | Как проверим результат: [мера] | [да / нет] |
  | Достижимая | Хватит ли ресурсов и времени | [да / нет] |
  | Значимая | Ведёт к бизнес-цели | [да / нет] |
  | Ограниченная по времени | Срок: [дата] | [да / нет] |

  **Согласовано:** [спонсор], [дата]
howToUse:
  - Цель описывает результат, а не список работ
  - Согласуйте формулировку со спонсором и зафиксируйте дату
lessonIds:
  - j05-01
