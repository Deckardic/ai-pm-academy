id: prioritizaciya-rice
slug: prioritizaciya-rice
title: Приоритизация RICE
summary: Таблица приоритизации бэклога по RICE с обоснованием оценок.
level: middle
body: |-
  # Приоритизация RICE: [продукт, период]

  Шкала влияния: 3 — огромное · 2 — большое · 1 — среднее · 0,5 — низкое · 0,25 — минимальное
  Уверенность: 100% — есть данные · 80% — хорошие основания · 50% — догадка

  | Задача | Охват (за [период]) | Влияние | Уверенность | Затраты (чел.-мес.) | RICE | Обоснование оценок |
  |---|---|---|---|---|---|---|
  | [задача] | [ ] | [ ] | [ ] | [ ] | =Охват×Влияние×Уверенность÷Затраты | [откуда цифры] |
howToUse:
  - Затраты оценивает команда, ценность — бизнес
  - Обсуждайте расхождения оценок, а не усредняйте
lessonIds:
  - m03-03
