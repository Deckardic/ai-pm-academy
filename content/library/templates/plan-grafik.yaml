id: plan-grafik
slug: plan-grafik
title: План-график с вехами
summary: "Таблица план-графика: работы, длительности, зависимости, вехи, критический путь."
level: junior
body: |-
  # План-график: [проект]

  | № | Работа | Длительность, дн. | После | Начало | Окончание | Ответственный | Критическая? | Резерв, дн. |
  |---|---|---|---|---|---|---|---|---|
  | A | [работа] | [ ] | — | [дата] | [дата] | [роль] | да / нет | [ ] |

  ## Вехи
  | Веха (как факт) | Дата | Контрольная точка? | Решение |
  |---|---|---|---|
  | [Макеты утверждены] | [дата] | да / нет | [продолжать / изменить / остановить] |

  **Буфер проекта:** [дней], перед вехой [название]. Израсходовано: [дней].

  **Внешние зависимости:** [что ждём, от кого, до какой даты, план Б]
howToUse:
  - Пересчитывайте критический путь при каждом обновлении
  - Внешние зависимости сразу вносите в реестр рисков
