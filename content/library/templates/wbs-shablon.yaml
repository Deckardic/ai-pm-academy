id: wbs-shablon
slug: wbs-shablon
title: WBS проекта
summary: Иерархическая структура работ с пакетами, ответственными и оценками.
level: junior
body: |-
  # WBS: [проект]

  | Код | Элемент (результат) | Ответственный | Оценка O / M / P | Ожидание | Зависит от |
  |---|---|---|---|---|---|
  | 1 | Управление проектом | PM | | | |
  | 1.1 | План и отчётность | PM | [ ] | [ ] | — |
  | 2 | [Крупный результат] | [роль] | | | |
  | 2.1 | [Пакет работ] | [роль] | [ ] | [ ] | [код] |
  | 3 | Тестирование | [роль] | | | |
  | 4 | Обучение и документация | [роль] | | | |
  | 5 | Запуск и передача в эксплуатацию | [роль] | | | |

  **Проверка правила 100%:** всё из раздела «входит» есть в WBS, ничего из «не входит» — нет.
howToUse:
  - Формулируйте элементы как результаты
  - Пакет — от 8 до 80 часов работы
  - Ожидание считайте по формуле (O + 4M + P) / 6
lessonIds:
  - j07-01
  - j07-02
