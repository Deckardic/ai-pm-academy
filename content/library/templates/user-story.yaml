id: user-story
slug: user-story
title: Пользовательская история
summary: Карточка истории с критериями приёмки и проверкой INVEST.
level: middle
body: |-
  # [Короткое название истории]

  **Как** [роль], **я хочу** [действие], **чтобы** [ценность].

  ## Критерии приёмки
  ```
  Сценарий 1: [название]
  Дано: [исходная ситуация]
  Когда: [действие]
  Тогда: [результат]
  ```

  ## Проверка INVEST
  - [ ] Независимая · [ ] Обсуждаемая · [ ] Ценная · [ ] Оцениваемая · [ ] Небольшая · [ ] Проверяемая

  ## Вопросы и договорённости
  - [вопрос] — [ответ, дата]
howToUse:
  - Часть «чтобы» обязательна
  - Добавьте хотя бы один граничный сценарий
lessonIds:
  - m03-02
