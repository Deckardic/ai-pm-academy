id: povestka-vstrechi
slug: povestka-vstrechi
title: Повестка встречи
summary: Приглашение на встречу с целью, повесткой и ожидаемым результатом.
level: junior
body: |-
  # [Тема встречи]

  **Цель:** к концу встречи [что решим или получим].
  **Участники:** [кто и зачем нужен]
  **Длительность:** [мин]

  | Пункт | Время | Ожидаемый результат |
  |---|---|---|
  | [вопрос] | [мин] | Решение / варианты / информация |
  | Итоги и следующие шаги | 5 мин | Решения, задачи, открытые вопросы |

  **Материалы заранее:** [ссылки] — пожалуйста, посмотрите до встречи.
howToUse:
  - Если цель не формулируется — встреча не нужна
  - Решения проговаривайте вслух до конца встречи
