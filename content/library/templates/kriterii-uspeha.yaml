id: kriterii-uspeha
slug: kriterii-uspeha
title: Критерии успеха проекта
summary: Таблица критериев успеха проекта и продукта с мерой, базой, сроком и владельцем.
level: junior
body: |-
  # Критерии успеха: [проект]

  ## Успех проекта
  | Критерий | Мера | Целевое значение | Срок проверки | Кто проверяет |
  |---|---|---|---|---|
  | Результат | [что готово] | [значение] | [дата] | [роль] |
  | Срок | Дата запуска | [дата] | [дата] | [роль] |
  | Бюджет | Затраты | Не больше [сумма] | При закрытии | [роль] |

  ## Успех продукта
  | Критерий | Мера | База сейчас | Целевое значение | Срок проверки | Кто проверяет |
  |---|---|---|---|---|---|
  | [польза] | [метрика] | [значение] | [значение] | [через N месяцев] | [роль] |
howToUse:
  - Фиксируйте критерии на старте и утверждайте у спонсора
  - Для критериев продукта сначала соберите базу для сравнения
lessonIds:
  - j02-03
