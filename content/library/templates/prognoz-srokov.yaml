id: prognoz-srokov
slug: prognoz-srokov
title: Прогноз сроков по данным
summary: Шаблон прогноза даты методом Монте-Карло с допущениями и сообщением заказчику.
level: middle
body: |-
  # Прогноз: [релиз]

  **История пропускной способности** (задач в неделю, [период]): [3, 5, 4, …]
  **Объём:** [N] задач · **ожидаемый рост бэклога:** [%]

  | Уверенность | Недель | Дата |
  |---|---|---|
  | 50% | [ ] | [ ] |
  | 85% | [ ] | [ ] |
  | 95% | [ ] | [ ] |

  **Допущения:** [команда, внешние зависимости, рост объёма]

  **Что меняет прогноз:** [каждые N задач — плюс неделя]

  **Обновление:** каждую [пятницу] в статус-отчёте.
howToUse:
  - Проверьте симуляцию на малых числах
  - Для внешних обязательств используйте уверенность 85% и выше
lessonIds:
  - m04-03
  - m04-04
