id: plan-kommunikaciy
slug: plan-kommunikaciy
title: План коммуникаций
summary: План коммуникаций на одну страницу с правилом срочного информирования.
level: junior
body: |-
  # План коммуникаций: [проект]

  | Что | Кому | Канал | Когда | Ответственный | Решения на встрече |
  |---|---|---|---|---|---|
  | Статус-отчёт | [спонсор] | Письмо | [пятница] | PM | — |
  | Синхронизация команды | Команда | Встреча 15 мин | [дни] | [кто ведёт] | Блокеры |
  | Демонстрация | [заказчик, пользователи] | Встреча | [раз в 2 недели] | [кто] | Обратная связь, бэклог |

  **Срочное информирование:** [какие события] — [кому] — [в течение какого времени] — [канал].

  **Где решения:** журнал решений в [база знаний].
howToUse:
  - Для каждой встречи запишите решение, ради которого она проводится
  - Всё, что можно, переведите в асинхронный формат
lessonIds:
  - j09-01
