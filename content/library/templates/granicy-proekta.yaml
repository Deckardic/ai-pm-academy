title: Границы проекта
summary: "Шаблон описания содержания: входит, не входит, допущения, ограничения, критерии приёмки."
level: junior
body: |-
  # Границы проекта: [проект]

  ## Входит
  - [результат 1]
  - [результат 2]

  ## Не входит (в этом проекте)
  - [что не делаем] — [можно в следующем этапе?]

  ## Допущения
  | Допущение | Как проверим | К какому сроку | Если ложное |
  |---|---|---|---|
  | [допущение] | [способ] | [дата] | [последствие] |

  ## Ограничения
  - [что нельзя изменить]

  ## Критерии приёмки
  - [как поймём, что результат готов]
howToUse:
  - Раздел «не входит» обязателен
  - Каждое допущение проверьте как можно раньше
