id: raci
slug: raci
title: Матрица RACI
summary: Матрица распределения ответственности по работам и ролям.
level: junior
body: |-
  # RACI: [проект]

  R — исполняет · A — отвечает (ровно один) · C — консультирует · I — информируется

  | Работа | [Роль 1] | [Роль 2] | [Роль 3] | [Роль 4] |
  |---|---|---|---|---|
  | [работа] | A | R | C | I |

  **Проверка:** в каждой строке одна A; у каждой работы есть R; нет людей с R почти во всех строках.
howToUse:
  - Обсудите матрицу с командой — роли распределяют люди
  - Используйте роли, а не имена, если документ широко доступен
lessonIds:
  - j01-02
  - j07-05
