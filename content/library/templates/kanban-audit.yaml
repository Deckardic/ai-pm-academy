id: kanban-audit
slug: kanban-audit
title: Аудит Kanban-доски
summary: Чек-лист и таблица метрик для диагностики потока команды и настройки WIP-лимитов.
level: middle
body: "# Аудит Kanban-доски: [команда]


  ## Текущее состояние

  | Колонка | Задач сейчас | WIP-лимит | Среднее время в колонке |

  |---|---|---|---|

  | | | | |


  **Пропускная способность (задач в неделю):** [число]

  **Среднее время прохождения (cycle time):** [дней]


  ## Чек-лист

  - [ ] Колонки отражают реальный процесс, а не оргструктуру

  - [ ] Есть явные правила перехода между колонками

  - [ ] Заблокированные задачи отмечены и видны

  - [ ] WIP-лимиты установлены и соблюдаются

  - [ ] Метрики пересматриваются регулярно


  ## Узкие места

  - [Колонка, где задачи ждут дольше всего, и гипотеза почему]


  ## Изменения на следующие 2 недели

  - [Изменение и как измерим эффект]"
howToUse:
  - Соберите данные за последние 4–6 недель — меньше недостаточно
  - Начинайте с одного изменения за раз, чтобы видеть эффект
  - "Сверяйте закон Литтла: время прохождения ≈ незавершённая работа ÷ пропускная способность"
lessonIds:
  - m01-01
