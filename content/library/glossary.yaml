  - id: poziciya-i-interes
    slug: poziciya-i-interes
    term: Позиция и интерес
    en: Position and interest
    short: Позиция — что человек требует, интерес — зачем ему это.
    definition:
      Позиции часто несовместимы, а интересы — совместимы. Главный вопрос — «почему это важно
      для вас?».
    related:
      - peregovory
    lessonIds:
      - m09-03
  - id: batna
    slug: batna
    term: Лучшая альтернатива соглашению
    en: BATNA
    short: Лучшее, что вы сделаете, если договориться не получится.
    definition: Альтернатива определяет силу в переговорах. Её готовят заранее и стараются улучшить.
    related:
      - peregovory
    lessonIds:
      - m09-03
  - id: upravlenie-ozhidaniyami
    slug: upravlenie-ozhidaniyami
    term: Управление ожиданиями
    en: Expectation management
    short: Работа по согласованию ожиданий стейкхолдеров с реальностью проекта.
    definition:
      Ожидания проявляют и фиксируют как договорённости, регулярно сверяют на демонстрациях, плохие
      новости сообщают рано.
    related:
      - stakeholder
    lessonIds:
      - m09-02
  - id: slozhnyy-razgovor
    slug: slozhnyy-razgovor
    term: Сложный разговор
    en: Difficult conversation
    short: Разговор с высокими ставками, разными мнениями и сильными эмоциями.
    definition: "Помогает структура: общая цель, выслушать, признать эмоции, факты, варианты, фиксация договорённостей."
    related:
      - eskalaciya
    lessonIds:
      - m09-04
  - id: vnutrennyaya-motivaciya
    slug: vnutrennyaya-motivaciya
    term: Внутренняя мотивация
    en: Intrinsic motivation
    short: Интерес к самой работе и желание сделать хорошо.
    definition:
      Для интеллектуальной работы важны автономия, мастерство и смысл — факторы, на которые PM
      влияет напрямую.
    related:
      - delegirovanie
    lessonIds:
      - m10-01
  - id: delegirovanie
    slug: delegirovanie
    term: Делегирование
    en: Delegation
    short: Передача задачи вместе с правом решения в оговорённых границах.
    definition: Уровни делегирования — от «я решаю и сообщаю» до «решай сам» — делают границы явными.
    related:
      - one-on-one
    lessonIds:
      - m10-02
  - id: one-on-one
    slug: one-on-one
    term: Встреча один на один
    en: One-on-one, 1:1
    short: Регулярный разговор руководителя с членом команды.
    definition:
      "Повестку ведёт сотрудник: самочувствие, препятствия, развитие, обратная связь. Заметки
      конфиденциальны."
    related:
      - delegirovanie
    lessonIds:
      - m10-03
  - id: konflikt
    slug: konflikt
    term: Конфликт в команде
    en: Team conflict
    short: Столкновение целей, интересов или представлений участников.
    definition:
      Часто корень конфликта в процессе или ролях. Разбирают по фактам и интересам, без назначения
      виноватого.
    related:
      - stili-konflikta
    lessonIds:
      - m10-04
  - id: stili-konflikta
    slug: stili-konflikta
    term: Стили поведения в конфликте
    en: Thomas–Kilmann modes
    short: Соперничество, сотрудничество, компромисс, избегание, приспособление.
    definition:
      "Модель Томаса — Килманна: у каждого стиля своё место; проблема — всегда использовать один
      стиль."
    related:
      - konflikt
    lessonIds:
      - m10-04
  - id: obratnaya-svyaz
    slug: obratnaya-svyaz
    term: Обратная связь
    en: Feedback
    short: Информация человеку о влиянии его действий.
    definition:
      Конструктивная обратная связь говорит о ситуации и поведении, а не о личности, и заканчивается
      договорённостью.
    related:
      - one-on-one
    lessonIds:
      - m10-03
  - id: fasilitaciya
    slug: fasilitaciya
    term: Фасилитация
    en: Facilitation
    short: Ведение встречи так, чтобы группа пришла к результату.
    definition:
      "Фасилитатор управляет процессом, а не содержанием: время, слово для всех, безопасность,
      путь к решениям."
    related:
      - retrospektiva
    lessonIds:
      - j11-02
      - m10-04
  - id: psihologicheskaya-bezopasnost
    slug: psihologicheskaya-bezopasnost
    term: Психологическая безопасность
    en: Psychological safety
    short: Уверенность, что за честные слова и ошибки не накажут.
    definition:
      Без неё ретроспективы и разборы превращаются в ритуал. Помогают фокус на процессе и пример
      руководителя.
    related:
      - retrospektiva
    lessonIds:
      - j11-02
  - id: priemka
    slug: priemka
    term: Приёмка
    en: Acceptance
    short: Формальное подтверждение заказчиком, что результат соответствует договорённостям.
    definition:
      Приёмку проводят по заранее согласованным критериям; новые пожелания — это новая работа,
      а не замечания.
    related:
      - kriterii-priemki
      - zakrytie-proekta
    lessonIds:
      - j11-01
  - id: peredacha-v-ekspluataciyu
    slug: peredacha-v-ekspluataciyu
    term: Передача в эксплуатацию
    en: Handover
    short: Передача результата тем, кто будет его поддерживать.
    definition: Передают документацию, доступы, контакты и обучение; часто есть период сопровождения.
    related:
      - priemka
    lessonIds:
      - j11-01
  - id: uroki-proekta
    slug: uroki-proekta
    term: Уроки проекта
    en: Lessons learned
    short: Опыт проекта, который стоит применить в других проектах.
    definition:
      Урок описывает, что произошло, почему и что делать в следующий раз. Урок выучен, когда изменил
      практику.
    related:
      - retrospektiva
    lessonIds:
      - j11-03
  - id: otchet-o-zakrytii
    slug: otchet-o-zakrytii
    term: Отчёт о закрытии
    en: Closure report
    short: "Итоговый документ проекта: результаты, отклонения, уроки, рекомендации."
    definition: Честный отчёт даёт организации возможность учиться.
    related:
      - uroki-proekta
    lessonIds:
      - j11-03
  - id: portfolio-pm
    slug: portfolio-pm
    term: Портфолио проект-менеджера
    en: PM portfolio
    short: Набор кейсов с историями и артефактами, показывающий, как вы работаете.
    definition:
      "Для Junior достаточно двух-трёх кейсов вокруг решений: контекст, роль, варианты, выбор,
      результат, выводы."
    related:
      - project-manager
    lessonIds:
      - j12-03
      - j01-04
  - id: vorota
    slug: vorota
    term: Ворота этапа
    en: Gate
    short: Точка инвестиционного решения между этапами в модели Stage-Gate.
    definition:
      На воротах решают, продолжать, доработать, остановить или отложить проект, по заранее известным
      критериям.
    related:
      - stage-gate
      - kontrolnaya-tochka
    lessonIds:
      - m02-02
  - id: stage-gate
    slug: stage-gate
    term: Stage-Gate
    en: Stage-Gate
    short: Модель, где этапы проекта разделены воротами с инвестиционными решениями.
    definition: Внутри этапов команда может работать итерациями; ворота управляют инвестициями, а не работой.
    related:
      - vorota
      - gibridnyy-podhod
    lessonIds:
      - m02-02
  - id: water-scrum-fall
    slug: water-scrum-fall
    term: Water-Scrum-Fall
    en: Water-Scrum-Fall
    short: "Гибрид: длинный анализ, итеративная разработка и длинное внедрение."
    definition: Ценность теряется на «водопадных» концах. Иногда это разумный компромисс, если он осознанный.
    related:
      - gibridnyy-podhod
    lessonIds:
      - m02-03
  - id: minimalno-dostatochnyy-process
    slug: minimalno-dostatochnyy-process
    term: Минимально достаточный процесс
    en: Minimum viable process
    short: Столько правил, встреч и документов, сколько нужно для рисков проекта, и не больше.
    definition: Каждый элемент процесса отвечает на вопрос «зачем» и помогает принимать решения.
    related:
      - gibridnyy-podhod
    lessonIds:
      - m02-04
  - id: antikrizisnyy-plan
    slug: antikrizisnyy-plan
    term: Антикризисный план
    en: Recovery plan
    short: План спасения проблемного проекта на основе диагностики.
    definition:
      "Действия идут в три волны: остановить ухудшение, стабилизировать, выйти на новый план.
      План сопровождают прогнозом и метриками контроля."
    related:
      - evm
      - monte-karlo
    lessonIds:
      - m12-02
  - id: diagnostika-proekta
    slug: diagnostika-proekta
    term: Диагностика проекта
    en: Project health check
    short: Анализ проекта по потоку, скоупу, бюджету и стейкхолдерам.
    definition: Хороший диагноз опирается на данные и находит причины, объясняющие несколько симптомов сразу.
    related:
      - antikrizisnyy-plan
    lessonIds:
      - m12-01
      - m12-02
