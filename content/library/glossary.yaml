terms:
  - id: proekt
    slug: proekt
    term: Проект
    en: Project
    short: Временная деятельность для создания уникального результата.
    definition:
      Проект — это временная деятельность, направленная на создание уникального продукта, услуги
      или результата. У проекта есть начало и конец, а результат отличается от того, что делали раньше.
    related:
      - operacionnaya-deyatelnost
      - produkt
    lessonIds:
      - j01-01
      - j02-01
  - id: operacionnaya-deyatelnost
    slug: operacionnaya-deyatelnost
    term: Операционная деятельность
    en: Operations
    short: Повторяющаяся работа, которая поддерживает бизнес.
    definition:
      "Операционная деятельность — регулярная повторяющаяся работа по регламентам: бухгалтерия,
      поддержка, логистика. У неё нет финала, её цель — стабильность и эффективность."
    related:
      - proekt
    lessonIds:
      - j01-01
  - id: produkt
    slug: produkt
    term: Продукт
    en: Product
    short: То, что решает проблему пользователя и развивается, пока приносит ценность.
    definition:
      Продукт — решение для пользователей, которое живёт и развивается, пока приносит ценность.
      Внутри жизни продукта возникают проекты.
    related:
      - proekt
    lessonIds:
      - j01-01
  - id: stakeholder
    slug: stakeholder
    term: Стейкхолдер
    en: Stakeholder
    short: Человек или группа, на которых влияет проект или которые влияют на него.
    definition:
      "Стейкхолдер (заинтересованная сторона) — любой, кто влияет на проект или на кого влияет
      его результат: заказчик, спонсор, пользователи, команда, смежные отделы, регуляторы."
    related: []
    lessonIds:
      - j05-02
      - m09-01
  - id: ustav-proekta
    slug: ustav-proekta
    term: Устав проекта
    en: Project Charter
    short: Документ, который официально запускает проект и фиксирует его цель и границы.
    definition:
      Устав проекта — короткий документ, который фиксирует цель, критерии успеха, границы, ключевые
      вехи, бюджет и роли. Его согласование со спонсором — формальный старт проекта.
    related: []
    lessonIds:
      - j05-03
  - id: wbs
    slug: wbs
    term: WBS
    en: Work Breakdown Structure
    short: Иерархическая структура работ проекта.
    definition:
      WBS (иерархическая структура работ) раскладывает результат проекта на всё более мелкие части
      до пакетов работ, которые можно оценить и поручить. Главное правило — правило 100%.
    related:
      - paket-rabot
      - pravilo-100
    lessonIds:
      - j07-01
  - id: paket-rabot
    slug: paket-rabot
    term: Пакет работ
    en: Work Package
    short: "Нижний уровень WBS: работа, которую можно оценить и поручить."
    definition:
      Пакет работ — элемент нижнего уровня WBS, который можно оценить по срокам и стоимости и
      поручить одному ответственному. Ориентир размера — от 8 до 80 часов.
    related:
      - wbs
    lessonIds:
      - j07-01
  - id: pravilo-100
    slug: pravilo-100
    term: Правило 100%
    en: 100% Rule
    short: WBS включает всю работу проекта и ничего сверх неё.
    definition:
      Правило 100% требует, чтобы WBS охватывала всю работу проекта — включая управление, тестирование
      и обучение — и не содержала лишней работы.
    related:
      - wbs
    lessonIds:
      - j07-01
  - id: veha
    slug: veha
    term: Веха
    en: Milestone
    short: Ключевая точка проекта без длительности.
    definition:
      Веха — значимое событие или контрольная точка проекта, например «договор подписан» или «бета-версия
      готова». У вехи нет длительности, она отмечает момент.
    related: []
    lessonIds:
      - j02-04
      - j07-03
  - id: kriticheskiy-put
    slug: kriticheskiy-put
    term: Критический путь
    en: Critical Path
    short: Самая длинная цепочка зависимых работ, определяющая срок проекта.
    definition:
      Критический путь — последовательность зависимых задач с нулевым резервом времени. Задержка
      любой задачи на критическом пути сдвигает срок всего проекта.
    related:
      - veha
    lessonIds:
      - j07-04
  - id: risk
    slug: risk
    term: Риск
    en: Risk
    short: Возможное событие, которое может повлиять на цели проекта.
    definition:
      Риск — неопределённое событие или условие, которое, если произойдёт, повлияет на цели проекта.
      Риски оценивают по вероятности и влиянию и ведут в реестре рисков.
    related:
      - problema
    lessonIds:
      - j08-01
      - j08-02
  - id: problema
    slug: problema
    term: Проблема
    en: Issue
    short: Событие, которое уже произошло и влияет на проект.
    definition:
      Проблема (issue) — уже случившееся событие, требующее действий. В отличие от риска, неопределённости
      здесь нет.
    related:
      - risk
    lessonIds:
      - j08-01
  - id: scrum
    slug: scrum
    term: Scrum
    en: Scrum
    short: Фреймворк для командной работы короткими итерациями — спринтами.
    definition:
      "Scrum — лёгкий фреймворк, в котором команда работает итерациями фиксированной длины (спринтами),
      регулярно показывает результат и улучшает процесс. Роли: Product Owner, Scrum Master, разработчики."
    related:
      - kanban
      - scrum-master
    lessonIds:
      - j01-02
      - j06-03
      - m01-02
  - id: kanban
    slug: kanban
    term: Kanban
    en: Kanban
    short: Метод управления потоком работы с визуализацией и WIP-лимитами.
    definition:
      Kanban — метод, который визуализирует работу на доске, ограничивает незавершённую работу
      WIP-лимитами и управляет потоком по метрикам. Итераций фиксированной длины в Kanban нет.
    related:
      - wip-limit
      - scrum
    lessonIds:
      - j06-03
      - m01-01
      - m01-04
  - id: wip-limit
    slug: wip-limit
    term: WIP-лимит
    en: Work in Progress Limit
    short: Ограничение числа задач, одновременно находящихся в работе.
    definition:
      WIP-лимит ограничивает количество задач в работе на этапе процесса. Он сокращает время прохождения
      задач и делает узкие места видимыми.
    related:
      - kanban
      - zakon-littla
    lessonIds:
      - j06-03
      - m01-01
      - m01-04
  - id: zakon-littla
    slug: zakon-littla
    term: Закон Литтла
    en: Little's Law
    short: Время прохождения = незавершённая работа ÷ пропускная способность.
    definition:
      "Закон Литтла связывает три метрики стабильной системы: среднее время прохождения равно
      объёму незавершённой работы, делённому на пропускную способность."
    related:
      - wip-limit
      - cycle-time
    lessonIds:
      - m01-01
  - id: cycle-time
    slug: cycle-time
    term: Время цикла
    en: Cycle Time
    short: Время от начала работы над задачей до её завершения.
    definition:
      "Cycle time — сколько времени задача проводит в работе: от момента, когда её взяли, до готовности.
      Ключевая метрика потока в Kanban."
    related:
      - zakon-littla
    lessonIds:
      - m01-01
      - m05-01
  - id: scrum-master
    slug: scrum-master
    term: Scrum Master
    en: Scrum Master
    short: Роль в Scrum, которая помогает команде эффективно работать по фреймворку.
    definition:
      "Scrum Master помогает команде и организации работать по Scrum: фасилитирует события, убирает
      препятствия, обучает. Он не распределяет задачи и не отвечает за сроки."
    related:
      - scrum
    lessonIds:
      - j01-02
  - id: llm
    slug: llm
    term: Большая языковая модель
    en: Large Language Model, LLM
    short: Нейросеть, которая генерирует текст, предсказывая его продолжение.
    definition:
      Большая языковая модель (LLM) обучена на огромном массиве текстов и генерирует ответ, предсказывая
      наиболее правдоподобное продолжение. На LLM основаны ChatGPT, YandexGPT, GigaChat и другие ассистенты.
    related:
      - gallyucinaciya
      - kontekstnoe-okno
      - prompt
    lessonIds:
      - j03-01
      - j03-03
  - id: gallyucinaciya
    slug: gallyucinaciya
    term: Галлюцинация
    en: Hallucination
    short: Уверенный, но неверный или выдуманный ответ модели.
    definition:
      "Галлюцинация — правдоподобный текст модели без опоры на факты: выдуманные цифры, ссылки,
      статьи законов. Нормальное свойство LLM, поэтому факты нужно проверять."
    related:
      - llm
    lessonIds:
      - j03-01
      - j03-04
  - id: kontekstnoe-okno
    slug: kontekstnoe-okno
    term: Контекстное окно
    en: Context Window
    short: Объём текста, который модель учитывает за один раз.
    definition:
      Контекстное окно — ограниченный объём текста (запрос, документы, история диалога), который
      модель видит при генерации ответа. В длинных диалогах ранние детали теряются.
    related:
      - llm
    lessonIds:
      - j03-01
      - j04-03
      - m07-03
  - id: prompt
    slug: prompt
    term: Промпт
    en: Prompt
    short: Запрос к ИИ-модели.
    definition:
      Промпт — текст задания для ИИ-модели. Хороший промпт задаёт роль, контекст, задачу, формат
      ответа и ограничения.
    related:
      - cepochka-promptov
      - llm
    lessonIds:
      - j04-01
  - id: cepochka-promptov
    slug: cepochka-promptov
    term: Цепочка промптов
    en: Prompt Chaining
    short: Последовательность запросов, где результат шага — вход следующего.
    definition:
      "Цепочка промптов разбивает сложную задачу на простые шаги с проверкой между ними. Типовая
      схема: извлечь → проверить → проанализировать → оформить."
    related:
      - prompt
    lessonIds:
      - m03-05
      - m07-01
  - id: obezlichivanie
    slug: obezlichivanie
    term: Обезличивание
    en: Anonymization
    short: Удаление из данных сведений, позволяющих определить человека или компанию.
    definition:
      Обезличивание — замена имён, названий, сумм и других идентифицирующих сведений на условные
      перед отправкой во внешний ИИ-сервис.
    related:
      - llm
    lessonIds:
      - j03-02
      - m07-03
      - m11-02
  - id: project-manager
    slug: project-manager
    term: Проект-менеджер
    en: Project Manager
    short: Отвечает за то, чтобы проект был доведён до результата в срок, в бюджет и с нужным качеством.
    definition:
      Проект-менеджер планирует работы, управляет сроками, бюджетом и рисками, договаривается
      со стейкхолдерами и снимает блокеры команды. Его экспертиза — в организации работы, а не обязательно
      в предмете проекта.
    related:
      - proekt
      - product-manager
    lessonIds:
      - j01-02
      - j01-04
  - id: product-manager
    slug: product-manager
    term: Продакт-менеджер
    en: Product Manager
    short: Отвечает за то, что и зачем делать в продукте.
    definition:
      Продакт-менеджер исследует пользователей, формулирует гипотезы, приоритизирует бэклог и
      отвечает за ценность продукта и его метрики.
    related:
      - produkt
      - project-manager
    lessonIds:
      - j01-02
  - id: delivery-manager
    slug: delivery-manager
    term: Delivery-менеджер
    en: Delivery Manager
    short: Отвечает за стабильную и предсказуемую поставку результата командами.
    definition:
      "Delivery-менеджер работает с потоком поставки одной или нескольких команд: метриками потока,
      зависимостями и процессом, а не с одним проектом."
    related:
      - project-manager
      - metriki-potoka
    lessonIds:
      - j01-02
  - id: programma
    slug: programma
    term: Программа проектов
    en: Program
    short: Группа связанных проектов, которыми управляют вместе ради общих выгод.
    definition:
      Программа объединяет проекты, у которых общие цели, ресурсы или зависимости. Управление
      программой фокусируется на выгодах для бизнеса и согласовании проектов между собой.
    related:
      - proekt
      - portfel
    lessonIds:
      - j01-04
  - id: portfel
    slug: portfel
    term: Портфель проектов
    en: Portfolio
    short: Совокупность проектов и программ организации, которые приоритизируют вместе.
    definition:
      Управление портфелем отвечает на вопрос, какие проекты запускать, продолжать или останавливать
      с учётом стратегии и ресурсов.
    related:
      - programma
    lessonIds:
      - j01-04
  - id: pmo
    slug: pmo
    term: Офис управления проектами
    en: PMO
    short: Подразделение, которое задаёт стандарты управления проектами в организации.
    definition:
      Офис управления проектами разрабатывает шаблоны и правила, собирает отчётность по проектам,
      обучает проект-менеджеров и иногда управляет портфелем.
    related:
      - portfel
    lessonIds:
      - j01-04
  - id: zhiznennyy-cikl-proekta
    slug: zhiznennyy-cikl-proekta
    term: Жизненный цикл проекта
    en: Project life cycle
    short: Последовательность фаз проекта от инициации до закрытия.
    definition:
      "Жизненный цикл обычно описывают группами процессов: инициация, планирование, исполнение,
      мониторинг и контроль, закрытие. Фазы пересекаются, а контроль идёт всё время."
    related:
      - iniciaciya
      - zakrytie-proekta
    lessonIds:
      - j02-01
  - id: iniciaciya
    slug: iniciaciya
    term: Инициация
    en: Initiation
    short: Фаза, в которой определяют, зачем нужен проект, и официально его запускают.
    definition:
      На инициации формулируют цель и критерии успеха, находят спонсора и стейкхолдеров, фиксируют
      ограничения. Результат — утверждённый устав проекта.
    related:
      - ustav-proekta
      - zhiznennyy-cikl-proekta
    lessonIds:
      - j02-01
      - j05-03
  - id: planirovanie-proekta
    slug: planirovanie-proekta
    term: Планирование
    en: Planning
    short: Фаза, в которой определяют, что, кто, когда и за какие деньги делает.
    definition:
      "Результат планирования — план проекта: состав работ, график, бюджет, реестр рисков, план
      коммуникаций. План уточняется по ходу проекта."
    related:
      - wbs
      - bazovyy-plan
    lessonIds:
      - j02-01
  - id: monitoring-i-kontrol
    slug: monitoring-i-kontrol
    term: Мониторинг и контроль
    en: Monitoring and controlling
    short: Сравнение факта с планом и управление отклонениями на всём протяжении проекта.
    definition:
      "Мониторинг и контроль идут параллельно другим фазам: PM отслеживает сроки, бюджет, риски
      и изменения и принимает решения о корректировках."
    related:
      - zhiznennyy-cikl-proekta
    lessonIds:
      - j02-01
  - id: zakrytie-proekta
    slug: zakrytie-proekta
    term: Закрытие проекта
    en: Project closure
    short: Фаза приёмки результата, передачи в эксплуатацию и подведения итогов.
    definition:
      На закрытии заказчик принимает результат, его передают в поддержку, закрывают договоры,
      проводят ретроспективу и фиксируют уроки проекта.
    related:
      - priemka
      - uroki-proekta
    lessonIds:
      - j02-01
      - j11-01
  - id: posledovatelnaya-detalizaciya
    slug: posledovatelnaya-detalizaciya
    term: Последовательная детализация
    en: Progressive elaboration
    short: Уточнение плана по мере того, как появляется информация.
    definition:
      На старте план описывают крупно, а ближайшие этапы детализируют по мере приближения. Это
      позволяет не тратить силы на детали, которые всё равно изменятся.
    related:
      - planirovanie-proekta
    lessonIds:
      - j02-01
  - id: treugolnik-ogranicheniy
    slug: treugolnik-ogranicheniy
    term: Треугольник ограничений
    en: Triple constraint
    short: Связь сроков, бюджета и содержания проекта, внутри которой находится качество.
    definition:
      Изменение одной стороны треугольника требует изменить другие или затрагивает качество. Инструмент
      помогает показывать заказчику варианты вместо простого отказа.
    related:
      - skoup
      - kachestvo
    lessonIds:
      - j02-02
  - id: skoup
    slug: skoup
    term: Содержание проекта
    en: Scope
    short: Что именно проект должен создать и какие работы для этого нужны.
    definition:
      Содержание (скоуп) описывает результаты, их характеристики и критерии приёмки, а также то,
      что не входит в проект.
    related:
      - treugolnik-ogranicheniy
      - razrastanie-skoupa
    lessonIds:
      - j02-02
      - j05-04
  - id: kachestvo
    slug: kachestvo
    term: Качество
    en: Quality
    short: Степень соответствия результата требованиям и ожиданиям.
    definition:
      "В треугольнике ограничений качество находится внутри: когда сроки и бюджет зажаты при том
      же объёме, первым страдает качество — сокращают тестирование и проверку."
    related:
      - treugolnik-ogranicheniy
    lessonIds:
      - j02-02
  - id: kriterii-uspeha
    slug: kriterii-uspeha
    term: Критерии успеха
    en: Success criteria
    short: Измеримые условия, по которым понятно, что проект удался.
    definition:
      Критерии успеха фиксируют на старте и утверждают у спонсора. Хорошо разделять успех проекта
      (сделали обещанное) и успех продукта (результат приносит пользу).
    related:
      - smart
      - ustav-proekta
    lessonIds:
      - j02-03
  - id: kontrolnaya-tochka
    slug: kontrolnaya-tochka
    term: Контрольная точка
    en: Stage gate / checkpoint
    short: "Веха, на которой принимают решение: продолжать, изменить или остановить проект."
    definition:
      На контрольной точке показывают статус, прогноз, риски и варианты. Если решения не принимается,
      это статус-встреча, а не контрольная точка.
    related:
      - veha
      - vorota
    lessonIds:
      - j02-04
  - id: sponsor
    slug: sponsor
    term: Спонсор проекта
    en: Sponsor
    short: Руководитель, который отвечает за проект со стороны бизнеса и обеспечивает ресурсы.
    definition:
      Спонсор утверждает устав и бюджет, принимает решения за пределами полномочий PM и помогает
      снимать организационные препятствия.
    related:
      - ustav-proekta
      - stakeholder
    lessonIds:
      - j05-03
  - id: zakazchik
    slug: zakazchik
    term: Заказчик
    en: Customer / client
    short: Сторона, для которой выполняется проект и которая принимает результат.
    definition:
      Заказчик формулирует потребность, участвует в согласованиях и приёмке. Во внутренних проектах
      заказчиком бывает подразделение компании.
    related:
      - sponsor
      - stakeholder
    lessonIds:
      - j05-02
  - id: smart
    slug: smart
    term: SMART
    en: SMART
    short:
      "Набор критериев проверяемой цели: конкретная, измеримая, достижимая, значимая, ограниченная
      по времени."
    definition:
      SMART помогает превратить размытое пожелание в цель, выполнение которой можно проверить.
      Цель описывает результат, а не список работ.
    related:
      - kriterii-uspeha
      - biznes-cel
    lessonIds:
      - j05-01
  - id: biznes-cel
    slug: biznes-cel
    term: Бизнес-цель
    en: Business objective
    short: Польза для организации, ради которой затевается проект.
    definition:
      Бизнес-цель — например, снизить нагрузку на регистратуру — достигается не только проектом.
      Цель проекта описывает результат, который делает бизнес-цель достижимой.
    related:
      - smart
    lessonIds:
      - j05-01
  - id: matrica-vlast-interes
    slug: matrica-vlast-interes
    term: Матрица «власть — интерес»
    en: Power/interest grid
    short: Способ разместить стейкхолдеров по влиянию на проект и интересу к нему.
    definition:
      "Матрица подсказывает стратегию: управлять плотно, держать удовлетворёнными, держать в курсе
      или наблюдать. Она не показывает, за или против человек, поэтому её дополняют оценкой вовлечённости."
    related:
      - stakeholder
      - vovlechennost
    lessonIds:
      - j05-02
      - m09-01
  - id: vovlechennost
    slug: vovlechennost
    term: Вовлечённость стейкхолдера
    en: Stakeholder engagement
    short: "Позиция стейкхолдера по отношению к проекту: от неосведомлённости до лидерства."
    definition:
      "Оценивают текущую и желаемую вовлечённость: не осведомлён, сопротивляется, нейтрален, поддерживает,
      лидирует. Разрыв между ними определяет план работы со стейкхолдером."
    related:
      - matrica-vlast-interes
    lessonIds:
      - m09-01
  - id: dopushchenie
    slug: dopushchenie
    term: Допущение
    en: Assumption
    short: То, что считают верным без доказательства и на чём строят план.
    definition:
      Если допущение окажется ложным, план придётся менять. Каждое непроверенное допущение — потенциальный
      риск, его стоит проверить как можно раньше.
    related:
      - ogranichenie
      - risk
    lessonIds:
      - j05-04
  - id: ogranichenie
    slug: ogranichenie
    term: Ограничение
    en: Constraint
    short: То, что нельзя изменить и что сужает варианты решения.
    definition:
      Ограничения — фиксированная дата, лимит бюджета, требования закона. Их фиксируют в уставе
      рядом с допущениями.
    related:
      - dopushchenie
    lessonIds:
      - j05-04
  - id: razrastanie-skoupa
    slug: razrastanie-skoupa
    term: Разрастание содержания
    en: Scope creep
    short: Постепенное добавление работ без изменения сроков и бюджета.
    definition:
      Каждая просьба кажется маленькой, но вместе они съедают буфер и качество. Защита — границы
      проекта и процедура управления изменениями.
    related:
      - skoup
      - zapros-na-izmenenie
    lessonIds:
      - j05-04
      - m03-04
  - id: kick-off
    slug: kick-off
    term: Стартовая встреча
    en: Kick-off meeting
    short: Встреча, на которой команда и стейкхолдеры выравнивают понимание проекта в начале работ.
    definition:
      На стартовой встрече проговаривают цель, границы, роли, правила работы и ближайшие шаги,
      а также выявляют скрытые ожидания.
    related:
      - ustav-proekta
    lessonIds:
      - j05-03
  - id: waterfall
    slug: waterfall
    term: Каскадная модель
    en: Waterfall
    short: Подход, при котором этапы проекта идут строго последовательно.
    definition:
      Каскад уместен при стабильных требованиях, дорогих изменениях и результате, который нельзя
      поставлять частями. Главный риск — поздняя обратная связь.
    related:
      - agile
      - gibridnyy-podhod
    lessonIds:
      - j06-01
  - id: agile
    slug: agile
    term: Agile
    en: Agile
    short: Набор ценностей и принципов гибкой разработки для работы в неопределённости.
    definition:
      Манифест Agile 2001 года ставит людей, работающий продукт, сотрудничество с заказчиком и
      готовность к изменениям выше процессов, документации, контрактов и плана. Главный механизм — короткие
      итерации с обратной связью.
    related:
      - scrum
      - kanban
      - iteraciya
    lessonIds:
      - j06-02
  - id: iteraciya
    slug: iteraciya
    term: Итерация
    en: Iteration
    short: Короткий цикл работы с готовым результатом и обратной связью в конце.
    definition:
      "Итерация длится обычно от одной до четырёх недель: выбрать самое ценное, сделать, показать,
      получить обратную связь, скорректировать план."
    related:
      - agile
      - sprint
    lessonIds:
      - j06-02
  - id: gibridnyy-podhod
    slug: gibridnyy-podhod
    term: Гибридный подход
    en: Hybrid approach
    short: Сочетание элементов разных методологий под ограничения проекта.
    definition:
      Типичный гибрид — фазы, вехи и контроль бюджета сверху, итерации внутри этапов. Каждый элемент
      должен отвечать конкретному ограничению проекта.
    related:
      - waterfall
      - agile
      - vorota
    lessonIds:
      - j06-04
      - m02-01
  - id: sprint
    slug: sprint
    term: Спринт
    en: Sprint
    short: Итерация Scrum фиксированной длины — не больше месяца.
    definition:
      Спринт — контейнер для всех событий Scrum. В его конце команда получает инкремент, соответствующий
      определению готовности.
    related:
      - scrum
      - cel-sprinta
      - inkrement
    lessonIds:
      - j06-03
      - m01-02
  - id: cel-sprinta
    slug: cel-sprinta
    term: Цель спринта
    en: Sprint Goal
    short: Одна фраза о ценности, ради которой нужен спринт.
    definition:
      "Цель спринта даёт команде фокус и гибкость: состав задач может меняться, если это приближает
      к цели."
    related:
      - sprint
    lessonIds:
      - m01-02
  - id: product-owner
    slug: product-owner
    term: Владелец продукта
    en: Product Owner
    short: Роль Scrum, отвечающая за ценность продукта и порядок бэклога.
    definition: Product Owner решает, что делать дальше, ведёт бэклог продукта и принимает решения по приоритетам.
    related:
      - scrum
      - beklog-produkta
    lessonIds:
      - j06-03
  - id: razrabotchiki-scrum
    slug: razrabotchiki-scrum
    term: Разработчики (Scrum)
    en: Developers
    short: Все участники Scrum-команды, которые создают инкремент.
    definition:
      В Scrum разработчиками называют не только программистов, но и аналитиков, дизайнеров, тестировщиков
      — всех, кто делает результат.
    related:
      - scrum
    lessonIds:
      - j06-03
  - id: beklog-produkta
    slug: beklog-produkta
    term: Бэклог продукта
    en: Product Backlog
    short: Упорядоченный список всего, что может понадобиться в продукте.
    definition:
      Бэклог продукта ведёт Product Owner. Верхние элементы детализированы и готовы к работе,
      нижние — крупнее и менее определённы.
    related:
      - product-owner
      - gruming
    lessonIds:
      - j06-03
      - m01-03
  - id: beklog-sprinta
    slug: beklog-sprinta
    term: Бэклог спринта
    en: Sprint Backlog
    short: Задачи, которые команда взяла в спринт, и план их выполнения.
    definition:
      Бэклог спринта принадлежит разработчикам и меняется по ходу спринта, пока это приближает
      к цели спринта.
    related:
      - sprint
      - cel-sprinta
    lessonIds:
      - j06-03
  - id: inkrement
    slug: inkrement
    term: Инкремент
    en: Increment
    short: Готовый результат спринта, соответствующий определению готовности.
    definition: Инкремент — шаг к цели продукта, который можно показать и, при необходимости, выпустить.
    related:
      - definition-of-done
    lessonIds:
      - j06-03
  - id: daily-scrum
    slug: daily-scrum
    term: Ежедневный Scrum
    en: Daily Scrum
    short: 15-минутная встреча разработчиков для синхронизации вокруг цели спринта.
    definition:
      Ежедневный Scrum — встреча команды для команды, а не отчёт менеджеру. Удобно идти по доске
      от задач, ближайших к завершению.
    related:
      - sprint
    lessonIds:
      - j06-03
      - m01-02
  - id: obzor-sprinta
    slug: obzor-sprinta
    term: Обзор спринта
    en: Sprint Review
    short: Событие, на котором показывают результат и получают обратную связь.
    definition:
      На обзоре участвуют стейкхолдеры и по возможности пользователи. Итог — изменения в бэклоге
      продукта.
    related:
      - sprint
    lessonIds:
      - m01-02
  - id: retrospektiva
    slug: retrospektiva
    term: Ретроспектива
    en: Retrospective
    short: Встреча, на которой команда разбирает, как улучшить свою работу.
    definition:
      Работающая ретроспектива заканчивается одним-двумя конкретными действиями с владельцами
      и проверкой на следующей встрече.
    related:
      - uroki-proekta
    lessonIds:
      - m01-02
      - j11-02
  - id: definition-of-done
    slug: definition-of-done
    term: Определение готовности
    en: Definition of Done
    short: Общий для команды критерий, когда работа считается завершённой.
    definition:
      "Definition of Done делает понятие «готово» одинаковым для всех: например, прошла ревью
      и тесты, принята продактом, готова к выкладке."
    related:
      - definition-of-ready
      - inkrement
    lessonIds:
      - m01-03
  - id: definition-of-ready
    slug: definition-of-ready
    term: Критерии готовности к работе
    en: Definition of Ready
    short: Договорённость команды о том, когда задачу можно брать в работу.
    definition:
      "Пример критериев: понятна проблема, есть критерии приёмки, задача оценена и помещается
      в спринт. Это не должно становиться бюрократическим барьером."
    related:
      - definition-of-done
    lessonIds:
      - m01-03
  - id: gruming
    slug: gruming
    term: Уточнение бэклога
    en: Backlog refinement
    short: Регулярная работа по детализации, оценке и упорядочиванию бэклога.
    definition:
      Детально готовы задачи на один-два спринта вперёд, крупнее — на квартал. Старые неактуальные
      задачи удаляют.
    related:
      - beklog-produkta
    lessonIds:
      - m01-03
  - id: vertikalnaya-narezka
    slug: vertikalnaya-narezka
    term: Вертикальная нарезка
    en: Vertical slicing
    short: Разделение крупной задачи на части, каждая из которых даёт пользу.
    definition:
      Режут по сценариям, типам пользователей, правилам или данным, а не по слоям системы. Горизонтальная
      нарезка откладывает пользу до готовности всех частей.
    related:
      - user-story
    lessonIds:
      - m01-03
  - id: karg-skram
    slug: karg-skram
    term: Карго-скрам
    en: Cargo cult Scrum
    short: Соблюдение внешней формы Scrum без инспекции и адаптации.
    definition:
      "Признаки: нет цели спринта, половина задач переносится, дейли — отчёт, на обзоре нет пользователей,
      ретро не приводит к изменениям."
    related:
      - scrum
    lessonIds:
      - m01-02
  - id: klass-obsluzhivaniya
    slug: klass-obsluzhivaniya
    term: Класс обслуживания
    en: Class of service
    short: Категория задач Kanban со своими правилами обработки.
    definition:
      "Классический набор: срочный, с фиксированной датой, стандартный, нематериальный. Срочный
      класс обязательно ограничивают."
    related:
      - kanban
    lessonIds:
      - m01-04
  - id: yavnye-politiki
    slug: yavnye-politiki
    term: Явные политики
    en: Explicit policies
    short: Записанные правила работы Kanban-системы.
    definition:
      Политики описывают критерии перехода, WIP-лимиты, приоритеты и правила для блокеров. Их
      формулирует и пересматривает команда.
    related:
      - kanban
      - wip-limit
    lessonIds:
      - m01-04
  - id: bloker
    slug: bloker
    term: Блокер
    en: Blocker
    short: Событие, из-за которого задача не может двигаться дальше.
    definition:
      Блокеры помечают сразу, разбирают ежедневно и регулярно считают — это данные для разговора
      с руководством и соседними командами.
    related:
      - kanban
    lessonIds:
      - m01-04
  - id: vozrast-zadachi
    slug: vozrast-zadachi
    term: Возраст задачи
    en: Work item age
    short: Сколько времени прошло с начала работы над незавершённой задачей.
    definition:
      "Возраст задачи — ранний сигнал: если задача старше, чем 85% ранее завершённых, её пора
      разобрать."
    related:
      - cycle-time
    lessonIds:
      - m01-04
      - m05-01
  - id: antipattern
    slug: antipattern
    term: Антипаттерн
    en: Anti-pattern
    short: Распространённое решение, которое кажется разумным, но вредит.
    definition:
      Типичные антипаттерны процесса — вечные переносы спринтов, «всё срочное», доска не отражает
      реальность, метрики ради отчёта.
    related:
      - karg-skram
    lessonIds:
      - m01-05
  - id: velocity
    slug: velocity
    term: Скорость команды
    en: Velocity
    short: Сумма оценок задач, завершённых командой за спринт.
    definition:
      Velocity используют для планирования внутри команды. Сравнивать команды по ней нельзя, а
      делать её целью — вредно.
    related:
      - story-points
    lessonIds:
      - m04-02
      - m01-05
  - id: dekompoziciya
    slug: dekompoziciya
    term: Декомпозиция
    en: Decomposition
    short: Разделение большой работы на меньшие управляемые части.
    definition: "Декомпозиция — основа WBS и нарезки задач: работа делится, пока её нельзя оценить и поручить."
    related:
      - wbs
      - paket-rabot
    lessonIds:
      - j07-01
  - id: pravilo-8-80
    slug: pravilo-8-80
    term: Правило 8–80
    en: 8/80 rule
    short: "Ориентир размера пакета работ: от 8 до 80 часов."
    definition: Мельче — начинается микроменеджмент, крупнее — трудно оценить работу и заметить отставание.
    related:
      - paket-rabot
    lessonIds:
      - j07-01
  - id: ekspertnaya-ocenka
    slug: ekspertnaya-ocenka
    term: Экспертная оценка
    en: Expert judgment
    short: Оценка работы по опыту человека, который её делал.
    definition: Быстрый способ, но зависит от опыта и оптимизма эксперта. Лучше, когда оценивает исполнитель.
    related:
      - trehtochechnaya-ocenka
    lessonIds:
      - j07-02
  - id: ocenka-po-analogii
    slug: ocenka-po-analogii
    term: Оценка по аналогии
    en: Analogous estimating
    short: Оценка по фактическим данным похожих работ или проектов.
    definition:
      Берут факт похожей работы и корректируют на отличия. Работает, если сохраняются данные прошлых
      проектов.
    related:
      - ekspertnaya-ocenka
    lessonIds:
      - j07-02
      - m06-01
  - id: trehtochechnaya-ocenka
    slug: trehtochechnaya-ocenka
    term: Трёхточечная оценка
    en: Three-point estimate
    short: Оценка через оптимистичное, наиболее вероятное и пессимистичное значения.
    definition:
      "Ожидаемая длительность по формуле PERT: (O + 4M + P) / 6. Разрыв между O и P показывает
      неопределённость и подсказывает риски."
    related:
      - pert
      - bufer
    lessonIds:
      - j07-02
  - id: pert
    slug: pert
    term: PERT
    en: PERT
    short: Формула ожидаемой длительности (O + 4M + P) / 6.
    definition:
      PERT взвешивает наиболее вероятную оценку сильнее крайних. Пессимистичный хвост сдвигает
      ожидание вправо.
    related:
      - trehtochechnaya-ocenka
    lessonIds:
      - j07-02
  - id: bufer
    slug: bufer
    term: Буфер
    en: Buffer
    short: Явный запас времени на неопределённость.
    definition:
      Буфер лучше держать общим — в конце графика или перед вехой, — чем прятать в каждой задаче.
      PM следит за его расходом.
    related:
      - rezerv-na-riski
    lessonIds:
      - j07-02
  - id: zavisimost
    slug: zavisimost
    term: Зависимость
    en: Dependency
    short: Связь, при которой одна работа не может начаться или закончиться без другой.
    definition:
      Чаще всего встречается зависимость «окончание — начало». Внешние зависимости — от подрядчиков,
      заказчика, регулятора — главный источник сдвигов.
    related:
      - diagramma-ganta
    lessonIds:
      - j07-03
  - id: diagramma-ganta
    slug: diagramma-ganta
    term: Диаграмма Ганта
    en: Gantt chart
    short: График, где работы показаны полосами на шкале времени.
    definition:
      Диаграмма Ганта показывает сроки, связи и вехи, но не показывает загрузку людей и неопределённость
      оценок.
    related:
      - zavisimost
      - veha
    lessonIds:
      - j07-03
  - id: rezerv-vremeni
    slug: rezerv-vremeni
    term: Резерв времени
    en: Float / slack
    short: На сколько работу можно задержать без сдвига срока проекта.
    definition: У работ на критическом пути резерв нулевой. Резерв общий для цепочки работ и может закончиться.
    related:
      - kriticheskiy-put
    lessonIds:
      - j07-04
  - id: bazovyy-plan
    slug: bazovyy-plan
    term: Базовый план
    en: Baseline
    short: Утверждённая версия плана, с которой сравнивают факт.
    definition:
      Базовый план сроков и стоимости меняют только через управление изменениями — иначе отклонения
      невозможно измерить.
    related:
      - planirovanie-proekta
      - evm
    lessonIds:
      - j02-01
      - m06-03
  - id: raci
    slug: raci
    term: RACI
    en: RACI matrix
    short: "Матрица распределения ответственности: исполняет, отвечает, консультирует, информируется."
    definition:
      У каждой работы ровно один ответственный (A). Матрица помогает договориться о ролях и заметить
      перегрузку.
    related:
      - project-manager
    lessonIds:
      - j01-02
      - j07-05
  - id: zagruzka
    slug: zagruzka
    term: Загрузка ресурсов
    en: Resource loading
    short: Сколько работы назначено человеку в каждый период относительно его доступности.
    definition:
      "Людей не планируют на 100%: часть времени уходит на встречи, поддержку, другие проекты.
      Перегрузку находят суммированием назначений по неделям."
    related:
      - vyravnivanie
    lessonIds:
      - j07-05
  - id: vyravnivanie
    slug: vyravnivanie
    term: Выравнивание ресурсов
    en: Resource leveling
    short: Изменение графика, чтобы устранить перегрузку людей.
    definition:
      Начинают со сдвига некритических работ в пределах резерва, затем перераспределяют работу.
      Выравнивание обычно удлиняет проект.
    related:
      - zagruzka
      - rezerv-vremeni
    lessonIds:
      - j07-05
  - id: oshibka-planirovaniya
    slug: oshibka-planirovaniya
    term: Ошибка планирования
    en: Planning fallacy
    short: Склонность недооценивать время на собственные задачи.
    definition:
      "Описана психологами Даниэлем Канеманом и Амосом Тверски. Противоядие — взгляд снаружи:
      фактические данные похожих работ."
    related:
      - yakorenie
    lessonIds:
      - m04-01
  - id: yakorenie
    slug: yakorenie
    term: Якорение
    en: Anchoring
    short: Склонность опираться на первую услышанную цифру.
    definition:
      Если руководитель назвал срок до оценки, оценки тяготеют к нему. Просите оценку до объявления
      желаемой даты.
    related:
      - oshibka-planirovaniya
    lessonIds:
      - m04-01
  - id: story-points
    slug: story-points
    term: Story points
    en: Story points
    short: Относительная оценка объёма, сложности и неопределённости задачи.
    definition:
      Задачу сравнивают с эталонной, обычно по шкале, похожей на числа Фибоначчи. Шкала у каждой
      команды своя.
    related:
      - velocity
      - poker-planirovaniya
    lessonIds:
      - m04-02
  - id: poker-planirovaniya
    slug: poker-planirovaniya
    term: Покер планирования
    en: Planning poker
    short: Способ получить независимые оценки задачи и обсудить расхождения.
    definition:
      Все одновременно открывают карты с оценками; авторы крайних оценок объясняют свою логику.
      Ценность — в обсуждении, а не в числе.
    related:
      - story-points
    lessonIds:
      - m04-02
  - id: no-estimates
    slug: no-estimates
    term: Подход без оценок
    en: "#NoEstimates"
    short: Прогнозирование по количеству задач сопоставимого размера вместо оценок.
    definition: Команда тратит время на нарезку задач, а для прогноза использует пропускную способность.
    related:
      - throughput
      - monte-karlo
    lessonIds:
      - m04-02
  - id: monte-karlo
    slug: monte-karlo
    term: Метод Монте-Карло
    en: Monte Carlo simulation
    short: Прогноз сроков через тысячи случайных «проигрываний» будущего по истории.
    definition:
      Симуляция случайно выбирает недели из истории пропускной способности, пока не закончится
      объём, и даёт распределение дат с уровнями уверенности.
    related:
      - throughput
      - uroven-uverennosti
    lessonIds:
      - m04-03
  - id: uroven-uverennosti
    slug: uroven-uverennosti
    term: Уровень уверенности прогноза
    en: Confidence level
    short: Доля симуляций, в которых работа завершается к дате.
    definition:
      Прогноз по средней — это около 50% уверенности. Для внешних обязательств обычно берут 85%
      и выше.
    related:
      - monte-karlo
    lessonIds:
      - m04-03
      - m04-04
  - id: lead-time
    slug: lead-time
    term: Время выполнения
    en: Lead time
    short: Время от появления запроса до получения результата.
    definition:
      "Lead time чувствует заказчик: в него входит и ожидание в очереди, и работа. Разница с cycle
      time — время в очереди."
    related:
      - cycle-time
    lessonIds:
      - m05-01
  - id: throughput
    slug: throughput
    term: Пропускная способность
    en: Throughput
    short: Количество задач, завершённых за период.
    definition:
      Пропускная способность — простая метрика потока и основа прогноза методом Монте-Карло. Важен
      не только средний уровень, но и разброс.
    related:
      - monte-karlo
      - zakon-littla
    lessonIds:
      - m05-01
      - m04-03
  - id: wip
    slug: wip
    term: Работа в процессе
    en: Work in progress, WIP
    short: Количество начатых, но не завершённых задач.
    definition:
      По закону Литтла при той же пропускной способности рост WIP увеличивает время прохождения
      задач.
    related:
      - wip-limit
      - zakon-littla
    lessonIds:
      - m05-01
  - id: metriki-potoka
    slug: metriki-potoka
    term: Метрики потока
    en: Flow metrics
    short: "Показатели движения работы через систему: время, пропускная способность, WIP, возраст."
    definition:
      "Метрики потока смотрят как распределения, а не как средние: медиана и 85-й процентиль честнее
      среднего."
    related:
      - lead-time
      - throughput
      - wip
    lessonIds:
      - m05-01
  - id: procentil
    slug: procentil
    term: Процентиль
    en: Percentile
    short: Значение, которое не превышает заданная доля наблюдений.
    definition:
      85-й процентиль времени цикла означает, что 85% задач выполнялись не дольше этого значения.
      Для обещаний он честнее среднего.
    related:
      - metriki-potoka
    lessonIds:
      - m05-01
  - id: burn-down
    slug: burn-down
    term: Диаграмма сгорания
    en: Burn-down chart
    short: График оставшейся работы во времени.
    definition:
      "Burn-down показывает, успеваем ли к дате, но скрывает рост объёма: линия может стоять,
      хотя команда работает."
    related:
      - burn-up
    lessonIds:
      - m05-02
  - id: burn-up
    slug: burn-up
    term: Диаграмма роста
    en: Burn-up chart
    short: График сделанной работы и общего объёма на одном поле.
    definition: Burn-up разделяет темп команды и рост скоупа, поэтому лучше подходит для разговора со стейкхолдерами.
    related:
      - burn-down
    lessonIds:
      - m05-02
  - id: cfd
    slug: cfd
    term: Накопительная диаграмма потока
    en: Cumulative flow diagram, CFD
    short: График количества задач на каждом этапе процесса во времени.
    definition: Расширяющаяся полоса этапа означает, что там копится работа — это узкое место.
    related:
      - uzkoe-mesto
    lessonIds:
      - m05-02
  - id: uzkoe-mesto
    slug: uzkoe-mesto
    term: Узкое место
    en: Bottleneck
    short: Этап процесса, который ограничивает пропускную способность всей системы.
    definition:
      Узкое место видно по накоплению работы перед этапом. Ускорять другие этапы бесполезно —
      нужно помочь узкому месту.
    related:
      - cfd
    lessonIds:
      - m05-02
  - id: dashbord
    slug: dashbord
    term: Дашборд
    en: Dashboard
    short: Набор метрик и графиков для принятия решений.
    definition:
      "Хороший дашборд строится от вопросов аудитории: три-пять метрик с определениями, источником
      и решением, которое по ним принимается."
    related:
      - zakon-gudharta
    lessonIds:
      - m05-03
  - id: zakon-gudharta
    slug: zakon-gudharta
    term: Закон Гудхарта
    en: Goodhart's law
    short: Когда показатель становится целью, он перестаёт быть хорошим показателем.
    definition:
      "Метрики, по которым оценивают людей, начинают подгонять: дробят задачи, растят оценки.
      Метрики используют для понимания системы."
    related:
      - dashbord
      - velocity
    lessonIds:
      - m05-03
  - id: byudzhet-proekta
    slug: byudzhet-proekta
    term: Бюджет проекта
    en: Project budget
    short: Утверждённая сумма на проект, распределённая по статьям и периодам.
    definition:
      Бюджет включает команду, подрядчиков, закупки, обучение и резервы. Распределение по месяцам
      позволяет вести план-факт.
    related:
      - plan-fakt
      - rezerv-na-riski
    lessonIds:
      - m06-01
  - id: rezerv-na-riski
    slug: rezerv-na-riski
    term: Резерв на риски
    en: Contingency reserve
    short: Деньги или время на известные риски из реестра.
    definition:
      Размер резерва обосновывают реестром рисков. Им обычно управляет PM в рамках согласованных
      правил.
    related:
      - upravlencheskiy-rezerv
      - risk
    lessonIds:
      - m06-01
      - j08-03
  - id: upravlencheskiy-rezerv
    slug: upravlencheskiy-rezerv
    term: Управленческий резерв
    en: Management reserve
    short: Деньги на непредвиденное, которыми распоряжается спонсор.
    definition: Управленческий резерв предназначен для «неизвестных неизвестных». PM запрашивает его с обоснованием.
    related:
      - rezerv-na-riski
    lessonIds:
      - m06-01
  - id: plan-fakt
    slug: plan-fakt
    term: План-факт
    en: Plan vs actual
    short: Сравнение плановых и фактических затрат по периодам и статьям.
    definition:
      Отклонения бывают из-за сдвига во времени, перерасхода или изменения объёма. Недорасход
      часто означает отставание работ.
    related:
      - byudzhet-proekta
      - evm
    lessonIds:
      - m06-02
  - id: obyazatelstva
    slug: obyazatelstva
    term: Обязательства
    en: Commitments
    short: Согласованные, но ещё не оплаченные расходы.
    definition:
      Подписанные договоры и согласованные счета учитывают в прогнозе бюджета — так перерасход
      виден в момент решения, а не оплаты.
    related:
      - plan-fakt
    lessonIds:
      - m06-02
  - id: evm
    slug: evm
    term: Метод освоенного объёма
    en: Earned Value Management, EVM
    short: Метод контроля, сравнивающий план, выполненную работу и затраты.
    definition:
      EVM оперирует величинами PV, EV и AC и индексами CPI и SPI. Работает при честной оценке
      выполненной работы и стабильном базовом плане.
    related:
      - pv
      - ev
      - ac
    lessonIds:
      - m06-03
  - id: pv
    slug: pv
    term: Плановый объём
    en: Planned Value, PV
    short: Плановая стоимость работы, которая должна быть выполнена к дате.
    definition: PV берут из бюджета, распределённого по времени.
    related:
      - evm
      - ev
    lessonIds:
      - m06-03
  - id: ev
    slug: ev
    term: Освоенный объём
    en: Earned Value, EV
    short: Плановая стоимость фактически выполненной работы.
    definition: Если выполнено 40% работы, EV = 40% × BAC. Надёжнее считать по завершённым пакетам работ.
    related:
      - evm
      - pv
      - ac
    lessonIds:
      - m06-03
  - id: ac
    slug: ac
    term: Фактическая стоимость
    en: Actual Cost, AC
    short: Сколько реально потрачено на выполненную работу.
    definition: AC сравнивают с EV, чтобы понять эффективность затрат.
    related:
      - evm
      - ev
    lessonIds:
      - m06-03
  - id: cpi
    slug: cpi
    term: Индекс выполнения стоимости
    en: Cost Performance Index, CPI
    short: CPI = EV ÷ AC — сколько работы получаем на рубль затрат.
    definition: CPI меньше 1 означает, что работа обходится дороже плана.
    related:
      - spi
      - eac
    lessonIds:
      - m06-03
  - id: spi
    slug: spi
    term: Индекс выполнения сроков
    en: Schedule Performance Index, SPI
    short: SPI = EV ÷ PV — темп работы относительно плана.
    definition: SPI меньше 1 означает отставание от графика.
    related:
      - cpi
    lessonIds:
      - m06-03
  - id: bac
    slug: bac
    term: Бюджет по завершении
    en: Budget at Completion, BAC
    short: Утверждённый бюджет всего проекта.
    definition: BAC — база для расчёта освоенного объёма и прогноза EAC.
    related:
      - eac
    lessonIds:
      - m06-03
  - id: eac
    slug: eac
    term: Прогноз стоимости завершения
    en: Estimate at Completion, EAC
    short: Сколько проект будет стоить в итоге по текущим данным.
    definition:
      При сохранении эффективности EAC = BAC ÷ CPI; если отклонение разовое — EAC = AC + (BAC
      − EV). Выбор формулы — допущение.
    related:
      - cpi
      - vac
    lessonIds:
      - m06-04
  - id: etc
    slug: etc
    term: Оставшиеся затраты
    en: Estimate to Complete, ETC
    short: ETC = EAC − AC — сколько ещё потратим.
    definition: ETC помогает спланировать финансирование оставшейся части проекта.
    related:
      - eac
    lessonIds:
      - m06-04
  - id: vac
    slug: vac
    term: Отклонение на завершение
    en: Variance at Completion, VAC
    short: VAC = BAC − EAC — ожидаемое отклонение от бюджета.
    definition: Отрицательный VAC означает прогноз перерасхода.
    related:
      - eac
    lessonIds:
      - m06-04
  - id: reestr-riskov
    slug: reestr-riskov
    term: Реестр рисков
    en: Risk register
    short: Таблица рисков проекта с оценкой, владельцами, мерами и триггерами.
    definition:
      "Реестр полезен, пока он короткий и живой: его пересматривают раз в одну-две недели, закрывают
      неактуальные риски и переносят случившиеся в журнал проблем."
    related:
      - risk
      - vladelec-riska
    lessonIds:
      - j08-02
  - id: veroyatnost-i-vliyanie
    slug: veroyatnost-i-vliyanie
    term: Вероятность и влияние
    en: Probability and impact
    short: "Две оценки риска: насколько вероятен и насколько сильно ударит."
    definition: Их оценивают по шкале 1–5, описанной для проекта. Произведение даёт оценку риска для приоритизации.
    related:
      - matrica-riskov
    lessonIds:
      - j08-02
  - id: matrica-riskov
    slug: matrica-riskov
    term: Матрица рисков
    en: Risk matrix
    short: Таблица вероятности и влияния, где видно, какие риски главные.
    definition: Риски делят на красную, жёлтую и зелёную зоны и выбирают, с какими работать активно.
    related:
      - veroyatnost-i-vliyanie
    lessonIds:
      - j08-02
  - id: vladelec-riska
    slug: vladelec-riska
    term: Владелец риска
    en: Risk owner
    short: Человек, который следит за риском и запускает реакцию.
    definition:
      Владелец — тот, кто ближе всего к источнику риска. Если владелец всех рисков — PM, реестр
      не работает.
    related:
      - reestr-riskov
    lessonIds:
      - j08-02
  - id: strategiya-reagirovaniya
    slug: strategiya-reagirovaniya
    term: Стратегия реагирования на риск
    en: Risk response strategy
    short: "Способ обращения с риском: избежать, снизить, передать или принять."
    definition:
      Для возможностей — использовать, усилить, разделить или принять. Передача помогает с деньгами,
      но не со сроками.
    related:
      - trigger-riska
    lessonIds:
      - j08-03
  - id: trigger-riska
    slug: trigger-riska
    term: Триггер риска
    en: Risk trigger
    short: Ранний сигнал, что риск начинает сбываться.
    definition: Хороший триггер наступает раньше самого события, пока есть время реагировать.
    related:
      - strategiya-reagirovaniya
    lessonIds:
      - j08-03
      - j08-04
  - id: vozmozhnost
    slug: vozmozhnost
    term: Возможность
    en: Opportunity
    short: Неопределённое событие, которое может улучшить результат проекта.
    definition: "Возможностями управляют как рисками: оценивают, назначают владельца, повышают шанс реализации."
    related:
      - risk
    lessonIds:
      - j08-01
  - id: eskalaciya
    slug: eskalaciya
    term: Эскалация
    en: Escalation
    short: Передача вопроса тому, кто уполномочен его решить.
    definition:
      "Эскалация — рабочий инструмент: вовремя, с фактами, вариантами и конкретным запросом, с
      предупреждением тех, кого она касается."
    related:
      - sponsor
    lessonIds:
      - j08-04
      - m09-04
  - id: zhurnal-problem
    slug: zhurnal-problem
    term: Журнал проблем
    en: Issue log
    short: Список случившихся проблем с ответственными и сроками решения.
