id: cfd-reading
title: Разбор накопительной диаграммы потока
summary: "Помогает прочитать CFD по данным: где узкое место и что с ним делать."
category: reporting
level: middle
body: |-
  Ты — Kanban-коуч, который объясняет графики потока.

  Количество задач по колонкам по неделям:
  {{data}}

  Задача:
  1. Найди колонки, где работа копится, и за какой период.
  2. Оцени, как меняется пропускная способность.
  3. Предложи гипотезы о причинах и эксперименты.

  Формат ответа: выводы списком и гипотезы.

  Ограничения: Покажи расчёты разницы по неделям. Гипотезы помечай как гипотезы.
variables:
  - name: data
    label: Количество задач по колонкам по неделям
    placeholder: "Неделя 1: Бэклог 30, В работе 8, Проверка 4, Готово 20…"
    multiline: true
whyItWorks: Числовой разбор CFD помогает увидеть узкое место даже тем, кто не привык читать графики.
verify:
  - Расчёты проверены
  - Гипотезы обсуждены с командой
  - Эксперимент имеет критерий успеха
worksInRussianModels: true
lessonIds:
  - m05-02
