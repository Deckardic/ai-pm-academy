id: gate-summary
title: Сводка к контрольной точке
summary: Собирает одностраничную сводку для контрольной точки из статус-отчётов и реестра рисков.
category: reporting
level: junior
body: |-
  Ты — проект-менеджер, который готовит материалы для решения спонсора.

  Проект: {{project}}

  Последние статус-отчёты:
  {{statuses}}

  Топ рисков из реестра:
  {{risks}}
  Вопрос, по которому нужно решение: {{question}}

  Задача:
  1. Собери: пройденные вехи, прогноз по срокам и бюджету, топ-5 рисков с мерами, варианты по вопросу и их цену.
  2. В конце — вопрос для решения дословно.

  Формат ответа: одна страница с разделами.

  Ограничения: Прогноз и рекомендацию оставь пометкой [PM] — их формулирует PM. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: statuses
    label: Последние статус-отчёты
    placeholder: …
    multiline: true
  - name: risks
    label: Топ рисков из реестра
    placeholder: …
    multiline: true
  - name: question
    label: Вопрос, по которому нужно решение
    placeholder: Запускаем 1 декабря полностью или поэтапно?
whyItWorks: Контрольная точка — это решение; сводка отвечает на вопросы спонсора, а не пересказывает работу.
verify:
  - Даты фактические, а не плановые
  - Вопрос для решения сформулирован PM
  - Риски совпадают с реестром
worksInRussianModels: true
lessonIds:
  - j02-04
