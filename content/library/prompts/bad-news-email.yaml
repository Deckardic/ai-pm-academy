id: bad-news-email
title: Письмо с плохой новостью
summary: Помогает написать письмо о проблеме по схеме «факты — влияние — план — запрос».
category: communication
level: junior
body: |-
  Ты — проект-менеджер, который сообщает плохие новости быстро, честно и спокойно.

  Адресат: {{audience}}

  Что произошло:
  {{facts}}
  Влияние: {{impact}}

  Варианты и рекомендация:
  {{options}}

  Задача:
  1. Напиши письмо: тема с сутью и сроком решения; факты; влияние; варианты с ценой; рекомендация; запрос решения со сроком.

  Формат ответа: письмо до 150 слов.

  Ограничения: Не больше одного извинения, без поиска виноватых, без смягчений вроде «небольшая корректировка». Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: audience
    label: Адресат
    placeholder: Главный врач
  - name: facts
    label: Что произошло
    placeholder: Подрядчик задерживает интеграцию на две недели
    multiline: true
  - name: impact
    label: Влияние
    placeholder: Полный запуск 1 декабря под угрозой
  - name: options
    label: Варианты и рекомендация
    placeholder: Два отделения 1 декабря, остальные 15 декабря
    multiline: true
whyItWorks: Схема ставит главное в начало и сразу переводит разговор к решению.
verify:
  - Главное — в теме и первом абзаце
  - Сроки и цифры не смягчены
  - Понятно, какое решение нужно
worksInRussianModels: true
lessonIds:
  - j09-05
