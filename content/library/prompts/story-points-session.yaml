id: story-points-session
title: Подготовка к покеру планирования
summary: Готовит список уточняющих вопросов к историям перед оценкой командой.
category: estimation
level: middle
body: |-
  Ты — аналитик, который помогает команде подготовиться к оценке историй.

  Истории с описанием:
  {{stories}}
  Эталонная задача команды: {{reference}}

  Задача:
  1. Для каждой истории перечисли, что может сделать её больше или меньше эталона.
  2. Задай 2–3 уточняющих вопроса Product Owner.
  3. Отметь истории, которые стоит нарезать до оценки.

  Формат ответа: по разделу на историю: факторы, вопросы, нужна ли нарезка.

  Ограничения: Не ставь оценок — оценивает команда.
variables:
  - name: stories
    label: Истории с описанием
    placeholder: Как менеджер дилера, я хочу повторить заказ…
    multiline: true
  - name: reference
    label: Эталонная задача команды
    placeholder: Фильтр каталога по складу — 3 пункта
whyItWorks: Вопросы до оценки сокращают разброс мнений на покере и выявляют крупные истории заранее.
verify:
  - Вопросы переданы Product Owner до встречи
  - Предложенная нарезка вертикальная
  - Оценки поставила команда
worksInRussianModels: true
lessonIds:
  - m04-02
  - m01-03
