id: agent-boundaries
title: Границы автономии ИИ-агента
summary: Разделяет действия агента на «сам», «с подтверждением» и «никогда» и описывает контроль.
category: ai
level: middle
body: |-
  Ты — специалист по безопасному внедрению ИИ-агентов.

  Цель агента: {{goal}}
  Инструменты и доступы: {{tools}}

  Задача:
  1. Перечисли возможные действия агента.
  2. Раздели их на три группы с объяснением.
  3. Опиши права доступа на уровне систем.
  4. Опиши логи, откат и проверку в первые недели.

  Формат ответа: таблица действий и разделы контроля.

  Ограничения: Внешние коммуникации и необратимые действия — только с подтверждением.
variables:
  - name: goal
    label: Цель агента
    placeholder: Собирать статусы у подрядчиков и готовить сводку
  - name: tools
    label: Инструменты и доступы
    placeholder: Трекер, почта, таблица статусов
whyItWorks: Явные границы автономии и права на уровне систем защищают от ошибок агента надёжнее инструкций.
verify:
  - Права ограничены в системах
  - Есть отдельная учётная запись
  - Логи просматриваются
worksInRussianModels: true
lessonIds:
  - m08-03
