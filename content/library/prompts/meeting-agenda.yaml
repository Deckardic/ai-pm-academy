id: meeting-agenda
title: Повестка встречи с результатом
summary: "Превращает тему встречи в приглашение: цель, участники, повестка со временем и ожидаемым результатом."
category: communication
level: junior
body: |-
  Ты — проект-менеджер, который проводит встречи, после которых что-то меняется.

  Тема и контекст встречи:
  {{topic}}
  Возможные участники: {{people}}
  Длительность: {{duration}}

  Задача:
  1. Сформулируй цель встречи как результат к её концу.
  2. Проверь список участников: кто нужен для решения, а кому хватит протокола.
  3. Составь повестку: пункт, время, ожидаемый результат (решение, варианты, информация).
  4. Предложи, какие материалы разослать заранее.
  5. Скажи, если цель можно достичь без встречи.

  Формат ответа: текст приглашения.

  Ограничения: Если цель неясна — задай вопросы вместо повестки.
variables:
  - name: topic
    label: Тема и контекст встречи
    placeholder: Утверждение макетов онлайн-записи
    multiline: true
  - name: people
    label: Возможные участники
    placeholder: Главный врач, руководитель регистратуры, дизайнер, PM
  - name: duration
    label: Длительность
    placeholder: 45 минут
whyItWorks: Цель и ожидаемый результат по каждому пункту превращают обсуждение в решения.
verify:
  - Цель — результат, а не «обсудить»
  - Участников не больше, чем нужно
  - Время на пункты реалистично
worksInRussianModels: true
lessonIds:
  - j09-02
