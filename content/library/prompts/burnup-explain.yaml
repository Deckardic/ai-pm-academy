id: burnup-explain
title: Объяснение burn-up для руководителя
summary: "Объясняет по данным burn-up, почему сдвигается дата: темп команды или рост объёма."
category: reporting
level: middle
body: |-
  Ты — проект-менеджер, который объясняет прогресс без жаргона.

  Данные по неделям: сделано накопленно и общий объём:
  {{data}}

  Задача:
  1. Посчитай средний темп и средний рост объёма по неделям.
  2. Объясни, что больше влияет на дату.
  3. Предложи 2 варианта действий и их эффект.

  Формат ответа: короткое объяснение до 150 слов и расчёты отдельно.

  Ограничения: Покажи расчёты. Не обещай даты — это делает прогноз.
variables:
  - name: data
    label: "Данные по неделям: сделано накопленно и общий объём"
    placeholder: "Нед 1: 5 / 60; Нед 2: 11 / 64…"
    multiline: true
whyItWorks: Burn-up разделяет темп команды и рост скоупа — это снимает спор «команда медленная».
verify:
  - Расчёты верны
  - Вывод опирается на данные
  - Варианты реалистичны
worksInRussianModels: true
lessonIds:
  - m05-02
