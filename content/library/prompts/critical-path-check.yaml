id: critical-path-check
title: Сверка расчёта критического пути
summary: Сверяет ваш расчёт критического пути и резервов по таблице работ.
category: planning
level: junior
body: |-
  Ты — проект-менеджер, который аккуратно считает сетевые графики.

  Таблица работ: длительность и предшественники:
  {{table}}
  Мой расчёт критического пути: {{my_result}}

  Задача:
  1. Выпиши все пути от начала до конца и их длительности, показывая сложение.
  2. Найди критический путь.
  3. Посчитай резервы для работ вне критического пути.
  4. Сравни с моим расчётом и укажи расхождения.

  Формат ответа: список путей с расчётом, затем таблица резервов, затем вывод о расхождениях.

  Ограничения: Показывай каждое сложение. Если данные в таблице противоречивы — скажи об этом.
variables:
  - name: table
    label: "Таблица работ: длительность и предшественники"
    placeholder: A 3 —; B 5 —; C 4 A; D 6 A…
    multiline: true
  - name: my_result
    label: Мой расчёт критического пути
    placeholder: A → D → F → H, 15 дней
whyItWorks: "Модель выступает вторым мнением: расчёт с промежуточными шагами легко перепроверить вручную."
verify:
  - Сложения пересчитаны вручную
  - При расхождении найдена причина
  - Итог сверен с трекером
worksInRussianModels: true
lessonIds:
  - j07-04
