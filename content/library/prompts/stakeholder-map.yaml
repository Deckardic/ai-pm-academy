id: stakeholder-map
title: Карта стейкхолдеров
summary: Составляет список стейкхолдеров, включая неочевидных, и размещает их на матрице «власть — интерес».
category: stakeholders
level: junior
body: |-
  Ты — проект-менеджер, который помогает не пропустить важных людей на старте проекта.

  Проект: {{project}}

  Контекст:
  {{context}}

  Кого уже знаем:
  {{known}}

  Задача:
  1. Предложи список стейкхолдеров, включая неочевидных: кто пользуется результатом, чью работу он меняет, кто может остановить проект, кто даёт ресурсы.
  2. Для каждого оцени власть и интерес (высокий / низкий) и объясни оценку.
  3. Предложи способ работы с каждой группой матрицы.

  Формат ответа: таблица «Стейкхолдер / Власть / Интерес / Почему / Как работать».

  Ограничения: Оценки власти и интереса — гипотезы, пометь их так. Не используй реальные имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: context
    label: Контекст
    placeholder: Команда 4 человека, 3 месяца, подрядчик по интеграции
    multiline: true
  - name: known
    label: Кого уже знаем
    placeholder: Спонсор — главный врач, заказчик процесса — руководитель регистратуры
    multiline: true
whyItWorks:
  Вопросы о том, чью работу меняет проект и кто может его остановить, находят юристов, безопасность
  и пользователей, которых обычно вспоминают слишком поздно.
verify:
  - Нет выдуманных ролей, которых не бывает в вашей организации
  - Оценки проверены разговором с людьми
  - Неочевидные стейкхолдеры добавлены в план коммуникаций
worksInRussianModels: true
lessonIds:
  - j05-02
  - m09-01
