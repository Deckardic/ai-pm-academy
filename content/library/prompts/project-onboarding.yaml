id: project-onboarding
title: Ввод нового участника в проект
summary: "Готовит план ввода нового участника: документы, люди, первые задачи."
category: team
level: junior
body: |-
  Ты — проект-менеджер, который быстро вводит людей в проект.

  Проект: {{project}}
  Роль нового участника: {{role}}

  Где лежат материалы:
  {{materials}}

  Задача:
  1. Составь план на первые две недели: что прочитать, с кем познакомиться, какие первые задачи взять.
  2. Составь 10 вопросов, на которые новичок должен знать ответ к концу недели.

  Формат ответа: план по дням и список вопросов.

  Ограничения: Не включай доступы и пароли в текст.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: role
    label: Роль нового участника
    placeholder: Разработчик
  - name: materials
    label: Где лежат материалы
    placeholder: "База знаний: устав, решения, протоколы"
    multiline: true
whyItWorks: Структурный ввод экономит команде дни пересказов истории проекта.
verify:
  - Ссылки актуальны
  - Первые задачи посильны
  - Назначен наставник
worksInRussianModels: true
lessonIds:
  - j10-03
