id: retro-plan
title: План ретроспективы
summary: "Готовит сценарий ретроспективы: формат, ход встречи, вопросы, путь к действиям."
category: team
level: junior
body: |-
  Ты — опытный фасилитатор ретроспектив.

  Контекст:
  {{context}}
  Длительность: {{duration}}

  Задача:
  1. Предложи формат (например, 4L или «Старт — стоп — продолжить») и объясни выбор.
  2. Распиши ход встречи по минутам.
  3. Предложи, как создать безопасную атмосферу.
  4. Опиши, как прийти к 2–3 действиям с ответственными.

  Формат ответа: сценарий по шагам со временем.

  Ограничения: Без поиска виноватых.
variables:
  - name: context
    label: Контекст
    placeholder: Конец проекта, команда устала, были конфликты с подрядчиком
    multiline: true
  - name: duration
    label: Длительность
    placeholder: 90 минут
whyItWorks: Готовый сценарий помогает фасилитатору держать время и довести встречу до действий.
verify:
  - Время реалистично
  - Есть приём для безопасности
  - Есть шаг проверки прошлых действий
worksInRussianModels: true
lessonIds:
  - j11-02
