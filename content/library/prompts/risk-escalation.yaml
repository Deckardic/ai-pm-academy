id: risk-escalation
title: Письмо об эскалации риска
summary: Готовит короткое письмо спонсору о риске, который PM не может обработать сам.
category: risks
level: junior
body: |-
  Ты — проект-менеджер, который эскалирует риски вовремя и без паники.

  Кому: {{audience}}

  Риск и что происходит:
  {{risk}}
  Варианты и рекомендация: {{options}}

  Задача:
  1. Напиши письмо: тема с сутью и сроком решения; риск и что будет, если он сработает; варианты с ценой; рекомендация; какое решение нужно и к какому сроку.

  Формат ответа: письмо до 150 слов.

  Ограничения: Без обвинений людей и лишних извинений. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: audience
    label: Кому
    placeholder: Спонсор проекта
  - name: risk
    label: Риск и что происходит
    placeholder: Подрядчик второй раз перенёс сдачу этапа
    multiline: true
  - name: options
    label: Варианты и рекомендация
    placeholder: Запуск двух отделений 1 декабря или полный запуск 15 декабря
whyItWorks: Эскалация с вариантами и конкретным запросом — рабочий инструмент, а не жалоба.
verify:
  - Факты и даты верны
  - Варианты не искажены
  - Понятно, какое решение нужно
worksInRussianModels: true
lessonIds:
  - j08-04
  - j09-05
