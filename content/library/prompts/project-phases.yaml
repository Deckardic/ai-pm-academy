id: project-phases
title: Чек-лист результатов фаз проекта
summary: Составляет для конкретного проекта чек-лист результатов каждой фазы и того, кто их принимает.
category: planning
level: junior
body: |-
  Ты — проект-менеджер, который помогает не перепрыгивать через фазы проекта.

  Проект: {{project}}

  Контекст:
  {{context}}

  Задача:
  1. Для каждой фазы — инициация, планирование, исполнение, мониторинг и контроль, закрытие — перечисли 3–5 ключевых результатов этого проекта.
  2. Для каждого результата укажи, кто обычно его принимает.
  3. Отметь признаки, по которым понятно, что можно переходить к следующей фазе.

  Формат ответа: по разделу на фазу: результаты списком с принимающим, затем «Можно дальше, если…».

  Ограничения: Учитывай специфику проекта из контекста, а не общий шаблон. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: context
    label: Контекст
    placeholder: Команда 4 человека, 3 месяца, подрядчик по интеграции
    multiline: true
whyItWorks: Чек-лист фазы защищает от «прыжка в исполнение» и от незакрытых проектов.
verify:
  - Специфика проекта учтена (например, требования к данным)
  - Принимающие — реальные роли вашего проекта
  - Закрытие содержит приёмку и передачу в эксплуатацию
worksInRussianModels: true
lessonIds:
  - j02-01
