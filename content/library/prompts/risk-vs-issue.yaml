id: risk-vs-issue
title: Разделить риски и проблемы
summary: Разбирает список «рисков» на настоящие риски, уже случившиеся проблемы и возможности.
category: risks
level: junior
body: |-
  Ты — проект-менеджер, который наводит порядок в реестре рисков.

  Список записей из реестра:
  {{items}}

  Задача:
  1. Отнеси каждую запись к риску (может случиться), проблеме (уже случилось) или возможности (может улучшить результат).
  2. Риски и возможности переформулируй в формате «Если [событие], то [последствие] для [цели]».
  3. Для проблем предложи первый шаг и кому его поручить.

  Формат ответа: три таблицы: «Риски», «Проблемы», «Возможности».

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: items
    label: Список записей из реестра
    placeholder: Подрядчик задерживает интеграцию; может выйти обновление системы…
    multiline: true
whyItWorks:
  Проблемы, замаскированные под риски, откладывают действия. Разделение показывает, что решать
  сейчас, а за чем наблюдать.
verify:
  - Проблемы действительно уже случились
  - Формулировки рисков содержат событие и последствие
  - Проблемы перенесены в журнал проблем
worksInRussianModels: true
lessonIds:
  - j08-01
