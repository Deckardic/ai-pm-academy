id: wbs-review
title: Поиск пропусков в WBS
summary: "Использует ИИ как критика: находит работы, которые забыли включить в WBS, с учётом правила 100%."
category: planning
level: junior
body:
  "Ты — опытный проект-менеджер и строгий ревьюер планов. Проверь мою WBS на полноту по правилу 100%.


  Проект: {{project}}

  Контекст (масштаб, срок, ограничения): {{context}}


  WBS:

  {{wbs}}


  Задача:

  1. Найди работы, которые, вероятно, пропущены. Особое внимание: управление проектом, согласования, тестирование,
  обучение пользователей, документация, запуск и переход в эксплуатацию.

  2. Для каждой найденной работы объясни, почему она нужна именно этому проекту.

  3. Отметь пакеты работ, которые выглядят слишком крупными для оценки (больше 80 часов).


  Не переписывай WBS целиком. Формат: таблица «Что добавить / Куда в структуре / Почему»."
variables:
  - name: project
    label: Проект
    placeholder: Запуск интернет-магазина
  - name: context
    label: Контекст
    placeholder: Команда 5 человек, 3 месяца, собственная доставка
  - name: wbs
    label: WBS
    placeholder: Вставьте структуру списком с отступами
    multiline: true
whyItWorks:
  "Модель работает критиком, а не автором: вы сохраняете контроль над структурой, а ИИ использует
  знание типичных проектов, чтобы найти пропуски. Требование объяснять «почему» отсеивает нерелевантные
  предложения."
verify:
  - Каждая предложенная работа действительно нужна вашему проекту
  - Предложения не дублируют существующие пакеты
  - Крупные пакеты отмечены обоснованно
lessonIds:
  - j07-01
