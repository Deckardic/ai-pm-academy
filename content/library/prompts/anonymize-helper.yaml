id: anonymize-helper
title: Помощник обезличивания
summary: Находит в тексте персональные данные и коммерческую информацию и предлагает замены.
category: ai
level: junior
body: |-
  Ты — специалист по защите данных. Твоя задача — найти в тексте то, что нельзя отправлять во внешние сервисы.

  Текст для проверки:
  {{text}}

  Задача:
  1. Найди персональные данные: имена, телефоны, почту, должности с компаниями.
  2. Найди коммерческую информацию: суммы, цены, названия клиентов и партнёров, условия договоров.
  3. Предложи замены условными обозначениями и выдай обезличенный текст.

  Формат ответа: список найденного и обезличенный текст.

  Ограничения: Используй этот промпт только в сервисе, где разрешено обрабатывать исходный текст, — иначе обезличивайте вручную.
variables:
  - name: text
    label: Текст для проверки
    placeholder: Вставьте текст, который собираетесь отправить в ИИ
    multiline: true
whyItWorks: Второй взгляд находит данные, которые легко пропустить, например названия компаний в подписях.
verify:
  - Проверено, что сервис разрешён для исходного текста
  - Все замены проверены глазами
  - Таблица соответствий хранится отдельно
worksInRussianModels: true
lessonIds:
  - j03-02
