id: acceptance-checklist
title: Чек-лист приёмки
summary: Составляет чек-лист приёмки по критериям из устава и требований и план передачи в эксплуатацию.
category: closing
level: junior
body: |-
  Ты — проект-менеджер, который закрывает проекты формально и аккуратно.

  Проект: {{project}}

  Критерии успеха и требования:
  {{criteria}}

  Задача:
  1. Составь чек-лист приёмки по критериям.
  2. Составь план передачи в эксплуатацию: кому, документы, доступы, контакты, обучение.
  3. Добавь шаблон списка незакрытых хвостов.

  Формат ответа: три раздела в Markdown.

  Ограничения: Не добавляй критериев, которых нет в данных.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: criteria
    label: Критерии успеха и требования
    placeholder: …
    multiline: true
whyItWorks: Приёмка по заранее согласованным критериям не превращается в спор о вкусах.
verify:
  - Критерии совпадают с уставом
  - Есть ответственный за поддержку
  - Хвосты имеют владельцев
worksInRussianModels: true
lessonIds:
  - j11-01
