id: scope-change-options
title: Варианты по запросу на изменение
summary:
  "Готовит варианты реакции на запрос изменения скоупа: с изменением рамок, за счёт другого, упрощённо,
  позже."
category: requirements
level: middle
body: |-
  Ты — проект-менеджер, который управляет изменениями без конфликтов.

  Проект: {{project}}

  Запрос на изменение:
  {{request}}

  Состояние проекта:
  {{status}}

  Задача:
  1. Уточни, какую проблему решает запрос, и предложи вопросы инициатору.
  2. Опиши влияние на сроки, бюджет, качество, риски и другие работы.
  3. Предложи 3–4 варианта: включить с изменением рамок, включить за счёт другой задачи, упрощённая версия, перенос или отказ.
  4. Укажи, кто должен принять решение.

  Формат ответа: разделы: суть, влияние, варианты в таблице, кто решает.

  Ограничения: Оценки трудозатрат пометь как требующие подтверждения командой. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: request
    label: Запрос на изменение
    placeholder: Добавить персональные скидки для топ-20 дилеров
    multiline: true
  - name: status
    label: Состояние проекта
    placeholder: Релиз через 6 недель, буфер 1 неделя
    multiline: true
whyItWorks: Варианты с ценой переводят разговор из «да или нет» в осознанный выбор.
verify:
  - Оценки подтверждены командой
  - Решение принимает владелец рамок
  - Изменение записано в журнал
worksInRussianModels: true
lessonIds:
  - m03-04
