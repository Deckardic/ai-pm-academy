id: table-analysis
title: Анализ выгрузки по частям
summary: "Помогает проанализировать большую выгрузку: формулы для чисел, модель — для текста."
category: ai
level: middle
body: |-
  Ты — аналитик, который работает с большими таблицами надёжно.

  Столбцы выгрузки: {{columns}}
  Что хочу узнать: {{question}}

  Задача:
  1. Предложи, что посчитать формулами, и дай формулы.
  2. Предложи фильтр для отбора нужных строк.
  3. Предложи промпт для анализа текстовых комментариев отфильтрованных задач по частям.
  4. Предложи контрольные проверки итогов.

  Формат ответа: план с формулами и промптом.

  Ограничения: Не проси модель считать суммы и средние по всей таблице.
variables:
  - name: columns
    label: Столбцы выгрузки
    placeholder: Ключ, тип, статус, даты, комментарий
  - name: question
    label: Что хочу узнать
    placeholder: Почему задачи застревают дольше двух недель
whyItWorks:
  Разделение «числа — формулам, текст — модели» и работа частями защищают от ошибок на больших
  данных.
verify:
  - Выгрузка обезличена
  - Контрольные суммы сходятся
  - Выборка проверена вручную
worksInRussianModels: true
lessonIds:
  - m07-03
