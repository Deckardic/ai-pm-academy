id: requirements-extract
title: Извлечение требований из протокола
summary: "Первый шаг цепочки: выделяет требования, ограничения и открытые вопросы из длинного текста."
category: requirements
level: middle
body:
  "Ты — бизнес-аналитик. Извлеки из текста требования заказчика. Это первый шаг анализа, поэтому только
  извлекай — не анализируй и не дополняй.


  Текст:

  {{source}}


  Выведи три списка:

  1. Требования — каждое одной фразой, с цитатой из текста в скобках.

  2. Ограничения — сроки, бюджет, технические и организационные условия.

  3. Упомянутые, но не раскрытые темы — то, о чём говорили без деталей.


  Если что-то сформулировано неоднозначно, пометь «[неоднозначно]». Ничего не добавляй от себя."
variables:
  - name: source
    label: Текст протокола
    placeholder: Вставьте обезличенный протокол или переписку
    multiline: true
whyItWorks:
  Шаг ограничен одной операцией — извлечением, а цитаты позволяют за минуту проверить, что модель
  ничего не выдумала. Метки неоднозначности готовят материал для следующего шага цепочки.
verify:
  - У каждого требования есть цитата, и она совпадает с текстом
  - Ничего не добавлено «от себя»
  - Неоднозначные места помечены
lessonIds:
  - m07-01
