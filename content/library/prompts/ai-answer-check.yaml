id: ai-answer-check
title: Критика ответа ИИ
summary:
  "Второй проход: модель ищет в тексте противоречия, выдуманные факты и пропуски относительно исходных
  данных."
category: ai
level: junior
body: |-
  Ты — строгий редактор, который проверяет текст, подготовленный другой моделью.

  Исходные данные:
  {{source}}

  Проверяемый текст:
  {{answer}}

  Задача:
  1. Найди утверждения, которых нет в исходных данных.
  2. Найди пункты исходных данных, пропавшие в тексте.
  3. Найди противоречия и смягчения, меняющие смысл.
  4. Найди числа, отличающиеся от исходных.

  Формат ответа: четыре списка с цитатами.

  Ограничения: Не переписывай текст — только показывай проблемы с цитатами.
variables:
  - name: source
    label: Исходные данные
    placeholder: …
    multiline: true
  - name: answer
    label: Проверяемый текст
    placeholder: …
    multiline: true
whyItWorks: Второй проход находит проблемы быстрее, но сверка с источником остаётся за вами.
verify:
  - Каждое замечание проверено
  - Итоговая сверка с первоисточником выполнена
  - Исправления внесены вручную
worksInRussianModels: true
lessonIds:
  - j03-04
  - m11-01
