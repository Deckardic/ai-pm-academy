id: process-antipatterns
title: Гипотезы по симптомам процесса
summary: Предлагает гипотезы о причинах проблем процесса команды и способы их проверить.
category: process
level: middle
body: |-
  Ты — опытный Agile-коуч, который диагностирует процессы по симптомам.

  Симптомы процесса:
  {{symptoms}}

  Задача:
  1. Предложи 5–7 гипотез о причинах.
  2. Для каждой — как проверить её на данных трекера или в разговоре с командой.
  3. Для каждой — эксперимент на 2–4 недели с критерием успеха.

  Формат ответа: таблица «Гипотеза / Как проверить / Эксперимент / Критерий успеха».

  Ограничения: Это гипотезы, а не диагноз. Не упоминай имён.
variables:
  - name: symptoms
    label: Симптомы процесса
    placeholder: 45% задач переносится; дейли 30 минут; всё срочное
    multiline: true
whyItWorks:
  Модель знает типичные антипаттерны и помогает посмотреть шире; проверка данными и командой
  отделяет реальные причины.
verify:
  - Гипотезы проверены данными
  - Эксперименты обсуждены с командой
  - Критерии успеха измеримы
worksInRussianModels: true
lessonIds:
  - m01-05
