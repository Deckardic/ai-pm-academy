id: new-pm-audit
title: Аудит проекта при приёме от другого PM
summary: Составляет чек-лист вопросов и данных, которые нужно собрать, принимая проект от другого PM.
category: process
level: middle
body: |-
  Ты — опытный антикризисный руководитель проектов.

  Проект: {{project}}

  Что известно сейчас:
  {{known}}

  Задача:
  1. Составь чек-лист по направлениям: цели и договорённости, поток и сроки, скоуп и изменения, бюджет, риски, стейкхолдеры, команда, подрядчики.
  2. Для каждого пункта укажи, какие данные или документы запросить и с кем поговорить в первую неделю.

  Формат ответа: чек-лист по разделам.

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: known
    label: Что известно сейчас
    placeholder: Проект на 4-м месяце, предыдущий PM ушёл
    multiline: true
whyItWorks: Системный аудит в первую неделю даёт данные для диагноза вместо реакции на самый громкий «пожар».
verify:
  - Список встреч на первую неделю составлен
  - Данные выгружены
  - Первые выводы подтверждены данными
worksInRussianModels: true
lessonIds:
  - m12-01
  - m12-02
