id: assistant-instructions
title: Инструкции для ассистента
summary: Превращает проверенный промпт в постоянные инструкции ассистента и готовит тесты.
category: ai
level: middle
body: |-
  Ты — специалист по настройке ИИ-ассистентов для команд.

  Проверенный промпт:
  {{prompt}}
  Для какой повторяющейся задачи: {{task}}

  Задача:
  1. Преобразуй промпт в постоянные инструкции: роль, формат, ограничения, реакция на неподходящие запросы.
  2. Предложи 5–7 тестовых входов, включая граничные, и ожидаемый результат для каждого.
  3. Предложи описание ассистента: назначение, владелец, правила по данным.

  Формат ответа: инструкции, таблица тестов, описание.

  Ограничения: Не добавляй в инструкции рабочие данные.
variables:
  - name: prompt
    label: Проверенный промпт
    placeholder: …
    multiline: true
  - name: task
    label: Для какой повторяющейся задачи
    placeholder: Протоколы встреч проекта
whyItWorks: Проверенный промпт в инструкциях плюс набор тестов делают ассистента предсказуемым.
verify:
  - Тесты прогнаны
  - Назначен владелец
  - Правила по данным указаны
worksInRussianModels: true
lessonIds:
  - m07-04
