id: budget-structure
title: Структура бюджета проекта
summary: Проверяет полноту бюджета по статьям и WBS и предлагает резервы.
category: budget
level: middle
body: |-
  Ты — финансовый контролёр проектов.

  Проект: {{project}}

  Пакеты работ WBS:
  {{wbs}}

  Черновик бюджета по статьям:
  {{budget}}

  Задача:
  1. Проверь, у каждого ли пакета WBS есть источник затрат.
  2. Найди вероятно пропущенные статьи: закупки, обучение, тестовые среды, лицензии.
  3. Предложи структуру резерва на риски с привязкой к рискам и управленческий резерв.

  Формат ответа: списки пропусков и предложения по резервам.

  Ограничения: Не называй суммы, которых нет в данных.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: wbs
    label: Пакеты работ WBS
    placeholder: …
    multiline: true
  - name: budget
    label: Черновик бюджета по статьям
    placeholder: Команда, подрядчик, хостинг
    multiline: true
whyItWorks: Сверка бюджета с WBS находит работы, на которые нет денег, ещё до старта.
verify:
  - Пропущенные статьи относятся к проекту
  - Резерв обоснован рисками
  - Суммы посчитали вы
worksInRussianModels: true
lessonIds:
  - m06-01
