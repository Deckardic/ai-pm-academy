id: wsjf-calc
title: Приоритизация по WSJF
summary: Считает WSJF по оценкам стоимости задержки и размера работ и объясняет порядок.
category: requirements
level: middle
body: |-
  Ты — аналитик, который помогает выбирать, что делать первым.

  Задачи: ценность, критичность по времени, снижение рисков, размер:
  {{items}}

  Задача:
  1. Посчитай стоимость задержки как сумму трёх компонентов и WSJF = стоимость задержки ÷ размер.
  2. Отсортируй задачи.
  3. Объясни, почему первые три задачи оказались наверху.
  4. Отметь, какие оценки сильнее всего влияют на порядок.

  Формат ответа: таблица с расчётом и пояснения.

  Ограничения: Не меняй оценки. Покажи расчёт.
variables:
  - name: items
    label: "Задачи: ценность, критичность по времени, снижение рисков, размер"
    placeholder: Статусы заказов | 3 | 2 | 8 | 2
    multiline: true
whyItWorks: WSJF поднимает короткие задачи с высокой стоимостью задержки — модель показывает это прозрачно.
verify:
  - Арифметика верна
  - Порядок обсуждён со стейкхолдерами
  - Оценки размеров даны командой
worksInRussianModels: true
lessonIds:
  - m03-03
