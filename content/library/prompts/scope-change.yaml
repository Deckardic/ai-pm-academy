id: scope-change
title: Оценка запроса на изменение
summary: Помогает разобрать запрос на изменение скоупа и подготовить варианты для заказчика.
category: requirements
level: middle
body: |-
  Ты — опытный проект-менеджер. Помоги разобрать запрос на изменение скоупа.

  Текущий план (кратко): {{plan}}
  Запрос на изменение: {{request}}

  Подготовь:
  1. Что именно меняется в результате проекта.
  2. Влияние на сроки, бюджет, качество и риски — по каждому пункту, с допущениями.
  3. Три варианта для заказчика: принять с изменением сроков/бюджета, принять вместо другой работы, отложить на следующий этап.
  4. Вопросы, которые нужно уточнить до решения.

  Помечай допущения явно. Не выдавай оценки за факты.
variables:
  - name: plan
    label: Текущий план
    placeholder: Релиз 1 ноября, команда 4 человека, 3 крупные функции
    multiline: true
  - name: request
    label: Запрос
    placeholder: Заказчик просит добавить интеграцию с 1С
    multiline: true
whyItWorks:
  Три варианта превращают разговор «да или нет» в выбор, а явные допущения не дают выдать черновую
  оценку модели за обязательство.
verify:
  - Оценки влияния проверены с командой
  - Допущения помечены
  - Варианты реалистичны для вашего проекта
lessonIds:
  - m03-04
