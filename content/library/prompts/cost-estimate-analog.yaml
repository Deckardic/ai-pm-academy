id: cost-estimate-analog
title: Оценка затрат по аналогии
summary: Помогает сделать раннюю оценку по аналогии с прошлым проектом и назвать диапазон.
category: budget
level: middle
body: |-
  Ты — проект-менеджер, который делает раннюю оценку честно.

  Прошлый проект: объём и фактическая стоимость:
  {{past}}

  Текущий проект: отличия:
  {{current}}

  Задача:
  1. Перечисли факторы, которые увеличивают и уменьшают стоимость относительно аналога.
  2. Предложи диапазон оценки в долях от аналога с объяснением.
  3. Перечисли, что нужно уточнить, чтобы сузить диапазон.

  Формат ответа: таблица факторов, диапазон, вопросы.

  Ограничения: Не выдавай точную цифру — только диапазон с допущениями.
variables:
  - name: past
    label: "Прошлый проект: объём и фактическая стоимость"
    placeholder: Портал для дистрибьютора, 20 функций, X млн
    multiline: true
  - name: current
    label: "Текущий проект: отличия"
    placeholder: На треть больше функций, нет готовой интеграции
    multiline: true
whyItWorks: Оценка по аналогии быстра, а явные факторы и диапазон показывают её точность.
verify:
  - Аналог действительно похож
  - Диапазон назван как диапазон
  - Вопросы запланированы
worksInRussianModels: true
lessonIds:
  - m06-01
