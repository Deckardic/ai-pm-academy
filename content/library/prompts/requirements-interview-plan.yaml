id: requirements-interview-plan
title: План интервью для выявления требований
summary:
  "Готовит план интервью с пользователем или заказчиком: цель, вопросы о прошлом опыте, нефункциональные
  требования."
category: requirements
level: middle
body: |-
  Ты — бизнес-аналитик, который выявляет требования через интервью.

  Проект: {{project}}
  С кем интервью: {{role}}
  Цель интервью: {{goal}}

  Задача:
  1. Сформулируй цель интервью одной фразой.
  2. Предложи 12–15 открытых вопросов от общего к частному, с упором на реальный прошлый опыт («расскажите о последнем случае…»).
  3. Добавь вопросы о нефункциональных требованиях: скорость, надёжность, доступ, устройства.
  4. Добавь вопросы, которые помогают найти проблему за предложенным решением.

  Формат ответа: план интервью со временем на каждый блок.

  Ограничения: Не задавай наводящих вопросов и вопросов «да/нет».
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: role
    label: С кем интервью
    placeholder: Менеджер дилера, оформляет заказы ежедневно
  - name: goal
    label: Цель интервью
    placeholder: Понять, как сейчас оформляются заказы и где теряется время
whyItWorks:
  Вопросы о прошлом опыте дают надёжнее информацию, чем фантазии о будущем, а явные вопросы
  о нефункциональных требованиях вытаскивают то, что считают очевидным.
verify:
  - Нет наводящих вопросов
  - Есть вопросы о нефункциональных требованиях
  - Время интервью реалистично
worksInRussianModels: true
lessonIds:
  - m03-01
