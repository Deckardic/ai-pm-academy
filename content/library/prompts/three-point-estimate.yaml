id: three-point-estimate
title: Трёхточечная оценка с факторами риска
summary:
  Помогает подготовить трёхточечную оценку пакетов работ и собрать факторы, которые увеличивают
  срок.
category: estimation
level: junior
body: |-
  Ты — проект-менеджер, который помогает команде честно оценивать работы с учётом неопределённости.

  Проект: {{project}}

  Пакеты работ с оценками команды (O, M, P):
  {{packages}}

  Задача:
  1. Для каждого пакета посчитай ожидаемую длительность по формуле (O + 4M + P) / 6 и покажи расчёт.
  2. Перечисли факторы, из-за которых пакет может занять пессимистичное время.
  3. Отметь пакеты с самым большим разрывом между O и P — им нужен буфер или разговор с командой.

  Формат ответа: таблица «Пакет / O / M / P / Ожидание / Факторы риска», затем выводы.

  Ограничения: Не меняй оценки команды. Проверь арифметику: покажи расчёт для каждой строки.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: packages
    label: Пакеты работ с оценками команды (O, M, P)
    placeholder: "Интеграция: 3 / 5 / 13 дней"
    multiline: true
whyItWorks:
  Модель считает и собирает факторы риска, а оценки остаются за исполнителями — так вы не подменяете
  команду прогнозом модели.
verify:
  - Расчёт пересчитан вручную хотя бы для двух строк
  - Факторы риска относятся к вашему проекту
  - Крупные разрывы O–P обсуждены с командой
worksInRussianModels: true
lessonIds:
  - j07-02
