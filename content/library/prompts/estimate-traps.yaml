id: estimate-traps
title: Разбор оценки на ловушки
summary: "Проверяет оценку срока на типичные ловушки: ошибку планирования, якорение, неучтённую работу."
category: estimation
level: middle
body: |-
  Ты — опытный проект-менеджер, который помогает команде не попадать в ловушки оценки.

  Проект: {{project}}

  Оценка и как её получили:
  {{estimate}}
  Контекст команды: {{context}}

  Задача:
  1. Найди признаки ловушек: ошибка планирования, якорение, давление сроком, неучтённая работа, доступность людей меньше 100%.
  2. Перечисли, что, вероятно, не вошло в оценку.
  3. Предложи вопросы к команде и способ получить более реалистичную оценку (взгляд снаружи, диапазон).

  Формат ответа: список найденных ловушек с объяснением, затем вопросы к команде.

  Ограничения: Не называй новую оценку вместо команды. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: estimate
    label: Оценка и как её получили
    placeholder: "55 рабочих дней: сложили оценки задач"
    multiline: true
  - name: context
    label: Контекст команды
    placeholder: Половина времени — поддержка старой системы
whyItWorks: Ловушки оценки систематические — чек-лист помогает увидеть их до того, как срок будет сорван.
verify:
  - Названные пропуски действительно не учтены
  - Вопросы обсуждены с командой
  - Новая оценка — диапазон от команды
worksInRussianModels: true
lessonIds:
  - m04-01
