id: forecast-message
title: Сообщение заказчику о сроке
summary: Превращает вероятностный прогноз в короткое сообщение заказчику с датой, условиями и рычагами.
category: estimation
level: middle
body: |-
  Ты — проект-менеджер, который говорит о сроках честно и понятно.

  Адресат: {{audience}}
  Прогноз: {{forecast}}

  Допущения и рычаги:
  {{assumptions}}

  Задача:
  1. Напиши сообщение до 150 слов: дата с высокой уверенностью, «скорее всего» дата, условия, рычаги, договорённость об обновлениях.
  2. Не используй проценты, если адресат их не любит, — замени понятными формулировками.

  Формат ответа: текст письма с темой.

  Ограничения: Не называй дату раньше, чем даёт прогноз с высокой уверенностью. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: audience
    label: Адресат
    placeholder: Коммерческий директор
  - name: forecast
    label: Прогноз
    placeholder: 50% — 10 недель, 85% — 11 недель, 95% — 11 недель
  - name: assumptions
    label: Допущения и рычаги
    placeholder: Доступ подрядчика до 1 февраля; каждые 5 задач — плюс неделя
    multiline: true
whyItWorks:
  Структура «дата — условия — рычаги — обновления» даёт заказчику дату, которой можно доверять,
  и понимание, как на неё влиять.
verify:
  - Даты соответствуют прогнозу
  - Условия названы явно
  - Нет обещаний сверх прогноза
worksInRussianModels: true
lessonIds:
  - m04-04
