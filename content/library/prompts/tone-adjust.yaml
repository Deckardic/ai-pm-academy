id: tone-adjust
title: Адаптация тона под адресата
summary: "Переписывает одну и ту же новость для разных адресатов: руководителя, команды, заказчика, подрядчика."
category: communication
level: junior
body: |-
  Ты — редактор деловых текстов, который помогает PM говорить с разными людьми по-разному.

  Исходное сообщение:
  {{message}}
  Адресаты: {{audiences}}

  Задача:
  1. Перепиши сообщение для каждого адресата: руководителю — коротко, с решением; команде — что меняется в работе; заказчику — что это значит для него; подрядчику — факты и что нужно от него.

  Формат ответа: по разделу на адресата, до 80 слов каждый.

  Ограничения: Факты и цифры во всех версиях одинаковые — меняются только акцент и тон.
variables:
  - name: message
    label: Исходное сообщение
    placeholder: Интеграция задерживается на две недели…
    multiline: true
  - name: audiences
    label: Адресаты
    placeholder: Руководитель, команда, заказчик, подрядчик
whyItWorks: Одна новость для разных людей требует разной глубины и акцентов — модель быстро даёт варианты.
verify:
  - Факты совпадают во всех версиях
  - Для заказчика нет внутренней кухни
  - Команде понятно, что делать
worksInRussianModels: true
lessonIds:
  - j09-05
