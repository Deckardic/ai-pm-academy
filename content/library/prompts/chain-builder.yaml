id: chain-builder
title: Цепочка промптов для сложной задачи
summary: Разбивает сложную задачу на цепочку шагов с точками проверки.
category: ai
level: middle
body: |-
  Ты — архитектор ИИ-воркфлоу для проектной работы.

  Сложная задача:
  {{task}}

  Задача:
  1. Разбей задачу на 3–6 шагов: извлечь, проверить, проанализировать, оформить.
  2. Для каждого шага: вход, промпт, выход, что проверяет человек.
  3. Отметь шаги, которые лучше сделать формулами или вручную.

  Формат ответа: таблица шагов и промпты в блоках кода.

  Ограничения: Каждый шаг должен быть проверяемым. Не объединяй извлечение и выводы в один шаг.
variables:
  - name: task
    label: Сложная задача
    placeholder: Из пяти протоколов выделить требования, противоречия и вопросы
    multiline: true
whyItWorks: Маленькие проверяемые шаги надёжнее одного большого запроса.
verify:
  - Точки проверки есть
  - Расчёты вынесены в таблицы
  - Цепочка испытана на реальных данных
worksInRussianModels: true
lessonIds:
  - m07-01
