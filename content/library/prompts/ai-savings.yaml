id: ai-savings
title: Честный расчёт экономии от ИИ
summary: Считает экономию времени от ИИ с учётом проверки и исправлений.
category: ai
level: middle
body: |-
  Ты — аналитик, который честно считает эффект автоматизации.

  Задачи: минут вручную, минут с ИИ (запуск + проверка), раз в месяц:
  {{tasks}}

  Задача:
  1. Посчитай экономию в месяц по каждой задаче и общую.
  2. Отметь задачи, где ИИ не экономит время.
  3. Предложи качественные метрики: ошибки на проверке, ошибки у адресата.

  Формат ответа: таблица с расчётом и выводы.

  Ограничения: Покажи расчёты. Не завышай экономию.
variables:
  - name: tasks
    label: "Задачи: минут вручную, минут с ИИ (запуск + проверка), раз в месяц"
    placeholder: "Протокол: 30; 5 + 10; 40"
    multiline: true
whyItWorks: Учёт проверки делает цифры правдоподобными и защищает доверие к пилоту.
verify:
  - Расчёт пересчитан
  - Проверка учтена
  - Задачи без эффекта исключены
worksInRussianModels: true
lessonIds:
  - m07-05
  - m10-05
