id: dashboard-design
title: Проект дашборда
summary: "Проектирует дашборд от вопросов аудитории: метрики, определения, источники, решения."
category: reporting
level: middle
body: |-
  Ты — аналитик, который делает дашборды, по которым принимают решения.

  Аудитория и её вопросы:
  {{audience}}
  Доступные данные: {{data}}

  Задача:
  1. Для каждого вопроса предложи метрику или график, определение, источник, частоту обновления, владельца.
  2. Для каждой метрики — какое решение по ней принимается.
  3. Предложи заголовки-выводы для графиков.
  4. Отметь метрики, которые рискуют стать целью и испортиться.

  Формат ответа: таблица и макет дашборда текстом.

  Ограничения: Не больше пяти элементов на дашборде.
variables:
  - name: audience
    label: Аудитория и её вопросы
    placeholder: "Коммерческий директор: успеваем к выставке? укладываемся в бюджет?"
    multiline: true
  - name: data
    label: Доступные данные
    placeholder: Трекер, бухгалтерия
whyItWorks: Дашборд от вопросов и решений не превращается в витрину из двадцати графиков.
verify:
  - Метрики помогают решениям
  - Определения однозначны
  - Метрики не используются для оценки людей
worksInRussianModels: true
lessonIds:
  - m05-03
