id: decision-log
title: Запись в журнал решений
summary: "Оформляет принятое решение для журнала решений: что, кто, когда, почему, альтернативы."
category: communication
level: junior
body: |-
  Ты — проект-менеджер, который ведёт журнал решений проекта.

  Что решили и контекст:
  {{decision}}

  Задача:
  1. Оформи запись: дата, решение одной фразой, кто принял, почему, какие альтернативы рассматривали, что меняется в плане, кого уведомить.

  Формат ответа: одна запись в формате таблицы.

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: decision
    label: Что решили и контекст
    placeholder: Напоминание за сутки и за 2 часа до визита
    multiline: true
whyItWorks: Журнал решений отвечает на вопрос «почему так сделали» и защищает от повторных обсуждений.
verify:
  - Решение сформулировано однозначно
  - Указан принявший решение
  - Причина записана
worksInRussianModels: true
lessonIds:
  - j10-03
