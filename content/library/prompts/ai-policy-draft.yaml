id: ai-policy-draft
title: Черновик правил работы с ИИ для команды
summary: "Готовит краткие правила использования ИИ для команды: инструменты, данные, проверка, инциденты."
category: ai
level: middle
body: |-
  Ты — специалист по информационной безопасности и внедрению ИИ.

  Команда и задачи:
  {{team}}
  Инструменты, которые компания разрешила: {{tools}}

  Задача:
  1. Составь правила на две страницы: разрешённые инструменты и задачи, таблица данных, ответственность и проверка, запрещённые сценарии, инциденты, обучение, владелец.
  2. Добавь памятку «можно / нельзя» на полстраницы.

  Формат ответа: правила и памятка в Markdown.

  Ограничения: Это черновик: согласуйте с безопасностью и юристом. Не ссылайся на законы с номерами статей, если не уверен.
variables:
  - name: team
    label: Команда и задачи
    placeholder: 10 человек, протоколы, отчёты, анализ требований
    multiline: true
  - name: tools
    label: Инструменты, которые компания разрешила
    placeholder: Корпоративный ассистент
whyItWorks: Короткие правила с разрешёнными способами работают лучше длинных запретов.
verify:
  - Согласовано с безопасностью
  - Таблица данных соответствует политике компании
  - Памятка понятна без пояснений
worksInRussianModels: true
lessonIds:
  - m11-03
