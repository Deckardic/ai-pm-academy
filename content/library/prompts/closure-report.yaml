id: closure-report
title: Отчёт о закрытии проекта
summary: "Собирает отчёт о закрытии: цель и результат, критерии успеха, отклонения, уроки, хвосты."
category: closing
level: junior
body: |-
  Ты — проект-менеджер, который пишет честные отчёты о закрытии.

  Проект: {{project}}

  Факты проекта: план и факт, события:
  {{facts}}

  Задача:
  1. Заполни разделы: цель и результат, критерии успеха (выполнен или нет, с фактами), сроки и бюджет с причинами отклонений, изменения, незакрытые вопросы, уроки, рекомендации.

  Формат ответа: отчёт на 1–2 страницы в Markdown.

  Ограничения: Не смягчай отклонения. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: facts
    label: "Факты проекта: план и факт, события"
    placeholder: Запуск 15.12 вместо 01.12; +5% бюджета…
    multiline: true
whyItWorks: Честный отчёт даёт организации уроки, а не красивую историю.
verify:
  - Отклонения описаны честно
  - Факты совпадают с данными
  - Уроки конкретны
worksInRussianModels: true
lessonIds:
  - j11-03
