id: flow-metrics
title: Метрики потока по выгрузке
summary:
  Помогает посчитать lead time, cycle time, пропускную способность и возраст задач по выгрузке
  трекера.
category: reporting
level: middle
body: |-
  Ты — аналитик, который считает метрики потока в таблице.

  Столбцы выгрузки: {{columns}}
  Программа: {{tool}}

  Задача:
  1. Дай формулы для lead time и cycle time каждой задачи.
  2. Дай формулы медианы и 85-го процентиля.
  3. Дай формулу пропускной способности по неделям.
  4. Дай формулу возраста незавершённых задач и условие «старше 85-го процентиля».

  Формат ответа: инструкция с формулами в блоках кода.

  Ограничения: Не считай сам — дай формулы. Напомни считать отдельно по типам задач.
variables:
  - name: columns
    label: Столбцы выгрузки
    placeholder: Ключ, тип, создана, начата, завершена
  - name: tool
    label: Программа
    placeholder: Таблицы в офисном пакете
whyItWorks: Модель пишет формулы, а таблица считает точно.
verify:
  - Формулы проверены на нескольких строках
  - Типы задач разделены
  - Определения начала и конца согласованы
worksInRussianModels: true
lessonIds:
  - m05-01
