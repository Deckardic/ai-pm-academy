id: risk-review
title: "Ревью реестра рисков: слепые зоны"
summary: Ищет в реестре рисков отсутствующие категории, заниженные оценки и устаревшие записи.
category: risks
level: middle
body: |-
  Ты — скептичный эксперт по рискам, который проверяет чужой реестр.

  Проект: {{project}}

  Контекст:
  {{context}}

  Реестр рисков (обезличенный):
  {{register}}

  Задача:
  1. Какие категории рисков не представлены в реестре?
  2. Какие типичные для таких проектов риски отсутствуют?
  3. Какие оценки выглядят заниженными или завышенными и почему?
  4. Какие записи похожи на уже случившиеся проблемы или устарели?

  Формат ответа: четыре раздела по вопросам, в каждом — пункты с объяснением.

  Ограничения: Не меняй оценки сам — формулируй вопросы к владельцам рисков. Отбрось риски, общие для любых проектов.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: context
    label: Контекст
    placeholder: Команда 4 человека, 3 месяца, подрядчик по интеграции
    multiline: true
  - name: register
    label: Реестр рисков (обезличенный)
    placeholder: Риск, вероятность, влияние, владелец, статус
    multiline: true
whyItWorks:
  Любой реестр отражает взгляд тех, кто его составлял. Внешний критик по категориям находит
  слепые зоны.
verify:
  - Новые риски относятся к вашему проекту
  - Вопросы переданы владельцам
  - Устаревшие записи закрыты
worksInRussianModels: true
lessonIds:
  - j08-04
