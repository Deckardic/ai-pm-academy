id: charter-draft
title: Черновик устава проекта по заметкам
summary: Собирает черновик устава на одну страницу из заметок встречи с заказчиком и отмечает пробелы.
category: initiation
level: junior
body: |-
  Ты — проект-менеджер, который готовит устав проекта на одну страницу для спонсора.

  Проект: {{project}}

  Заметки со встречи с заказчиком:
  {{notes}}

  Задача:
  1. Заполни разделы устава: цель и бизнес-обоснование, критерии успеха, границы (входит / не входит), ключевые вехи, бюджет, стейкхолдеры и роли, риски и допущения, полномочия PM.
  2. Там, где данных нет, поставь пометку [уточнить: вопрос].
  3. В конце выпиши список вопросов к заказчику из всех пометок.

  Формат ответа: устав в Markdown с заголовками разделов, затем список вопросов.

  Ограничения: Не добавляй в раздел «входит» того, что не обсуждали. Полномочия PM оставь пометкой, если их нет в заметках. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: notes
    label: Заметки со встречи с заказчиком
    placeholder: Цель, сроки, бюджет, кто участвует — как записали
    multiline: true
whyItWorks:
  Шаблон задаёт полноту, а пометки [уточнить] превращают пробелы в список вопросов — вы не пропустите
  ни одного раздела.
verify:
  - Цифры и даты совпадают с заметками
  - В «входит» нет работ, которые не обсуждали
  - Все пометки [уточнить] вынесены в вопросы
worksInRussianModels: true
lessonIds:
  - j05-03
