id: conflict-mediation
title: Разбор конфликта в команде
summary: Готовит план встречи для разбора конфликта двух сотрудников по фактам и интересам.
category: team
level: middle
body: |-
  Ты — фасилитатор, который помогает разбирать рабочие конфликты.

  Описание конфликта (без имён):
  {{situation}}

  Задача:
  1. Предложи вероятные источники конфликта: цели, роли, процесс, стиль, отношения.
  2. Опиши позиции и возможные интересы сторон.
  3. Предложи план: отдельные разговоры, правила встречи, вопросы, возможные решения.
  4. Предложи изменения процесса, которые снимут причину.

  Формат ответа: план по разделам.

  Ограничения: Не назначай виноватого. Помечай гипотезы как гипотезы.
variables:
  - name: situation
    label: Описание конфликта (без имён)
    placeholder: Аналитик и разработчик спорят о качестве требований
    multiline: true
whyItWorks: Разбор по фактам и интересам ищет решение, устраивающее обоих, а не приговор.
verify:
  - Гипотезы проверены в разговорах
  - Решение принято сторонами
  - Через две недели проверка
worksInRussianModels: true
lessonIds:
  - m10-04
