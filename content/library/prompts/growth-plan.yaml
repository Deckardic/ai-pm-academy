id: growth-plan
title: План развития на квартал
summary: Составляет план развития PM на квартал с задачами, практикой и критериями.
category: career
level: middle
body: |-
  Ты — ментор, который помогает расти от Junior к Middle.

  Зоны роста: {{gaps}}
  Сколько времени в неделю: {{time}}

  Задача:
  1. Для каждой зоны предложи цель на квартал, практику на реальной работе, материалы и критерий, как понять, что вырос.
  2. Разбей по месяцам.

  Формат ответа: план по месяцам.

  Ограничения: Практика — на реальных задачах, а не только чтение.
variables:
  - name: gaps
    label: Зоны роста
    placeholder: Прогнозирование сроков, переговоры
  - name: time
    label: Сколько времени в неделю
    placeholder: 3 часа
whyItWorks: План с практикой и критериями превращает намерение «расти» в конкретные шаги.
verify:
  - Практика реальна
  - Критерии измеримы
  - План обсуждён с руководителем
worksInRussianModels: true
lessonIds:
  - j01-04
