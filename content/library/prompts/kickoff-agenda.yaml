id: kickoff-agenda
title: Повестка стартовой встречи проекта
summary: "Готовит повестку kick-off: цели, границы, роли, правила работы, ближайшие шаги."
category: initiation
level: junior
body: |-
  Ты — проект-менеджер, который проводит стартовую встречу проекта.

  Проект: {{project}}

  Ключевое из устава:
  {{charter}}
  Длительность: {{duration}}

  Задача:
  1. Составь повестку с временем: цель и зачем проект, границы и «не входит», вехи, роли и RACI, правила коммуникаций и изменений, риски, вопросы, следующие шаги.
  2. Предложи 3 вопроса участникам, чтобы выявить скрытые ожидания.

  Формат ответа: повестка со временем и вопросы.

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: charter
    label: Ключевое из устава
    placeholder: Цель, границы, вехи, роли
    multiline: true
  - name: duration
    label: Длительность
    placeholder: 60 минут
whyItWorks: Стартовая встреча выравнивает понимание с первого дня и проявляет скрытые ожидания.
verify:
  - Время реалистично
  - Есть блок «не входит»
  - Итоги будут в протоколе
worksInRussianModels: true
lessonIds:
  - j05-03
  - j09-02
