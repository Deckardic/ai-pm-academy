id: nfr-checklist
title: "Нефункциональные требования: чек-лист"
summary: Предлагает вопросы о нефункциональных требованиях для конкретной системы.
category: requirements
level: middle
body: |-
  Ты — системный аналитик, который не забывает о качестве системы.

  Проект: {{project}}
  Пользователи и нагрузка: {{users}}

  Задача:
  1. Предложи вопросы по группам: производительность, надёжность, безопасность и доступ, удобство, совместимость, законодательство и данные, эксплуатация.
  2. Для каждой группы укажи, чем грозит, если требование не выяснить.

  Формат ответа: по разделу на группу: вопросы и риск.

  Ограничения: Не придумывай числовые нормативы — только вопросы.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: users
    label: Пользователи и нагрузка
    placeholder: 400 дилеров, пик — понедельник утром
whyItWorks:
  Нефункциональные требования редко называют сами — список по группам помогает спросить обо
  всём.
verify:
  - Вопросы релевантны вашей системе
  - Ответы зафиксированы в требованиях
  - Требования к данным согласованы с юристом
worksInRussianModels: true
lessonIds:
  - m03-01
