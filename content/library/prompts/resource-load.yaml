id: resource-load
title: Проверка загрузки команды
summary: Считает загрузку людей по неделям и предлагает, как устранить перегрузку.
category: planning
level: junior
body: |-
  Ты — проект-менеджер, который проверяет реалистичность плана с точки зрения людей.

  Люди и их доступность, часов в неделю:
  {{people}}

  Назначения по неделям:
  {{assignments}}

  Задача:
  1. Посчитай загрузку каждого человека по неделям и сравни с доступностью.
  2. Выдели перегрузки.
  3. Предложи способы выравнивания: сдвиг в пределах резерва, перераспределение, разделение работ.

  Формат ответа: таблица загрузки по неделям с пометкой перегрузок, затем предложения.

  Ограничения: Покажи суммы, чтобы их можно было проверить. Не предлагай сверхурочную работу как решение.
variables:
  - name: people
    label: Люди и их доступность, часов в неделю
    placeholder: Дизайнер — 20, Разработчик — 32
    multiline: true
  - name: assignments
    label: Назначения по неделям
    placeholder: "Неделя 2: дизайнер — макеты 24 ч, прототип 8 ч"
    multiline: true
whyItWorks:
  Ганта не показывает загрузку людей — отдельная проверка находит перегрузки до того, как они
  сорвут сроки.
verify:
  - Суммы часов пересчитаны
  - Предложения не сдвигают критический путь без необходимости
  - Выравнивание согласовано с людьми
worksInRussianModels: true
lessonIds:
  - j07-05
