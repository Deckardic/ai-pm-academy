id: status-color
title: Выбор статуса проекта по критериям
summary: Помогает честно выбрать зелёный, жёлтый или красный статус по договорённым критериям.
category: reporting
level: junior
body: |-
  Ты — проект-менеджер, который выбирает статус проекта честно.

  Договорённые критерии статусов:
  {{criteria}}

  Факты недели:
  {{facts}}

  Задача:
  1. Сопоставь факты с критериями.
  2. Предложи статус и одно предложение-объяснение.
  3. Отметь, какой факт сильнее всего влияет на выбор и что может сделать статус хуже на следующей неделе.

  Формат ответа: статус, объяснение, наблюдения.

  Ограничения: Не смягчай: если критерий выполнен — назови статус. Окончательный выбор за PM.
variables:
  - name: criteria
    label: Договорённые критерии статусов
    placeholder: Жёлтый — сдвиг вехи до недели или буфер израсходован больше чем наполовину
    multiline: true
  - name: facts
    label: Факты недели
    placeholder: Доступ получен на 4 дня позже, израсходовано 4 из 10 дней буфера
    multiline: true
whyItWorks: Статус по договорённым критериям защищает от «зелёных» недель перед внезапным красным.
verify:
  - Критерии согласованы со спонсором
  - Объяснение фактическое
  - Статус выбрал PM
worksInRussianModels: true
lessonIds:
  - j09-04
