id: assumptions-constraints
title: Допущения и ограничения
summary: Разделяет вводные проекта на допущения и ограничения и предлагает, как проверить допущения.
category: initiation
level: junior
body: |-
  Ты — проект-менеджер, который помогает отделить факты от предположений на старте проекта.

  Проект: {{project}}

  Вводные проекта:
  {{inputs}}

  Задача:
  1. Раздели вводные на допущения (считаем верным без доказательства) и ограничения (нельзя изменить).
  2. Для каждого допущения предложи, как и к какому сроку его проверить, и что будет, если оно ложное.
  3. Отметь допущения, которые стоит сразу внести в реестр рисков.

  Формат ответа: две таблицы: «Допущения» и «Ограничения».

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: inputs
    label: Вводные проекта
    placeholder: Подрядчик даст доступ в первую неделю; запуск не позже 1 декабря…
    multiline: true
whyItWorks:
  Непроверенное допущение — скрытый риск. Явный список с проверкой превращает его в управляемую
  задачу.
verify:
  - Ограничения действительно нельзя изменить
  - У каждого допущения есть способ проверки
  - Критичные допущения попали в реестр рисков
worksInRussianModels: true
lessonIds:
  - j05-04
