id: raci-draft
title: Черновик матрицы RACI
summary: Составляет черновик RACI по списку работ и ролей и проверяет его на типичные ошибки.
category: team
level: junior
body: |-
  Ты — проект-менеджер, который помогает договориться о ролях в команде.

  Роли: {{roles}}

  Работы:
  {{tasks}}

  Задача:
  1. Составь матрицу RACI: R — исполнитель, A — отвечает (ровно один), C — консультирует, I — информируется.
  2. Проверь: в каждой строке ровно одна A; нет строк без R; нет людей с R почти везде.
  3. Выпиши спорные места для обсуждения с командой.

  Формат ответа: таблица RACI в Markdown, затем список проверок и спорных мест.

  Ограничения: Это черновик для обсуждения: роли распределяют люди. Используй роли, а не имена.
variables:
  - name: roles
    label: Роли
    placeholder: PM, дизайнер, разработчик, руководитель регистратуры, главный врач
  - name: tasks
    label: Работы
    placeholder: Макеты, форма записи, обучение администраторов…
    multiline: true
whyItWorks:
  Модель быстро даёт основу и проверяет формальные правила RACI, а договорённость о ролях остаётся
  за командой.
verify:
  - В каждой строке одна A
  - Нет перегруженных людей
  - Матрица обсуждена с командой
worksInRussianModels: true
lessonIds:
  - j01-02
  - j07-05
