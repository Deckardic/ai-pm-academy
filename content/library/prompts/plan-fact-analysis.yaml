id: plan-fact-analysis
title: Разбор план-факта
summary: "Разбирает отклонения план-факт по статьям: сдвиг во времени, перерасход или изменение объёма."
category: budget
level: middle
body: |-
  Ты — финансовый контролёр, который ищет причины отклонений.

  План-факт по статьям и месяцам:
  {{table}}

  События периода:
  {{events}}

  Задача:
  1. Для каждого отклонения предположи причину: сдвиг во времени, перерасход или экономия, изменение объёма.
  2. Учти обязательства, которые ещё не оплачены.
  3. Сделай вывод и вопросы к бухгалтерии и команде.

  Формат ответа: таблица отклонений с причинами, затем вывод.

  Ограничения: Покажи расчёты отклонений. Причины помечай как предположения, если их нет в данных.
variables:
  - name: table
    label: План-факт по статьям и месяцам
    placeholder: "Команда: план 1,6, факт 1,8…"
    multiline: true
  - name: events
    label: События периода
    placeholder: Подрядчик не сдал этап; закупка согласована дороже
    multiline: true
whyItWorks: Итоговая «экономия» часто прячет отставание — разбор по статьям это показывает.
verify:
  - Отклонения пересчитаны
  - Обязательства учтены
  - Причины подтверждены
worksInRussianModels: true
lessonIds:
  - m06-02
