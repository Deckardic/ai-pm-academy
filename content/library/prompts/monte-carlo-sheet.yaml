id: monte-carlo-sheet
title: Симуляция Монте-Карло в таблице
summary: Помогает собрать формулы симуляции Монте-Карло для прогноза даты по истории пропускной способности.
category: estimation
level: middle
body: |-
  Ты — аналитик, который помогает собрать вероятностный прогноз в обычной таблице.

  История: задач завершено по неделям: {{history}}
  Объём работы, задач: {{scope}}
  В какой программе таблица: {{tool}}

  Задача:
  1. Предложи структуру листа: где история, где симуляции, где итоги.
  2. Дай формулы: случайный выбор недели из истории, накопленная сумма, номер недели достижения объёма.
  3. Дай формулы для частот и значений 50, 85 и 95%.
  4. Опиши проверку на малых числах.

  Формат ответа: пошаговая инструкция с формулами в блоках кода.

  Ограничения: Не считай прогноз сам — дай формулы. Укажи, если функции могут называться по-разному в разных программах.
variables:
  - name: history
    label: "История: задач завершено по неделям"
    placeholder: 3, 5, 4, 6, 2, 5, 4, 3, 7, 4
  - name: scope
    label: Объём работы, задач
    placeholder: "40"
  - name: tool
    label: В какой программе таблица
    placeholder: Таблицы в офисном пакете
whyItWorks:
  "Модель пишет формулы, а считает таблица: так вы получаете точный расчёт вместо арифметики
  модели."
verify:
  - Проверка на малых числах проходит
  - Медиана близка к «объём ÷ среднее»
  - Результаты стабильны при пересчёте
worksInRussianModels: true
lessonIds:
  - m04-03
