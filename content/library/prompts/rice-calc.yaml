id: rice-calc
title: Приоритизация по RICE
summary: Считает RICE по оценкам команды, сортирует бэклог и находит несогласованные оценки.
category: requirements
level: middle
body: |-
  Ты — аналитик, который помогает приоритизировать бэклог прозрачно.

  Задачи с оценками: охват, влияние, уверенность, затраты:
  {{items}}

  Задача:
  1. Посчитай RICE = охват × влияние × уверенность ÷ затраты для каждой задачи, показывая расчёт.
  2. Отсортируй по убыванию.
  3. Отметь оценки, которые выглядят несогласованными (например, высокое влияние при низкой уверенности без объяснения).
  4. Задай вопросы к оценкам, которые сильнее всего влияют на порядок.

  Формат ответа: таблица с расчётом, затем вопросы.

  Ограничения: Не меняй оценки. Покажи арифметику для каждой строки.
variables:
  - name: items
    label: "Задачи с оценками: охват, влияние, уверенность, затраты"
    placeholder: Повтор заказа | 400 | 2 | 80% | 1
    multiline: true
whyItWorks:
  Модель берёт на себя расчёт и поиск странностей, а обсуждение оценок остаётся за людьми, которые
  знают бизнес.
verify:
  - Расчёт пересчитан выборочно
  - Вопросы к оценкам обсуждены
  - Порядок проверен здравым смыслом
worksInRussianModels: true
lessonIds:
  - m03-03
