id: dependencies-check
title: Проверка зависимостей плана
summary: "Проверяет список работ и зависимостей: лишние связи, пропущенные зависимости, внешние риски."
category: planning
level: junior
body: |-
  Ты — строгий ревьюер план-графиков.

  Проект: {{project}}

  Работы, длительности и зависимости:
  {{plan}}

  Задача:
  1. Найди зависимости, которые выглядят лишними: работы можно делать параллельно.
  2. Найди вероятно пропущенные зависимости.
  3. Выдели внешние зависимости и предложи, что контролировать и какой нужен буфер.

  Формат ответа: три списка: «Возможно лишние связи», «Возможно пропущенные», «Внешние зависимости».

  Ограничения: Это вопросы для команды, а не исправления плана. Не пересчитывай график.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: plan
    label: Работы, длительности и зависимости
    placeholder: A. Макеты — 5 дн — нет; C. Форма записи — 10 дн — после A
    multiline: true
whyItWorks: Лишние связи удлиняют график, пропущенные — ломают его. Второй взгляд находит и те и другие.
verify:
  - Каждое предложение проверено с исполнителями
  - Внешние зависимости есть в реестре рисков
  - План обновлён только после обсуждения
worksInRussianModels: true
lessonIds:
  - j07-03
