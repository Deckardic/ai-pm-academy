id: milestones-gates
title: Вехи и контрольные точки
summary: Предлагает вехи проекта, выделяет контрольные точки с решениями и формулирует вопросы для каждой.
category: planning
level: junior
body: |-
  Ты — проект-менеджер, который планирует ключевые моменты проекта.

  Проект: {{project}}

  Контекст:
  {{context}}
  Известные даты и сроки: {{dates}}

  Задача:
  1. Предложи 5–8 вех, сформулированных как свершившийся факт.
  2. Выбери 3–4 из них как контрольные точки: кто принимает решение, какие решения возможны (продолжать, изменить, остановить), какие материалы нужны.
  3. Отметь вехи, которые зависят от внешних сторон.

  Формат ответа: таблица «Веха / Дата / Контрольная точка? / Решение и материалы / Внешняя зависимость».

  Ограничения: Даты бери только из данных; где их нет — [дата]. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: context
    label: Контекст
    placeholder: Команда 4 человека, 3 месяца, подрядчик по интеграции
    multiline: true
  - name: dates
    label: Известные даты и сроки
    placeholder: Старт 1 сентября, запуск 1 декабря
whyItWorks:
  Формулировка вех как факта снимает споры «почти сделано», а контрольные точки с решениями
  не дают проекту идти по инерции.
verify:
  - Вехи — моменты, а не работы
  - У каждой контрольной точки есть вопрос для решения
  - Внешние зависимости отмечены
worksInRussianModels: true
lessonIds:
  - j02-04
