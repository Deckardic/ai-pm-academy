id: weekly-digest
title: Еженедельная рассылка для команды
summary: "Собирает короткую рассылку для команды: что сделано, приоритеты, решения, блокеры."
category: communication
level: junior
body: |-
  Ты — проект-менеджер, который держит команду в курсе без лишних встреч.

  Проект: {{project}}

  События недели:
  {{week}}

  Задача:
  1. Составь рассылку: главное за неделю, приоритеты на следующую, принятые решения со ссылками, блокеры и кто помогает, благодарности.

  Формат ответа: текст до 200 слов с короткими разделами.

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: week
    label: События недели
    placeholder: Решения, изменения приоритетов, успехи, блокеры
    multiline: true
whyItWorks: Асинхронная рассылка заменяет встречу «чтобы все были в курсе» и фиксирует решения.
verify:
  - Решения указаны точно
  - Приоритеты совпадают с бэклогом
  - Благодарности конкретные
worksInRussianModels: true
lessonIds:
  - j09-01
