id: meeting-minutes
title: Протокол встречи по заметкам
summary: Превращает сырые заметки со встречи в протокол с решениями, задачами и открытыми вопросами.
category: communication
level: junior
body: "Ты — опытный проект-менеджер. Составь протокол встречи по моим заметкам.


  Тема встречи: {{topic}}

  Участники (роли, без имён): {{participants}}


  Заметки:

  {{notes}}


  Формат протокола:

  1. Цель встречи — одно предложение.

  2. Принятые решения — нумерованный список.

  3. Задачи — таблица: задача, ответственный (роль), срок.

  4. Открытые вопросы — что осталось нерешённым и кто за это отвечает.


  Правила: используй только информацию из заметок. Если срок или ответственный не указаны — напиши «не
  определено», не придумывай."
variables:
  - name: topic
    label: Тема встречи
    placeholder: Планирование релиза 2.0
  - name: participants
    label: Участники
    placeholder: PM, техлид, дизайнер, представитель заказчика
  - name: notes
    label: Заметки
    placeholder: Вставьте заметки без имён и конфиденциальных данных
    multiline: true
whyItWorks:
  Промпт задаёт роль, чёткую структуру результата и главное ограничение — не выдумывать. Отдельный
  пункт про «не определено» защищает от галлюцинаций в сроках и ответственных.
verify:
  - Все решения действительно были приняты на встрече
  - У задач нет выдуманных сроков и ответственных
  - Открытые вопросы не потерялись
lessonIds:
  - j01-03
