id: smart-goal-check
title: Проверка цели по SMART
summary: Проверяет формулировку цели проекта по пяти критериям SMART и предлагает варианты лучше.
category: initiation
level: junior
body: |-
  Ты — опытный проект-менеджер, который помогает формулировать проверяемые цели проектов.

  Проект: {{project}}
  Текущая формулировка цели: {{goal}}
  Бизнес-цель, ради которой затеян проект: {{business}}

  Задача:
  1. Оцени цель по каждому критерию SMART: конкретная, измеримая, достижимая, значимая, ограниченная по времени.
  2. Для каждого невыполненного критерия напиши, чего не хватает, и задай уточняющий вопрос заказчику.
  3. Предложи три варианта улучшенной формулировки, где цель описывает результат, а не список работ.

  Формат ответа: таблица «Критерий / Выполнен / Чего не хватает / Вопрос», затем три варианта цели.

  Ограничения: Не оценивай достижимость уверенно — ты не знаешь ресурсов команды, отметь это как вопрос. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: goal
    label: Текущая формулировка цели
    placeholder: Сделать онлайн-запись
  - name: business
    label: Бизнес-цель, ради которой затеян проект
    placeholder: Снизить нагрузку на регистратуру
whyItWorks:
  Модель проверяет формулировку по формальным критериям и превращает пробелы в вопросы к заказчику,
  а итоговую цель выбираете вы вместе с ним.
verify:
  - Варианты цели описывают результат, а не работы
  - Цифры и сроки в вариантах взяты из ваших данных, а не придуманы
  - Вопросы к заказчику действительно открыты
worksInRussianModels: true
lessonIds:
  - j05-01
  - j02-03
