id: requirements-conflicts
title: Противоречия в требованиях разных отделов
summary: Сравнивает требования нескольких сторон, находит противоречия с цитатами и готовит вопросы.
category: requirements
level: middle
body: |-
  Ты — аналитик, который ищет противоречия до того, как они станут проблемой в разработке.

  Требования с указанием отдела и даты:
  {{sources}}

  Задача:
  1. Найди противоречащие друг другу требования. Для каждого приведи цитаты с обеих сторон.
  2. Найди неоднозначные формулировки («быстро», «удобно»).
  3. Учитывай, что более поздние решения важнее ранних.
  4. Сформулируй вопросы для встречи с отделами.

  Формат ответа: таблица противоречий, список неоднозначностей, вопросы.

  Ограничения: Не решай противоречия сам — только показывай их. Не добавляй требований, которых нет в источниках.
variables:
  - name: sources
    label: Требования с указанием отдела и даты
    placeholder: "Продажи, 12.09: показывать остатки дилерам…"
    multiline: true
whyItWorks: Цитаты с обеих сторон делают противоречие проверяемым, а решение остаётся за встречей с отделами.
verify:
  - Каждое противоречие подтверждено цитатами
  - Учтены даты решений
  - Вопросы вынесены на встречу
worksInRussianModels: true
lessonIds:
  - m03-05
