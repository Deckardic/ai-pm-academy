id: prompt-standard
title: Описание промпта для командной библиотеки
summary: Оформляет промпт по стандарту командной библиотеки.
category: ai
level: middle
body: |-
  Ты — редактор командной библиотеки промптов.

  Текст промпта:
  {{prompt}}
  Как им пользуются: {{usage}}

  Задача:
  1. Оформи описание: название и назначение, когда использовать и когда нет, текст с переменными, описание переменных, что проверить, правила по данным, владелец и версия (оставь пометки для заполнения).

  Формат ответа: карточка промпта в Markdown.

  Ограничения: Не выдумывай пример результата — оставь пометку.
variables:
  - name: prompt
    label: Текст промпта
    placeholder: …
    multiline: true
  - name: usage
    label: Как им пользуются
    placeholder: Для протоколов рабочих встреч
whyItWorks: Единый стандарт делает промпт понятным любому в команде.
verify:
  - Все поля заполнены
  - Пример результата реальный
  - Версия и владелец указаны
worksInRussianModels: true
lessonIds:
  - m07-05
