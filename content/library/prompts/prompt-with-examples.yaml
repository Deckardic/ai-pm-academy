id: prompt-with-examples
title: Промпт с примерами (few-shot)
summary: Собирает шаблон промпта с двумя-тремя примерами «вход — результат».
category: ai
level: middle
body: |-
  Ты — эксперт по промптингу, который учит модели на примерах.

  Задача: {{task}}

  Примеры: входные данные и одобренный результат (обезличенные):
  {{examples}}

  Задача:
  1. Проверь, что примеры разнообразны; если нет — скажи, какого не хватает.
  2. Собери шаблон: задача, примеры, указание брать из примеров только формат и тон, ограничение на факты, переменная для новых данных.

  Формат ответа: шаблон в блоке кода и комментарии.

  Ограничения: Не копируй факты из примеров в инструкции.
variables:
  - name: task
    label: Задача
    placeholder: Еженедельный статус-отчёт
  - name: examples
    label: "Примеры: входные данные и одобренный результат (обезличенные)"
    placeholder: …
    multiline: true
whyItWorks:
  Разнообразные пары «вход — результат» передают стиль точнее описаний и не дают модели копировать
  содержание.
verify:
  - Примеры обезличены
  - Есть указание про формат
  - Проверено на трёх разных неделях
worksInRussianModels: true
lessonIds:
  - m07-02
