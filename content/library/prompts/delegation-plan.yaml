id: delegation-plan
title: План делегирования
summary: Раскладывает задачи PM по уровням делегирования и готовит договорённости.
category: team
level: middle
body: |-
  Ты — коуч руководителей, который помогает делегировать без микроменеджмента.

  Мои регулярные задачи и решения:
  {{tasks}}

  Кто в команде и чего хочет:
  {{team}}

  Задача:
  1. Для каждой задачи оцени, можно ли делегировать и кому.
  2. Предложи уровень делегирования по шкале от «я решаю и сообщаю» до «решай сам».
  3. Для трёх задач составь договорённость: результат, срок, границы, точки проверки, сигналы.

  Формат ответа: таблица задач и три договорённости.

  Ограничения: Не делегируй ответственность перед спонсором и решения о людях.
variables:
  - name: tasks
    label: Мои регулярные задачи и решения
    placeholder: Статус-отчёт, созвоны с подрядчиком, проверка задач…
    multiline: true
  - name: team
    label: Кто в команде и чего хочет
    placeholder: Аналитик хочет расти в управление проектами
    multiline: true
whyItWorks: Явный уровень делегирования убирает главную проблему — неясные границы решения.
verify:
  - Границы проговорены с человеком
  - Нет делегирования без полномочий
  - Точки проверки согласованы
worksInRussianModels: true
lessonIds:
  - m10-02
