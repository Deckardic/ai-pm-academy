id: negotiation-prep
title: Подготовка к переговорам
summary: "Готовит план переговоров: интересы сторон, альтернативы, варианты взаимной выгоды, критерии."
category: stakeholders
level: middle
body: |-
  Ты — эксперт по переговорам, который помогает подготовиться к сложному разговору.

  Ситуация:
  {{situation}}
  Моя цель и минимум: {{my_goal}}

  Задача:
  1. Опиши позиции и возможные интересы каждой стороны.
  2. Оцени лучшую альтернативу соглашению для каждой стороны.
  3. Предложи 3–5 вариантов взаимной выгоды.
  4. Предложи объективные критерии для обсуждения.
  5. Предложи первые фразы и ответы на три вероятных возражения.

  Формат ответа: план по разделам.

  Ограничения: Интересы — гипотезы; помечай их так. Без манипулятивных приёмов.
variables:
  - name: situation
    label: Ситуация
    placeholder: Логистика против показа остатков дилерам, продажи — за
    multiline: true
  - name: my_goal
    label: Моя цель и минимум
    placeholder: Показать дилерам доступность товара; минимум — индикатор наличия
whyItWorks: Разделение позиций и интересов превращает спор в поиск решения.
verify:
  - Интересы проверены вопросами на встрече
  - Варианты реалистичны
  - Альтернатива продумана заранее
worksInRussianModels: true
lessonIds:
  - m09-03
