id: risk-brainstorm
title: Брейншторм рисков проекта
summary: Помогает составить черновой список рисков по категориям с оценкой вероятности и влияния.
category: risks
level: junior
body: "Ты — проект-менеджер с опытом в управлении рисками. Помоги составить черновой реестр рисков.


  Проект: {{project}}

  Описание и ограничения: {{context}}


  Сгенерируй 10–15 рисков по категориям: сроки, ресурсы, технологии, стейкхолдеры, внешние факторы.

  Для каждого риска: формулировка «Если …, то …», вероятность (низкая/средняя/высокая), влияние (низкое/среднее/высокое),
  первая мера реагирования.


  Формулируй риски конкретно для этого проекта, а не общими словами. Таблица."
variables:
  - name: project
    label: Проект
    placeholder: Переезд офиса
  - name: context
    label: Контекст
    placeholder: 120 сотрудников, переезд за выходные, новое здание ещё ремонтируется
    multiline: true
whyItWorks:
  Формат «Если …, то …» заставляет описывать причину и последствие, а категории гарантируют,
  что модель пройдётся по всем источникам рисков, а не только по очевидным.
verify:
  - Риски конкретны для вашего проекта, а не общие
  - Оценки вероятности и влияния обсуждены с командой
  - У ключевых рисков есть владелец
lessonIds: []
