id: gate-review
title: Материалы к воротам этапа
summary: "Собирает материалы для решения на воротах: результаты, проверенные гипотезы, прогноз и рекомендация."
category: process
level: middle
body: |-
  Ты — проект-менеджер, который готовит инвестиционное решение для руководства.

  Проект: {{project}}
  Цель этапа и её критерии: {{stage}}

  Результаты этапа и данные:
  {{results}}

  Прогноз следующего этапа:
  {{next}}

  Задача:
  1. Сформулируй, достигнута ли цель этапа, с фактами.
  2. Перечисли подтверждённые и неподтверждённые гипотезы.
  3. Опиши прогноз следующего этапа.
  4. Предложи рекомендацию: идти дальше, изменить или остановить — с обоснованием.

  Формат ответа: одностраничник с разделами.

  Ограничения: Рекомендацию пометь как черновик — её формулирует PM. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: stage
    label: Цель этапа и её критерии
    placeholder: "Пилот: 5 дилеров оформляют через портал большинство заказов"
  - name: results
    label: Результаты этапа и данные
    placeholder: 3 из 5 дилеров оформляют 70% заказов онлайн…
    multiline: true
  - name: next
    label: Прогноз следующего этапа
    placeholder: 12 недель, 6 человек, риски интеграции
    multiline: true
whyItWorks:
  Ворота — инвестиционное решение; структура отвечает на вопросы лиц, принимающих решение, а
  не пересказывает работу.
verify:
  - Факты совпадают с данными
  - Рекомендация — ваша
  - Остановка рассмотрена как вариант
worksInRussianModels: true
lessonIds:
  - m02-02
