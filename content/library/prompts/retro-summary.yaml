id: retro-summary
title: Сводка ретроспективы
summary: Группирует стикеры ретроспективы в темы и формулирует действия с ответственными.
category: team
level: middle
body: "Ты — фасилитатор, который помогает команде подвести итоги ретроспективы.


  Стикеры с ретро (как есть):

  {{stickers}}


  Задача:

  1. Сгруппируй стикеры в 3–6 тем. Название темы — суть проблемы или успеха, а не общее слово.

  2. Для каждой темы — сколько стикеров и короткая формулировка сути.

  3. Предложи по 1–2 действия для трёх самых частых проблемных тем: конкретное, выполнимое за спринт,
  с ролью ответственного.


  Не придумывай проблемы, которых нет в стикерах."
variables:
  - name: stickers
    label: Стикеры
    placeholder: Каждый стикер с новой строки, без имён
    multiline: true
whyItWorks:
  Модель хорошо группирует похожие формулировки, а требование «выполнимо за спринт» превращает
  обсуждение в конкретные действия.
verify:
  - Группировка отражает смысл, а не только слова
  - Действия выполнимы и у каждого есть ответственный
  - Ни одна проблема не придумана
lessonIds: []
