id: expectations-check
title: Сверка ожиданий стейкхолдера
summary: Находит расхождения между ожиданиями стейкхолдера и договорённостями проекта.
category: stakeholders
level: middle
body: |-
  Ты — проект-менеджер, который предотвращает разочарования на приёмке.

  Договорённости: цели и границы:
  {{agreements}}

  Что говорил и ожидает стейкхолдер:
  {{signals}}

  Задача:
  1. Найди расхождения между ожиданиями и договорённостями.
  2. Объясни, откуда могло взяться каждое ожидание.
  3. Предложи, как выровнять: что сказать, что показать, что зафиксировать.

  Формат ответа: таблица «Ожидание / Договорённость / Откуда / Как выровнять».

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: agreements
    label: "Договорённости: цели и границы"
    placeholder: "Входит: каталог, заказ, повтор; не входит: бонусы"
    multiline: true
  - name: signals
    label: Что говорил и ожидает стейкхолдер
    placeholder: «Портал станет единым окном», видел макет с вкладкой «Бонусы»
    multiline: true
whyItWorks: Явное сравнение ожиданий с договорённостями показывает будущие разочарования заранее.
verify:
  - Расхождения подтверждены фактами
  - Выравнивание запланировано до демонстрации
  - Договорённости зафиксированы письменно
worksInRussianModels: true
lessonIds:
  - m09-02
