id: scope-out
title: "Раздел «не входит»: неявные ожидания"
summary:
  Находит работы и функции, которые заказчик может считать само собой разумеющимися, чтобы явно
  записать их в «не входит» или «входит».
category: initiation
level: junior
body: |-
  Ты — опытный проект-менеджер, который помогает защитить проект от разрастания скоупа.

  Проект: {{project}}

  Описание содержания проекта:
  {{scope}}

  Задача:
  1. Перечисли 8–12 функций и работ, которые заказчик может неявно ожидать, хотя их нет в описании.
  2. Для каждой объясни, почему заказчик может этого ожидать.
  3. Предложи формулировку для раздела «не входит» или вопрос для обсуждения.

  Формат ответа: таблица «Неявное ожидание / Почему могут ожидать / Формулировка или вопрос».

  Ограничения: Это предложения для обсуждения, а не решения. Не оценивай стоимость работ.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: scope
    label: Описание содержания проекта
    placeholder: Запись к врачам 5 отделений, перенос и отмена, напоминания
    multiline: true
whyItWorks:
  Модель знает, из чего обычно состоят похожие проекты, и подсказывает то, что заказчик додумывает
  сам.
verify:
  - Каждый пункт относится к вашему проекту
  - Формулировки «не входит» не звучат как отказ
  - Спорные пункты вынесены на обсуждение с заказчиком
worksInRussianModels: true
lessonIds:
  - j05-04
