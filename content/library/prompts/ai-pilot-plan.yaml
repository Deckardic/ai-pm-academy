id: ai-pilot-plan
title: План пилота ИИ в команде
summary: "Составляет план месячного пилота ИИ: участники, задачи, правила, метрики, обмен опытом."
category: team
level: middle
body: |-
  Ты — руководитель изменений, который внедряет ИИ-инструменты без хаоса.

  Команда и её задачи:
  {{team}}
  Разрешённые инструменты: {{tools}}

  Задача:
  1. Предложи критерии отбора добровольцев.
  2. Выбери 3–5 задач с быстрым эффектом и низким риском.
  3. Сформулируй правила по данным и проверке.
  4. Предложи метрики до и после: время с учётом проверки, качество, ошибки.
  5. Опиши обмен опытом и критерии решения в конце пилота.

  Формат ответа: план по разделам.

  Ограничения: Не обещай конкретных процентов экономии.
variables:
  - name: team
    label: Команда и её задачи
    placeholder: 7 человек; много протоколов, отчётов, анализа требований
    multiline: true
  - name: tools
    label: Разрешённые инструменты
    placeholder: Корпоративный ассистент
whyItWorks: Пилот с правилами и честными метриками даёт реальные данные и снижает сопротивление.
verify:
  - Правила по данным согласованы с безопасностью
  - Метрики учитывают проверку
  - Есть критерии остановки
worksInRussianModels: true
lessonIds:
  - m10-05
