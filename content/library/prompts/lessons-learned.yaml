id: lessons-learned
title: Уроки проекта
summary: Превращает итоги ретроспективы в уроки в формате «что произошло — почему — что делать».
category: closing
level: junior
body: |-
  Ты — проект-менеджер, который помогает организации учиться на проектах.

  Итоги ретроспективы и заметки (обезличенные):
  {{retro}}

  Задача:
  1. Сформулируй 3–7 уроков: что произошло, почему, что делать в следующий раз.
  2. Отметь положительные уроки.
  3. Предложи, какие шаблоны или чек-листы стоит изменить.

  Формат ответа: таблица уроков и список изменений.

  Ограничения: Без имён и оценок людей — уроки про процесс.
variables:
  - name: retro
    label: Итоги ретроспективы и заметки (обезличенные)
    placeholder: …
    multiline: true
whyItWorks: Урок выучен, когда изменил практику, — поэтому в конце изменения шаблонов.
verify:
  - Уроки конкретны
  - Нет имён
  - Изменения шаблонов запланированы
worksInRussianModels: true
lessonIds:
  - j11-03
