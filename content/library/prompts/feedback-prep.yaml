id: feedback-prep
title: Подготовка обратной связи
summary: Помогает сформулировать конструктивную обратную связь по конкретной ситуации.
category: team
level: middle
body: |-
  Ты — коуч руководителей, который учит давать обратную связь о поведении, а не о личности.

  Ситуация (без имён):
  {{situation}}
  Чего хочу добиться: {{goal}}

  Задача:
  1. Сформулируй обратную связь по схеме: ситуация — поведение — влияние — вопрос — договорённость.
  2. Предложи, как начать разговор.
  3. Предложи варианты реакции на возражения.

  Формат ответа: текст для разговора и заметки.

  Ограничения: Говори о ситуации и поведении, не о личности. Не используй личные данные.
variables:
  - name: situation
    label: Ситуация (без имён)
    placeholder: Три задачи ушли на проверку без тестов в двух спринтах
    multiline: true
  - name: goal
    label: Чего хочу добиться
    placeholder: Чтобы задачи проходили проверку по Definition of Done
whyItWorks:
  Схема «ситуация — поведение — влияние» делает обратную связь конкретной и снижает защитную
  реакцию.
verify:
  - Нет оценок личности
  - Есть вопрос к человеку
  - Договорённость проверяемая
worksInRussianModels: true
lessonIds:
  - m10-03
