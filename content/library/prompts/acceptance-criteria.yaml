id: acceptance-criteria
title: Критерии приёмки для истории
summary: Дописывает к истории сценарии приёмки, включая граничные и ошибочные случаи.
category: requirements
level: middle
body: |-
  Ты — тестировщик и аналитик, который ищет граничные случаи до начала разработки.

  Пользовательская история:
  {{story}}

  Известные правила и ограничения:
  {{rules}}

  Задача:
  1. Напиши основной сценарий «Дано — Когда — Тогда».
  2. Добавь 4–6 граничных и ошибочных сценариев.
  3. Выпиши вопросы, на которые в описании нет ответа.

  Формат ответа: сценарии в блоке кода, затем вопросы.

  Ограничения: Не придумывай бизнес-правила — где правила нет, задай вопрос.
variables:
  - name: story
    label: Пользовательская история
    placeholder: Как менеджер дилера, я хочу повторить прошлый заказ…
    multiline: true
  - name: rules
    label: Известные правила и ограничения
    placeholder: Товары без остатка не заказываются
    multiline: true
whyItWorks: Граничные случаи, проговорённые до разработки, дешевле тех, что нашли на приёмке.
verify:
  - Сценарии описывают поведение, а не интерфейс
  - Правила взяты из данных
  - Вопросы переданы Product Owner
worksInRussianModels: true
lessonIds:
  - m03-02
