id: sprint-goal
title: Цель спринта
summary: Помогает сформулировать цель спринта по списку кандидатов в спринт.
category: process
level: middle
body: |-
  Ты — Scrum-мастер, который помогает команде планировать вокруг цели.

  Задачи-кандидаты в спринт:
  {{candidates}}
  Приоритеты продукта: {{context}}

  Задача:
  1. Предложи 2–3 варианта цели спринта: одна фраза о ценности для пользователя.
  2. Для каждой цели укажи, какие задачи ей служат, а какие нет.
  3. Отметь задачи, которые не связаны ни с одной целью.

  Формат ответа: варианты целей с разбором задач.

  Ограничения: Цель описывает ценность, а не список задач. Окончательно цель выбирает команда с Product Owner.
variables:
  - name: candidates
    label: Задачи-кандидаты в спринт
    placeholder: PORT-112 Повтор заказа; PORT-118 Статусы…
    multiline: true
  - name: context
    label: Приоритеты продукта
    placeholder: Главная жалоба дилеров — долгие повторные заказы
whyItWorks: "Цель спринта даёт фокус и гибкость: задачи можно менять, сохраняя ценность."
verify:
  - Цель понятна пользователю
  - Задачи ей действительно служат
  - Цель выбрана командой
worksInRussianModels: true
lessonIds:
  - m01-02
