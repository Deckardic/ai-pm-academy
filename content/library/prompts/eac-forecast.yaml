id: eac-forecast
title: Прогноз стоимости завершения
summary: Считает EAC несколькими способами, ETC и VAC и формулирует допущения.
category: budget
level: middle
body: |-
  Ты — финансовый аналитик проектов.

  BAC, EV, AC, CPI, SPI:
  {{data}}

  Что известно о причинах отклонений:
  {{context}}

  Задача:
  1. Посчитай EAC тремя способами: BAC ÷ CPI; AC + (BAC − EV); AC + (BAC − EV) ÷ (CPI × SPI).
  2. Посчитай ETC и VAC.
  3. Объясни, какой способ уместнее и почему, с учётом контекста.

  Формат ответа: таблица расчётов и вывод с допущениями.

  Ограничения: Показывай расчёты. Выбор формулы — допущение, назови его.
variables:
  - name: data
    label: BAC, EV, AC, CPI, SPI
    placeholder: BAC 12; EV 6; AC 8
    multiline: true
  - name: context
    label: Что известно о причинах отклонений
    placeholder: "Перерасход системный: интеграция сложнее"
    multiline: true
whyItWorks: Несколько формул дают диапазон и явные допущения вместо одной «точной» цифры.
verify:
  - Расчёты верны
  - Допущения названы
  - Диапазон передан спонсору
worksInRussianModels: true
lessonIds:
  - m06-04
