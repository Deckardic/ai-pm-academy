id: success-criteria
title: Критерии успеха проекта
summary: Помогает сформулировать измеримые критерии успеха проекта и продукта и назначить, кто их проверяет.
category: initiation
level: junior
body: |-
  Ты — проект-менеджер, который помогает договориться о критериях успеха до начала работ.

  Проект: {{project}}
  Цель проекта: {{goal}}

  Какие данные есть сейчас (база для сравнения):
  {{data}}

  Задача:
  1. Предложи 2–3 критерия успеха проекта (результат, срок, бюджет, качество).
  2. Предложи 2–3 критерия успеха продукта — пользы после запуска.
  3. Для каждого укажи меру, срок проверки, кто проверяет и какие данные для этого нужно собирать.

  Формат ответа: две таблицы: «Успех проекта» и «Успех продукта».

  Ограничения: Не придумывай целевые числа — оставь «[целевое значение согласовать]», если их нет в данных. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: goal
    label: Цель проекта
    placeholder: К 1 декабря пациенты записываются к врачу на сайте
  - name: data
    label: Какие данные есть сейчас (база для сравнения)
    placeholder: Доля записей по телефону — около 90%
    multiline: true
whyItWorks:
  Разделение успеха проекта и продукта не даёт закончить проект «в срок, но зря», а владелец
  измерения делает критерий реальным.
verify:
  - Каждый критерий однозначно проверяем
  - Целевые значения не взяты из воздуха
  - У каждого критерия есть владелец и срок проверки
worksInRussianModels: true
lessonIds:
  - j02-03
  - j05-03
