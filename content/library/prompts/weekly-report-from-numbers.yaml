id: weekly-report-from-numbers
title: Сводка по готовым цифрам
summary: Пишет еженедельную сводку по уже посчитанным метрикам, не меняя цифр.
category: reporting
level: middle
body: |-
  Ты — проект-менеджер, который пишет краткие и честные сводки. Цифры уже посчитаны, их нельзя менять.

  Посчитанные метрики недели:
  {{numbers}}

  Шаблон сводки:
  {{template}}

  Задача:
  1. Заполни шаблон, используя цифры дословно.
  2. Раздел «Статус» и «Нужно от вас» оставь с пометкой [PM].

  Формат ответа: заполненный шаблон.

  Ограничения: Не округляй и не пересчитывай цифры. Не добавляй причин, которых нет в данных.
variables:
  - name: numbers
    label: Посчитанные метрики недели
    placeholder: Закрыто 14, медиана цикла 5 дней, 3 задачи старше 12 дней…
    multiline: true
  - name: template
    label: Шаблон сводки
    placeholder: Статус / Сделано / Метрики / Риски / Нужно от вас
    multiline: true
whyItWorks: Разделение «цифры — формулами, текст — моделью» убирает арифметические ошибки из отчётов.
verify:
  - Все цифры совпадают с таблицей
  - Статус выбрал PM
  - Нет выдуманных причин
worksInRussianModels: true
lessonIds:
  - m05-04
