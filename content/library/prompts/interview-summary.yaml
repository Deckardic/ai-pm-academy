id: interview-summary
title: Резюме интервью со стейкхолдером
summary: Делает короткое резюме интервью для подтверждения у собеседника.
category: stakeholders
level: junior
body: |-
  Ты — проект-менеджер, который закрепляет договорённости после интервью.

  Заметки интервью (обезличенные):
  {{notes}}
  Роль собеседника: {{role}}

  Задача:
  1. Составь резюме для отправки собеседнику: что для него главное, опасения, ограничения, кого ещё вовлечь, следующие шаги.
  2. Сформулируй в конце просьбу поправить, если что-то понято неверно.

  Формат ответа: письмо до 150 слов.

  Ограничения: Не приписывай собеседнику того, чего нет в заметках. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: notes
    label: Заметки интервью (обезличенные)
    placeholder: Что важно, опасения, ограничения, кого ещё вовлечь
    multiline: true
  - name: role
    label: Роль собеседника
    placeholder: Руководитель регистратуры
whyItWorks: Резюме после интервью подтверждает понимание и показывает уважение к времени человека.
verify:
  - Нет приписанных слов
  - Опасения переданы точно
  - Следующие шаги конкретны
worksInRussianModels: true
lessonIds:
  - j05-02
