id: risk-response
title: План реагирования на риск
summary: Предлагает стратегию, меры, триггер и план на случай срабатывания для главных рисков.
category: risks
level: junior
body: |-
  Ты — опытный проект-менеджер, который превращает риски в план действий.

  Проект: {{project}}

  Главные риски с оценками:
  {{risks}}

  Задача:
  1. Для каждого риска предложи стратегию: избежать, снизить, передать или принять — с обоснованием.
  2. Опиши меры заранее и их примерную цену (время, деньги).
  3. Предложи триггер — ранний сигнал, который наступает раньше самого события.
  4. Опиши план на случай срабатывания и кто его запускает.

  Формат ответа: по карточке на риск: стратегия, меры, триггер, план Б, владелец.

  Ограничения: Не называй стоимость в рублях, если её нет в данных, — используй «низкая / средняя / высокая». Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: risks
    label: Главные риски с оценками
    placeholder: Если подрядчик задержит доступ… — В4, Вл4
    multiline: true
whyItWorks:
  Хороший триггер даёт время отреагировать, а сравнение цены меры с ущербом отсекает лишнюю
  работу.
verify:
  - Триггеры наступают раньше события
  - Меры реалистичны для команды
  - Передача риска сочетается со снижением
worksInRussianModels: true
lessonIds:
  - j08-03
