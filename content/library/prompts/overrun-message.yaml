id: overrun-message
title: Сообщение о перерасходе
summary: Готовит сообщение спонсору о прогнозе перерасхода с причинами и вариантами.
category: budget
level: middle
body: |-
  Ты — проект-менеджер, который сообщает о финансовых рисках вовремя.

  Прогноз: {{forecast}}

  Причины:
  {{causes}}

  Варианты:
  {{options}}

  Задача:
  1. Напиши сообщение: факт и прогноз, причины, варианты с ценой, рекомендация, какое решение нужно и к какому сроку.

  Формат ответа: письмо до 180 слов.

  Ограничения: Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: forecast
    label: Прогноз
    placeholder: EAC 9,7–10,5 млн при бюджете 8 млн
  - name: causes
    label: Причины
    placeholder: …
    multiline: true
  - name: options
    label: Варианты
    placeholder: Сократить объём, использовать резерв, запросить бюджет
    multiline: true
whyItWorks: Ранний сигнал с вариантами оставляет спонсору выбор, пока он есть.
verify:
  - Цифры совпадают с расчётом
  - Причины конкретны
  - Запрос решения ясен
worksInRussianModels: true
lessonIds:
  - m06-02
  - m06-04
