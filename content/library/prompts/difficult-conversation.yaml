id: difficult-conversation
title: Подготовка к сложному разговору
summary: Готовит структуру сложного разговора с недовольным стейкхолдером.
category: stakeholders
level: middle
body: |-
  Ты — опытный руководитель, который помогает подготовиться к напряжённому разговору.

  Ситуация:
  {{situation}}

  Факты:
  {{facts}}

  Задача:
  1. Предложи общую цель, с которой начать.
  2. Предложи, как признать эмоции и свою часть ответственности.
  3. Отдели факты от интерпретаций.
  4. Предложи варианты и следующие шаги.
  5. Составь письмо с фиксацией договорённостей.

  Формат ответа: план разговора и черновик письма.

  Ограничения: Без оправданий и перекладывания вины. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: situation
    label: Ситуация
    placeholder: Коммерческий директор узнал о риске сдвига не от PM и недоволен
    multiline: true
  - name: facts
    label: Факты
    placeholder: Подрядчик предупредил в среду, сообщили в пятницу
    multiline: true
whyItWorks: Структура удерживает разговор на фактах и решениях, даже когда эмоции сильны.
verify:
  - Признание ошибки честное и короткое
  - Варианты реалистичны
  - Письмо отправлено в тот же день
worksInRussianModels: true
lessonIds:
  - m09-04
