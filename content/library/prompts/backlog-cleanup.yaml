id: backlog-cleanup
title: Чистка бэклога
summary: Находит в выгрузке бэклога дубли, задачи без понятной проблемы и кандидатов на удаление.
category: requirements
level: middle
body: |-
  Ты — аналитик, который помогает Product Owner держать бэклог в порядке.

  Выгрузка бэклога: ключ, заголовок, описание, дата создания:
  {{backlog}}

  Задача:
  1. Найди возможные дубли и сгруппируй похожие задачи.
  2. Отметь задачи без понятной проблемы или критериев приёмки.
  3. Отметь задачи старше полугода как кандидатов на архив.
  4. Для 2–3 крупных задач предложи вертикальную нарезку.

  Формат ответа: четыре раздела со ссылками на ключи задач.

  Ограничения: Решения об удалении принимает Product Owner — формулируй предложения. Не включай в ответ данные клиентов.
variables:
  - name: backlog
    label: "Выгрузка бэклога: ключ, заголовок, описание, дата создания"
    placeholder: PORT-12 | Улучшить фильтры | … | 2025-03-01
    multiline: true
whyItWorks:
  Механическую часть работы с бэклогом модель делает быстро, а решения остаются за владельцем
  продукта.
verify:
  - Дубли действительно одинаковы по сути
  - Нарезка вертикальная
  - Удаление согласовано с Product Owner
worksInRussianModels: true
lessonIds:
  - m01-03
