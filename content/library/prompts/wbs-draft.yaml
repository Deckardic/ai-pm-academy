id: wbs-draft
title: Черновик WBS из описания проекта
summary: Строит черновик иерархической структуры работ из результатов, с учётом правила 100%.
category: planning
level: junior
body: |-
  Ты — проект-менеджер, который строит иерархическую структуру работ (WBS) из результатов, а не действий.

  Проект: {{project}}

  Границы проекта: что входит:
  {{scope}}
  Что не входит: {{out}}

  Задача:
  1. Построй WBS на три уровня: результат проекта, крупные результаты, пакеты работ.
  2. Формулируй элементы как результаты (существительные).
  3. Обязательно включи управление проектом, тестирование, обучение, документацию, согласования, запуск.
  4. Отметь пакеты, которые, вероятно, крупнее 80 часов.

  Формат ответа: многоуровневый список с номерами 1, 1.1, 1.1.1.

  Ограничения: Не включай то, что в «не входит». Не оценивай трудозатраты.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: scope
    label: "Границы проекта: что входит"
    placeholder: Запись к врачам, напоминания, обучение администраторов
    multiline: true
  - name: out
    label: Что не входит
    placeholder: Онлайн-оплата, мобильное приложение
whyItWorks:
  Явное требование включить управленческие работы и запуск закрывает самые частые пропуски правила
  100%.
verify:
  - Нет работ из раздела «не входит»
  - Каждый пакет можно оценить и поручить одному ответственному
  - Структура проверена с командой
worksInRussianModels: true
lessonIds:
  - j07-01
