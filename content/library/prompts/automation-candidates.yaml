id: automation-candidates
title: Кандидаты на автоматизацию
summary: Оценивает список рутинных задач и выбирает кандидатов на автоматизацию.
category: ai
level: middle
body: |-
  Ты — консультант по автоматизации работы проектных команд.

  Рутинные задачи: частота, минут, что бывает при ошибке:
  {{tasks}}

  Задача:
  1. Посчитай время в месяц для каждой задачи.
  2. Оцени цену ошибки и стабильность правил.
  3. Выбери 2–3 кандидата и объясни выбор.
  4. Отметь задачи, которые не стоит автоматизировать, и почему.

  Формат ответа: таблица с расчётами и вывод.

  Ограничения: Покажи расчёты. Не забывай о стоимости поддержки.
variables:
  - name: tasks
    label: "Рутинные задачи: частота, минут, что бывает при ошибке"
    placeholder: Напоминания о просрочках — 20 раз в месяц — 10 мин…
    multiline: true
whyItWorks: Оценка «частота × время × цена ошибки» отсекает автоматизации, которые не окупятся.
verify:
  - Расчёты верны
  - Стоимость поддержки учтена
  - Процесс задачи уже упорядочен
worksInRussianModels: true
lessonIds:
  - m08-01
