id: portfolio-case
title: Описание кейса для портфолио
summary: "Превращает заметки о проекте в историю для портфолио: контекст, роль, решения, результат, выводы."
category: career
level: junior
body: |-
  Ты — карьерный консультант для проект-менеджеров.

  Заметки о проекте (обезличенные):
  {{notes}}

  Задача:
  1. Составь историю на полстраницы: контекст, моя роль, 2–3 ключевых решения с вариантами и обоснованием, результат в фактах, что сделал бы иначе.
  2. Предложи, какие артефакты приложить.

  Формат ответа: текст истории и список артефактов.

  Ограничения: Не преувеличивай роль и результаты. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: notes
    label: Заметки о проекте (обезличенные)
    placeholder: …
    multiline: true
whyItWorks: История вокруг решений показывает, как вы думаете, — это главное для работодателя.
verify:
  - Нет конфиденциальных данных
  - Результаты подтверждаемы
  - Решения описаны с вариантами
worksInRussianModels: true
lessonIds:
  - j12-03
