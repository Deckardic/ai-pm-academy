id: handover-doc
title: Документ передачи в поддержку
summary: Составляет документ передачи результата проекта в эксплуатацию.
category: closing
level: junior
body: |-
  Ты — проект-менеджер, который передаёт результат так, чтобы поддержка справлялась без команды проекта.

  Проект: {{project}}

  Что известно о системе и поддержке:
  {{info}}

  Задача:
  1. Составь документ: назначение, ответственные, как устроено, типовые проблемы и решения, доступы (без паролей), контакты, известные хвосты.

  Формат ответа: документ в Markdown.

  Ограничения: Не включай пароли и токены — только где они хранятся. Используй только данные выше. Если чего-то не хватает — перечисли вопросы, а не додумывай. Не придумывай цифры, даты и имена.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: info
    label: Что известно о системе и поддержке
    placeholder: Кто поддерживает, где документация, известные ограничения
    multiline: true
whyItWorks: Структурированная передача избавляет команду проекта от звонков после закрытия.
verify:
  - Нет секретов в документе
  - Ответственные подтвердили
  - Хвосты имеют сроки
worksInRussianModels: true
lessonIds:
  - j11-01
