id: stakeholder-questions
title: Вопросы для интервью со стейкхолдером
summary: Готовит список вопросов к первой встрече с заказчиком или ключевым стейкхолдером.
category: initiation
level: junior
body: "Ты — проект-менеджер, который готовится к первой встрече со стейкхолдером.


  Роль стейкхолдера: {{role}}

  Что известно о проекте: {{context}}


  Составь 12 вопросов, сгруппированных по темам: цели и критерии успеха, ограничения (сроки, бюджет),
  ожидания от результата, риски и опасения, как принимать решения и согласовывать.

  Вопросы должны быть открытыми (не «да/нет») и не подсказывать ответ. Отметь 3 самых важных вопроса,
  если встреча окажется короткой."
variables:
  - name: role
    label: Роль стейкхолдера
    placeholder: Директор по продажам
  - name: context
    label: Контекст проекта
    placeholder: Внедряем CRM для отдела продаж, старт через месяц
    multiline: true
whyItWorks:
  Группировка по темам покрывает всё, что нужно для устава проекта, а требование открытых вопросов
  даёт больше информации, чем «да/нет».
verify:
  - Вопросы не содержат допущений, которые вы не проверили
  - Три главных вопроса отражают ваши реальные неизвестные
lessonIds: []
