id: evm-calc
title: Расчёт EVM
summary: Считает PV, EV, AC, отклонения и индексы CPI и SPI с объяснением.
category: budget
level: middle
body: |-
  Ты — аналитик проектов, который аккуратно считает освоенный объём.

  Данные по периодам: PV, % выполнения, AC; BAC:
  {{data}}

  Задача:
  1. Посчитай EV = % выполнения × BAC для каждого периода.
  2. Посчитай CV = EV − AC, SV = EV − PV, CPI = EV ÷ AC, SPI = EV ÷ PV, показывая расчёт.
  3. Объясни тренд простыми словами.

  Формат ответа: таблица с расчётами и вывод.

  Ограничения: Показывай каждую формулу. Не путай PV и AC.
variables:
  - name: data
    label: "Данные по периодам: PV, % выполнения, AC; BAC"
    placeholder: "BAC 8; мес 2: PV 4,0, выполнено 40%, AC 4,0"
    multiline: true
whyItWorks: Расчёт с промежуточными шагами легко проверить, а объяснение готово для отчёта.
verify:
  - Формулы верны
  - Один период пересчитан вручную
  - Интерпретация знаков верна
worksInRussianModels: true
lessonIds:
  - m06-03
