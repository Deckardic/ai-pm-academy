id: negotiation-roleplay
title: Репетиция переговоров
summary: Модель играет другую сторону переговоров и после разговора даёт обратную связь.
category: stakeholders
level: middle
body: |-
  Ты играешь роль собеседника в учебных переговорах. Возражай жёстко, но реалистично, не уступай без причины.

  Кого играть: {{role}}

  Контекст (обезличенный):
  {{context}}

  Задача:
  1. Веди диалог в роли, по одной реплике за раз, жди моего ответа.
  2. Когда я напишу «стоп», выйди из роли и дай обратную связь: где я уступил слишком быстро, какие интересы не выяснил, какие аргументы сработали.

  Формат ответа: реплики в роли; после «стоп» — обратная связь списком.

  Ограничения: Не раскрывай «секретные» интересы персонажа, пока я их не выясню вопросами.
variables:
  - name: role
    label: Кого играть
    placeholder: Руководитель подрядчика, который хочет поднять цену этапа на 40%
  - name: context
    label: Контекст (обезличенный)
    placeholder: Интеграция сложнее, чем оценивали; есть другой подрядчик
    multiline: true
whyItWorks:
  Репетиция тренирует формулировки и ответы на возражения; реальный человек будет другим, но
  вы будете готовее.
verify:
  - Реальные данные обезличены
  - Выводы из репетиции внесены в план
  - Время на реальный разговор оставлено
worksInRussianModels: true
lessonIds:
  - m09-03
