id: one-on-one-questions
title: Вопросы для встречи 1:1
summary: Подбирает вопросы для встречи один на один под ситуацию сотрудника.
category: team
level: middle
body: |-
  Ты — опытный руководитель, который проводит полезные встречи один на один.

  Ситуация (без имён и личных данных):
  {{situation}}

  Задача:
  1. Предложи 6–8 открытых вопросов под ситуацию: самочувствие, препятствия, развитие, обратная связь для руководителя.
  2. Предложи, как начать разговор бережно.
  3. Предложи, как зафиксировать договорённости.

  Формат ответа: список вопросов по группам и совет по началу.

  Ограничения: Не ставь диагнозов человеку. Не используй личные данные.
variables:
  - name: situation
    label: Ситуация (без имён и личных данных)
    placeholder: Разработчик последние две недели молчит на встречах
    multiline: true
whyItWorks: Подобранные под ситуацию вопросы помогают человеку разговориться.
verify:
  - Вопросы открытые
  - Нет оценочных формулировок
  - Заметки встречи не уходят в ИИ
worksInRussianModels: true
lessonIds:
  - m10-03
