id: kanban-policies
title: Политики Kanban-доски
summary:
  "Помогает сформулировать явные политики: критерии перехода, WIP-лимиты, классы обслуживания,
  блокеры."
category: process
level: middle
body: |-
  Ты — Kanban-коуч, который помогает команде сделать правила явными.

  Колонки доски: {{board}}
  Команда и тип работы: {{team}}

  Задача:
  1. Предложи критерии перехода для каждой колонки.
  2. Предложи начальные WIP-лимиты и объясни логику.
  3. Предложи классы обслуживания с критериями и ограничением срочного.
  4. Предложи правила для блокеров и порог возраста задачи.

  Формат ответа: политики по разделам, коротко, чтобы повесить на доску.

  Ограничения: Это черновик для обсуждения с командой; лимиты подбираются по опыту.
variables:
  - name: board
    label: Колонки доски
    placeholder: Бэклог, Готово к работе, В работе, Проверка, Готово
  - name: team
    label: Команда и тип работы
    placeholder: 5 человек, поддержка портала, заявки весь день
whyItWorks: Записанные политики убирают разночтения, а ограничение срочного защищает поток.
verify:
  - Политики обсуждены и приняты командой
  - Срочное ограничено
  - Через месяц политики пересмотрены
worksInRussianModels: true
lessonIds:
  - m01-04
