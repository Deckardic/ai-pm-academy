id: comm-plan
title: План коммуникаций
summary: "Составляет план коммуникаций на одну страницу: кому, что, как часто, каким каналом и кто отвечает."
category: communication
level: junior
body: |-
  Ты — проект-менеджер, который выстраивает понятные коммуникации в проекте.

  Проект: {{project}}

  Стейкхолдеры и что им важно:
  {{stakeholders}}

  Задача:
  1. Для каждой аудитории определи, что ей нужно знать и зачем.
  2. Предложи канал, частоту и ответственного.
  3. Отметь, что можно сделать асинхронно вместо встреч.
  4. Добавь правило срочного информирования спонсора.

  Формат ответа: таблица «Что / Кому / Канал / Когда / Ответственный», затем правило срочности.

  Ограничения: Не добавляй встреч без цели.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: stakeholders
    label: Стейкхолдеры и что им важно
    placeholder: Главный врач — решения и риски; команда — задачи и блокеры
    multiline: true
whyItWorks: План от потребностей аудиторий даёт каждому нужную глубину и сокращает лишние встречи.
verify:
  - У каждой строки есть ответственный
  - Встречи имеют цель
  - Правило срочности согласовано со спонсором
worksInRussianModels: true
lessonIds:
  - j09-01
