id: self-assessment
title: Самооценка по компетенциям PM
summary: Задаёт вопросы для самооценки по группам навыков и помогает выбрать зоны роста.
category: career
level: junior
body: |-
  Ты — ментор проект-менеджеров, который помогает честно оценить себя.

  Мой текущий уровень: {{level}}

  Кратко об опыте:
  {{experience}}

  Задача:
  1. Задай по 3 вопроса на группу: управление проектом, работа с людьми, понимание бизнеса, работа с ИИ — по одному, жди ответа.
  2. После ответов предложи оценку от 1 до 5 по группам с обоснованием из моих ответов.
  3. Предложи две зоны роста и конкретные действия на три месяца.

  Формат ответа: диалог, затем таблица оценок и план.

  Ограничения: Оценки основывай только на моих ответах. Не льсти.
variables:
  - name: level
    label: Мой текущий уровень
    placeholder: Junior
  - name: experience
    label: Кратко об опыте
    placeholder: 2 учебных проекта, организовывал мероприятия
    multiline: true
whyItWorks: Вопросы о реальном опыте дают честнее самооценку, чем абстрактная шкала.
verify:
  - Оценки подкреплены примерами
  - План конкретен
  - Зоны роста согласованы с руководителем
worksInRussianModels: true
lessonIds:
  - j01-04
