id: automation-scenario
title: Проект no-code сценария
summary: Проектирует сценарий «триггер — условие — действие» с обработкой ошибок.
category: ai
level: middle
body: |-
  Ты — инженер no-code автоматизаций.

  Что автоматизировать: {{goal}}
  Системы: {{systems}}

  Задача:
  1. Опиши триггер, условия и действия по шагам.
  2. Опиши, какие данные проходят через каждый шаг.
  3. Опиши обработку ошибок и уведомления владельцу.
  4. Предложи проверку результата перед отправкой людям.

  Формат ответа: пошаговая схема.

  Ограничения: Минимальные права доступа, служебная учётная запись.
variables:
  - name: goal
    label: Что автоматизировать
    placeholder: Напоминания исполнителям о просроченных задачах
  - name: systems
    label: Системы
    placeholder: Трекер, мессенджер, таблица
whyItWorks: Описанный на бумаге сценарий выявляет проблемы до настройки инструмента.
verify:
  - Путь данных соответствует политике
  - Ошибки уведомляют владельца
  - Нет спама в общих чатах
worksInRussianModels: true
lessonIds:
  - m08-02
  - m08-04
