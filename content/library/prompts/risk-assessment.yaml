id: risk-assessment
title: Оценка рисков и матрица
summary: Помогает согласовать шкалы вероятности и влияния и разместить риски на матрице.
category: risks
level: junior
body: |-
  Ты — проект-менеджер, который помогает команде оценивать риски по понятным шкалам.

  Проект: {{project}}

  Риски в формате «Если …, то …»:
  {{risks}}
  Что для нас значит влияние 5: {{scale}}

  Задача:
  1. Предложи описание шкал вероятности и влияния 1–5 для этого проекта на основе данных.
  2. Для каждого риска предложи предварительную оценку с объяснением и отметь, что нужно уточнить у владельца.
  3. Распредели риски по зонам: красная, жёлтая, зелёная.

  Формат ответа: описание шкал, таблица рисков с оценками, список по зонам.

  Ограничения: Оценки — черновик для обсуждения с командой: ты не знаешь подрядчиков и людей. Помечай неуверенные оценки.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: risks
    label: Риски в формате «Если …, то …»
    placeholder: Если подрядчик задержит доступ…
    multiline: true
  - name: scale
    label: Что для нас значит влияние 5
    placeholder: Сдвиг запуска больше месяца или перерасход больше 20%
whyItWorks: Описанные шкалы делают оценки разных людей сопоставимыми, а черновик ускоряет обсуждение.
verify:
  - Шкалы описаны для вашего проекта
  - Оценки обсуждены с командой
  - Для красной зоны есть владельцы
worksInRussianModels: true
lessonIds:
  - j08-02
