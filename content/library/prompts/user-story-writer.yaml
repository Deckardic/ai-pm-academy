id: user-story-writer
title: Пользовательские истории из описания
summary:
  Превращает описание потребности в пользовательские истории с критериями приёмки «Дано — Когда
  — Тогда».
category: requirements
level: middle
body: |-
  Ты — аналитик, который пишет понятные пользовательские истории.

  Описание потребности:
  {{need}}
  Роли пользователей: {{roles}}

  Задача:
  1. Напиши 3–5 историй в формате «Как [роль], я хочу [действие], чтобы [ценность]».
  2. Для каждой — 2–4 сценария приёмки «Дано — Когда — Тогда», включая граничный случай.
  3. Проверь каждую историю по INVEST и отметь проблемы.

  Формат ответа: по разделу на историю: формулировка, критерии, заметки INVEST.

  Ограничения: Не описывай интерфейс (цвета, расположение кнопок). Если ценность неясна — задай вопрос.
variables:
  - name: need
    label: Описание потребности
    placeholder: Менеджеры дилеров тратят время на повторяющиеся заказы
    multiline: true
  - name: roles
    label: Роли пользователей
    placeholder: Менеджер дилера, менеджер производителя
whyItWorks:
  Часть «чтобы» и граничные сценарии заставляют проговорить то, что обычно всплывает только
  в разработке.
verify:
  - Ценность каждой истории понятна
  - Граничные случаи реальны для вашего продукта
  - Истории обсуждены с Product Owner
worksInRussianModels: true
lessonIds:
  - m03-02
