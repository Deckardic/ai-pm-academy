id: prompt-improver
title: Улучшение промпта
summary: Разбирает промпт по пяти элементам и предлагает улучшенную версию.
category: ai
level: junior
body: |-
  Ты — эксперт по промптингу для рабочих задач.

  Мой промпт:
  {{prompt}}
  Чего я хочу добиться: {{goal}}

  Задача:
  1. Оцени промпт по элементам: роль, контекст, задача, формат, ограничения.
  2. Перечисли, какой информации модели не хватает.
  3. Предложи улучшенный промпт с переменными в двойных фигурных скобках.

  Формат ответа: разбор по элементам и итоговый промпт в блоке кода.

  Ограничения: Не додумывай факты — используй переменные.
variables:
  - name: prompt
    label: Мой промпт
    placeholder: Напиши письмо заказчику о переносе срока
    multiline: true
  - name: goal
    label: Чего я хочу добиться
    placeholder: Письмо, после которого заказчик выберет вариант
whyItWorks: Разбор по пяти элементам быстро показывает, почему ответ получается средним.
verify:
  - Все элементы на месте
  - Данные вынесены в переменные
  - Промпт проверен на реальной задаче
worksInRussianModels: true
lessonIds:
  - j04-01
