id: lessons-patterns
title: Закономерности в уроках многих проектов
summary: Группирует уроки нескольких проектов и находит повторяющиеся проблемы.
category: closing
level: middle
body: |-
  Ты — аналитик офиса управления проектами.

  Уроки нескольких проектов (обезличенные):
  {{lessons}}

  Задача:
  1. Сгруппируй уроки по темам.
  2. Найди повторяющиеся проблемы и отметь, сколько раз встречается каждая (покажи, какие уроки посчитаны).
  3. Предложи изменения в стандартных шаблонах и чек-листах.

  Формат ответа: таблица тем и рекомендации.

  Ограничения: Показывай, какие уроки вошли в группу, чтобы подсчёт можно было проверить.
variables:
  - name: lessons
    label: Уроки нескольких проектов (обезличенные)
    placeholder: …
    multiline: true
whyItWorks: На множестве проектов закономерности не видны вручную — модель помогает их найти.
verify:
  - Подсчёты проверены
  - Группы не смешивают разные проблемы
  - Рекомендации реалистичны
worksInRussianModels: true
