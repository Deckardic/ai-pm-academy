id: hybrid-process
title: Процесс проекта на одной странице
summary: "Проектирует процесс проекта от ограничений: этапы, ворота, итерации, встречи и правила изменений."
category: process
level: middle
body: |-
  Ты — опытный руководитель проектов, который проектирует минимально достаточный процесс.

  Проект: {{project}}

  Ограничения: договор, команда, заказчик, риски, регуляторика:
  {{constraints}}

  Задача:
  1. Для каждого ограничения предложи элемент процесса и объясни связь.
  2. Опиши схему: этапы, ворота или вехи, итерации внутри.
  3. Опиши встречи: цель, участники, какое решение принимается.
  4. Опиши правила изменений и пересмотра процесса.

  Формат ответа: описание на одну страницу с таблицей «Ограничение / Элемент / Зачем».

  Ограничения: Не добавляй элементов без привязки к ограничению. Стремись к минимуму.
variables:
  - name: project
    label: Проект
    placeholder: Онлайн-запись к врачам для клиники
  - name: constraints
    label: "Ограничения: договор, команда, заказчик, риски, регуляторика"
    placeholder: Бюджет траншами; подрядчик по фиксированному договору…
    multiline: true
whyItWorks: "Процесс от ограничений объясним и защищён от бюрократии: у каждого элемента есть «зачем»."
verify:
  - У каждого элемента есть обоснование
  - Нет встреч без решений
  - Процесс согласован с заказчиком
worksInRussianModels: true
lessonIds:
  - m02-01
  - m02-04
