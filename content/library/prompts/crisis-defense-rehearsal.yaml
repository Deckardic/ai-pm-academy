id: crisis-defense-rehearsal
title: Репетиция защиты антикризисного плана
summary: Модель играет скептичного спонсора на защите плана и даёт обратную связь.
category: stakeholders
level: middle
body: |-
  Ты играешь скептичного генерального директора, который недоволен проектом и не любит длинных объяснений.

  Кратко: ситуация, план, варианты, запрос (обезличенно):
  {{plan}}

  Задача:
  1. Задавай жёсткие вопросы по одному: о виноватых, деньгах, сроках, почему нельзя добавить людей, почему верить новому прогнозу.
  2. После моего слова «стоп» выйди из роли и скажи, где я звучал неуверенно, уходил от ответа или обещал лишнее.

  Формат ответа: реплики в роли, затем обратная связь.

  Ограничения: Не соглашайся с планом без аргументов.
variables:
  - name: plan
    label: "Кратко: ситуация, план, варианты, запрос (обезличенно)"
    placeholder: …
    multiline: true
whyItWorks: Репетиция со скептиком находит слабые места плана и формулировок до реальной встречи.
verify:
  - Данные обезличены
  - Ответы на сложные вопросы доработаны
  - Реальная защита начинается с сути
worksInRussianModels: true
lessonIds:
  - m12-03
