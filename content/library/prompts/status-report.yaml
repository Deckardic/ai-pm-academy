id: status-report
title: Еженедельный статус-отчёт
summary: "Собирает статус проекта для руководства из списка задач: прогресс, риски, что нужно от руководителя."
category: reporting
level: junior
body: "Ты — проект-менеджер, который пишет краткие и честные статус-отчёты для руководства.


  Проект: {{project}}

  Период: {{period}}


  Данные о задачах за период:

  {{tasks}}


  Составь статус-отчёт:

  - Общий статус: зелёный / жёлтый / красный — и одно предложение почему.

  - Что сделано — 3–5 пунктов, только значимое.

  - Что в работе и ожидаемые даты.

  - Риски и проблемы — с предлагаемыми действиями.

  - Что нужно от руководства — конкретные решения или помощь.


  Не более 200 слов. Не приукрашивай: если есть отставание, скажи прямо."
variables:
  - name: project
    label: Проект
    placeholder: Внедрение CRM
  - name: period
    label: Период
    placeholder: 15–19 сентября
  - name: tasks
    label: Задачи
    placeholder: "Выгрузка задач из трекера: название, статус, срок"
    multiline: true
whyItWorks:
  Структура совпадает с тем, что руководитель ищет в отчёте, а ограничение по объёму и требование
  честности убирают «воду» и приукрашивание.
verify:
  - Статус (цвет) соответствует реальному положению дел
  - Цифры и даты сверены с трекером
  - Запрос к руководству конкретный и выполнимый
lessonIds:
  - j01-03
